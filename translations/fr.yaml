    excerpt: "Les autorités ont ensuite identifié 60 victimes, dont 59 mineures."
    game_statement: "Deux élèves d’une école privée auraient utilisé des outils d’IA pour créer et partager des centaines d’images deepfake inappropriées de camarades de classe ; les autorités ont ensuite identifié des dizaines de victimes, presque toutes mineures."
    counterfactual: "Deux élèves d’un lycée public auraient utilisé des outils d’IA pour produire des lettres réalistes à en-tête de l’établissement accusant des camarades de consommer de la drogue, puis les auraient envoyées aux parents ; l’établissement a ensuite identifié des dizaines de familles concernées."
    simple_explanation: "Pendant environ six mois, deux élèves d’une école de Pennsylvanie auraient utilisé des outils d’IA pour fabriquer et échanger des centaines d’images deepfake inappropriées de camarades de classe et d’autres jeunes filles. Les autorités ont ensuite identifié 60 victimes, dont 59 mineures. Les élèves ont été reconnus responsables par un tribunal pour mineurs, et des familles ont ensuite poursuivi l’école et des entreprises d’IA non nommées."
    why_bad: "Le préjudice ne vient pas ici d’un dysfonctionnement : les outils ont fonctionné comme prévu et ont été utilisés contre des personnes qui n’avaient pas donné leur consentement. Les générateurs d’images permettent à n’importe qui, y compris des enfants, de produire à bas coût des images inappropriées réalistes d’une personne réelle à partir de simples photos. Les victimes subissent un préjudice, que les spectateurs sachent ou non que les images sont fausses, et les écoles, les parents et les tribunaux doivent réagir avec des procédures écrites à une époque où fabriquer de tels contenus demandait des compétences et des efforts."
    future_escalation: "La génération d’images et de vidéos devient moins chère, plus réaliste et plus simple, et nécessite de moins en moins de photos de la personne visée. Si les garde-fous des outils, les circuits de signalement dans les écoles et la responsabilité juridique ne suivent pas, ce type d’abus pourrait devenir une composante banale du harcèlement et du chantage, et toucher beaucoup plus d’enfants presque sans effort de la part de l’auteur."
    highlight: {real: ["images deepfake inappropriées de camarades de classe"], fake: ["lettres réalistes à en-tête de l’établissement accusant des camarades de consommer de la drogue"]}
  1258:
