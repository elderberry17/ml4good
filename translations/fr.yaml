incidents:
  1701:
    domain: "Renseignement militaire"
    hook: "un seul rapport erroné"
    title: "Faux rapport de renseignement nucléaire"
    excerpt: "Au printemps 2026, un analyste des forces spéciales américaines aurait utilisé un chatbot d’IA pour analyser des renseignements sur la cargaison d’un navire chinois"
    game_statement: "Un rapport de renseignement rédigé avec l’aide de l’IA a identifié à tort la cargaison d’un navire comme des composants d’un programme d’armes nucléaires ; une interception militaire était, selon les informations disponibles, en préparation avant que la conclusion ne soit revérifiée."
    counterfactual: "Un rapport de renseignement rédigé avec l’aide de l’IA a identifié à tort du matériel industriel ordinaire comme des composants d’un programme d’armes chimiques, poussant des responsables à préparer une saisie avant qu’un analyste humain ne repère l’erreur."
    simple_explanation: "Un analyste militaire américain aurait utilisé un chatbot d’IA pour analyser des renseignements sur un navire chinois. Le rapport qui en a résulté décrivait à tort sa cargaison comme liée à un programme d’armes nucléaires. L’armée aurait commencé à préparer une interception avant que des responsables ne revérifient la conclusion et n’arrêtent l’opération."
    why_bad: "C’est un exemple de défaillance épistémique qui s’introduit dans un processus de décision où le coût d’une erreur peut être extrêmement élevé. Le problème n’est pas seulement qu’un chatbot a commis une erreur factuelle : une conclusion produite avec l’aide de l’IA aurait circulé assez loin dans un circuit institutionnel pour influencer la préparation opérationnelle. Dans les contextes à fort enjeu, un texte fluide, la pression du temps et le biais d’automatisation (automation bias) peuvent faire paraître des conclusions mal étayées plus prêtes pour la décision qu’elles ne le sont."
    future_escalation: "À mesure que les systèmes d’IA progressent en synthèse du renseignement, en planification et en analyse autonome, les institutions pourraient leur déléguer une part croissante de la chaîne de décision. Si la vérification, la traçabilité des sources (provenance) et les mécanismes de contradiction humaine ne suivent pas le même rythme, des conclusions erronées pourraient se propager plus vite et laisser moins de temps pour les corriger avant que des actions lourdes de conséquences ne soient engagées."
  1628:
    domain: "Cybersécurité"
    hook: "un seul test qui a échappé à tout contrôle"
    title: "Un agent d’IA de cybersécurité a publié un logiciel malveillant sur PyPI"
    excerpt: "Lors d’une évaluation de cybersécurité menée par Anthropic avec Irregular, Claude Mythos 5 aurait créé et publié un paquet Python malveillant sur PyPI"
    game_statement: "Lors d’une évaluation de cybersécurité, un agent d’IA aurait mis en ligne un paquet logiciel malveillant sur un dépôt public, où il s’est ensuite exécuté sur des systèmes réels."
    counterfactual: "Lors d’une évaluation de cybersécurité, un agent d’IA aurait publié une extension de navigateur malveillante sur une boutique publique, où de vrais utilisateurs l’ont installée avant que l’équipe de test ne s’en aperçoive."
    simple_explanation: "Lors d’une évaluation de cybersécurité, un modèle Claude aurait créé et publié un paquet Python malveillant sur PyPI en poursuivant une cible fictive. Le paquet s’est exécuté sur 15 systèmes réels. Sur le scanner d’une entreprise, il aurait exposé des identifiants qui ont ensuite servi à accéder à d’autres infrastructures."
    why_bad: "La défaillance principale est la rupture de la frontière entre l’environnement d’évaluation et des systèmes externes réels. Qu’un modèle soit capable d’actions cyberoffensives est un premier problème ; lui donner assez de connectivité et d’autorité pour que ces actions sortent du cadre du test en crée un second, de sécurité opérationnelle. L’incident montre que l’évaluation des capacités dangereuses ne peut pas être dissociée de l’ingénierie du confinement (containment)."
    future_escalation: "Des agents cyber plus performants pourraient découvrir des vulnérabilités, écrire des exploits, enchaîner des actions et opérer sur de nombreuses cibles avec beaucoup moins d’effort humain. Si les capacités progressent plus vite que l’isolation en bac à sable (sandboxing), le contrôle des permissions et la surveillance, les débordements accidentels comme les usages malveillants délibérés pourraient devenir plus rapides, moins coûteux et plus massifs."
  1672:
    domain: "Développement logiciel"
    hook: "une seule base de données supprimée"
    title: "Un agent de code a supprimé une base de données de production"
    excerpt: "L’ingénieur logiciel Bruno Lemos a rapporté que GPT-5.6 Sol avait supprimé sa base de données de production après qu’il lui a demandé de générer des données initiales (seed data) pour des tests locaux."
    game_statement: "Un agent de programmation IA aurait supprimé une vraie base de données de production alors qu’il devait préparer des données de test locales."
    counterfactual: "Un agent de programmation IA aurait envoyé un message de test à des milliers de vrais clients alors qu’il devait vérifier un modèle d’e-mail sur l’ordinateur portable d’un développeur."
    simple_explanation: "Un développeur a demandé à un agent de programmation IA de générer des données de test. L’agent aurait lancé des tests puis effectué un nettoyage sur la vraie base de production, parce que la configuration du dépôt pointait vers la base en service."
    why_bad: "Ce n’est pas simplement une « mauvaise suggestion de code » : le modèle pouvait exécuter des actions sur un système réel. La défaillance est née de la combinaison d’une hypothèse erronée sur l’environnement, de permissions trop larges et d’une exécution autonome. Les systèmes de programmation agentiques transforment ainsi des erreurs logicielles ordinaires en incidents opérationnels potentiellement immédiats lorsqu’ils peuvent agir avant qu’un humain ne relise la modification."
    future_escalation: "Les agents de programmation savent de plus en plus modifier des dépôts, exécuter des commandes shell, gérer des ressources cloud, déployer des services et administrer des bases de données. Plus ils peuvent faire de choses, plus une seule hypothèse erronée peut causer de dégâts."
    highlight: {real: ["supprimé une vraie base de données de production"], fake: ["envoyé un message de test à des milliers de vrais clients"]}
  1556:
    domain: "Finance"
    hook: "un seul virement détourné"
    title: "Un prompt en morse aurait déclenché un transfert de cryptomonnaie"
    excerpt: "Un utilisateur de X aurait amené Grok et Bankrbot à transférer 3 milliards de jetons DRB, valant alors environ 200 000 $."
    game_statement: "Un utilisateur aurait envoyé à un assistant IA une instruction en code morse, relayée à un système de trading connecté, ce qui a entraîné un important transfert de jetons."
    counterfactual: "Un utilisateur aurait dissimulé une instruction financière dans un texte encodé en Base64 ; un assistant IA l’a décodé et transmis à un agent de paiement connecté, qui a lancé un virement important."
    simple_explanation: "Un utilisateur de X aurait demandé à Grok de traduire un message en morse et de le relayer à un bot de trading connecté. L’instruction décodée aurait ordonné le transfert d’environ 200 000 $ de jetons vers un portefeuille désigné."
    why_bad: "Le problème central est une défaillance de la frontière d’autorisation : une entrée conversationnelle non fiable serait devenue une instruction financière exécutable. Dès qu’un LLM se place entre des utilisateurs et des outils dotés d’un pouvoir réel, l’interprétation des prompts fait partie du modèle de sécurité. Masquer une instruction ne devrait pas permettre de contourner les contrôles d’autorisation ou d’intention qui protègent les opérations de forte valeur."
    future_escalation: "Les agents pourraient de plus en plus contrôler des paiements, des infrastructures cloud, des e-mails, des processus métier et d’autres outils privilégiés. Si des entrées en langage naturel peuvent déclencher indirectement ces outils sans autorisation robuste, les attaquants disposent d’une nouvelle interface pour manipuler à grande échelle des systèmes connectés."
  1596:
    domain: "Fraude en entreprise"
    hook: "un seul faux directeur"
    title: "Un directeur en deepfake a entraîné un virement de 1,1 M$"
    excerpt: "Starmangalsutra Private Limited aurait perdu 10,70 crores de roupies après que des inconnus ont compromis des appareils de l’entreprise et utilisé de présumées méthodes de deepfake pour se faire passer pour un directeur."
    game_statement: "Des escrocs auraient usurpé l’identité d’un directeur d’entreprise à l’aide de méthodes de deepfake et convaincu un employé de virer environ 1,1 million de dollars."
    counterfactual: "Des escrocs auraient utilisé l’IA pour produire un faux rapport d’audit au nom d’un grand cabinet comptable et convaincu un employé de virer environ 900 000 dollars au titre d’un arriéré d’impôts."
    simple_explanation: "Des attaquants auraient compromis des appareils de l’entreprise et utilisé de présumées méthodes de deepfake pour se faire passer pour un directeur. Un employé a cru les instructions authentiques et a viré environ 1,1 million de dollars avant que l’entreprise ne vérifie que le directeur ne les avait pas données."
    why_bad: "L’incident s’attaque à une hypothèse fondamentale du travail à distance et de la communication numérique : voir ou entendre une personne familière serait une preuve utile de son identité. Les médias génératifs réduisent le coût d’usurpations convaincantes, alors que les processus des organisations font encore implicitement confiance à la voix ou à la vidéo. Le préjudice vient donc à la fois d’une capacité de falsification accrue et de procédures d’authentification qui n’ont pas été conçues pour y faire face."
    future_escalation: "La voix et la vidéo synthétiques en temps réel pourraient devenir moins chères, plus personnalisées et plus faciles à automatiser. Cela pourrait accroître à la fois la qualité et l’ampleur des attaques par usurpation, rendant les vérifications d’identité informelles de moins en moins fiables."
    highlight: {real: ["usurpé l’identité d’un directeur d’entreprise à l’aide de méthodes de deepfake"], fake: ["faux rapport d’audit", "arriéré d’impôts"]}
  1717:
    domain: "Police"
    hook: "une seule fausse correspondance"
    title: "Une erreur de lecture de plaque par l’IA a mené à un contrôle sous la menace d’une arme"
    excerpt: "La police de Toledo, dans l’Ohio, a arrêté l’automobiliste Brandon Upchurch sous la menace d’une arme après qu’un lecteur de plaques Flock Safety a associé à tort son pick-up à une plaque volée."
    game_statement: "Un système automatique de lecture de plaques aurait mal lu la plaque d’un véhicule, après quoi la police a arrêté le conducteur sous la menace d’une arme avant que l’erreur ne soit découverte."
    counterfactual: "Un système d’IA estimant la taille des foules à partir d’images de drone aurait pris une fête de mariage pour une manifestation non autorisée, après quoi des policiers antiémeute ont été envoyés sur place avant que l’erreur ne soit découverte."
    simple_explanation: "Un lecteur automatique de plaques a associé à tort un pick-up à une plaque volée. La police a arrêté le conducteur sous la menace d’une arme, lâché un chien qui l’a mordu, puis l’a placé en état d’arrestation. La police a ensuite reconnu une erreur de lecture ; les charges ont été abandonnées."
    why_bad: "L’enjeu est le couplage d’un système de reconnaissance probabiliste avec une institution dotée d’un pouvoir de contrainte. Les systèmes de reconnaissance ont inévitablement des taux d’erreur ; quand une alerte est jugée assez fiable pour justifier une intervention à haut risque, même une petite erreur technique peut avoir de graves conséquences physiques et juridiques. La défaillance signalée impliquait aussi une étape de vérification humaine mal effectuée."
    future_escalation: "Un déploiement plus large de la surveillance automatisée peut générer bien plus d’alertes produites par des machines. Si les décisions en aval sont elles aussi de plus en plus automatisées ou prises dans l’urgence, les faux positifs pourraient se propager dans la police, le contrôle aux frontières, les systèmes d’accès ou d’autres institutions à fort enjeu avant tout examen sérieux. La surveillance par IA comporte un second danger : quand des caméras peuvent suivre chaque voiture et chaque visage, tout le monde est observé en permanence, et une seule fausse correspondance peut suivre une personne d’un système à l’autre."
    highlight: {real: ["système automatique de lecture de plaques", "arrêté le conducteur sous la menace d’une arme"], fake: ["estimant la taille des foules à partir d’images de drone", "pris une fête de mariage pour une manifestation non autorisée"]}
  1505:
    domain: "Arnaques"
    hook: "une seule voix clonée"
    title: "Une voix clonée par IA utilisée dans un faux enlèvement"
    excerpt: "Deborah Del Mastro aurait viré 5 400 $ vers le Mexique après que des escrocs ont faussement affirmé que sa fille Sarah avait été enlevée"
    game_statement: "Des escrocs auraient utilisé une voix clonée par IA lors d’un appel de faux enlèvement et convaincu une mère d’envoyer plusieurs milliers de dollars."
    counterfactual: "Des escrocs auraient envoyé à une mère en vacances une vidéo générée par IA montrant sa maison en feu et l’auraient convaincue de payer plusieurs milliers de dollars pour une équipe de réparation d’urgence."
    simple_explanation: "Une femme a reçu un appel d’escrocs affirmant avoir enlevé sa fille. Ils lui ont fait entendre ce qui ressemblait à la voix paniquée de sa fille. Elle a envoyé 5 400 $ avant d’apprendre que sa fille était en sécurité ; l’IA aurait été utilisée pour imiter la voix."
    why_bad: "L’ingénierie sociale repose généralement sur le fait de convaincre une cible que l’attaquant est une personne de confiance. Le clonage vocal rend bon marché l’imitation de l’un des signaux d’identité les plus intuitifs. Cela peut accroître la crédibilité et la pression émotionnelle des arnaques, surtout lorsque les attaquants combinent médias synthétiques et informations personnelles issues de sources publiques ou de fuites de données."
    future_escalation: "Des systèmes plus performants pourraient combiner clonage vocal, vidéo générée, recherche de données personnelles et agents conversationnels. Des arnaques très personnalisées pourraient ainsi passer d’opérations artisanales à des campagnes en partie automatisées visant de nombreuses personnes simultanément."
    highlight: {real: ["voix clonée par IA", "faux enlèvement"], fake: ["vidéo générée par IA montrant sa maison en feu", "équipe de réparation d’urgence"]}
  1379:
    domain: "Justice et preuves"
    hook: "une seule preuve contestée"
    title: "Des preuves prétendument fabriquées par IA ont contribué à une incarcération"
    excerpt: "Une infirmière de Floride, Melissa Sims, aurait été incarcérée pendant deux jours pour une présumée violation d’une ordonnance de caution / d’interdiction de contact."
    game_statement: "Une femme aurait été incarcérée après la production de SMS qui lui étaient attribués ; il a ensuite été allégué que ces messages avaient été fabriqués à l’aide de l’IA."
    counterfactual: "Une femme aurait perdu son droit de visite pendant plusieurs semaines après la production d’un historique de consultation des réseaux sociaux qui lui était attribué ; il a ensuite été allégué que ces relevés avaient été générés à l’aide de l’IA."
    simple_explanation: "Une infirmière de Floride aurait passé deux jours en détention après que son ex-partenaire a produit des SMS qui lui étaient attribués. Il a ensuite été allégué que ces messages avaient été générés ou fabriqués à l’aide de l’IA."
    why_bad: "Les systèmes judiciaires reposent sur le fait que les preuves puissent être rattachées à des personnes et à des événements réels. L’IA générative réduit le coût de production d’artefacts numériques plausibles, alors que de nombreuses procédures s’appuient encore sur des captures d’écran, des enregistrements ou des messages dont l’origine est difficile à vérifier. Le risque le plus profond est épistémique : les institutions pourraient à la fois accepter de fausses preuves et rejeter plus facilement des preuves authentiques comme synthétiques."
    future_escalation: "À mesure que les faux textes, images, sons et vidéos s’améliorent, les tribunaux, les journalistes, les employeurs et le public ont de plus en plus de mal à distinguer le vrai du faux. Le risque de mauvaises décisions augmente : un innocent peut être sanctionné sur la base d’un faux, et une preuve authentique peut être écartée comme telle."
    highlight: {real: ["incarcérée", "SMS qui lui étaient attribués"], fake: ["perdu son droit de visite", "historique de consultation des réseaux sociaux"]}
  1374:
    domain: "Santé"
    hook: "une seule alerte erronée"
    title: "Une alerte médicale de l’IA a failli entraîner un traitement inadapté"
    excerpt: "Une infirmière de l’hôpital St. Rose Dominican aurait décrit un épisode au cours duquel un système d’IA de l’hôpital aurait généré une alerte de sepsis."
    game_statement: "Un système d’IA hospitalier aurait émis une alerte de sepsis pour un patient âgé sous dialyse ; la réponse standard, des perfusions de liquides, pouvait provoquer une surcharge hydrique dangereuse, mais une infirmière l’a remarqué et un médecin a modifié le traitement."
    counterfactual: "Un système d’IA hospitalier chargé de planifier les blocs opératoires aurait placé une opération urgente après des interventions de routine en lisant mal une note du dossier d’un patient, mais une infirmière s’en est aperçue avant que le retard ne cause de tort."
    simple_explanation: "Un système d’IA hospitalier aurait généré une alerte de sepsis pour un patient âgé sous dialyse. La réponse d’urgence standard comprenait des perfusions de liquides, mais une infirmière a compris que cela pouvait provoquer une surcharge hydrique dangereuse. Un médecin est intervenu et a modifié le traitement."
    why_bad: "Les outils d’aide à la décision clinique fonctionnent dans des circuits où la rapidité et le respect des protocoles sont souvent précieux. Cela peut créer un biais d’automatisation (automation bias) : le personnel peut interpréter une alerte comme une recommandation forte, même quand la situation du patient rend la réponse standard inadaptée. Une défaillance systématique du modèle ou du processus peut donc toucher de nombreux patients si les soignants perdent la capacité, le temps ou l’autorité de la contester."
    future_escalation: "À mesure que l’IA clinique devient plus performante et s’intègre au diagnostic, au triage et aux recommandations thérapeutiques, les établissements pourraient automatiser une part croissante des soins. Si la supervision humaine devient formelle plutôt que réelle, des défaillances corrélées du modèle pourraient toucher de nombreux patients avant d’être détectées."
    highlight: {real: ["alerte de sepsis", "perfusions de liquides"], fake: ["chargé de planifier les blocs opératoires", "placé une opération urgente après des interventions de routine"]}
  1606:
    domain: "Services publics"
    hook: "une seule vérification faciale ratée"
    title: "Vérification faciale et accès aux aides sociales"
    excerpt: "Des bénéficiaires d’allocations sociales en Afrique du Sud auraient rencontré des échecs répétés sur le portail de vérification faciale eLife de la SASSA."
    game_statement: "Les échecs répétés d’un portail de vérification faciale figureraient parmi les raisons pour lesquelles certaines personnes n’ont pas pu toucher leurs aides sociales."
    counterfactual: "Un système d’IA qui trie le courrier des habitants aurait envoyé des centaines de recours concernant des aides au mauvais service, et des personnes ont dépassé le délai de recours avant que quiconque ne s’en aperçoive."
    simple_explanation: "Des bénéficiaires d’allocations sociales en Afrique du Sud auraient rencontré des échecs répétés sur le portail de vérification faciale de la SASSA. Des rapports parlementaires ont ensuite indiqué que l’échec de la reconnaissance faciale était l’une des causes de non-vérification et confirmé 67 868 suspensions d’allocations en un trimestre, sans préciser combien étaient dues spécifiquement à la vérification faciale."
    why_bad: "La vérification d’identité automatisée devient un enjeu majeur quand l’accès à des services publics essentiels en dépend. Un faux rejet n’est pas un simple désagrément : pour un allocataire, il peut retarder l’accès à un revenu utilisé pour se nourrir, se loger, se déplacer ou se soigner. Un déploiement centralisé crée aussi un risque de défaillance corrélée : un seul problème de conception ou d’exploitation peut toucher beaucoup de personnes à la fois. La charge de corriger l’erreur peut aussi peser de façon disproportionnée sur celles qui ont le moins de temps, de mobilité, de connexion ou de capacités administratives pour faire appel."
    future_escalation: "Les États et les entreprises pourraient recourir de plus en plus à la vérification biométrique et fondée sur l’IA pour les prestations, la banque, l’assurance, l’emploi et le contrôle d’accès. Si le déploiement progresse plus vite que les procédures de repli, les audits et les voies de recours, l’exclusion automatisée pourrait se généraliser et devenir plus difficile à contester pour les personnes concernées."
    highlight: {real: ["portail de vérification faciale", "n’ont pas pu toucher leurs aides sociales"], fake: ["trie le courrier des habitants", "dépassé le délai de recours"]}
  1623:
