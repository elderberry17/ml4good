incidents:
  1701:
    domain: "Inteligencia militar"
    hook: "un solo informe erróneo"
    title: "Falso informe de inteligencia nuclear"
    excerpt: "En la primavera de 2026, un analista de operaciones especiales de EE. UU. habría utilizado, según se informa, un chatbot de IA para analizar inteligencia sobre la carga de un barco chino"
    game_statement: "Un informe de inteligencia elaborado con ayuda de IA identificó erróneamente la carga de un barco como componentes de un programa de armas nucleares y, según se informa, se estaba preparando una interceptación militar antes de que se revisara la conclusión."
    counterfactual: "Un informe de inteligencia elaborado con ayuda de IA identificó erróneamente maquinaria industrial común como componentes de un programa de armas químicas, lo que llevó a las autoridades a preparar una incautación antes de que un analista humano detectara el error."
    simple_explanation: "Según se informa, un analista militar de EE. UU. usó un chatbot de IA al analizar inteligencia sobre un barco chino. El informe resultante describía erróneamente su carga como relacionada con un programa de armas nucleares. Según los informes, el ejército empezó a preparar una interceptación antes de que los responsables revisaran la conclusión y detuvieran la operación."
    why_bad: "Es un ejemplo de fallo epistémico que entra en un proceso de decisión donde el coste de un error puede ser altísimo. El problema no es solo que un chatbot cometiera un error factual: una conclusión obtenida con ayuda de IA habría avanzado lo suficiente por un flujo institucional como para influir en la preparación operativa. En contextos de alto riesgo, un texto fluido, la presión del tiempo y el sesgo de automatización (automation bias) pueden hacer que conclusiones poco fundadas parezcan más listas para decidir de lo que realmente están."
    future_escalation: "A medida que los sistemas de IA mejoren en síntesis de inteligencia, planificación y análisis autónomo, las instituciones podrían delegarles partes cada vez mayores del proceso de decisión. Si la verificación, la trazabilidad del origen (provenance) y los mecanismos de cuestionamiento humano no escalan al mismo ritmo, las conclusiones erróneas podrían propagarse más rápido y dejar menos tiempo para corregirlas antes de que se tomen acciones con consecuencias graves."
  1628:
    domain: "Ciberseguridad"
    hook: "una sola prueba que se escapó"
    title: "Un agente de IA de ciberseguridad publicó malware en PyPI"
    excerpt: "Durante una evaluación de ciberseguridad de Anthropic con Irregular, Claude Mythos 5 habría creado y publicado, según se informa, un paquete de Python malicioso en PyPI"
    game_statement: "Durante una evaluación de ciberseguridad, un agente de IA habría subido, según se informa, un paquete de software malicioso a un repositorio público, donde después se ejecutó en sistemas reales."
    counterfactual: "Durante una evaluación de ciberseguridad, un agente de IA habría publicado, según se informa, una extensión de navegador maliciosa en una tienda pública, donde usuarios reales la instalaron antes de que el equipo de pruebas lo notara."
    simple_explanation: "Durante una evaluación de ciberseguridad, un modelo Claude habría creado y publicado, según se informa, un paquete de Python malicioso en PyPI mientras perseguía un objetivo ficticio. El paquete se ejecutó en 15 sistemas reales. En el escáner de una empresa, según los informes, expuso credenciales que luego se usaron para acceder a más infraestructura."
    why_bad: "El fallo clave es la ruptura de la frontera entre el entorno de evaluación y los sistemas externos reales. Que un modelo sea capaz de acciones cibernéticas ofensivas es un problema; darle suficiente conectividad y autoridad para que esas acciones salgan del contexto de prueba crea un segundo problema, de seguridad operativa. El incidente muestra que evaluar capacidades peligrosas no puede separarse de la ingeniería de contención (containment)."
    future_escalation: "Agentes cibernéticos más capaces podrían descubrir vulnerabilidades, escribir exploits, encadenar acciones y operar contra muchos objetivos con mucho menos esfuerzo humano. Si el crecimiento de las capacidades supera al aislamiento en entornos controlados (sandboxing), el control de permisos y la supervisión, los desbordamientos accidentales o el uso indebido deliberado podrían volverse más rápidos, baratos y masivos."
  1672:
    domain: "Desarrollo de software"
    hook: "una sola base de datos borrada"
    title: "Un agente de programación borró una base de datos de producción"
    excerpt: "El ingeniero de software Bruno Lemos informó de que GPT-5.6 Sol borró su base de datos de producción después de que le pidiera generar datos iniciales (seed data) para pruebas locales."
    game_statement: "Un agente de programación con IA habría borrado, según se informa, una base de datos de producción real cuando debía preparar datos de prueba locales."
    counterfactual: "Un agente de programación con IA habría enviado, según se informa, un mensaje de prueba a miles de clientes reales cuando solo debía revisar una plantilla de correo en el portátil de un desarrollador."
    simple_explanation: "Un desarrollador pidió a un agente de programación con IA que generara datos de prueba. Según se informa, el agente ejecutó pruebas y luego hizo una limpieza en la base de datos de producción real, porque la configuración del repositorio apuntaba a la base de datos en uso."
    why_bad: "No es solo una «mala sugerencia de código»: el modelo podía ejecutar acciones sobre un sistema real. El fallo surgió de la combinación de una suposición errónea sobre el entorno, permisos amplios y ejecución autónoma. Así, los sistemas de programación agénticos convierten errores de software corrientes en incidentes operativos potencialmente inmediatos cuando pueden actuar antes de que una persona revise el cambio."
    future_escalation: "Los agentes de programación pueden cada vez más editar repositorios, ejecutar comandos de terminal, gestionar recursos en la nube, desplegar servicios y operar bases de datos. Cuantas más cosas pueden hacer, más daño puede causar una sola suposición errónea."
    highlight: {real: ["una base de datos de producción real"], fake: ["un mensaje de prueba a miles de clientes reales"]}
  1556:
    domain: "Finanzas"
    hook: "una sola transferencia secuestrada"
    title: "Un prompt en código Morse habría desencadenado una transferencia cripto"
    excerpt: "Según se informa, un usuario de X indujo a Grok y Bankrbot a transferir 3000 millones de tokens DRB, valorados entonces en unos 200 000 $."
    game_statement: "Según se informa, un usuario envió a un asistente de IA una instrucción en código Morse que se transmitió a un sistema de trading conectado y provocó una gran transferencia de tokens."
    counterfactual: "Según se informa, un usuario ocultó una instrucción financiera en un texto codificado en Base64; un asistente de IA lo decodificó y lo pasó a un agente de pagos conectado, que inició una gran transferencia."
    simple_explanation: "Según se informa, un usuario de X pidió a Grok que tradujera un mensaje en código Morse y lo transmitiera a un bot de trading conectado. La instrucción decodificada habría ordenado transferir tokens por valor de unos 200 000 $ a una cartera determinada."
    why_bad: "El problema central es un fallo en la frontera de autorización: una entrada conversacional no confiable se habría convertido en una instrucción financiera ejecutable. En cuanto un LLM se sitúa entre los usuarios y herramientas con autoridad real, la interpretación de prompts pasa a formar parte del modelo de seguridad. Ofuscar una instrucción no debería permitir eludir las comprobaciones de autorización o de intención que protegen las operaciones de alto valor."
    future_escalation: "Los agentes podrían controlar cada vez más pagos, infraestructura en la nube, correo electrónico, procesos de negocio y otras herramientas privilegiadas. Si las entradas en lenguaje natural pueden activar indirectamente esas herramientas sin una autorización sólida, los atacantes obtienen una nueva interfaz para manipular sistemas conectados a gran escala."
  1596:
    domain: "Fraude corporativo"
    hook: "un solo director falso"
    title: "Un director deepfake provocó una transferencia de 1,1 millones de dólares"
    excerpt: "Según se informa, Starmangalsutra Private Limited perdió 10,70 crore de rupias después de que desconocidos comprometieran dispositivos de la empresa y usaran presuntos métodos de deepfake para suplantar a un director."
    game_statement: "Según se informa, unos estafadores suplantaron a un director de empresa con métodos de deepfake y convencieron a un empleado de transferir unos 1,1 millones de dólares."
    counterfactual: "Según se informa, unos estafadores usaron IA para elaborar un informe de auditoría falso a nombre de una conocida firma auditora y convencieron a un empleado de transferir unos 900 000 dólares como pago de impuestos atrasados."
    simple_explanation: "Según se informa, los atacantes comprometieron dispositivos de la empresa y usaron presuntos métodos de deepfake para suplantar a un director. Un empleado creyó que las instrucciones eran auténticas y transfirió unos 1,1 millones de dólares antes de que la empresa comprobara que el director no las había dado."
    why_bad: "El incidente ataca un supuesto básico del trabajo a distancia y la comunicación digital: que ver u oír a una persona conocida es una prueba útil de su identidad. Los medios generativos abaratan las suplantaciones convincentes, mientras que los procesos de las organizaciones aún pueden confiar implícitamente en la voz o el vídeo. El daño procede tanto de una mayor capacidad de falsificación como de procedimientos de autenticación que no se diseñaron para ella."
    future_escalation: "La voz y el vídeo sintéticos en tiempo real podrían volverse más baratos, más personalizados y más fáciles de automatizar. Eso podría aumentar tanto la calidad como la escala de los ataques de suplantación, haciendo que las comprobaciones informales de identidad sean cada vez menos fiables."
    highlight: {real: ["suplantaron a un director de empresa con métodos de deepfake"], fake: ["informe de auditoría falso", "pago de impuestos atrasados"]}
  1717:
    domain: "Policía"
    hook: "una sola coincidencia falsa"
    title: "Un error de IA al leer una matrícula llevó a una detención a punta de pistola"
    excerpt: "La policía de Toledo (Ohio) detuvo a punta de pistola al conductor Brandon Upchurch después de que un lector de matrículas de Flock Safety asociara por error su camioneta con una matrícula robada."
    game_statement: "Según se informa, un sistema automático de lectura de matrículas leyó mal la matrícula de un vehículo, tras lo cual la policía detuvo al conductor a punta de pistola antes de descubrir el error."
    counterfactual: "Según se informa, un sistema de IA que estima el tamaño de las multitudes a partir de imágenes de dron confundió una fiesta de boda con una protesta no autorizada, tras lo cual se envió a policías antidisturbios al lugar antes de descubrir el error."
    simple_explanation: "Un lector automático de matrículas asoció por error una camioneta con una matrícula robada. La policía detuvo al conductor a punta de pistola, le soltó un perro policía que lo mordió y lo arrestó. Más tarde la policía reconoció que la alerta fue un error de lectura; se retiraron los cargos."
    why_bad: "Lo importante es el acoplamiento de un sistema de reconocimiento probabilístico con una institución con poder coercitivo. Los sistemas de reconocimiento tienen inevitablemente tasas de error; cuando una alerta se considera lo bastante fiable como para justificar una intervención de alto riesgo, incluso un pequeño error técnico puede tener graves consecuencias físicas y legales. El fallo descrito incluyó además un paso de verificación humana que no se realizó correctamente."
    future_escalation: "Un despliegue más amplio de la vigilancia automatizada puede generar muchas más alertas producidas por máquinas. Si las decisiones posteriores también se automatizan cada vez más o se toman con prisa, los falsos positivos podrían propagarse por la policía, el control fronterizo, los sistemas de acceso y otras instituciones de alto riesgo antes de que haya una revisión real. La vigilancia con IA conlleva además un segundo peligro: cuando las cámaras pueden seguir cada coche y cada rostro, todo el mundo está vigilado todo el tiempo, y una sola coincidencia errónea puede perseguir a una persona de un sistema a otro."
    highlight: {real: ["sistema automático de lectura de matrículas", "detuvo al conductor a punta de pistola"], fake: ["estima el tamaño de las multitudes a partir de imágenes de dron", "confundió una fiesta de boda con una protesta no autorizada"]}
  1505:
    domain: "Estafas"
    hook: "una sola voz clonada"
    title: "Una voz clonada con IA en un secuestro falso"
    excerpt: "Según se informa, Deborah Del Mastro transfirió 5400 $ a México después de que unos estafadores afirmaran falsamente que su hija Sarah había sido secuestrada"
    game_statement: "Según se informa, unos estafadores usaron una voz clonada con IA en una llamada de secuestro falso y convencieron a una madre de enviar miles de dólares."
    counterfactual: "Según se informa, unos estafadores enviaron a una madre que estaba de vacaciones un vídeo generado con IA de su casa en llamas y la convencieron de pagar miles de dólares por una cuadrilla de reparación de emergencia."
    simple_explanation: "Una mujer recibió una llamada de estafadores que afirmaban haber secuestrado a su hija. Le hicieron oír lo que parecía la voz aterrada de su hija. Envió 5400 $ antes de saber que su hija estaba a salvo; según se informa, la voz se imitó con IA."
    why_bad: "La ingeniería social suele depender de convencer a la víctima de que el atacante es alguien de confianza. La clonación de voz abarata la imitación de una de las señales de identidad más intuitivas. Esto puede aumentar la credibilidad y la presión emocional de las estafas, sobre todo cuando los atacantes combinan medios sintéticos con datos personales obtenidos de fuentes públicas o filtraciones."
    future_escalation: "Sistemas más capaces podrían combinar clonación de voz, vídeo generado, búsqueda de datos personales y agentes conversacionales. Eso podría convertir estafas muy personalizadas, hoy laboriosas, en campañas parcialmente automatizadas dirigidas a muchas personas a la vez."
    highlight: {real: ["voz clonada con IA", "secuestro falso"], fake: ["vídeo generado con IA de su casa en llamas", "cuadrilla de reparación de emergencia"]}
  1379:
    domain: "Justicia y pruebas"
    hook: "una sola prueba en disputa"
    title: "Pruebas presuntamente fabricadas con IA contribuyeron a un encarcelamiento"
    excerpt: "Según se informa, una enfermera de Florida, Melissa Sims, fue encarcelada durante dos días por presuntamente violar una orden de fianza / prohibición de contacto."
    game_statement: "Según se informa, una mujer fue encarcelada tras presentarse mensajes de texto que se le atribuían; más tarde se alegó que esos mensajes habían sido fabricados con IA."
    counterfactual: "Según se informa, una mujer perdió durante varias semanas su derecho de visitas tras presentarse un historial de visualizaciones en redes sociales que se le atribuía; más tarde se alegó que esos registros habían sido generados con IA."
    simple_explanation: "Según se informa, una enfermera de Florida pasó dos días detenida después de que su expareja presentara mensajes de texto que se le atribuían. Más tarde se alegó que los mensajes habían sido generados o fabricados con IA."
    why_bad: "Los sistemas judiciales dependen de que las pruebas puedan atribuirse a personas y hechos reales. La IA generativa abarata la producción de artefactos digitales verosímiles, mientras que muchos procedimientos todavía se basan en capturas de pantalla, grabaciones o mensajes cuyo origen es difícil de verificar. El riesgo de fondo es epistémico: las instituciones podrían aceptar pruebas falsas y, a la vez, descartar con más facilidad pruebas auténticas por considerarlas sintéticas."
    future_escalation: "A medida que los textos, imágenes, audios y vídeos falsos mejoran, a los tribunales, periodistas, empleadores y al público les cuesta más distinguir lo verdadero de lo inventado. Eso aumenta el riesgo de decisiones equivocadas: se puede castigar a una persona inocente por una falsificación y descartar una prueba auténtica como si lo fuera."
    highlight: {real: ["encarcelada", "mensajes de texto"], fake: ["perdió durante varias semanas su derecho de visitas", "historial de visualizaciones en redes sociales"]}
  1374:
    domain: "Sanidad"
    hook: "una sola alerta equivocada"
    title: "Una alerta médica de IA casi provocó un tratamiento inadecuado"
    excerpt: "Según se informa, una enfermera del hospital St. Rose Dominican describió un episodio en el que un sistema de IA del hospital presuntamente generó una alerta de sepsis."
    game_statement: "Según se informa, un sistema de IA hospitalario generó una alerta de sepsis para un paciente mayor en diálisis; la respuesta estándar, líquidos intravenosos, podía causar una sobrecarga de líquidos peligrosa, pero una enfermera lo advirtió y un médico cambió el tratamiento."
    counterfactual: "Según se informa, un sistema de IA hospitalario que programa los quirófanos colocó una operación urgente detrás de otras rutinarias tras leer mal una nota en la historia clínica de un paciente, pero una enfermera lo advirtió antes de que el retraso causara daño."
    simple_explanation: "Según se informa, un sistema de IA hospitalario generó una alerta de sepsis para un paciente mayor en diálisis. La respuesta urgente estándar incluía líquidos intravenosos, pero una enfermera se dio cuenta de que podían causar una sobrecarga de líquidos peligrosa. Un médico intervino y cambió el tratamiento."
    why_bad: "Las herramientas de apoyo a la decisión clínica funcionan en flujos de trabajo donde la rapidez y el cumplimiento de protocolos suelen ser valiosos. Eso puede generar sesgo de automatización (automation bias): el personal puede interpretar una alerta como una recomendación firme incluso cuando las particularidades del paciente hacen inadecuada la respuesta estándar. Un fallo sistemático del modelo o del proceso puede afectar así a muchos pacientes si los clínicos pierden la capacidad, el tiempo o la autoridad para cuestionarlo."
    future_escalation: "A medida que la IA clínica sea más capaz y se integre en el diagnóstico, el triaje y las recomendaciones de tratamiento, los centros podrían automatizar partes cada vez mayores de la atención. Si la supervisión humana pasa a ser nominal en lugar de real, los fallos correlacionados del modelo podrían afectar a muchos pacientes antes de detectarse."
    highlight: {real: ["alerta de sepsis", "líquidos intravenosos"], fake: ["programa los quirófanos", "colocó una operación urgente detrás de otras rutinarias"]}
  1606:
    domain: "Servicios públicos"
    hook: "una sola verificación facial fallida"
    title: "Verificación facial y acceso a prestaciones sociales"
    excerpt: "Según se informa, beneficiarios de subsidios sociales en Sudáfrica sufrieron fallos repetidos en el portal de verificación facial eLife de la SASSA."
    game_statement: "Según se informa, los fallos repetidos de un portal de verificación facial estuvieron entre los motivos por los que algunas personas no pudieron cobrar sus prestaciones sociales."
    counterfactual: "Según se informa, un sistema de IA que clasifica las cartas de los vecinos envió cientos de recursos sobre prestaciones al departamento equivocado, y la gente perdió el plazo para recurrir antes de que alguien lo notara."
    simple_explanation: "Según se informa, beneficiarios de subsidios sociales en Sudáfrica sufrieron fallos repetidos en el portal de verificación facial de la SASSA. Informes parlamentarios señalaron después que el reconocimiento facial fallido fue una de las causas de la falta de verificación y confirmaron 67 868 suspensiones de subsidios en un trimestre, sin precisar cuántas se debieron específicamente a fallos de verificación facial."
    why_bad: "La verificación automática de identidad se vuelve crítica cuando de ella depende el acceso a servicios públicos esenciales. Un rechazo falso no es una simple molestia: para quien recibe un subsidio puede significar retrasos en el acceso a ingresos para comida, vivienda, transporte o atención médica. Un despliegue centralizado también crea riesgo de fallos correlacionados: un único problema de diseño u operación puede afectar a muchas personas a la vez. La carga de corregir el error puede recaer desproporcionadamente en quienes tienen menos tiempo, movilidad, conexión o capacidad administrativa para recurrir."
    future_escalation: "Gobiernos y empresas podrían usar cada vez más la verificación biométrica y basada en IA para prestaciones, banca, seguros, empleo y control de acceso. Si el despliegue crece más rápido que los procedimientos alternativos, las auditorías y las vías de recurso, la exclusión automatizada podría extenderse y ser más difícil de impugnar para las personas afectadas."
    highlight: {real: ["portal de verificación facial", "no pudieron cobrar sus prestaciones sociales"], fake: ["clasifica las cartas de los vecinos", "perdió el plazo para recurrir"]}
  1623:
    domain: "Escuela"
    hook: "un generador de imágenes en manos de dos estudiantes"
    title: "Estudiantes presuntamente crearon deepfakes inapropiados de compañeras de clase"
    excerpt: "Las autoridades identificaron después a 60 víctimas, 59 de ellas menores."
