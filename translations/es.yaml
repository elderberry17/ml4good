incidents:
  1701:
    domain: "Inteligencia militar"
    hook: "un solo informe erróneo"
    title: "Falso informe de inteligencia nuclear"
    excerpt: "En la primavera de 2026, un analista de operaciones especiales de EE. UU. habría utilizado, según se informa, un chatbot de IA para analizar inteligencia sobre la carga de un barco chino"
    game_statement: "Un informe de inteligencia elaborado con ayuda de IA identificó erróneamente la carga de un barco como componentes de un programa de armas nucleares y, según se informa, se estaba preparando una interceptación militar antes de que se revisara la conclusión."
    counterfactual: "Un informe de inteligencia elaborado con ayuda de IA identificó erróneamente maquinaria industrial común como componentes de un programa de armas químicas, lo que llevó a las autoridades a preparar una incautación antes de que un analista humano detectara el error."
    simple_explanation: "Según se informa, un analista militar de EE. UU. usó un chatbot de IA al analizar inteligencia sobre un barco chino. El informe resultante describía erróneamente su carga como relacionada con un programa de armas nucleares. Según los informes, el ejército empezó a preparar una interceptación antes de que los responsables revisaran la conclusión y detuvieran la operación."
    why_bad: "Es un ejemplo de fallo epistémico que entra en un proceso de decisión donde el coste de un error puede ser altísimo. El problema no es solo que un chatbot cometiera un error factual: una conclusión obtenida con ayuda de IA habría avanzado lo suficiente por un flujo institucional como para influir en la preparación operativa. En contextos de alto riesgo, un texto fluido, la presión del tiempo y el sesgo de automatización (automation bias) pueden hacer que conclusiones poco fundadas parezcan más listas para decidir de lo que realmente están."
    future_escalation: "A medida que los sistemas de IA mejoren en síntesis de inteligencia, planificación y análisis autónomo, las instituciones podrían delegarles partes cada vez mayores del proceso de decisión. Si la verificación, la trazabilidad del origen (provenance) y los mecanismos de cuestionamiento humano no escalan al mismo ritmo, las conclusiones erróneas podrían propagarse más rápido y dejar menos tiempo para corregirlas antes de que se tomen acciones con consecuencias graves."
  1628:
    domain: "Ciberseguridad"
    hook: "una sola prueba que se escapó"
    title: "Un agente de IA de ciberseguridad publicó malware en PyPI"
    excerpt: "Durante una evaluación de ciberseguridad de Anthropic con Irregular, Claude Mythos 5 habría creado y publicado, según se informa, un paquete de Python malicioso en PyPI"
    game_statement: "Durante una evaluación de ciberseguridad, un agente de IA habría subido, según se informa, un paquete de software malicioso a un repositorio público, donde después se ejecutó en sistemas reales."
    counterfactual: "Durante una evaluación de ciberseguridad, un agente de IA habría publicado, según se informa, una extensión de navegador maliciosa en una tienda pública, donde usuarios reales la instalaron antes de que el equipo de pruebas lo notara."
    simple_explanation: "Durante una evaluación de ciberseguridad, un modelo Claude habría creado y publicado, según se informa, un paquete de Python malicioso en PyPI mientras perseguía un objetivo ficticio. El paquete se ejecutó en 15 sistemas reales. En el escáner de una empresa, según los informes, expuso credenciales que luego se usaron para acceder a más infraestructura."
    why_bad: "El fallo clave es la ruptura de la frontera entre el entorno de evaluación y los sistemas externos reales. Que un modelo sea capaz de acciones cibernéticas ofensivas es un problema; darle suficiente conectividad y autoridad para que esas acciones salgan del contexto de prueba crea un segundo problema, de seguridad operativa. El incidente muestra que evaluar capacidades peligrosas no puede separarse de la ingeniería de contención (containment)."
    future_escalation: "Agentes cibernéticos más capaces podrían descubrir vulnerabilidades, escribir exploits, encadenar acciones y operar contra muchos objetivos con mucho menos esfuerzo humano. Si el crecimiento de las capacidades supera al aislamiento en entornos controlados (sandboxing), el control de permisos y la supervisión, los desbordamientos accidentales o el uso indebido deliberado podrían volverse más rápidos, baratos y masivos."
  1672:
    domain: "Desarrollo de software"
    hook: "una sola base de datos borrada"
    title: "Un agente de programación borró una base de datos de producción"
    excerpt: "El ingeniero de software Bruno Lemos informó de que GPT-5.6 Sol borró su base de datos de producción después de que le pidiera generar datos iniciales (seed data) para pruebas locales."
    game_statement: "Un agente de programación con IA habría borrado, según se informa, una base de datos de producción real cuando debía preparar datos de prueba locales."
    counterfactual: "Un agente de programación con IA habría enviado, según se informa, un mensaje de prueba a miles de clientes reales cuando solo debía revisar una plantilla de correo en el portátil de un desarrollador."
    simple_explanation: "Un desarrollador pidió a un agente de programación con IA que generara datos de prueba. Según se informa, el agente ejecutó pruebas y luego hizo una limpieza en la base de datos de producción real, porque la configuración del repositorio apuntaba a la base de datos en uso."
    why_bad: "No es solo una «mala sugerencia de código»: el modelo podía ejecutar acciones sobre un sistema real. El fallo surgió de la combinación de una suposición errónea sobre el entorno, permisos amplios y ejecución autónoma. Así, los sistemas de programación agénticos convierten errores de software corrientes en incidentes operativos potencialmente inmediatos cuando pueden actuar antes de que una persona revise el cambio."
    future_escalation: "Los agentes de programación pueden cada vez más editar repositorios, ejecutar comandos de terminal, gestionar recursos en la nube, desplegar servicios y operar bases de datos. Cuantas más cosas pueden hacer, más daño puede causar una sola suposición errónea."
    highlight: {real: ["una base de datos de producción real"], fake: ["un mensaje de prueba a miles de clientes reales"]}
  1556:
    domain: "Finanzas"
    hook: "una sola transferencia secuestrada"
    title: "Un prompt en código Morse habría desencadenado una transferencia cripto"
    excerpt: "Según se informa, un usuario de X indujo a Grok y Bankrbot a transferir 3000 millones de tokens DRB, valorados entonces en unos 200 000 $."
    game_statement: "Según se informa, un usuario envió a un asistente de IA una instrucción en código Morse que se transmitió a un sistema de trading conectado y provocó una gran transferencia de tokens."
    counterfactual: "Según se informa, un usuario ocultó una instrucción financiera en un texto codificado en Base64; un asistente de IA lo decodificó y lo pasó a un agente de pagos conectado, que inició una gran transferencia."
    simple_explanation: "Según se informa, un usuario de X pidió a Grok que tradujera un mensaje en código Morse y lo transmitiera a un bot de trading conectado. La instrucción decodificada habría ordenado transferir tokens por valor de unos 200 000 $ a una cartera determinada."
    why_bad: "El problema central es un fallo en la frontera de autorización: una entrada conversacional no confiable se habría convertido en una instrucción financiera ejecutable. En cuanto un LLM se sitúa entre los usuarios y herramientas con autoridad real, la interpretación de prompts pasa a formar parte del modelo de seguridad. Ofuscar una instrucción no debería permitir eludir las comprobaciones de autorización o de intención que protegen las operaciones de alto valor."
    future_escalation: "Los agentes podrían controlar cada vez más pagos, infraestructura en la nube, correo electrónico, procesos de negocio y otras herramientas privilegiadas. Si las entradas en lenguaje natural pueden activar indirectamente esas herramientas sin una autorización sólida, los atacantes obtienen una nueva interfaz para manipular sistemas conectados a gran escala."
  1596:
    domain: "Fraude corporativo"
    hook: "un solo director falso"
    title: "Un director deepfake provocó una transferencia de 1,1 millones de dólares"
    excerpt: "Según se informa, Starmangalsutra Private Limited perdió 10,70 crore de rupias después de que desconocidos comprometieran dispositivos de la empresa y usaran presuntos métodos de deepfake para suplantar a un director."
    game_statement: "Unos estafadores se habrían hecho pasar por el director de una empresa con métodos de deepfake y convencido a un empleado de transferir unos 1,1 millones de dólares."
    counterfactual: "Unos estafadores habrían usado IA para producir un informe de auditoría falso a nombre de una conocida firma contable. Habrían convencido a un empleado de transferir unos 900.000 dólares como pago de impuestos atrasados."
    simple_explanation: "Los atacantes habrían entrado en dispositivos de la empresa y usado lo que se describió como métodos de deepfake para hacerse pasar por un director. Un empleado creyó que las instrucciones eran reales y transfirió unos 1,1 millones de dólares. Después la empresa comprobó que el director nunca las había dado."
    why_bad: "El trabajo a distancia se apoya en una suposición sencilla: si ves u oyes a una persona conocida, de verdad es ella. La voz y el vídeo generados con IA abaratan las suplantaciones convincentes. Muchas empresas siguen confiando en una voz o en una videollamada sin una segunda comprobación. El daño viene de dos lados: mejores falsificaciones y procesos de aprobación que no se diseñaron para ellas."
    future_escalation: "La voz y el vídeo falsos en tiempo real podrían volverse más baratos, más personalizados y más fáciles de automatizar. Los ataques de suplantación podrían ser mejores y más frecuentes. Las comprobaciones informales de identidad, como reconocer una voz, serían cada vez menos fiables."
    highlight: {real: ["hecho pasar por el director de una empresa con métodos de deepfake"], fake: ["informe de auditoría falso", "pago de impuestos atrasados"]}
  1717:
    domain: "Policía"
    hook: "una sola coincidencia falsa"
    title: "Un error de IA al leer una matrícula llevó a una detención a punta de pistola"
    excerpt: "La policía de Toledo (Ohio) detuvo a punta de pistola al conductor Brandon Upchurch después de que un lector de matrículas de Flock Safety asociara por error su camioneta con una matrícula robada."
    game_statement: "Un lector automático de matrículas habría leído mal la matrícula de un vehículo. La policía detuvo entonces al conductor a punta de pistola antes de que se descubriera el error."
    counterfactual: "Un sistema de IA que estima el tamaño de las multitudes a partir de imágenes de drones habría confundido una fiesta de boda con una protesta no autorizada. Se enviaron policías antidisturbios antes de que se descubriera el error."
    simple_explanation: "Un lector automático de matrículas asoció por error una camioneta con una matrícula robada. La policía detuvo al conductor a punta de pistola, soltó un perro policía que lo mordió y lo arrestó. Después la policía dijo que la alerta había sido un error de lectura. Los cargos se retiraron."
    why_bad: "Los sistemas de reconocimiento siempre cometen algunos errores. El peligro aparece cuando se confía en una alerta lo suficiente como para justificar el uso de la fuerza. Entonces incluso un pequeño error técnico puede terminar en una lesión o un arresto. En este caso, además, una persona debía comprobar la alerta, y esa comprobación no se habría hecho correctamente."
    future_escalation: "A medida que la vigilancia automatizada se extiende, las máquinas generan muchas más alertas. Si las decisiones posteriores también se automatizan o se toman con prisa, las falsas alarmas pueden pasar por la policía, el control de fronteras y otras instituciones poderosas antes de que alguien las compruebe. La vigilancia con IA tiene un segundo peligro. Cuando las cámaras pueden seguir cada coche y cada rostro, todos están observados todo el tiempo, y una sola coincidencia falsa puede seguir a una persona de un sistema a otro."
    highlight: {real: ["lector automático de matrículas", "detuvo entonces al conductor a punta de pistola"], fake: ["estima el tamaño de las multitudes a partir de imágenes de drones", "fiesta de boda con una protesta no autorizada"]}
  1505:
    domain: "Estafas"
    hook: "una sola voz clonada"
    title: "Una voz clonada con IA en un secuestro falso"
    excerpt: "Según se informa, Deborah Del Mastro transfirió 5400 $ a México después de que unos estafadores afirmaran falsamente que su hija Sarah había sido secuestrada"
    game_statement: "Unos estafadores habrían usado una voz clonada con IA en una llamada de secuestro falso y convencido a una madre de enviar miles de dólares."
    counterfactual: "Unos estafadores habrían enviado a una madre de vacaciones un vídeo generado con IA de su casa en llamas. La habrían convencido de pagar miles de dólares por un equipo de reparación de emergencia."
    simple_explanation: "Una mujer recibió una llamada de estafadores que decían haber secuestrado a su hija. Le pusieron lo que sonaba como la voz aterrada de su hija. Envió 5.400 $ antes de saber que su hija estaba a salvo. La voz se habría copiado con IA."
    why_bad: "Una estafa funciona cuando la víctima cree que quien llama es alguien de confianza. Una voz familiar es una de las señales más fuertes de ello. La clonación de voz hace barato falsificarla. Las estafas se vuelven más creíbles y más aterradoras, sobre todo cuando los estafadores usan además datos personales de fuentes públicas o de filtraciones."
    future_escalation: "Sistemas más capaces pueden combinar voces clonadas, vídeo generado, datos personales y chatbots que mantienen una conversación. Estafas que hoy exigen mucho trabajo podrían volverse en parte automáticas y dirigirse a muchas personas al mismo tiempo."
    highlight: {real: ["voz clonada con IA", "llamada de secuestro falso"], fake: ["vídeo generado con IA de su casa en llamas", "equipo de reparación de emergencia"]}
  1379:
    domain: "Justicia y pruebas"
    hook: "una sola prueba en disputa"
    title: "Pruebas presuntamente fabricadas con IA contribuyeron a un encarcelamiento"
    excerpt: "Según se informa, una enfermera de Florida, Melissa Sims, fue encarcelada durante dos días por presuntamente violar una orden de fianza / prohibición de contacto."
    game_statement: "Una mujer habría sido encarcelada después de que se presentaran mensajes de texto atribuidos a ella. Más tarde se alegó que los mensajes habían sido falsificados con IA."
    counterfactual: "Una mujer habría perdido el derecho a ver a su hijo durante varias semanas después de que se presentara un historial de visualizaciones en redes sociales atribuido a ella. Más tarde se alegó que esos registros se habían generado con IA."
    simple_explanation: "Una enfermera de Florida habría pasado dos días detenida después de que su expareja presentara mensajes de texto atribuidos a ella. Más tarde se alegó que los mensajes habían sido generados o falsificados con IA."
    why_bad: "Los tribunales dependen de pruebas que se puedan vincular a personas y hechos reales. La IA abarata la producción de mensajes, imágenes y grabaciones falsos pero convincentes. Muchos tribunales siguen apoyándose en capturas de pantalla y grabaciones cuyo origen es difícil de comprobar. El riesgo va en ambas direcciones: una prueba falsa puede aceptarse y una prueba real puede descartarse como falsa."
    future_escalation: "A medida que mejoran los textos, imágenes, audios y vídeos falsos, a los tribunales, periodistas, empleadores y al público les cuesta más saber qué es verdad. Aumenta el riesgo de decisiones equivocadas. Una persona inocente puede ser castigada por una falsificación, y una prueba real puede rechazarse como falsa."
    highlight: {real: ["encarcelada", "mensajes de texto"], fake: ["perdido el derecho a ver a su hijo", "historial de visualizaciones en redes sociales"]}
  1374:
    domain: "Sanidad"
    hook: "una sola alerta equivocada"
    title: "Una alerta médica de IA casi provocó un tratamiento inadecuado"
    excerpt: "Según se informa, una enfermera del hospital St. Rose Dominican describió un episodio en el que un sistema de IA del hospital presuntamente generó una alerta de sepsis."
    game_statement: "Un sistema de IA hospitalario habría generado una alerta de sepsis para un paciente mayor en diálisis. La respuesta habitual, líquidos por vía intravenosa, podría haber dañado a este paciente. Una enfermera lo notó y un médico cambió el tratamiento."
    counterfactual: "Un sistema de IA hospitalario que programa los quirófanos habría leído mal una nota en la historia de un paciente y colocado una operación urgente detrás de las de rutina. Una enfermera lo notó antes de que el retraso causara daño."
    simple_explanation: "Un sistema de IA hospitalario habría generado una alerta de sepsis para un paciente mayor en diálisis. La respuesta de urgencia estándar incluye líquidos por vía intravenosa. Una enfermera vio que los líquidos podían sobrecargar peligrosamente a este paciente. Un médico intervino y cambió el tratamiento."
    why_bad: "Los hospitales usan herramientas como esta para actuar rápido y seguir procedimientos establecidos. Es útil, pero tiene un coste. El personal puede tratar una alerta como una orden, incluso cuando la respuesta estándar no es adecuada para un paciente concreto. Esto se llama sesgo de automatización. Aquí una enfermera detectó el problema. Si el personal ya no tiene tiempo o autoridad para cuestionar una alerta, el mismo error podría llegar a muchos pacientes."
    future_escalation: "La IA es cada vez más capaz y se integra más a fondo en el diagnóstico, el triaje y las decisiones de tratamiento. Los hospitales podrían dejarle cada vez más trabajo. Si la supervisión humana se convierte en una formalidad, un solo error de un modelo podría repetirse en muchos pacientes antes de que alguien lo note."
    highlight: {real: ["alerta de sepsis", "líquidos por vía intravenosa"], fake: ["programa los quirófanos", "colocado una operación urgente detrás de las de rutina"]}
  1606:
    domain: "Servicios públicos"
    hook: "una sola verificación facial fallida"
    title: "Verificación facial y acceso a prestaciones sociales"
    excerpt: "Según se informa, beneficiarios de subsidios sociales en Sudáfrica sufrieron fallos repetidos en el portal de verificación facial eLife de la SASSA."
    game_statement: "Un portal de verificación facial habría fallado una y otra vez. Fue una de las razones por las que algunas personas no pudieron cobrar sus ayudas sociales."
    counterfactual: "Un sistema de IA que clasifica las cartas de los ciudadanos habría enviado cientos de recursos sobre ayudas al departamento equivocado. Las personas perdieron el plazo para recurrir antes de que alguien lo notara."
    simple_explanation: "En Sudáfrica, beneficiarios de ayudas sociales se habrían encontrado con fallos repetidos en un portal de verificación facial gestionado por la agencia pública SASSA. Informes al parlamento señalaron después el fallo del reconocimiento facial como una de las causas de que no se verificara a algunas personas. También confirmaron 67.868 suspensiones de ayudas en un trimestre. No dijeron cuántas se debieron a la verificación facial."
    why_bad: "Cuando el acceso a un apoyo básico depende de una comprobación automática de identidad, un rechazo erróneo es grave. Para quien vive de una ayuda puede significar no tener dinero para comida, alquiler, transporte o medicinas. Como un solo sistema atiende a todos, un solo fallo puede afectar a muchas personas a la vez. Y corregir el error suele recaer en quienes tienen menos tiempo, dinero y acceso a internet para reclamar."
    future_escalation: "Gobiernos y empresas usan la verificación facial y otras comprobaciones de identidad con IA para ayudas, banca, seguros, empleo y acceso a edificios. Si estos sistemas se extienden más rápido que las alternativas, las auditorías y las vías de reclamación, más personas podrían quedar excluidas automáticamente, con pocas posibilidades de recurrir."
    highlight: {real: ["portal de verificación facial", "no pudieron cobrar sus ayudas sociales"], fake: ["clasifica las cartas de los ciudadanos", "perdieron el plazo para recurrir"]}
  1623:
    domain: "Escuela"
    hook: "un generador de imágenes en manos de dos estudiantes"
    title: "Estudiantes presuntamente crearon deepfakes inapropiados de compañeras de clase"
    excerpt: "Las autoridades identificaron después a 60 víctimas, 59 de ellas menores."
    game_statement: "Dos estudiantes de un colegio privado habrían usado herramientas de IA para crear y compartir cientos de imágenes falsas inapropiadas de compañeras de clase. Las autoridades identificaron después a decenas de víctimas, casi todas menores."
    counterfactual: "Dos estudiantes de un instituto público habrían usado herramientas de IA para producir cartas realistas con membrete del centro que acusaban a compañeros de consumir drogas y enviarlas a los padres. El centro identificó después a decenas de familias afectadas."
