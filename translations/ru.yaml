  brand: "Инцидент или вымысел?"
  language: "Язык"
  progress: "Прогресс"
  round: "Раунд {i} из {n}"
  question: "Поступило два сообщения. *Одно из них правдиво.* На какую угрозу вы отреагируете?"
  report: "Сообщение"
  pick: "Реагировать на это →"
  yourPick: "Ваш выбор"
  stampReal: "● Задокументировано · AIID #{id}"
