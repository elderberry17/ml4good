# Русский перевод контента игры.
# Ключ — incident_id из ai_incident_game_seed_v3.yaml.
# Правила перевода:
#   reportedly → «по имеющимся данным» / «по сообщениям»
#   allegedly  → «предположительно» / «утверждалось, что»
#   purported  → «предполагаемый»
#   Устоявшиеся англ. термины даём в скобках при первом упоминании: automation bias, provenance, sandboxing.
# excerpt — перевод цитаты из AIID; на сайте помечается как перевод, ссылка ведёт на оригинал.
# hook — подставляется в заголовок ui.whatifH.
meta: {name: Русский, flag: ru}
