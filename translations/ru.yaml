  rightH: "Верное решение. Угроза была реальной."
  rightP: "Теперь у этого здания есть защита. Второе сообщение было слухом, написанным для этой игры."
  wrongH: "Вы погнались за слухом. Реальная угроза прошла."
  wrongP: "Выбранное вами сообщение написано для этой игры. А тем временем реальный инцидент ударил по этому зданию."
  recordAria: "Что произошло на самом деле"
  quotes: ["«", "»"]
  quoteCite: "Перевод фрагмента оригинального описания в AIID"
  readFull: "Полная запись в базе (англ.) ↗"
  why: "Почему это важно"
  ctaH: "Это произошло на самом деле. А что, если ничего не менять?"
  ctaP: "Посмотрите, как тот же сбой может развиться по мере роста возможностей ИИ."
  ctaBtn: "Показать →"
  whatifEyebrow: "Если ничего не менять"
  whatifH: "Сегодня это уже происходит. Что дальше?"
  whatifNote: "Это не прогноз. Это один из правдоподобных сценариев, и его задача — заставить глубже задуматься о проблеме."
  next: "Следующий раунд →"
  results: "Посмотреть результат →"
  resultEyebrow: "Ваш город"
