    counterfactual: "Шахраї, за наявними даними, за допомогою ШІ виготовили підроблений аудиторський звіт від імені відомої аудиторської фірми й переконали працівника переказати близько $900 000 у рахунок простроченої податкової заборгованості."
    simple_explanation: "Зловмисники, за наявними даними, зламали пристрої компанії й використали імовірні діпфейк-методи, щоб видати себе за директора. Працівник повірив, що вказівки справжні, і переказав близько $1,1 млн, перш ніж компанія з'ясувала, що директор їх не давав."
    why_bad: "Інцидент б'є по базовому припущенню віддаленої роботи й цифрової комунікації: що побачити чи почути знайому людину — надійне підтвердження особи. Генеративні медіа здешевлюють переконливе видавання себе за іншого, а організаційні процеси досі можуть неявно довіряти голосу чи відео. Тому шкода виникає і через нові можливості підробки, і через процедури автентифікації, які на них не розраховані."
    future_escalation: "Синтетичний голос і відео в реальному часі можуть стати дешевшими, персоналізованішими й простішими для автоматизації. Це може підвищити і якість, і масштаб атак із видаванням себе за іншого, роблячи неформальні перевірки особи дедалі менш надійними."
    highlight: {real: ["видали себе за директора компанії за допомогою діпфейк-методів"], fake: ["підроблений аудиторський звіт", "простроченої податкової заборгованості"]}
