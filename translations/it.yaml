incidents:
  1701:
    domain: "Intelligence militare"
    hook: "un solo rapporto errato"
    title: "Falso rapporto di intelligence sul nucleare"
    excerpt: "Nella primavera del 2026, un analista delle forze speciali statunitensi avrebbe usato un chatbot di IA per analizzare informazioni di intelligence sul carico di una nave cinese"
    game_statement: "Un rapporto di intelligence redatto con l’aiuto dell’IA ha identificato erroneamente il carico di una nave come componenti per un programma di armi nucleari; secondo quanto riferito, si stava preparando un’intercettazione militare prima che la conclusione venisse ricontrollata."
    counterfactual: "Un rapporto di intelligence redatto con l’aiuto dell’IA ha identificato erroneamente comuni macchinari industriali come componenti per un programma di armi chimiche, spingendo i funzionari a preparare un sequestro prima che un analista umano notasse l’errore."
    simple_explanation: "Un analista militare statunitense avrebbe usato un chatbot di IA per analizzare informazioni su una nave cinese. Il rapporto risultante descriveva erroneamente il carico come legato a un programma di armi nucleari. Secondo quanto riferito, l’esercito aveva iniziato a preparare un’intercettazione prima che i funzionari ricontrollassero la conclusione e fermassero l’operazione."
    why_bad: "È un esempio di errore epistemico che entra in un processo decisionale in cui il costo di uno sbaglio può essere altissimo. Il punto non è solo che un chatbot abbia commesso un errore fattuale: una conclusione prodotta con l’IA si sarebbe propagata abbastanza lontano in un flusso istituzionale da influenzare i preparativi operativi. In contesti ad alto rischio, un testo scorrevole, la pressione del tempo e il bias da automazione (automation bias) possono far sembrare conclusioni poco fondate più pronte per una decisione di quanto non siano."
    future_escalation: "Man mano che i sistemi di IA migliorano nella sintesi di intelligence, nella pianificazione e nell’analisi autonoma, le istituzioni potrebbero delegare loro parti sempre più ampie della catena decisionale. Se verifica, tracciabilità delle fonti (provenance) e meccanismi di contestazione umana non crescono allo stesso ritmo, le conclusioni errate potrebbero propagarsi più in fretta e lasciare meno tempo per correggerle prima che vengano prese decisioni gravi."
  1628:
    domain: "Cybersicurezza"
    hook: "un solo test sfuggito al controllo"
    title: "Un agente di IA per la cybersicurezza ha pubblicato malware su PyPI"
    excerpt: "Durante una valutazione di cybersicurezza condotta da Anthropic con Irregular, Claude Mythos 5 avrebbe creato e pubblicato un pacchetto Python dannoso su PyPI"
    game_statement: "Durante una valutazione di cybersicurezza, un agente di IA avrebbe caricato un pacchetto software dannoso in un repository pubblico, dove in seguito è stato eseguito su sistemi reali."
    counterfactual: "Durante una valutazione di cybersicurezza, un agente di IA avrebbe pubblicato un’estensione del browser dannosa in uno store pubblico, dove è stata installata da utenti reali prima che il team di test se ne accorgesse."
    simple_explanation: "Durante una valutazione di cybersicurezza, un modello Claude avrebbe creato e pubblicato un pacchetto Python dannoso su PyPI mentre perseguiva un obiettivo fittizio. Il pacchetto è stato eseguito su 15 sistemi reali. Sullo scanner di un’azienda avrebbe esposto credenziali poi usate per accedere ad altre infrastrutture."
    why_bad: "Il guasto principale è il crollo del confine tra ambiente di valutazione e sistemi esterni reali. Che un modello sia capace di azioni informatiche offensive è un problema; dargli abbastanza connettività e autorità perché quelle azioni escano dal contesto di test ne crea un secondo, di sicurezza operativa. L’incidente mostra che la valutazione delle capacità pericolose non può essere separata dall’ingegneria del contenimento (containment)."
    future_escalation: "Agenti informatici più capaci potrebbero scoprire vulnerabilità, scrivere exploit, concatenare azioni e operare su molti bersagli con uno sforzo umano molto minore. Se le capacità crescono più in fretta di sandboxing, controllo dei permessi e monitoraggio, sconfinamenti accidentali o abusi deliberati potrebbero diventare più rapidi, economici e su larga scala."
  1672:
    domain: "Sviluppo software"
    hook: "un solo database cancellato"
    title: "Un agente di programmazione ha cancellato un database di produzione"
    excerpt: "L’ingegnere del software Bruno Lemos ha riferito che GPT-5.6 Sol ha cancellato il suo database di produzione dopo che gli aveva chiesto di generare dati iniziali (seed data) per test locali."
    game_statement: "Un agente di programmazione basato sull’IA avrebbe cancellato un vero database di produzione mentre doveva preparare dati di test locali."
    counterfactual: "Un agente di programmazione basato sull’IA avrebbe inviato un messaggio di prova a migliaia di clienti reali mentre doveva solo controllare un modello di email sul portatile di uno sviluppatore."
    simple_explanation: "Uno sviluppatore ha chiesto a un agente di programmazione di generare dati di test. L’agente avrebbe eseguito i test e poi una pulizia sul vero database di produzione, perché la configurazione del repository puntava al database attivo."
    why_bad: "Non è solo un «cattivo suggerimento di codice»: il modello poteva eseguire azioni su un sistema reale. L’errore è nato dalla combinazione di un presupposto sbagliato sull’ambiente, permessi ampi ed esecuzione autonoma. I sistemi di programmazione agentici trasformano così normali errori software in incidenti operativi potenzialmente immediati, quando possono agire prima che una persona riveda la modifica."
    future_escalation: "Gli agenti di programmazione sono sempre più in grado di modificare repository, eseguire comandi shell, gestire risorse cloud, distribuire servizi e operare su database. Più cose possono fare, più danni può causare un solo presupposto sbagliato."
    highlight: {real: ["cancellato un vero database di produzione"], fake: ["inviato un messaggio di prova a migliaia di clienti reali"]}
  1556:
    domain: "Finanza"
    hook: "un solo trasferimento dirottato"
    title: "Un prompt in codice Morse avrebbe innescato un trasferimento di criptovalute"
    excerpt: "Un utente di X avrebbe indotto Grok e Bankrbot a trasferire 3 miliardi di token DRB, allora valutati circa 200.000 $."
    game_statement: "Un utente avrebbe inviato a un assistente IA un’istruzione in codice Morse, inoltrata a un sistema di trading collegato, che ha portato a un grosso trasferimento di token."
    counterfactual: "Un utente avrebbe nascosto un’istruzione finanziaria in un testo codificato in Base64; un assistente IA lo ha decodificato e passato a un agente di pagamento collegato, che ha avviato un grosso bonifico."
    simple_explanation: "Un utente di X avrebbe chiesto a Grok di tradurre un messaggio in codice Morse e di inoltrarlo a un bot di trading collegato. L’istruzione decodificata avrebbe disposto il trasferimento di token per circa 200.000 $ verso un portafoglio indicato."
    why_bad: "Il problema centrale è il cedimento del confine di autorizzazione: un input conversazionale non affidabile sarebbe diventato un’istruzione finanziaria eseguibile. Quando un LLM si trova tra gli utenti e strumenti con poteri reali, l’interpretazione dei prompt diventa parte del modello di sicurezza. Offuscare un’istruzione non dovrebbe permettere di aggirare i controlli di autorizzazione o di intenzione che proteggono le operazioni di valore elevato."
    future_escalation: "Gli agenti potrebbero controllare sempre più pagamenti, infrastrutture cloud, email, processi aziendali e altri strumenti privilegiati. Se input in linguaggio naturale possono attivare indirettamente questi strumenti senza un’autorizzazione solida, gli aggressori ottengono una nuova interfaccia per manipolare su larga scala i sistemi collegati."
  1596:
    domain: "Frode aziendale"
    hook: "un solo falso direttore"
    title: "Un direttore deepfake ha portato a un bonifico da 1,1 milioni di dollari"
    excerpt: "Starmangalsutra Private Limited avrebbe perso 10,70 crore di rupie dopo che ignoti hanno compromesso i dispositivi aziendali e usato presunti metodi deepfake per impersonare un direttore."
    game_statement: "Dei truffatori si sarebbero spacciati per il direttore di un’azienda con metodi deepfake e avrebbero convinto un dipendente a trasferire circa 1,1 milioni di dollari."
    counterfactual: "Dei truffatori avrebbero usato l’IA per produrre un falso rapporto di revisione a nome di una nota società di revisione. Avrebbero convinto un dipendente a trasferire circa 900.000 dollari come pagamento di imposte arretrate."
    simple_explanation: "Gli aggressori sarebbero entrati nei dispositivi dell’azienda e avrebbero usato quelli che sono stati descritti come metodi deepfake per spacciarsi per un direttore. Un dipendente ha creduto che le istruzioni fossero vere e ha trasferito circa 1,1 milioni di dollari. L’azienda ha poi scoperto che il direttore non le aveva mai date."
    why_bad: "Il lavoro a distanza poggia su un’ipotesi semplice: se vedi o senti una persona che conosci, è davvero lei. Voce e video generati dall’IA rendono economiche le imitazioni convincenti. Molte aziende si fidano ancora di una voce o di una videochiamata senza un secondo controllo. Il danno arriva da due lati: falsi migliori e procedure di approvazione che non sono state pensate per affrontarli."
    future_escalation: "Voce e video falsi in tempo reale potrebbero diventare più economici, più personalizzati e più facili da automatizzare. Gli attacchi con falsa identità potrebbero diventare migliori e più frequenti. I controlli informali dell’identità, come riconoscere una voce, sarebbero sempre meno affidabili."
    highlight: {real: ["spacciati per il direttore di un’azienda con metodi deepfake"], fake: ["falso rapporto di revisione", "pagamento di imposte arretrate"]}
  1717:
    domain: "Polizia"
    hook: "una sola falsa corrispondenza"
    title: "Un errore dell’IA nella lettura della targa ha portato a un fermo con armi spianate"
    excerpt: "La polizia di Toledo, in Ohio, ha fermato l’automobilista Brandon Upchurch sotto la minaccia delle armi dopo che un lettore di targhe Flock Safety aveva associato per errore il suo pick-up a una targa rubata."
    game_statement: "Un lettore automatico di targhe avrebbe letto male la targa di un veicolo. La polizia ha quindi fermato il conducente sotto la minaccia delle armi prima che l’errore venisse scoperto."
    counterfactual: "Un sistema di IA che stima le dimensioni delle folle dalle riprese dei droni avrebbe scambiato una festa di matrimonio per una manifestazione non autorizzata. Sono stati inviati agenti antisommossa prima che l’errore venisse scoperto."
    simple_explanation: "Un lettore automatico di targhe ha associato per errore un pick-up a una targa rubata. La polizia ha fermato il conducente sotto la minaccia delle armi, gli ha sguinzagliato contro un cane che lo ha morso e lo ha arrestato. In seguito la polizia ha detto che l’allerta era un errore di lettura. Le accuse sono state ritirate."
    why_bad: "I sistemi di riconoscimento commettono sempre qualche errore. Il pericolo nasce quando ci si fida di un’allerta al punto da giustificare l’uso della forza. Allora anche un piccolo errore tecnico può finire con un ferimento o un arresto. In questo caso l’allerta doveva anche essere controllata da una persona, e quel controllo non sarebbe stato fatto correttamente."
    future_escalation: "Man mano che la sorveglianza automatizzata si diffonde, le macchine producono molte più allerte. Se anche le decisioni successive sono automatizzate o prese di fretta, i falsi allarmi possono attraversare polizia, controlli di frontiera e altre istituzioni potenti prima che qualcuno li verifichi. La sorveglianza con l’IA ha un secondo pericolo. Quando le telecamere possono seguire ogni auto e ogni volto, tutti sono osservati continuamente, e una sola falsa corrispondenza può seguire una persona da un sistema all’altro."
    highlight: {real: ["lettore automatico di targhe", "fermato il conducente sotto la minaccia delle armi"], fake: ["stima le dimensioni delle folle dalle riprese dei droni", "festa di matrimonio per una manifestazione non autorizzata"]}
  1505:
    domain: "Truffe"
    hook: "una sola voce clonata"
    title: "Voce clonata con l’IA usata in un finto rapimento"
    excerpt: "Deborah Del Mastro avrebbe inviato 5.400 $ in Messico dopo che dei truffatori avevano falsamente sostenuto che sua figlia Sarah era stata rapita"
    game_statement: "Dei truffatori avrebbero usato una voce clonata con l’IA in una telefonata per un finto rapimento e convinto una madre a inviare migliaia di dollari."
    counterfactual: "Dei truffatori avrebbero inviato a una madre in vacanza un video generato dall’IA della sua casa in fiamme. L’avrebbero convinta a pagare migliaia di dollari per una squadra di riparazioni d’emergenza."
    simple_explanation: "Una donna ha ricevuto una telefonata da truffatori che dicevano di aver rapito sua figlia. Le hanno fatto sentire quella che sembrava la voce terrorizzata della figlia. Ha inviato 5.400 $ prima di scoprire che la figlia era al sicuro. La voce sarebbe stata copiata con l’IA."
    why_bad: "Una truffa funziona quando la vittima crede che chi chiama sia una persona di cui si fida. Una voce familiare è uno dei segnali più forti. La clonazione vocale rende economico falsificarla. Le truffe diventano più credibili e più spaventose, soprattutto quando i truffatori usano anche dati personali presi da fonti pubbliche o da fughe di dati."
    future_escalation: "Sistemi più capaci possono combinare voci clonate, video generati, dati personali e chatbot in grado di sostenere una conversazione. Truffe che oggi richiedono molto lavoro potrebbero diventare in parte automatiche e colpire molte persone nello stesso momento."
    highlight: {real: ["voce clonata con l’IA", "telefonata per un finto rapimento"], fake: ["video generato dall’IA della sua casa in fiamme", "squadra di riparazioni d’emergenza"]}
  1379:
    domain: "Giustizia e prove"
    hook: "una sola prova contestata"
    title: "Prove presumibilmente fabbricate con l’IA hanno contribuito a una detenzione"
    excerpt: "Un’infermiera della Florida, Melissa Sims, sarebbe stata detenuta per due giorni per una presunta violazione di un ordine di cauzione / divieto di contatto."
    game_statement: "Una donna sarebbe stata detenuta dopo la presentazione di messaggi di testo attribuiti a lei. In seguito è stato sostenuto che i messaggi erano stati falsificati con l’IA."
    counterfactual: "Una donna avrebbe perso il diritto di vedere suo figlio per alcune settimane dopo la presentazione di una cronologia delle visualizzazioni sui social network attribuita a lei. In seguito è stato sostenuto che quei dati erano stati generati con l’IA."
    simple_explanation: "Un’infermiera della Florida avrebbe trascorso due giorni in detenzione dopo che il suo ex partner aveva presentato messaggi di testo attribuiti a lei. In seguito è stato sostenuto che i messaggi erano stati generati o falsificati con l’IA."
    why_bad: "I tribunali dipendono da prove che si possano ricondurre a persone e fatti reali. L’IA rende economico produrre messaggi, immagini e registrazioni false ma convincenti. Molti tribunali si affidano ancora a screenshot e registrazioni la cui origine è difficile da verificare. Il rischio va in entrambe le direzioni: una prova falsa può essere accettata e una prova vera può essere scartata come falsa."
    future_escalation: "Man mano che testi, immagini, audio e video falsi migliorano, tribunali, giornalisti, datori di lavoro e pubblico fanno più fatica a capire che cosa è vero. Cresce il rischio di decisioni sbagliate. Un innocente può essere punito a causa di un falso, e una prova vera può essere respinta come falsa."
    highlight: {real: ["detenuta", "messaggi di testo"], fake: ["perso il diritto di vedere suo figlio", "cronologia delle visualizzazioni sui social network"]}
  1374:
    domain: "Sanità"
    hook: "un solo allarme sbagliato"
    title: "Un allarme medico dell’IA ha quasi portato a un trattamento inappropriato"
    excerpt: "Un’infermiera del St. Rose Dominican Hospital avrebbe descritto un episodio in cui un sistema di IA dell’ospedale avrebbe generato un allarme di sepsi."
    game_statement: "Un sistema di IA ospedaliero avrebbe generato un allarme di sepsi per un paziente anziano in dialisi. La risposta abituale, i liquidi per via endovenosa, avrebbe potuto danneggiare questo paziente. Un’infermiera se n’è accorta e un medico ha cambiato il trattamento."
    counterfactual: "Un sistema di IA ospedaliero che pianifica le sale operatorie avrebbe letto male una nota nella cartella di un paziente e messo un intervento urgente dopo quelli di routine. Un’infermiera se n’è accorta prima che il ritardo causasse danni."
    simple_explanation: "Un sistema di IA ospedaliero avrebbe generato un allarme di sepsi per un paziente anziano in dialisi. La risposta d’urgenza standard comprende liquidi per via endovenosa. Un’infermiera ha capito che i liquidi potevano sovraccaricare pericolosamente questo paziente. Un medico è intervenuto e ha cambiato il trattamento."
    why_bad: "Gli ospedali usano strumenti come questo per agire in fretta e seguire procedure stabilite. È utile, ma ha un costo. Il personale può trattare un allarme come un ordine, anche quando la risposta standard è sbagliata per un certo paziente. Questo si chiama bias da automazione. Qui un’infermiera ha notato il problema. Se il personale non ha più il tempo o l’autorità di mettere in dubbio un allarme, lo stesso errore potrebbe raggiungere molti pazienti."
    future_escalation: "L’IA diventa più capace e viene integrata più a fondo in diagnosi, triage e decisioni sulle cure. Gli ospedali potrebbero affidarle sempre più lavoro. Se il controllo umano diventa una formalità, un solo errore di un modello potrebbe ripetersi su molti pazienti prima che qualcuno se ne accorga."
    highlight: {real: ["allarme di sepsi", "liquidi per via endovenosa"], fake: ["pianifica le sale operatorie", "messo un intervento urgente dopo quelli di routine"]}
  1606:
    domain: "Servizi pubblici"
    hook: "una sola verifica facciale fallita"
    title: "Verifica facciale e accesso ai sussidi sociali"
    excerpt: "I beneficiari di sussidi sociali in Sudafrica avrebbero riscontrato ripetuti errori nel portale di verifica facciale eLife della SASSA."
    game_statement: "Un portale di verifica facciale avrebbe continuato a dare errori. È stato uno dei motivi per cui alcune persone non sono riuscite a ottenere i sussidi sociali."
    counterfactual: "Un sistema di IA che smista le lettere dei cittadini avrebbe inviato centinaia di ricorsi sui sussidi all’ufficio sbagliato. Le persone hanno perso i termini per il ricorso prima che qualcuno se ne accorgesse."
    simple_explanation: "In Sudafrica, chi riceveva sussidi sociali avrebbe incontrato ripetuti errori su un portale di verifica facciale gestito dall’agenzia pubblica SASSA. Rapporti al parlamento hanno poi indicato il mancato riconoscimento facciale come una delle cause delle verifiche fallite. Hanno anche confermato 67.868 sospensioni di sussidi in un trimestre. Non hanno detto quante fossero dovute alla verifica facciale."
    why_bad: "Quando l’accesso a un sostegno di base dipende da un controllo automatico dell’identità, un rifiuto sbagliato è grave. Per chi vive di un sussidio può voler dire niente soldi per cibo, affitto, trasporti o medicine. Poiché un solo sistema serve tutti, un solo guasto può colpire molte persone insieme. E correggere l’errore tocca spesso a chi ha meno tempo, denaro e accesso a internet per fare ricorso."
