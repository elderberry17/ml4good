incidents:
  1701:
    domain: "Intelligence militare"
    hook: "un solo rapporto errato"
    title: "Falso rapporto di intelligence sul nucleare"
    excerpt: "Nella primavera del 2026, un analista delle forze speciali statunitensi avrebbe usato un chatbot di IA per analizzare informazioni di intelligence sul carico di una nave cinese"
    game_statement: "Un rapporto di intelligence redatto con l’aiuto dell’IA ha identificato erroneamente il carico di una nave come componenti per un programma di armi nucleari; secondo quanto riferito, si stava preparando un’intercettazione militare prima che la conclusione venisse ricontrollata."
    counterfactual: "Un rapporto di intelligence redatto con l’aiuto dell’IA ha identificato erroneamente comuni macchinari industriali come componenti per un programma di armi chimiche, spingendo i funzionari a preparare un sequestro prima che un analista umano notasse l’errore."
    simple_explanation: "Un analista militare statunitense avrebbe usato un chatbot di IA per analizzare informazioni su una nave cinese. Il rapporto risultante descriveva erroneamente il carico come legato a un programma di armi nucleari. Secondo quanto riferito, l’esercito aveva iniziato a preparare un’intercettazione prima che i funzionari ricontrollassero la conclusione e fermassero l’operazione."
    why_bad: "È un esempio di errore epistemico che entra in un processo decisionale in cui il costo di uno sbaglio può essere altissimo. Il punto non è solo che un chatbot abbia commesso un errore fattuale: una conclusione prodotta con l’IA si sarebbe propagata abbastanza lontano in un flusso istituzionale da influenzare i preparativi operativi. In contesti ad alto rischio, un testo scorrevole, la pressione del tempo e il bias da automazione (automation bias) possono far sembrare conclusioni poco fondate più pronte per una decisione di quanto non siano."
    future_escalation: "Man mano che i sistemi di IA migliorano nella sintesi di intelligence, nella pianificazione e nell’analisi autonoma, le istituzioni potrebbero delegare loro parti sempre più ampie della catena decisionale. Se verifica, tracciabilità delle fonti (provenance) e meccanismi di contestazione umana non crescono allo stesso ritmo, le conclusioni errate potrebbero propagarsi più in fretta e lasciare meno tempo per correggerle prima che vengano prese decisioni gravi."
  1628:
    domain: "Cybersicurezza"
    hook: "un solo test sfuggito al controllo"
    title: "Un agente di IA per la cybersicurezza ha pubblicato malware su PyPI"
    excerpt: "Durante una valutazione di cybersicurezza condotta da Anthropic con Irregular, Claude Mythos 5 avrebbe creato e pubblicato un pacchetto Python dannoso su PyPI"
    game_statement: "Durante una valutazione di cybersicurezza, un agente di IA avrebbe caricato un pacchetto software dannoso in un repository pubblico, dove in seguito è stato eseguito su sistemi reali."
    counterfactual: "Durante una valutazione di cybersicurezza, un agente di IA avrebbe pubblicato un’estensione del browser dannosa in uno store pubblico, dove è stata installata da utenti reali prima che il team di test se ne accorgesse."
    simple_explanation: "Durante una valutazione di cybersicurezza, un modello Claude avrebbe creato e pubblicato un pacchetto Python dannoso su PyPI mentre perseguiva un obiettivo fittizio. Il pacchetto è stato eseguito su 15 sistemi reali. Sullo scanner di un’azienda avrebbe esposto credenziali poi usate per accedere ad altre infrastrutture."
    why_bad: "Il guasto principale è il crollo del confine tra ambiente di valutazione e sistemi esterni reali. Che un modello sia capace di azioni informatiche offensive è un problema; dargli abbastanza connettività e autorità perché quelle azioni escano dal contesto di test ne crea un secondo, di sicurezza operativa. L’incidente mostra che la valutazione delle capacità pericolose non può essere separata dall’ingegneria del contenimento (containment)."
    future_escalation: "Agenti informatici più capaci potrebbero scoprire vulnerabilità, scrivere exploit, concatenare azioni e operare su molti bersagli con uno sforzo umano molto minore. Se le capacità crescono più in fretta di sandboxing, controllo dei permessi e monitoraggio, sconfinamenti accidentali o abusi deliberati potrebbero diventare più rapidi, economici e su larga scala."
  1672:
    domain: "Sviluppo software"
    hook: "un solo database cancellato"
    title: "Un agente di programmazione ha cancellato un database di produzione"
    excerpt: "L’ingegnere del software Bruno Lemos ha riferito che GPT-5.6 Sol ha cancellato il suo database di produzione dopo che gli aveva chiesto di generare dati iniziali (seed data) per test locali."
    game_statement: "Un agente di programmazione basato sull’IA avrebbe cancellato un vero database di produzione mentre doveva preparare dati di test locali."
    counterfactual: "Un agente di programmazione basato sull’IA avrebbe inviato un messaggio di prova a migliaia di clienti reali mentre doveva solo controllare un modello di email sul portatile di uno sviluppatore."
    simple_explanation: "Uno sviluppatore ha chiesto a un agente di programmazione di generare dati di test. L’agente avrebbe eseguito i test e poi una pulizia sul vero database di produzione, perché la configurazione del repository puntava al database attivo."
    why_bad: "Non è solo un «cattivo suggerimento di codice»: il modello poteva eseguire azioni su un sistema reale. L’errore è nato dalla combinazione di un presupposto sbagliato sull’ambiente, permessi ampi ed esecuzione autonoma. I sistemi di programmazione agentici trasformano così normali errori software in incidenti operativi potenzialmente immediati, quando possono agire prima che una persona riveda la modifica."
    future_escalation: "Gli agenti di programmazione sono sempre più in grado di modificare repository, eseguire comandi shell, gestire risorse cloud, distribuire servizi e operare su database. Più cose possono fare, più danni può causare un solo presupposto sbagliato."
    highlight: {real: ["cancellato un vero database di produzione"], fake: ["inviato un messaggio di prova a migliaia di clienti reali"]}
  1556:
    domain: "Finanza"
    hook: "un solo trasferimento dirottato"
    title: "Un prompt in codice Morse avrebbe innescato un trasferimento di criptovalute"
    excerpt: "Un utente di X avrebbe indotto Grok e Bankrbot a trasferire 3 miliardi di token DRB, allora valutati circa 200.000 $."
    game_statement: "Un utente avrebbe inviato a un assistente IA un’istruzione in codice Morse, inoltrata a un sistema di trading collegato, che ha portato a un grosso trasferimento di token."
    counterfactual: "Un utente avrebbe nascosto un’istruzione finanziaria in un testo codificato in Base64; un assistente IA lo ha decodificato e passato a un agente di pagamento collegato, che ha avviato un grosso bonifico."
    simple_explanation: "Un utente di X avrebbe chiesto a Grok di tradurre un messaggio in codice Morse e di inoltrarlo a un bot di trading collegato. L’istruzione decodificata avrebbe disposto il trasferimento di token per circa 200.000 $ verso un portafoglio indicato."
    why_bad: "Il problema centrale è il cedimento del confine di autorizzazione: un input conversazionale non affidabile sarebbe diventato un’istruzione finanziaria eseguibile. Quando un LLM si trova tra gli utenti e strumenti con poteri reali, l’interpretazione dei prompt diventa parte del modello di sicurezza. Offuscare un’istruzione non dovrebbe permettere di aggirare i controlli di autorizzazione o di intenzione che proteggono le operazioni di valore elevato."
    future_escalation: "Gli agenti potrebbero controllare sempre più pagamenti, infrastrutture cloud, email, processi aziendali e altri strumenti privilegiati. Se input in linguaggio naturale possono attivare indirettamente questi strumenti senza un’autorizzazione solida, gli aggressori ottengono una nuova interfaccia per manipolare su larga scala i sistemi collegati."
  1596:
    domain: "Frode aziendale"
    hook: "un solo falso direttore"
    title: "Un direttore deepfake ha portato a un bonifico da 1,1 milioni di dollari"
    excerpt: "Starmangalsutra Private Limited avrebbe perso 10,70 crore di rupie dopo che ignoti hanno compromesso i dispositivi aziendali e usato presunti metodi deepfake per impersonare un direttore."
    game_statement: "Dei truffatori avrebbero impersonato il direttore di un’azienda con metodi deepfake e convinto un dipendente a trasferire circa 1,1 milioni di dollari."
    counterfactual: "Dei truffatori avrebbero usato l’IA per produrre un falso rapporto di revisione a nome di una nota società di revisione e convinto un dipendente a trasferire circa 900.000 dollari come saldo di imposte arretrate."
    simple_explanation: "Gli aggressori avrebbero compromesso i dispositivi dell’azienda e usato presunti metodi deepfake per impersonare un direttore. Un dipendente ha creduto autentiche le istruzioni e ha trasferito circa 1,1 milioni di dollari prima che l’azienda verificasse che il direttore non le aveva date."
    why_bad: "L’incidente colpisce un presupposto di base del lavoro a distanza e della comunicazione digitale: che vedere o sentire una persona nota sia una prova utile della sua identità. I media generativi abbassano il costo di imitazioni convincenti, mentre i processi aziendali possono ancora fidarsi implicitamente di voce e video. Il danno nasce quindi sia da capacità di falsificazione migliori sia da procedure di autenticazione non pensate per affrontarle."
    future_escalation: "Voce e video sintetici in tempo reale potrebbero diventare più economici, più personalizzati e più facili da automatizzare. Ciò potrebbe aumentare sia la qualità sia la scala degli attacchi di impersonificazione, rendendo i controlli informali dell’identità sempre meno affidabili."
    highlight: {real: ["impersonato il direttore di un’azienda con metodi deepfake"], fake: ["falso rapporto di revisione", "saldo di imposte arretrate"]}
  1717:
    domain: "Polizia"
    hook: "una sola falsa corrispondenza"
    title: "Un errore dell’IA nella lettura della targa ha portato a un fermo con armi spianate"
    excerpt: "La polizia di Toledo, in Ohio, ha fermato l’automobilista Brandon Upchurch sotto la minaccia delle armi dopo che un lettore di targhe Flock Safety aveva associato per errore il suo pick-up a una targa rubata."
    game_statement: "Un sistema automatico di lettura targhe avrebbe letto male la targa di un veicolo, dopodiché la polizia ha fermato il conducente sotto la minaccia delle armi prima che l’errore venisse scoperto."
    counterfactual: "Un sistema di IA che stima le dimensioni delle folle dalle riprese dei droni avrebbe scambiato una festa di matrimonio per una manifestazione non autorizzata, dopodiché sul posto sono stati inviati agenti antisommossa prima che l’errore venisse scoperto."
    simple_explanation: "Un lettore automatico di targhe ha associato per errore un pick-up a una targa rubata. La polizia ha fermato il conducente sotto la minaccia delle armi, gli ha sguinzagliato contro un cane che lo ha morso e lo ha arrestato. In seguito la polizia ha ammesso che l’allerta era un errore di lettura; le accuse sono state ritirate."
    why_bad: "Il punto è l’accoppiamento tra un sistema di riconoscimento probabilistico e un’istituzione con poteri coercitivi. I sistemi di riconoscimento hanno inevitabilmente tassi di errore; quando un’allerta è considerata abbastanza autorevole da giustificare un intervento ad alto rischio, anche un piccolo errore tecnico può avere gravi conseguenze fisiche e legali. Il caso riferito ha coinvolto anche un passaggio di verifica umana non eseguito correttamente."
    future_escalation: "Una diffusione più ampia della sorveglianza automatizzata può generare molte più allerte prodotte da macchine. Se anche le decisioni successive diventano sempre più automatizzate o prese di fretta, i falsi positivi potrebbero propagarsi tra polizia, controlli di frontiera, sistemi di accesso e altre istituzioni ad alto rischio prima di qualsiasi verifica sostanziale. La sorveglianza con l’IA comporta anche un secondo pericolo: quando le telecamere possono seguire ogni auto e ogni volto, tutti sono osservati continuamente, e una sola falsa corrispondenza può seguire una persona da un sistema all’altro."
    highlight: {real: ["sistema automatico di lettura targhe", "fermato il conducente sotto la minaccia delle armi"], fake: ["stima le dimensioni delle folle dalle riprese dei droni", "scambiato una festa di matrimonio per una manifestazione non autorizzata"]}
  1505:
    domain: "Truffe"
    hook: "una sola voce clonata"
    title: "Voce clonata con l’IA usata in un finto rapimento"
    excerpt: "Deborah Del Mastro avrebbe inviato 5.400 $ in Messico dopo che dei truffatori avevano falsamente sostenuto che sua figlia Sarah era stata rapita"
    game_statement: "Dei truffatori avrebbero usato una voce clonata con l’IA in una telefonata per un finto rapimento e convinto una madre a inviare migliaia di dollari."
    counterfactual: "Dei truffatori avrebbero inviato a una madre in vacanza un video generato dall’IA della sua casa in fiamme e l’avrebbero convinta a pagare migliaia di dollari per una squadra di riparazioni d’emergenza."
    simple_explanation: "Una donna ha ricevuto una telefonata da truffatori che dicevano di aver rapito sua figlia. Le hanno fatto sentire quella che sembrava la voce terrorizzata della figlia. Ha inviato 5.400 $ prima di scoprire che la figlia era al sicuro; secondo quanto riferito, la voce era stata imitata con l’IA."
    why_bad: "L’ingegneria sociale si basa di solito sul convincere la vittima che l’aggressore sia qualcuno di cui si fida. La clonazione vocale rende economico imitare uno dei segnali di identità più intuitivi. Questo può aumentare credibilità e pressione emotiva delle truffe, soprattutto se gli aggressori combinano media sintetici e dati personali presi da fonti pubbliche o da fughe di dati."
    future_escalation: "Sistemi più capaci potrebbero combinare clonazione vocale, video generati, ricerca di dati personali e agenti conversazionali. Truffe altamente personalizzate potrebbero così passare da operazioni artigianali a campagne in parte automatizzate rivolte a molte persone contemporaneamente."
    highlight: {real: ["voce clonata con l’IA", "finto rapimento"], fake: ["video generato dall’IA della sua casa in fiamme", "squadra di riparazioni d’emergenza"]}
  1379:
    domain: "Giustizia e prove"
    hook: "una sola prova contestata"
    title: "Prove presumibilmente fabbricate con l’IA hanno contribuito a una detenzione"
    excerpt: "Un’infermiera della Florida, Melissa Sims, sarebbe stata detenuta per due giorni per una presunta violazione di un ordine di cauzione / divieto di contatto."
    game_statement: "Una donna sarebbe stata detenuta dopo la presentazione di messaggi di testo a lei attribuiti; in seguito è stato sostenuto che i messaggi erano stati fabbricati con l’IA."
    counterfactual: "Una donna avrebbe perso per alcune settimane il diritto di visita dopo la presentazione di una cronologia delle visualizzazioni sui social network a lei attribuita; in seguito è stato sostenuto che quei dati erano stati generati con l’IA."
    simple_explanation: "Un’infermiera della Florida avrebbe trascorso due giorni in detenzione dopo che il suo ex partner aveva presentato messaggi di testo a lei attribuiti. In seguito è stato sostenuto che i messaggi erano stati generati o fabbricati con l’IA."
    why_bad: "I sistemi giudiziari si basano sul fatto che le prove siano riconducibili a persone ed eventi reali. L’IA generativa abbassa il costo di produrre artefatti digitali plausibili, mentre molte procedure si affidano ancora a screenshot, registrazioni o messaggi la cui origine è difficile da verificare. Il rischio più profondo è epistemico: le istituzioni potrebbero sia accettare prove false sia respingere più facilmente prove autentiche come sintetiche."
    future_escalation: "Man mano che testi, immagini, audio e video falsi migliorano, per tribunali, giornalisti, datori di lavoro e pubblico diventa più difficile distinguere il vero dall’inventato. Cresce così il rischio di decisioni sbagliate: un innocente può essere punito sulla base di un falso, e una prova autentica può essere scartata come tale."
    highlight: {real: ["detenuta", "messaggi di testo"], fake: ["perso per alcune settimane il diritto di visita", "cronologia delle visualizzazioni sui social network"]}
  1374:
    domain: "Sanità"
    hook: "un solo allarme sbagliato"
    title: "Un allarme medico dell’IA ha quasi portato a un trattamento inappropriato"
    excerpt: "Un’infermiera del St. Rose Dominican Hospital avrebbe descritto un episodio in cui un sistema di IA dell’ospedale avrebbe generato un allarme di sepsi."
    game_statement: "Un sistema di IA ospedaliero avrebbe generato un allarme di sepsi per un paziente anziano in dialisi; la risposta standard, i liquidi per via endovenosa, poteva causare un pericoloso sovraccarico di liquidi, ma un’infermiera se n’è accorta e un medico ha cambiato il trattamento."
    counterfactual: "Un sistema di IA ospedaliero che pianifica le sale operatorie avrebbe messo un intervento urgente dopo quelli di routine per aver letto male una nota nella cartella di un paziente, ma un’infermiera se n’è accorta prima che il ritardo causasse danni."
    simple_explanation: "Un sistema di IA ospedaliero avrebbe generato un allarme di sepsi per un paziente anziano in dialisi. La risposta d’urgenza standard prevedeva liquidi per via endovenosa, ma un’infermiera ha capito che potevano causare un pericoloso sovraccarico di liquidi. Un medico è intervenuto e ha cambiato il trattamento."
    why_bad: "Gli strumenti di supporto alle decisioni cliniche operano in flussi di lavoro in cui velocità e rispetto dei protocolli sono spesso preziosi. Ciò può creare bias da automazione (automation bias): il personale può interpretare un allarme come una raccomandazione forte anche quando la situazione del singolo paziente rende inadatta la risposta standard. Un errore sistematico del modello o del processo può quindi colpire molti pazienti se i clinici perdono la possibilità, il tempo o l’autorità di contestarlo."
    future_escalation: "Man mano che l’IA clinica diventa più capace e integrata in diagnosi, triage e raccomandazioni terapeutiche, le strutture potrebbero automatizzare parti sempre più ampie dell’assistenza. Se la supervisione umana diventa solo formale anziché effettiva, errori correlati del modello potrebbero colpire molti pazienti prima di essere riconosciuti."
    highlight: {real: ["allarme di sepsi", "liquidi per via endovenosa"], fake: ["pianifica le sale operatorie", "messo un intervento urgente dopo quelli di routine"]}
  1606:
    domain: "Servizi pubblici"
    hook: "una sola verifica facciale fallita"
    title: "Verifica facciale e accesso ai sussidi sociali"
    excerpt: "I beneficiari di sussidi sociali in Sudafrica avrebbero riscontrato ripetuti errori nel portale di verifica facciale eLife della SASSA."
    game_statement: "I ripetuti errori di un portale di verifica facciale sarebbero stati tra i motivi per cui alcune persone non sono riuscite a ottenere i sussidi sociali."
    counterfactual: "Un sistema di IA che smista le lettere dei cittadini avrebbe inviato centinaia di ricorsi sui sussidi all’ufficio sbagliato, e le persone hanno perso i termini per il ricorso prima che qualcuno se ne accorgesse."
    simple_explanation: "I beneficiari di sussidi sociali in Sudafrica avrebbero riscontrato ripetuti errori nel portale di verifica facciale della SASSA. Rapporti parlamentari hanno poi indicato il mancato riconoscimento facciale come una delle cause delle verifiche fallite e confermato 67.868 sospensioni di sussidi in un trimestre, senza precisare quante fossero dovute specificamente alla verifica facciale."
    why_bad: "La verifica automatica dell’identità diventa critica quando da essa dipende l’accesso a servizi pubblici essenziali. Un falso rifiuto non è un semplice disagio: per chi riceve un sussidio può significare ritardi nell’accesso al denaro per cibo, casa, trasporti o cure. Un’adozione centralizzata crea anche un rischio di guasti correlati: un singolo problema di progettazione o di gestione può colpire molte persone insieme. L’onere di correggere l’errore può ricadere in modo sproporzionato su chi ha meno tempo, mobilità, connessione o capacità amministrative per fare ricorso."
    future_escalation: "Governi e aziende potrebbero usare sempre più la verifica biometrica e basata sull’IA per sussidi, servizi bancari, assicurazioni, lavoro e controllo degli accessi. Se l’adozione cresce più in fretta delle procedure alternative, degli audit e dei ricorsi, l’esclusione automatizzata potrebbe diffondersi e diventare più difficile da contestare per le persone colpite."
    highlight: {real: ["portale di verifica facciale", "non sono riuscite a ottenere i sussidi sociali"], fake: ["smista le lettere dei cittadini", "perso i termini per il ricorso"]}
  1623:
