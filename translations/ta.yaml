  endLead: "இது அறிவியல் புனைவு அல்ல. இத்தகைய நிகழ்வுகள் ஏற்கெனவே, அடிக்கடி, இந்த வரைபடத்தில் உள்ளவை போன்ற சாதாரண இடங்களில் நடக்கின்றன. இவை ஏற்கெனவே அன்றாட வாழ்வின் ஒரு பகுதி. காலம் கடந்துவிடுவதற்கு முன் AI அச்சுறுத்தல்களை நாம் தீவிரமாக எடுத்துக்கொள்ள வேண்டும். கீழே உள்ள ஒவ்வொரு உண்மை நிகழ்வும் பதிவு செய்யப்பட்டு, மூலத்துக்கான இணைப்புடன் உள்ளது."
