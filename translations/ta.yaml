incidents:
  1701:
    domain: "இராணுவ உளவுத்துறை"
    hook: "ஒரு தவறான அறிக்கை"
    title: "அணு ஆயுதம் தொடர்பான தவறான உளவு அறிக்கை"
    excerpt: "2026 வசந்த காலத்தில், அமெரிக்கச் சிறப்பு நடவடிக்கைப் படையின் ஆய்வாளர் ஒருவர் சீனக் கப்பல் ஒன்றின் சரக்கு குறித்த உளவுத் தகவல்களை ஆராய AI சாட்பாட்டைப் பயன்படுத்தியதாகக் கூறப்படுகிறது"
    game_statement: "AI உதவியுடன் தயாரிக்கப்பட்ட உளவு அறிக்கை ஒன்று, ஒரு கப்பலின் சரக்கை அணு ஆயுதத் திட்டத்துக்கான பாகங்கள் என்று தவறாக அடையாளம் கண்டது; அந்த முடிவு மறுபரிசீலனை செய்யப்படுவதற்கு முன்பே இராணுவ இடைமறிப்புக்கான தயாரிப்பு நடந்துகொண்டிருந்ததாகக் கூறப்படுகிறது."
    counterfactual: "AI உதவியுடன் தயாரிக்கப்பட்ட உளவு அறிக்கை ஒன்று, சாதாரணத் தொழிற்சாலை உபகரணங்களை இரசாயன ஆயுதத் திட்டத்துக்கான பாகங்கள் என்று தவறாக அடையாளம் கண்டது; ஒரு மனித ஆய்வாளர் பிழையைக் கண்டுபிடிப்பதற்கு முன்பே அதிகாரிகள் பறிமுதல் செய்யத் தயாரானார்கள்."
    simple_explanation: "அமெரிக்க இராணுவ ஆய்வாளர் ஒருவர் சீனக் கப்பல் குறித்த உளவுத் தகவல்களை ஆராயும்போது AI சாட்பாட்டைப் பயன்படுத்தியதாகக் கூறப்படுகிறது. அதன் விளைவாக உருவான அறிக்கை, சரக்கு அணு ஆயுதத் திட்டத்துடன் தொடர்புடையது என்று தவறாகக் குறிப்பிட்டது. அதிகாரிகள் அந்த முடிவை மீண்டும் சரிபார்த்து நடவடிக்கையை நிறுத்துவதற்கு முன்பே, இராணுவம் இடைமறிப்புக்குத் தயாராகத் தொடங்கியதாகத் தகவல்கள் தெரிவிக்கின்றன."
    why_bad: "பிழையின் விலை மிக அதிகமாக இருக்கக்கூடிய ஒரு முடிவெடுக்கும் செயல்முறைக்குள் அறிவுசார் தோல்வி நுழைந்ததற்கு இது ஓர் எடுத்துக்காட்டு. சாட்பாட் ஒரு தகவல் பிழை செய்தது மட்டும் பிரச்சினை அல்ல: AI உதவியுடன் பெறப்பட்ட முடிவு, நிறுவனச் செயல்முறையில் இராணுவத் தயாரிப்புகளைப் பாதிக்கும் அளவுக்கு முன்னேறியதாகக் கூறப்படுகிறது. உயர் ஆபத்துச் சூழல்களில், சரளமான எழுத்து, நேர அழுத்தம், தானியக்கச் சார்புநிலை (automation bias) ஆகியவை வலுவற்ற முடிவுகளை உண்மையில் இருப்பதை விட முடிவெடுக்கத் தயாரானவையாகக் காட்டக்கூடும்."
