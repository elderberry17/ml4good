  landingH: "நீங்கள்தான் மேயர்."
  landingP: "உங்கள் நகரின் ஒவ்வொரு கட்டடத்திலும் AI ஏற்கெனவே அமைதியாகச் செயல்படுகிறது: மருத்துவமனை, வங்கி, காவல் நிலையம், நீதிமன்றம். ஒவ்வொரு சுற்றிலும் ஓர் ஆலோசகர் உங்களிடம் இரண்டு அறிக்கைகளைக் கொண்டுவருவார். ஒன்று {aiid}-இல் பதிவான உண்மை நிகழ்வு, மற்றொன்று வதந்தி. உண்மையான அச்சுறுத்தலைக் கண்டறிந்தால் அந்தக் கட்டடம் பாதுகாக்கப்படும். தவறவிட்டால், நகரம் விலை கொடுக்கும்."
