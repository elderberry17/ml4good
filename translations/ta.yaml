    simple_explanation: "தாக்குதல்காரர்கள் நிறுவனக் கருவிகளுக்குள் ஊடுருவி, கூறப்படும் டீப்ஃபேக் முறைகள் மூலம் ஓர் இயக்குநராக ஆள்மாறாட்டம் செய்ததாகக் கூறப்படுகிறது. அந்த அறிவுறுத்தல்கள் உண்மையானவை என்று நம்பிய ஊழியர் ஒருவர் சுமார் 11 லட்சம் டாலரைப் பரிமாற்றம் செய்தார்; இயக்குநர் அவற்றை வழங்கவில்லை என்பதை நிறுவனம் அதன் பிறகே உறுதிசெய்தது."
