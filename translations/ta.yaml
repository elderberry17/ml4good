    title: "முகச் சரிபார்ப்பும் சமூக நலத் திட்டங்களுக்கான அணுகலும்"
    excerpt: "தென்னாப்பிரிக்காவில் சமூக உதவித்தொகை பெறுவோர் SASSA-வின் eLife முகச் சரிபார்ப்புத் தளத்தில் மீண்டும் மீண்டும் தோல்விகளைச் சந்தித்ததாகக் கூறப்படுகிறது."
    game_statement: "ஒரு முகச் சரிபார்ப்பு இணையதளம் மீண்டும் மீண்டும் செயலிழந்ததாகக் கூறப்படுகிறது. சிலர் சமூக நல உதவித்தொகையைப் பெற முடியாமல் போனதற்கு இது ஒரு காரணம்."
    counterfactual: "குடிமக்களின் கடிதங்களை வகைப்படுத்தும் ஒரு AI அமைப்பு, உதவித்தொகை தொடர்பான நூற்றுக்கணக்கான மேல்முறையீடுகளைத் தவறான துறைக்கு அனுப்பியதாகக் கூறப்படுகிறது. யாரும் கவனிப்பதற்கு முன் மக்கள் மேல்முறையீட்டுக் காலக்கெடுவைத் தவறவிட்டனர்."
    simple_explanation: "தென்னாப்பிரிக்காவில், சமூக நல உதவித்தொகை பெறுவோர், அரசு நிறுவனமான SASSA நடத்தும் முகச் சரிபார்ப்பு இணையதளத்தில் மீண்டும் மீண்டும் கோளாறுகளை எதிர்கொண்டதாகக் கூறப்படுகிறது. மக்கள் சரிபார்க்கப்படாமல் போனதற்கான காரணங்களில் ஒன்றாக முக அடையாளம் தோல்வியடைந்ததை நாடாளுமன்றத்துக்கு அளிக்கப்பட்ட அறிக்கைகள் பின்னர் குறிப்பிட்டன. ஒரு காலாண்டில் 67,868 உதவித்தொகைகள் நிறுத்திவைக்கப்பட்டதையும் அவை உறுதிப்படுத்தின. அவற்றில் எத்தனை முகச் சரிபார்ப்பால் ஏற்பட்டன என்று அவை கூறவில்லை."
    why_bad: "அடிப்படை உதவியைப் பெறுவது தானியங்கி அடையாளச் சரிபார்ப்பைச் சார்ந்திருக்கும்போது, தவறான மறுப்பு தீவிரமானது. உதவித்தொகையை நம்பி வாழ்பவருக்கு, அது உணவு, வாடகை, போக்குவரத்து, மருந்து ஆகியவற்றுக்குப் பணம் இல்லை என்று பொருள்படலாம். ஒரே அமைப்பு எல்லோருக்கும் சேவை செய்வதால், ஒரு கோளாறு ஒரே நேரத்தில் பலரைப் பாதிக்கலாம். பிழையைச் சரிசெய்யும் சுமை, மேல்முறையீடு செய்ய நேரம், பணம், இணைய வசதி ஆகியவை மிகக் குறைவாக உள்ளவர்கள் மீதே பெரும்பாலும் விழுகிறது."
    future_escalation: "அரசுகளும் நிறுவனங்களும் உதவித்தொகை, வங்கி, காப்பீடு, வேலை, கட்டடங்களுக்குள் நுழைதல் ஆகியவற்றுக்கு முகச் சரிபார்ப்பையும் பிற AI அடையாளச் சரிபார்ப்புகளையும் பயன்படுத்துகின்றன. மாற்று வழிகள், தணிக்கைகள், மேல்முறையீட்டு வழிகள் ஆகியவற்றைவிட இந்த அமைப்புகள் வேகமாகப் பரவினால், மேலும் பலர் மேல்முறையீடு செய்ய வாய்ப்பே கிட்டத்தட்ட இல்லாமல் தானாகவே விலக்கப்படக்கூடும்."
    highlight: {real: ["முகச் சரிபார்ப்பு இணையதளம்", "சமூக நல உதவித்தொகையைப் பெற முடியாமல் போனதற்கு"], fake: ["குடிமக்களின் கடிதங்களை வகைப்படுத்தும்", "மேல்முறையீட்டுக் காலக்கெடுவைத் தவறவிட்டனர்"]}
  1623:
    domain: "பள்ளி"
    hook: "பட உருவாக்கக் கருவியுடன் இரண்டு மாணவர்கள்"
    title: "மாணவர்கள் சக மாணவிகளின் தகாத டீப்ஃபேக் படங்களை உருவாக்கியதாகக் குற்றச்சாட்டு"
    excerpt: "அதிகாரிகள் பின்னர் 60 பாதிக்கப்பட்டவர்களை அடையாளம் கண்டனர்; அவர்களில் 59 பேர் சிறார்."
    game_statement: "ஒரு தனியார் பள்ளியின் இரண்டு மாணவர்கள், AI கருவிகளைப் பயன்படுத்தி வகுப்புத் தோழிகளின் பொருத்தமற்ற போலிப் படங்களை நூற்றுக்கணக்கில் உருவாக்கிப் பகிர்ந்ததாகக் குற்றம் சாட்டப்படுகிறது. அதிகாரிகள் பின்னர் டஜன் கணக்கான பாதிக்கப்பட்டவர்களை அடையாளம் கண்டனர்; கிட்டத்தட்ட அனைவரும் சிறார்கள்."
    counterfactual: "ஓர் அரசுப் பள்ளியின் இரண்டு மாணவர்கள், AI கருவிகளைப் பயன்படுத்தி, வகுப்புத் தோழர்கள் போதைப்பொருள் பயன்படுத்துவதாகக் குற்றம் சாட்டும், பள்ளியின் கடிதத் தலைப்புடன் கூடிய உண்மை போன்ற கடிதங்களை உருவாக்கிப் பெற்றோருக்கு அனுப்பியதாகக் குற்றம் சாட்டப்படுகிறது. பள்ளி பின்னர் டஜன் கணக்கான பாதிக்கப்பட்ட குடும்பங்களை அடையாளம் கண்டது."
    simple_explanation: "பென்சில்வேனியாவில் உள்ள ஒரு பள்ளியின் இரண்டு மாணவர்கள், சுமார் ஆறு மாதங்களாக AI கருவிகளைப் பயன்படுத்தி வகுப்புத் தோழிகள் மற்றும் பிற சிறுமிகளின் நூற்றுக்கணக்கான பொருத்தமற்ற டீப்ஃபேக் படங்களை உருவாக்கிப் பரிமாறிக்கொண்டதாகக் குற்றம் சாட்டப்படுகிறது. அதிகாரிகள் பின்னர் 60 பாதிக்கப்பட்டவர்களை அடையாளம் கண்டனர்; அவர்களில் 59 பேர் சிறார்கள். சிறார் நீதிமன்றம் அந்த மாணவர்களைப் பொறுப்பாளிகள் என்று தீர்மானித்தது. குடும்பங்கள் பின்னர் பள்ளி மீதும் பெயர் குறிப்பிடப்படாத AI நிறுவனங்கள் மீதும் வழக்குத் தொடர்ந்தன."
    why_bad: "இங்கே எதுவும் பழுதடையவில்லை. கருவிகள் வடிவமைக்கப்பட்டபடியே செயல்பட்டன; ஒருபோதும் சம்மதிக்காத மனிதர்களுக்கு எதிராக அவை பயன்படுத்தப்பட்டன. படம் உருவாக்கும் கருவிகள், குழந்தைகள் உட்பட யாரும், சாதாரணப் புகைப்படங்களிலிருந்து ஓர் உண்மையான நபரின் யதார்த்தமான, அவமானப்படுத்தும் போலிப் படங்களை உருவாக்க வழிசெய்கின்றன. படங்கள் போலி என்று பார்ப்பவர்களுக்குத் தெரிந்தாலும் தெரியாவிட்டாலும், பாதிக்கப்பட்டவர்களுக்குத் தீங்கு ஏற்படுகிறது. இத்தகைய படங்களை உருவாக்கத் திறமையும் உழைப்பும் தேவைப்பட்ட காலத்தில் எழுதப்பட்ட விதிகளைக் கொண்டே பள்ளிகளும் பெற்றோரும் நீதிமன்றங்களும் எதிர்வினையாற்ற வேண்டியுள்ளது."
    future_escalation: "போலிப் படங்களையும் காணொளிகளையும் உருவாக்குவது தொடர்ந்து மலிவாகவும், யதார்த்தமாகவும், எளிதாகவும் மாறுகிறது; குறிவைக்கப்படும் நபரின் புகைப்படங்களும் குறைவாகவே தேவைப்படுகின்றன. கருவிகளில் உள்ள பாதுகாப்புகள், பள்ளிகளில் புகார் அளிக்கும் வழிகள், சட்டப் பொறுப்பு ஆகியவை இதற்கு ஈடுகொடுக்காவிட்டால், இத்தகைய துன்புறுத்தல் கொடுமைப்படுத்துதலிலும் மிரட்டிப் பணம் பறிப்பதிலும் வழக்கமான ஒரு பகுதியாக மாறக்கூடும். இதைச் செய்பவரிடமிருந்து கிட்டத்தட்ட எந்த முயற்சியும் இல்லாமல் இது மிக அதிகமான குழந்தைகளைப் பாதிக்கக்கூடும்."
    highlight: {real: ["வகுப்புத் தோழிகளின் பொருத்தமற்ற போலிப் படங்களை"], fake: ["வகுப்புத் தோழர்கள் போதைப்பொருள் பயன்படுத்துவதாகக் குற்றம் சாட்டும், பள்ளியின் கடிதத் தலைப்புடன் கூடிய", "கடிதங்களை"]}
