    excerpt: "அயர்லாந்து அதிபர் வேட்பாளர் கேத்தரின் கானலி போட்டியிலிருந்து விலகுவதாக அறிவிப்பது போலப் பொய்யாகச் சித்தரித்ததாகக் கூறப்படும் ஒரு டீப்ஃபேக் வீடியோ இணையத்தில் பரவியது."
