  1717:
    domain: "காவல்துறை"
    hook: "ஒரு தவறான பொருத்தம்"
    title: "AI வாகன எண் வாசிப்புப் பிழையால் துப்பாக்கி முனையில் நிறுத்தம்"
    excerpt: "Flock Safety வாகன எண் பலகை வாசிப்பான் ஒன்று பிராண்டன் அப்சர்ச்சின் லாரியைத் திருடப்பட்ட எண் பலகையுடன் தவறாகப் பொருத்தியதால், அமெரிக்காவின் ஒஹையோ மாநிலம் டொலீடோ காவல்துறையினர் அவரைத் துப்பாக்கி முனையில் நிறுத்தினர்."
