    counterfactual: "ட்ரோன் காட்சிகளிலிருந்து கூட்டத்தின் அளவை மதிப்பிடும் AI அமைப்பு ஒன்று, ஒரு திருமண விழாவை அனுமதியற்ற போராட்டம் என்று தவறாகக் குறித்ததாகவும், பிழை கண்டுபிடிக்கப்படுவதற்கு முன்பே கலவரத் தடுப்புக் காவலர்கள் அங்கு அனுப்பப்பட்டதாகவும் கூறப்படுகிறது."
    simple_explanation: "தானியங்கி வாகன எண் வாசிப்பான் ஒரு லாரியைத் திருடப்பட்ட எண் பலகையுடன் தவறாகப் பொருத்தியது. காவல்துறையினர் ஓட்டுநரைத் துப்பாக்கி முனையில் நிறுத்தி, அவர் மீது ஒரு காவல் நாயை ஏவினர்; அது அவரைக் கடித்தது; பின்னர் அவரைக் கைது செய்தனர். அந்த எச்சரிக்கை தவறான வாசிப்பு என்று காவல்துறை பின்னர் கூறியது; குற்றச்சாட்டுகள் கைவிடப்பட்டன."
    why_bad: "நிகழ்தகவு அடிப்படையிலான ஓர் அடையாள அமைப்பு, கட்டாய அதிகாரம் கொண்ட ஒரு நிறுவனத்துடன் இணைக்கப்பட்டிருப்பதே முக்கியம். அடையாள அமைப்புகளுக்குத் தவிர்க்க முடியாத பிழை விகிதம் உண்டு; அதிக ஆபத்துள்ள தலையீட்டை நியாயப்படுத்தும் அளவுக்கு ஓர் எச்சரிக்கை நம்பகமானதாகக் கருதப்படும்போது, சிறிய தொழில்நுட்பப் பிழைகூடக் கடுமையான உடல்ரீதியான மற்றும் சட்டரீதியான விளைவுகளை ஏற்படுத்தலாம். இந்தத் தோல்வியில், சரியாகச் செய்யப்படாத ஒரு மனிதச் சரிபார்ப்புப் படியும் அடங்கியிருந்தது."
    future_escalation: "தானியங்கிக் கண்காணிப்பு பரவலாகப் பயன்படுத்தப்படும்போது, இயந்திரங்கள் உருவாக்கும் எச்சரிக்கைகள் பல மடங்கு அதிகரிக்கலாம். அடுத்தடுத்த முடிவுகளும் மேலும் தானியக்கமாகவோ நேர நெருக்கடியிலோ எடுக்கப்பட்டால், தவறான எச்சரிக்கைகள் உரிய ஆய்வுக்கு முன்பே காவல்துறை, எல்லைக் கட்டுப்பாடு, நுழைவு அமைப்புகள் மற்றும் பிற உயர் ஆபத்து நிறுவனங்கள் வழியாகப் பரவக்கூடும். AI கண்காணிப்பில் இரண்டாவது ஆபத்தும் உள்ளது: கேமராக்கள் ஒவ்வொரு வாகனத்தையும் ஒவ்வொரு முகத்தையும் பின்தொடர முடியும்போது, எல்லோரும் எப்போதும் கண்காணிக்கப்படுகிறார்கள்; ஒரே ஒரு தவறான பொருத்தம் ஒருவரை ஓர் அமைப்பிலிருந்து மற்றொன்றுக்குத் தொடர்ந்து செல்லக்கூடும்."
