    why_bad: "அந்தக் காணொளி நம்பிக்கையை இரண்டு முறை கடன் வாங்கியது: ஓர் உண்மையான வேட்பாளரின் முகம் மற்றும் குரலிலிருந்து, நம்பகமான தேசிய ஒளிபரப்பாளரின் தோற்றத்திலிருந்து. இத்தகைய காணொளியைப் பார்க்கும் வாக்காளர்கள், திருத்தம் தங்களை அடைவதற்கு முன் வீட்டிலேயே இருந்துவிடலாம் அல்லது தங்கள் வாக்கை மாற்றலாம். திருத்தங்கள் மூலக் காணொளி அளவுக்குப் பரவுவது அரிது. பரந்த சேதம் நம்பிக்கைக்கே ஏற்படுகிறது. நம்பத்தகுந்த போலிச் செய்தி அறிக்கைகள் பரவும்போது, உண்மையானவற்றையும் சந்தேகிக்க மக்களுக்குக் கூடுதல் காரணம் கிடைக்கிறது."
    future_escalation: "போலிக் காணொளியும் ஒலியும் மலிவாகின்றன, விரைவாக உருவாக்கப்படுகின்றன, உண்மையான ஒளிபரப்புகளிலிருந்து பிரித்தறிவது கடினமாகிறது. ஒரு காணொளி எங்கிருந்து வந்தது என்று சரிபார்க்கும் கருவிகள், தளங்களின் எதிர்வினை வேகம், தேர்தல் விதிகள் ஆகியவை இதற்கு ஈடுகொடுக்காவிட்டால், போலிகளைத் தனித்தனித் தொகுதிகளுக்கோ வாக்காளர்களுக்கோ ஏற்றவாறு உருவாக்க முடியும். திருத்த நேரமே இல்லாத பிரச்சாரத்தின் கடைசி மணிநேரங்களில் அவை வெளியிடப்படலாம்."
