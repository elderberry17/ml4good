    hook: "једно лажно подударање"
    title: "Грешка ВИ при читању таблица довела до заустављања под претњом оружјем"
    excerpt: "Полиција у Толеду, у Охају, зауставила је возача Брендона Апчерча под претњом оружјем након што је читач регистарских таблица Flock Safety погрешно повезао његов камионет са украденом таблицом."
    game_statement: "Аутоматски систем за читање регистарских таблица је, како се наводи, погрешно очитао таблицу возила, након чега је полиција зауставила возача под претњом оружјем пре него што је грешка откривена."
    counterfactual: "ВИ систем који процењује величину окупљања на основу снимака са дрона је, како се наводи, свадбу означио као непријављени протест, након чега је на лице места послата интервентна полиција пре него што је грешка откривена."
