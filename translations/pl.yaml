incidents:
  1374:
    domain: "Ochrona zdrowia"
    hook: "jeden błędny alert"
    title: "Alert medyczny AI omal nie doprowadził do niewłaściwego leczenia"
    excerpt: "Pielęgniarka ze szpitala St. Rose Dominican miała opisać zdarzenie, w którym szpitalny system AI rzekomo wygenerował alert sepsy."
    game_statement: "Szpitalny system AI miał wygenerować alert sepsy dla starszego pacjenta dializowanego; standardowa reakcja, dożylne podanie płynów, mogła spowodować niebezpieczne przewodnienie, ale pielęgniarka to zauważyła, a lekarz zmienił leczenie."
    counterfactual: "Szpitalny system AI układający grafik sal operacyjnych miał przesunąć pilną operację za zabiegi planowe po błędnym odczytaniu notatki w karcie pacjenta, ale pielęgniarka zauważyła to, zanim opóźnienie wyrządziło szkodę."
    simple_explanation: "Szpitalny system AI miał wygenerować alert sepsy dla starszego pacjenta dializowanego. Standardowa pilna reakcja obejmowała dożylne podanie płynów, ale pielęgniarka zorientowała się, że może to spowodować niebezpieczne przewodnienie. Lekarz interweniował i zmienił leczenie."
    why_bad: "Narzędzia wspomagające decyzje kliniczne działają w procesach, w których szybkość i trzymanie się procedur są często cenne. Może to rodzić nadmierne zaufanie do automatyzacji (automation bias): personel może potraktować alert jako mocne zalecenie nawet wtedy, gdy sytuacja konkretnego pacjenta sprawia, że standardowa reakcja jest niewłaściwa. Systematyczny błąd modelu lub procesu może więc dotknąć wielu pacjentów, jeśli klinicyści stracą możliwość, czas lub uprawnienia, by go zakwestionować."
    future_escalation: "W miarę jak kliniczna AI staje się coraz zdolniejsza i głębiej wbudowana w diagnostykę, triaż i zalecenia terapeutyczne, placówki mogą automatyzować coraz większą część opieki. Jeśli nadzór człowieka stanie się formalnością, a nie realną kontrolą, skorelowane błędy modelu mogą dotknąć wielu pacjentów, zanim zostaną wykryte."
    highlight: {real: ["alert sepsy", "dożylne podanie płynów"], fake: ["układający grafik sal operacyjnych", "przesunąć pilną operację za zabiegi planowe"]}
  1717:
    domain: "Policja"
    hook: "jedno fałszywe dopasowanie"
    title: "Błąd AI przy odczycie tablicy doprowadził do zatrzymania pod bronią"
    excerpt: "Policja w Toledo w stanie Ohio zatrzymała kierowcę Brandona Upchurcha, mierząc do niego z broni, po tym jak czytnik tablic rejestracyjnych Flock Safety błędnie dopasował jego pikapa do skradzionej tablicy."
    game_statement: "Automatyczny system odczytu tablic rejestracyjnych miał błędnie odczytać tablicę pojazdu, po czym policja zatrzymała kierowcę, mierząc do niego z broni, zanim wykryto pomyłkę."
    counterfactual: "System AI szacujący wielkość tłumu na podstawie nagrań z drona miał uznać wesele za nielegalny protest, po czym na miejsce wysłano oddziały prewencji, zanim wykryto pomyłkę."
    simple_explanation: "Automatyczny czytnik tablic błędnie dopasował pikapa do skradzionej tablicy. Policja zatrzymała kierowcę, mierząc do niego z broni, spuściła psa policyjnego, który go pogryzł, i aresztowała go. Później policja przyznała, że alert był błędnym odczytem; zarzuty wycofano."
    why_bad: "Istotą problemu jest połączenie probabilistycznego systemu rozpoznawania z instytucją, która może stosować przymus. Systemy rozpoznawania nieuchronnie popełniają błędy; gdy alert traktuje się jako wystarczająco wiarygodny, by uzasadnić ryzykowną interwencję, nawet drobny błąd techniczny może mieć poważne skutki fizyczne i prawne. W opisanym przypadku zawiódł też etap weryfikacji przez człowieka, którego nie wykonano prawidłowo."
    future_escalation: "Szersze stosowanie zautomatyzowanego nadzoru może generować znacznie więcej alertów tworzonych przez maszyny. Jeśli kolejne decyzje też będą coraz bardziej zautomatyzowane lub podejmowane w pośpiechu, fałszywe alarmy mogą rozchodzić się po policji, kontroli granicznej, systemach dostępu i innych instytucjach o wysokiej stawce, zanim dojdzie do rzetelnej weryfikacji. Nadzór oparty na AI niesie też drugie zagrożenie: gdy kamery mogą śledzić każdy samochód i każdą twarz, wszyscy są obserwowani przez cały czas, a jedno błędne dopasowanie może podążać za człowiekiem z systemu do systemu."
    highlight: {real: ["system odczytu tablic rejestracyjnych", "zatrzymała kierowcę, mierząc do niego z broni"], fake: ["szacujący wielkość tłumu na podstawie nagrań z drona", "uznać wesele za nielegalny protest"]}
