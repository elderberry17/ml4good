    future_escalation: "W miarę jak fałszywe teksty, obrazy, nagrania audio i wideo stają się coraz lepsze, sądom, dziennikarzom, pracodawcom i opinii publicznej coraz trudniej odróżnić prawdę od zmyślenia. Rośnie przez to ryzyko błędnych decyzji: niewinna osoba może zostać ukarana na podstawie fałszywki, a prawdziwy dowód odrzucony jako podróbka."
