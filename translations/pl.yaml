    counterfactual: "Kobieta miała na kilka tygodni stracić prawo do widzeń z dzieckiem po tym, jak przedstawiono przypisywaną jej historię oglądania w mediach społecznościowych; później twierdzono, że te dane zostały wygenerowane przy użyciu AI."
    simple_explanation: "Pielęgniarka z Florydy miała spędzić dwa dni w areszcie po tym, jak jej były partner przedstawił przypisywane jej wiadomości tekstowe. Później twierdzono, że wiadomości zostały wygenerowane lub sfabrykowane przy użyciu AI."
