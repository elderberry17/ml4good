    why_bad: "Automatyczna weryfikacja tożsamości nabiera dużej wagi, gdy zależy od niej dostęp do podstawowych usług publicznych. Błędna odmowa to nie tylko niedogodność: dla osoby pobierającej zasiłek może oznaczać opóźnienie pieniędzy na jedzenie, mieszkanie, transport czy leczenie. Centralne wdrożenie tworzy też ryzyko skorelowanych awarii — jeden błąd w projekcie lub działaniu systemu może dotknąć wiele osób naraz. Ciężar naprawienia pomyłki może nieproporcjonalnie spadać na tych, którzy mają najmniej czasu, możliwości dojazdu, dostępu do sieci i umiejętności urzędowych, by się odwołać."
    future_escalation: "Rządy i firmy mogą coraz częściej stosować weryfikację biometryczną i opartą na AI przy świadczeniach, w bankowości, ubezpieczeniach, zatrudnieniu i kontroli dostępu. Jeśli wdrożenia będą rosły szybciej niż procedury zastępcze, audyty i ścieżki odwoławcze, zautomatyzowane wykluczenie może stać się powszechniejsze i trudniejsze do zakwestionowania dla osób, których dotyczy."
