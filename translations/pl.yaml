incidents:
  1374:
    domain: "Ochrona zdrowia"
    hook: "jeden błędny alert"
    title: "Alert medyczny AI omal nie doprowadził do niewłaściwego leczenia"
    excerpt: "Pielęgniarka ze szpitala St. Rose Dominican miała opisać zdarzenie, w którym szpitalny system AI rzekomo wygenerował alert sepsy."
    game_statement: "Szpitalny system AI miał wygenerować alert sepsy dla starszego pacjenta dializowanego. Zwykła reakcja, czyli płyny podawane dożylnie, mogła temu pacjentowi zaszkodzić. Pielęgniarka to zauważyła, a lekarz zmienił leczenie."
    counterfactual: "Szpitalny system AI, który układa plan sal operacyjnych, miał błędnie odczytać notatkę w dokumentacji pacjenta i ustawić pilną operację po zabiegach planowych. Pielęgniarka zauważyła to, zanim opóźnienie wyrządziło szkodę."
    simple_explanation: "Szpitalny system AI miał wygenerować alert sepsy dla starszego pacjenta dializowanego. Standardowa reakcja w nagłych przypadkach obejmuje płyny podawane dożylnie. Pielęgniarka zauważyła, że płyny mogą niebezpiecznie przeciążyć tego pacjenta. Lekarz interweniował i zmienił leczenie."
    why_bad: "Szpitale używają takich narzędzi, żeby działać szybko i trzymać się ustalonych procedur. To pomaga, ale ma swoją cenę. Personel może traktować alert jak polecenie, nawet gdy standardowa reakcja jest zła dla konkretnego pacjenta. Nazywa się to błędem automatyzacji. Tutaj problem zauważyła pielęgniarka. Jeśli personel nie będzie miał czasu ani uprawnień, żeby zakwestionować alert, ten sam błąd może dotknąć wielu pacjentów."
    future_escalation: "AI staje się coraz sprawniejsza i jest głębiej wbudowywana w diagnostykę, triaż i decyzje o leczeniu. Szpitale mogą powierzać jej coraz więcej pracy. Jeśli nadzór człowieka stanie się formalnością, jeden błąd modelu może powtórzyć się u wielu pacjentów, zanim ktokolwiek go zauważy."
    highlight: {real: ["alert sepsy", "płyny podawane dożylnie"], fake: ["układa plan sal operacyjnych", "ustawić pilną operację po zabiegach planowych"]}
  1717:
    domain: "Policja"
    hook: "jedno fałszywe dopasowanie"
    title: "Błąd AI przy odczycie tablicy doprowadził do zatrzymania pod bronią"
    excerpt: "Policja w Toledo w stanie Ohio zatrzymała kierowcę Brandona Upchurcha, mierząc do niego z broni, po tym jak czytnik tablic rejestracyjnych Flock Safety błędnie dopasował jego pikapa do skradzionej tablicy."
    game_statement: "Automatyczny czytnik tablic rejestracyjnych miał błędnie odczytać tablicę pojazdu. Policja zatrzymała wtedy kierowcę, mierząc do niego z broni, zanim błąd wykryto."
    counterfactual: "System AI, który szacuje wielkość tłumu na podstawie nagrań z dronów, miał wziąć przyjęcie weselne za nielegalny protest. Wysłano oddziały prewencji, zanim błąd wykryto."
    simple_explanation: "Automatyczny czytnik tablic rejestracyjnych błędnie powiązał pick-upa ze skradzioną tablicą. Policja zatrzymała kierowcę, mierząc do niego z broni, spuściła psa, który go pogryzł, i aresztowała go. Później policja przyznała, że alert był błędem odczytu. Zarzuty wycofano."
    why_bad: "Systemy rozpoznawania zawsze popełniają jakieś błędy. Niebezpiecznie robi się wtedy, gdy alertowi ufa się na tyle, że uzasadnia użycie siły. Wtedy nawet drobny błąd techniczny może skończyć się obrażeniami albo aresztowaniem. W tym przypadku alert miał też sprawdzić człowiek, a tej kontroli podobno nie przeprowadzono prawidłowo."
    future_escalation: "Im szerzej stosuje się zautomatyzowany nadzór, tym więcej alertów generują maszyny. Jeśli kolejne decyzje też są zautomatyzowane albo podejmowane w pośpiechu, fałszywe alarmy mogą przejść przez policję, kontrolę graniczną i inne potężne instytucje, zanim ktoś je sprawdzi. Nadzór z użyciem AI niesie też drugie zagrożenie. Gdy kamery mogą śledzić każdy samochód i każdą twarz, wszyscy są obserwowani przez cały czas, a jedno fałszywe dopasowanie może iść za człowiekiem od systemu do systemu."
    highlight: {real: ["czytnik tablic rejestracyjnych", "zatrzymała wtedy kierowcę, mierząc do niego z broni"], fake: ["szacuje wielkość tłumu na podstawie nagrań z dronów", "przyjęcie weselne za nielegalny protest"]}
  1379:
    domain: "Sąd i dowody"
    hook: "jeden sporny dowód"
    title: "Dowody rzekomo sfabrykowane przez AI przyczyniły się do pozbawienia wolności"
    excerpt: "Pielęgniarka z Florydy, Melissa Sims, miała trafić na dwa dni do aresztu za rzekome naruszenie warunków kaucji / zakazu kontaktu."
    game_statement: "Kobieta miała zostać osadzona w areszcie po tym, jak przedstawiono wiadomości tekstowe przypisywane jej. Później twierdzono, że wiadomości sfałszowano przy użyciu AI."
    counterfactual: "Kobieta miała na kilka tygodni stracić prawo do widywania dziecka po tym, jak przedstawiono historię oglądanych treści w mediach społecznościowych przypisywaną jej. Później twierdzono, że te dane wygenerowano przy użyciu AI."
    simple_explanation: "Pielęgniarka z Florydy miała spędzić dwa dni w areszcie po tym, jak jej były partner przedstawił wiadomości tekstowe przypisywane jej. Później twierdzono, że wiadomości wygenerowano lub sfałszowano przy użyciu AI."
    why_bad: "Sądy opierają się na dowodach, które można powiązać z prawdziwymi osobami i zdarzeniami. Dzięki AI tanio powstają przekonujące fałszywe wiadomości, obrazy i nagrania. Wiele sądów wciąż polega na zrzutach ekranu i nagraniach, których pochodzenie trudno sprawdzić. Ryzyko działa w obie strony: fałszywy dowód może zostać przyjęty, a prawdziwy odrzucony jako fałszywy."
    future_escalation: "Im lepsze są fałszywe teksty, obrazy, nagrania audio i wideo, tym trudniej sądom, dziennikarzom, pracodawcom i opinii publicznej ustalić, co jest prawdą. Rośnie ryzyko błędnych decyzji. Niewinna osoba może zostać ukarana z powodu fałszerstwa, a prawdziwy dowód może zostać odrzucony jako fałszywy."
    highlight: {real: ["osadzona w areszcie", "wiadomości tekstowe"], fake: ["stracić prawo do widywania dziecka", "historię oglądanych treści w mediach społecznościowych"]}
  1606:
    domain: "Usługi publiczne"
    hook: "jedna nieudana weryfikacja twarzy"
    title: "Weryfikacja twarzy a dostęp do świadczeń socjalnych"
    excerpt: "Beneficjenci zasiłków socjalnych w Republice Południowej Afryki mieli wielokrotnie napotykać błędy w portalu weryfikacji twarzy eLife agencji SASSA."
    game_statement: "Portal weryfikacji twarzy miał raz po raz zawodzić. Był to jeden z powodów, dla których część osób nie mogła otrzymać świadczeń socjalnych."
    counterfactual: "System AI, który sortuje listy od mieszkańców, miał wysłać setki odwołań w sprawie świadczeń do niewłaściwego wydziału. Ludzie przekroczyli termin na odwołanie, zanim ktokolwiek to zauważył."
    simple_explanation: "W RPA osoby pobierające świadczenia socjalne miały wielokrotnie napotykać awarie portalu weryfikacji twarzy, prowadzonego przez państwową agencję SASSA. W raportach dla parlamentu wskazano później nieudane rozpoznawanie twarzy jako jedną z przyczyn braku weryfikacji. Potwierdzono w nich też 67 868 zawieszeń świadczeń w jednym kwartale. Nie podano, ile z nich wynikało z weryfikacji twarzy."
    why_bad: "Gdy dostęp do podstawowego wsparcia zależy od automatycznej kontroli tożsamości, błędna odmowa jest poważna. Dla osoby żyjącej ze świadczenia może oznaczać brak pieniędzy na jedzenie, czynsz, dojazdy lub leki. Ponieważ jeden system obsługuje wszystkich, jedna awaria może dotknąć wielu osób naraz. A naprawianie błędu często spada na tych, którzy mają najmniej czasu, pieniędzy i dostępu do internetu, żeby się odwołać."
    future_escalation: "Państwa i firmy stosują weryfikację twarzy i inne kontrole tożsamości oparte na AI przy świadczeniach, w bankach, ubezpieczeniach, pracy i przy wejściach do budynków. Jeśli te systemy będą się rozpowszechniać szybciej niż rozwiązania zapasowe, audyty i ścieżki odwoławcze, więcej osób może zostać wykluczonych automatycznie, prawie bez możliwości odwołania."
    highlight: {real: ["Portal weryfikacji twarzy", "nie mogła otrzymać świadczeń socjalnych"], fake: ["sortuje listy od mieszkańców", "przekroczyli termin na odwołanie"]}
  1505:
    domain: "Oszustwa"
    hook: "jeden sklonowany głos"
    title: "Głos sklonowany przez AI użyty w fałszywym porwaniu"
    excerpt: "Deborah Del Mastro miała przelać 5400 dolarów do Meksyku po tym, jak oszuści fałszywie twierdzili, że jej córka Sarah została porwana"
    game_statement: "Oszuści mieli użyć głosu sklonowanego przez AI w rozmowie telefonicznej o rzekomym porwaniu i nakłonić matkę do wysłania kilku tysięcy dolarów."
    counterfactual: "Oszuści mieli wysłać matce przebywającej na urlopie wygenerowane przez AI nagranie jej płonącego domu. Nakłonili ją do zapłacenia kilku tysięcy dolarów za ekipę do pilnych napraw."
    simple_explanation: "Do kobiety zadzwonili oszuści, którzy twierdzili, że porwali jej córkę. Odtworzyli coś, co brzmiało jak przerażony głos córki. Kobieta wysłała 5400 dolarów, zanim dowiedziała się, że córka jest bezpieczna. Głos miał zostać skopiowany przy użyciu AI."
    why_bad: "Oszustwo działa wtedy, gdy ofiara wierzy, że dzwoni ktoś, komu ufa. Znajomy głos to jeden z najsilniejszych takich sygnałów. Klonowanie głosu sprawia, że podrobienie go jest tanie. Oszustwa stają się bardziej wiarygodne i bardziej przerażające, zwłaszcza gdy oszuści korzystają też z danych osobowych ze źródeł publicznych lub z wycieków."
    future_escalation: "Sprawniejsze systemy mogą łączyć sklonowane głosy, wygenerowane wideo, dane osobowe i chatboty, które potrafią prowadzić rozmowę. Oszustwa, które dziś wymagają dużo pracy, mogą stać się częściowo automatyczne i trafiać do wielu osób jednocześnie."
    highlight: {real: ["głosu sklonowanego przez AI", "rozmowie telefonicznej o rzekomym porwaniu"], fake: ["wygenerowane przez AI nagranie jej płonącego domu", "ekipę do pilnych napraw"]}
  1596:
    domain: "Oszustwa korporacyjne"
    hook: "jeden fałszywy dyrektor"
    title: "Deepfake dyrektora doprowadził do przelewu 1,1 mln dolarów"
    excerpt: "Starmangalsutra Private Limited miała stracić 10,70 krora rupii po tym, jak nieznani sprawcy przejęli firmowe urządzenia i użyli rzekomych metod deepfake, by podszyć się pod dyrektora."
    game_statement: "Oszuści mieli podszyć się pod dyrektora firmy przy użyciu metod deepfake i nakłonić pracownika do przelania około 1,1 miliona dolarów."
    counterfactual: "Oszuści mieli użyć AI do przygotowania fałszywego raportu z audytu w imieniu znanej firmy księgowej. Nakłonili pracownika do przelania około 900 000 dolarów jako zaległej płatności podatkowej."
    simple_explanation: "Napastnicy mieli włamać się do urządzeń firmy i użyć czegoś, co opisano jako metody deepfake, żeby podszyć się pod dyrektora. Pracownik uwierzył, że polecenia są prawdziwe, i przelał około 1,1 miliona dolarów. Później firma ustaliła, że dyrektor nigdy ich nie wydał."
    why_bad: "Praca zdalna opiera się na prostym założeniu: jeśli widzisz lub słyszysz znaną osobę, to naprawdę ona. Głos i wideo generowane przez AI sprawiają, że przekonujące podszywanie się jest tanie. Wiele firm wciąż ufa głosowi albo rozmowie wideo bez drugiej kontroli. Szkoda bierze się z dwóch stron: lepszych fałszerstw i procedur zatwierdzania, których nie zaprojektowano z myślą o nich."
    future_escalation: "Fałszywy głos i wideo w czasie rzeczywistym mogą stać się tańsze, bardziej spersonalizowane i łatwiejsze do zautomatyzowania. Ataki z podszywaniem się mogą być lepsze i częstsze. Nieformalne sprawdzanie tożsamości, na przykład rozpoznawanie głosu, byłoby coraz mniej wiarygodne."
    highlight: {real: ["podszyć się pod dyrektora firmy przy użyciu metod deepfake"], fake: ["fałszywego raportu z audytu", "zaległej płatności podatkowej"]}
  1672:
    domain: "Tworzenie oprogramowania"
    hook: "jedna usunięta baza danych"
    title: "Agent programistyczny usunął produkcyjną bazę danych"
    excerpt: "Inżynier oprogramowania Bruno Lemos poinformował, że GPT-5.6 Sol usunął jego produkcyjną bazę danych po tym, jak poprosił o wygenerowanie danych początkowych (seed data) do lokalnych testów."
    game_statement: "Agent programistyczny AI miał usunąć prawdziwą produkcyjną bazę danych, choć miał jedynie przygotować lokalne dane testowe."
    counterfactual: "Agent programistyczny AI miał wysłać wiadomość testową do tysięcy prawdziwych klientów, choć miał jedynie sprawdzić szablon e-maila na laptopie programisty."
    simple_explanation: "Programista poprosił agenta programistycznego AI o wygenerowanie danych testowych. Agent miał uruchomić testy, a następnie przeprowadzić czyszczenie na prawdziwej produkcyjnej bazie danych, ponieważ konfiguracja repozytorium wskazywała na działającą bazę."
    why_bad: "To nie jest po prostu „zła podpowiedź kodu”: model mógł wykonywać działania w prawdziwym systemie. Błąd wyniknął z połączenia mylnego założenia co do środowiska, szerokich uprawnień i autonomicznego działania. Agentowe systemy programistyczne zamieniają więc zwykłe pomyłki programistyczne w potencjalnie natychmiastowe incydenty operacyjne, gdy mogą działać, zanim człowiek sprawdzi zmianę."
    future_escalation: "Agenci programistyczni coraz częściej potrafią edytować repozytoria, uruchamiać polecenia w terminalu, zarządzać zasobami w chmurze, wdrażać usługi i obsługiwać bazy danych. Im więcej mogą zrobić, tym większą szkodę może wyrządzić jedno błędne założenie."
    highlight: {real: ["usunąć prawdziwą produkcyjną bazę danych"], fake: ["wysłać wiadomość testową do tysięcy prawdziwych klientów"]}
