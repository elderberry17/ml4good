    simple_explanation: "Một video giả mạo, được dựng giống bản tin của RTÉ, được cho là đã chiếu cảnh ứng viên tổng thống Ireland Catherine Connolly tuyên bố rời cuộc đua. Theo báo cáo, video đạt khoảng 30.000 lượt xem trên Facebook trước khi bị gỡ. Bà Connolly đã khiếu nại lên Ủy ban Bầu cử và gọi video này là một nỗ lực ác ý nhằm đánh lừa cử tri."
