    counterfactual: "Một hệ thống AI xếp lịch phòng mổ của bệnh viện được cho là đã đẩy một ca mổ khẩn cấp xuống sau các ca thông thường vì đọc sai một ghi chú trong hồ sơ bệnh nhân, nhưng một y tá đã phát hiện trước khi sự chậm trễ gây hại."
    simple_explanation: "Một hệ thống AI của bệnh viện được cho là đã đưa ra cảnh báo nhiễm trùng huyết cho một bệnh nhân lớn tuổi đang chạy thận. Phản ứng cấp cứu tiêu chuẩn bao gồm truyền dịch tĩnh mạch, nhưng một y tá nhận ra điều này có thể gây quá tải dịch nguy hiểm. Một bác sĩ đã can thiệp và thay đổi phác đồ điều trị."
    why_bad: "Các công cụ hỗ trợ quyết định lâm sàng vận hành trong quy trình mà tốc độ và việc tuân thủ phác đồ thường rất quan trọng. Điều này có thể tạo ra thiên kiến tự động hóa (automation bias): nhân viên có thể coi cảnh báo là một khuyến nghị mạnh ngay cả khi đặc điểm riêng của bệnh nhân khiến phản ứng tiêu chuẩn không phù hợp. Vì thế, một lỗi có hệ thống của mô hình hoặc quy trình có thể ảnh hưởng đến nhiều bệnh nhân nếu nhân viên y tế mất khả năng, thời gian hoặc thẩm quyền để phản bác."
    future_escalation: "Khi AI lâm sàng ngày càng mạnh và được tích hợp sâu vào chẩn đoán, phân loại bệnh nhân (triage) và khuyến nghị điều trị, các cơ sở y tế có thể tự động hóa ngày càng nhiều phần của việc chăm sóc. Nếu sự giám sát của con người chỉ còn mang tính hình thức thay vì thực chất, các lỗi tương quan của mô hình có thể ảnh hưởng đến nhiều bệnh nhân trước khi được phát hiện."
    highlight: {real: ["cảnh báo nhiễm trùng huyết", "truyền dịch tĩnh mạch"], fake: ["xếp lịch phòng mổ", "đẩy một ca mổ khẩn cấp xuống sau các ca thông thường"]}
