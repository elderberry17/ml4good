    why_bad: "Điểm mấu chốt là sự kết nối giữa một hệ thống nhận dạng mang tính xác suất với một thiết chế có quyền cưỡng chế. Hệ thống nhận dạng luôn có tỷ lệ sai sót; khi một cảnh báo được coi là đủ đáng tin để biện minh cho một can thiệp rủi ro cao, ngay cả một lỗi kỹ thuật nhỏ cũng có thể gây hậu quả nghiêm trọng về thể chất và pháp lý. Sự cố được báo cáo còn liên quan đến một bước xác minh của con người không được thực hiện đúng."
    future_escalation: "Việc triển khai giám sát tự động rộng hơn có thể tạo ra nhiều cảnh báo do máy móc sinh ra hơn. Nếu các quyết định tiếp theo cũng ngày càng tự động hóa hoặc bị đưa ra dưới áp lực thời gian, các kết quả dương tính giả có thể lan qua cảnh sát, kiểm soát biên giới, hệ thống ra vào và các thiết chế rủi ro cao khác trước khi có bất kỳ sự xem xét thực chất nào. Giám sát bằng AI còn có mối nguy thứ hai: khi camera có thể theo dõi mọi chiếc xe và mọi khuôn mặt, ai cũng bị theo dõi mọi lúc, và một lần khớp sai có thể bám theo một người từ hệ thống này sang hệ thống khác."
