    future_escalation: "Video và âm thanh tổng hợp ngày càng rẻ, làm nhanh hơn và khó phân biệt với chương trình thật hơn. Nếu các công cụ xác thực nguồn gốc (provenance), tốc độ phản ứng của các nền tảng và quy định bầu cử không theo kịp, nội dung giả có thể được điều chỉnh cho từng khu vực bầu cử hoặc từng cử tri và tung ra trong những giờ cuối của chiến dịch, khi không còn thời gian để đính chính."
