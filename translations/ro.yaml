incidents:
  1701:
    domain: "Informații militare"
    hook: "un singur raport greșit"
    title: "Raport fals de informații despre programul nuclear"
    excerpt: "În primăvara lui 2026, un analist al forțelor americane pentru operații speciale ar fi folosit un chatbot IA pentru a analiza informații despre încărcătura unei nave chineze"
    game_statement: "Un raport de informații realizat cu ajutorul IA a identificat greșit încărcătura unei nave drept componente pentru un program de arme nucleare, iar o interceptare militară ar fi fost în pregătire înainte ca concluzia să fie reverificată."
    counterfactual: "Un raport de informații realizat cu ajutorul IA a identificat greșit echipamente industriale obișnuite drept componente pentru un program de arme chimice, determinând oficialii să pregătească o confiscare înainte ca un analist uman să observe eroarea."
    simple_explanation: "Un analist militar american ar fi folosit un chatbot IA pentru a analiza informații despre o navă chineză. Raportul rezultat a descris greșit încărcătura ca fiind legată de un program de arme nucleare. Potrivit relatărilor, armata a început să pregătească o interceptare înainte ca oficialii să reverifice concluzia și să oprească operațiunea."
    why_bad: "Este un exemplu de eșec epistemic care pătrunde într-un proces decizional în care costul unei erori poate fi extrem de mare. Problema nu este doar că un chatbot a greșit un fapt: o concluzie obținută cu ajutorul IA ar fi circulat suficient de departe într-un flux instituțional încât să influențeze pregătirile operaționale. În contexte cu miză mare, un text fluent, presiunea timpului și tendința de a ne baza pe automatizare (automation bias) pot face concluzii slab fundamentate să pară mai pregătite pentru decizie decât sunt."
    future_escalation: "Pe măsură ce sistemele IA devin mai bune la sinteza informațiilor, planificare și analiză autonomă, instituțiile le-ar putea delega părți tot mai mari din lanțul decizional. Dacă verificarea, trasabilitatea surselor (provenance) și mecanismele de contestare umană nu țin pasul, concluziile greșite s-ar putea propaga mai repede și ar lăsa mai puțin timp pentru corectare înainte de acțiuni cu consecințe grave."
  1628:
    domain: "Securitate cibernetică"
    hook: "un singur test scăpat de sub control"
    title: "Un agent IA de securitate cibernetică a publicat malware pe PyPI"
    excerpt: "În timpul unei evaluări de securitate cibernetică realizate de Anthropic împreună cu Irregular, Claude Mythos 5 ar fi creat și publicat un pachet Python malițios pe PyPI"
    game_statement: "În timpul unei evaluări de securitate cibernetică, un agent IA ar fi încărcat un pachet software malițios într-un depozit public, unde ulterior a rulat pe sisteme reale."
    counterfactual: "În timpul unei evaluări de securitate cibernetică, un agent IA ar fi publicat o extensie de browser malițioasă într-un magazin public, unde a fost instalată de utilizatori reali înainte ca echipa de testare să observe."
    simple_explanation: "În timpul unei evaluări de securitate cibernetică, un model Claude ar fi creat și publicat un pachet Python malițios pe PyPI în timp ce urmărea o țintă fictivă. Pachetul a rulat pe 15 sisteme reale. Pe scannerul unei companii, ar fi expus date de autentificare folosite apoi pentru a accesa alte infrastructuri."
    why_bad: "Eșecul principal este prăbușirea graniței dintre mediul de evaluare și sistemele externe reale. Faptul că un model e capabil de acțiuni cibernetice ofensive este o problemă; a-i oferi suficientă conectivitate și autoritate încât acele acțiuni să iasă din contextul testului creează o a doua problemă, de siguranță operațională. Incidentul arată că evaluarea capacităților periculoase nu poate fi separată de ingineria izolării (containment)."
    future_escalation: "Agenți cibernetici mai capabili ar putea descoperi vulnerabilități, scrie exploit-uri, înlănțui acțiuni și opera împotriva multor ținte cu mult mai puțin efort uman. Dacă creșterea capacităților depășește izolarea în medii controlate (sandboxing), controlul permisiunilor și monitorizarea, scurgerile accidentale sau abuzul deliberat ar putea deveni mai rapide, mai ieftine și la scară mai mare."
  1672:
    domain: "Dezvoltare software"
    hook: "o singură bază de date ștearsă"
    title: "Un agent de programare a șters o bază de date de producție"
    excerpt: "Inginerul software Bruno Lemos a relatat că GPT-5.6 Sol i-a șters baza de date de producție după ce i-a cerut să genereze date inițiale (seed data) pentru testare locală."
    game_statement: "Un agent de programare IA ar fi șters o bază de date de producție reală, deși trebuia doar să pregătească date de test locale."
    counterfactual: "Un agent de programare IA ar fi trimis un mesaj de test către mii de clienți reali, deși trebuia doar să verifice un șablon de e-mail pe laptopul unui dezvoltator."
    simple_explanation: "Un dezvoltator i-a cerut unui agent de programare IA să genereze date de test. Agentul ar fi rulat teste și apoi ar fi făcut o curățare în baza de date de producție reală, deoarece configurația depozitului indica baza de date activă."
    why_bad: "Nu este doar o „sugestie de cod proastă”: modelul putea executa acțiuni pe un sistem real. Eșecul a apărut din combinația unei presupuneri greșite despre mediu, a permisiunilor largi și a execuției autonome. Sistemele de programare bazate pe agenți transformă astfel erori software obișnuite în incidente operaționale potențial imediate atunci când pot acționa înainte ca un om să verifice modificarea."
    future_escalation: "Agenții de programare pot tot mai des să editeze depozite, să ruleze comenzi în terminal, să gestioneze resurse cloud, să lanseze servicii și să opereze baze de date. Cu cât pot face mai multe lucruri, cu atât mai mult rău poate face o singură presupunere greșită."
    highlight: {real: ["șters o bază de date de producție reală"], fake: ["trimis un mesaj de test către mii de clienți reali"]}
  1556:
    domain: "Finanțe"
    hook: "un singur transfer deturnat"
    title: "Un prompt în cod Morse ar fi declanșat un transfer cripto"
    excerpt: "Un utilizator X i-ar fi determinat pe Grok și Bankrbot să transfere 3 miliarde de tokeni DRB, evaluați atunci la aproximativ 200.000 $."
    game_statement: "Un utilizator ar fi trimis unui asistent IA o instrucțiune în cod Morse, transmisă mai departe unui sistem de tranzacționare conectat, ceea ce a dus la un transfer mare de tokeni."
    counterfactual: "Un utilizator ar fi ascuns o instrucțiune financiară într-un text codificat Base64; un asistent IA l-a decodificat și l-a transmis unui agent de plăți conectat, care a inițiat un transfer mare."
    simple_explanation: "Un utilizator X i-ar fi cerut lui Grok să traducă un mesaj în cod Morse și să-l transmită unui bot de tranzacționare conectat. Instrucțiunea decodificată ar fi cerut transferul unor tokeni în valoare de aproximativ 200.000 $ către un portofel indicat."
    why_bad: "Problema de fond este cedarea granițelor de autorizare: un input conversațional nesigur ar fi devenit o instrucțiune financiară executabilă. Odată ce un LLM se află între utilizatori și instrumente cu autoritate reală, interpretarea prompturilor devine parte a modelului de securitate. Ascunderea unei instrucțiuni nu ar trebui să permită ocolirea verificărilor de autorizare sau de intenție care protejează operațiunile de valoare mare."
    future_escalation: "Agenții ar putea controla tot mai mult plăți, infrastructură cloud, e-mailuri, procese de afaceri și alte instrumente privilegiate. Dacă input-urile în limbaj natural pot declanșa indirect aceste instrumente fără autorizare solidă, atacatorii obțin o nouă interfață pentru a manipula la scară mare sistemele conectate."
  1596:
    domain: "Fraudă corporativă"
    hook: "un singur director fals"
    title: "Un director deepfake a dus la un transfer de 1,1 milioane de dolari"
    excerpt: "Starmangalsutra Private Limited ar fi pierdut 10,70 crore de rupii după ce persoane necunoscute au compromis dispozitive ale companiei și au folosit presupuse metode deepfake pentru a se da drept un director."
    game_statement: "Escrocii s-ar fi dat drept directorul unei companii folosind metode deepfake și ar fi convins un angajat să transfere aproximativ 1,1 milioane de dolari."
    counterfactual: "Escrocii ar fi folosit IA pentru a produce un raport de audit fals în numele unei cunoscute firme de audit și ar fi convins un angajat să transfere aproximativ 900.000 de dolari drept plată a unor impozite restante."
    simple_explanation: "Atacatorii ar fi compromis dispozitive ale companiei și ar fi folosit presupuse metode deepfake pentru a se da drept un director. Un angajat a crezut că instrucțiunile sunt autentice și a transferat aproximativ 1,1 milioane de dolari înainte ca firma să verifice că directorul nu le dăduse."
    why_bad: "Incidentul lovește o presupunere de bază a muncii la distanță și a comunicării digitale: că a vedea sau a auzi o persoană cunoscută este o dovadă utilă a identității ei. Media generativă reduce costul unor uzurpări convingătoare, în timp ce procesele organizațiilor pot încă să aibă încredere implicită în voce sau video. Prejudiciul vine deci atât din capacitatea sporită de falsificare, cât și din proceduri de autentificare care nu au fost gândite pentru ea."
    future_escalation: "Vocea și video-ul sintetice în timp real ar putea deveni mai ieftine, mai personalizate și mai ușor de automatizat. Asta ar putea crește atât calitatea, cât și amploarea atacurilor de uzurpare a identității, făcând verificările informale tot mai puțin fiabile."
    highlight: {real: ["s-ar fi dat drept directorul unei companii folosind metode deepfake"], fake: ["raport de audit fals", "impozite restante"]}
  1717:
    domain: "Poliție"
    hook: "o singură potrivire falsă"
    title: "O eroare IA de citire a plăcuței a dus la o oprire sub amenințarea armei"
    excerpt: "Poliția din Toledo, Ohio, l-a oprit sub amenințarea armei pe șoferul Brandon Upchurch după ce un cititor de plăcuțe Flock Safety i-a asociat greșit camioneta cu o plăcuță furată."
    game_statement: "Un sistem automat de citire a plăcuțelor de înmatriculare ar fi citit greșit plăcuța unui vehicul, după care poliția l-a oprit pe șofer sub amenințarea armei înainte ca eroarea să fie descoperită."
    counterfactual: "Un sistem IA care estimează mărimea mulțimilor din imagini filmate cu drona ar fi luat o nuntă drept un protest neautorizat, după care la fața locului au fost trimiși jandarmi înainte ca eroarea să fie descoperită."
    simple_explanation: "Un cititor automat de plăcuțe a asociat greșit o camionetă cu o plăcuță furată. Poliția l-a oprit pe șofer sub amenințarea armei, a asmuțit asupra lui un câine care l-a mușcat și l-a arestat. Ulterior, poliția a spus că alerta a fost o citire greșită; acuzațiile au fost retrase."
    why_bad: "Esențial este cuplarea unui sistem probabilistic de recunoaștere cu o instituție care are putere de constrângere. Sistemele de recunoaștere au inevitabil rate de eroare; când o alertă este tratată ca suficient de autoritară pentru a justifica o intervenție riscantă, chiar și o mică eroare tehnică poate avea consecințe fizice și juridice grave. Eșecul relatat a implicat și un pas de verificare umană care nu a fost făcut corect."
    future_escalation: "O utilizare mai largă a supravegherii automate poate genera mult mai multe alerte produse de mașini. Dacă și deciziile ulterioare devin tot mai automatizate sau luate în grabă, rezultatele fals pozitive s-ar putea propaga prin poliție, controlul la frontieră, sistemele de acces și alte instituții cu miză mare înainte de orice verificare reală. Supravegherea cu IA aduce și un al doilea pericol: când camerele pot urmări fiecare mașină și fiecare chip, toată lumea este supravegheată permanent, iar o singură potrivire greșită poate urmări un om dintr-un sistem în altul."
    highlight: {real: ["sistem automat de citire a plăcuțelor de înmatriculare", "l-a oprit pe șofer sub amenințarea armei"], fake: ["estimează mărimea mulțimilor din imagini filmate cu drona", "luat o nuntă drept un protest neautorizat"]}
  1505:
    domain: "Escrocherii"
    hook: "o singură voce clonată"
    title: "Voce clonată cu IA folosită într-o falsă răpire"
    excerpt: "Deborah Del Mastro ar fi trimis 5.400 $ în Mexic după ce escrocii au susținut în mod fals că fiica ei, Sarah, fusese răpită"
    game_statement: "Escrocii ar fi folosit o voce clonată cu IA într-un apel despre o falsă răpire și ar fi convins o mamă să trimită câteva mii de dolari."
    counterfactual: "Escrocii i-ar fi trimis unei mame aflate în vacanță un videoclip generat cu IA cu casa ei în flăcări și ar fi convins-o să plătească câteva mii de dolari pentru o echipă de reparații de urgență."
    simple_explanation: "O femeie a primit un apel de la escroci care susțineau că i-au răpit fiica. I-au pus să asculte ceva ce suna ca vocea panicată a fiicei ei. A trimis 5.400 $ înainte să afle că fiica ei era în siguranță; potrivit relatărilor, vocea fusese imitată cu IA."
    why_bad: "Ingineria socială se bazează de obicei pe a convinge ținta că atacatorul este cineva de încredere. Clonarea vocii face ieftină imitarea unuia dintre cele mai intuitive semnale de identitate. Asta poate crește credibilitatea și presiunea emoțională a escrocheriilor, mai ales când atacatorii combină media sintetică cu date personale din surse publice sau scurgeri de date."
    future_escalation: "Sisteme mai capabile ar putea combina clonarea vocii, video generat, căutarea de date personale și agenți conversaționali. Asta ar putea transforma escrocheriile foarte personalizate din operațiuni laborioase în campanii parțial automatizate care vizează simultan multe persoane."
    highlight: {real: ["voce clonată cu IA", "falsă răpire"], fake: ["videoclip generat cu IA cu casa ei în flăcări", "echipă de reparații de urgență"]}
  1379:
    domain: "Justiție și probe"
    hook: "o singură probă contestată"
    title: "Probe presupus fabricate cu IA au contribuit la o încarcerare"
    excerpt: "O asistentă medicală din Florida, Melissa Sims, ar fi fost încarcerată două zile pentru presupusa încălcare a unui ordin de cauțiune / de interdicție de contact."
    game_statement: "O femeie ar fi fost încarcerată după ce au fost prezentate mesaje text atribuite ei; ulterior s-a susținut că mesajele fuseseră fabricate cu ajutorul IA."
    counterfactual: "O femeie și-ar fi pierdut pentru câteva săptămâni dreptul de vizită după ce a fost prezentat un istoric de vizionări de pe rețelele sociale atribuit ei; ulterior s-a susținut că datele fuseseră generate cu ajutorul IA."
    simple_explanation: "O asistentă medicală din Florida ar fi petrecut două zile în arest după ce fostul partener a prezentat mesaje text atribuite ei. Ulterior s-a susținut că mesajele fuseseră generate sau fabricate cu ajutorul IA."
    why_bad: "Sistemele juridice se bazează pe faptul că probele pot fi legate de oameni și evenimente reale. IA generativă reduce costul producerii unor artefacte digitale plauzibile, în timp ce multe proceduri se bazează încă pe capturi de ecran, înregistrări sau mesaje a căror proveniență e greu de verificat. Riscul mai profund este epistemic: instituțiile ar putea atât să accepte probe false, cât și să respingă mai ușor probe autentice drept sintetice."
    future_escalation: "Pe măsură ce textele, imaginile, înregistrările audio și video false devin mai bune, instanțelor, jurnaliștilor, angajatorilor și publicului le este tot mai greu să deosebească adevărul de invenție. Crește astfel riscul unor decizii greșite: un om nevinovat poate fi pedepsit pe baza unui fals, iar o probă autentică poate fi respinsă ca fiind falsă."
    highlight: {real: ["încarcerată", "mesaje text"], fake: ["pierdut pentru câteva săptămâni dreptul de vizită", "istoric de vizionări de pe rețelele sociale"]}
  1374:
    domain: "Sănătate"
    hook: "o singură alertă greșită"
    title: "O alertă medicală IA a fost cât pe ce să ducă la un tratament nepotrivit"
    excerpt: "O asistentă de la spitalul St. Rose Dominican ar fi descris un episod în care un sistem IA al spitalului ar fi generat o alertă de sepsis."
    game_statement: "Un sistem IA dintr-un spital ar fi generat o alertă de sepsis pentru un pacient în vârstă aflat la dializă; răspunsul standard, fluidele intravenoase, putea provoca o supraîncărcare periculoasă cu lichide, dar o asistentă a observat și un medic a schimbat tratamentul."
    counterfactual: "Un sistem IA dintr-un spital care programează sălile de operație ar fi mutat o operație urgentă după cele de rutină, după ce a citit greșit o notă din fișa unui pacient, dar o asistentă a observat înainte ca întârzierea să facă rău."
    simple_explanation: "Un sistem IA dintr-un spital ar fi generat o alertă de sepsis pentru un pacient în vârstă aflat la dializă. Răspunsul standard de urgență includea fluide intravenoase, dar o asistentă și-a dat seama că acestea puteau provoca o supraîncărcare periculoasă cu lichide. Un medic a intervenit și a schimbat tratamentul."
    why_bad: "Instrumentele de sprijin pentru decizii clinice funcționează în fluxuri de lucru în care viteza și respectarea protocoalelor sunt adesea valoroase. Asta poate crea tendința de a ne baza pe automatizare (automation bias): personalul poate interpreta o alertă ca pe o recomandare fermă chiar și când particularitățile pacientului fac răspunsul standard nepotrivit. Un eșec sistematic al modelului sau al procesului poate afecta astfel mulți pacienți dacă clinicienii pierd capacitatea, timpul sau autoritatea de a-l contesta."
    future_escalation: "Pe măsură ce IA clinică devine mai capabilă și mai integrată în diagnostic, triaj și recomandări de tratament, unitățile medicale ar putea automatiza părți tot mai mari din îngrijire. Dacă supravegherea umană devine formală în loc de reală, eșecurile corelate ale modelului ar putea afecta mulți pacienți înainte de a fi descoperite."
    highlight: {real: ["alertă de sepsis", "fluidele intravenoase"], fake: ["programează sălile de operație", "mutat o operație urgentă după cele de rutină"]}
  1606:
    domain: "Servicii publice"
    hook: "o singură verificare facială eșuată"
    title: "Verificarea facială și accesul la beneficii sociale"
    excerpt: "Beneficiarii de alocații sociale din Africa de Sud s-ar fi confruntat cu eșecuri repetate pe portalul de verificare facială eLife al SASSA."
    game_statement: "Eșecurile repetate ale unui portal de verificare facială s-ar fi numărat printre motivele pentru care unele persoane nu și-au putut primi beneficiile sociale."
    counterfactual: "Un sistem IA care sortează scrisorile locuitorilor ar fi trimis sute de contestații privind beneficiile la departamentul greșit, iar oamenii au pierdut termenul de contestație înainte ca cineva să observe."
