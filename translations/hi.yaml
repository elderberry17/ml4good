    counterfactual: "अस्पताल के एक निर्णय-सहायता मॉडल ने कथित तौर पर मरीज़ की किडनी की बीमारी को ध्यान में रखे बिना एंटीकोएगुलेंट की मानक खुराक की सिफ़ारिश की; एक फ़ार्मासिस्ट ने दवा देने से पहले समस्या पकड़ ली।"
    simple_explanation: "अस्पताल के एक AI सिस्टम ने कथित तौर पर डायलिसिस पर चल रहे एक बुज़ुर्ग मरीज़ के लिए सेप्सिस का अलर्ट दिया। मानक आपात प्रतिक्रिया में नस के ज़रिए तरल पदार्थ देना शामिल था, लेकिन एक नर्स ने पहचाना कि इससे शरीर में खतरनाक हद तक तरल भर सकता है। एक डॉक्टर ने हस्तक्षेप करके इलाज बदल दिया।"
    why_bad: "क्लिनिकल निर्णय-सहायता टूल ऐसी कार्य-प्रक्रियाओं में चलते हैं जहाँ गति और प्रोटोकॉल का पालन अक्सर कीमती होते हैं। इससे स्वचालन पूर्वाग्रह (automation bias) पैदा हो सकता है: कर्मचारी अलर्ट को एक पक्की सलाह मान सकते हैं, तब भी जब मरीज़ की खास स्थिति के कारण मानक प्रतिक्रिया अनुचित हो। इसलिए अगर चिकित्सकों के पास उसे चुनौती देने की क्षमता, समय या अधिकार न रहे, तो मॉडल या प्रक्रिया की व्यवस्थित विफलता कई मरीज़ों को प्रभावित कर सकती है।"
    future_escalation: "जैसे-जैसे क्लिनिकल AI ज़्यादा सक्षम होगा और निदान, ट्राइएज (triage) तथा इलाज की सिफ़ारिशों में गहराई से जुड़ेगा, संस्थाएँ देखभाल के बड़े हिस्से स्वचालित कर सकती हैं। अगर मानवीय निगरानी सार्थक न रहकर सिर्फ़ औपचारिक रह गई, तो मॉडल की आपस में जुड़ी विफलताएँ पकड़ में आने से पहले कई मरीज़ों तक फैल सकती हैं।"
  1606:
    domain: "सार्वजनिक सेवाएँ"
    hook: "चेहरे की एक नाकाम जाँच"
    title: "चेहरा-सत्यापन और सामाजिक लाभों तक पहुँच"
    excerpt: "दक्षिण अफ़्रीका में सामाजिक अनुदान पाने वालों को कथित तौर पर SASSA के eLife चेहरा-सत्यापन पोर्टल पर बार-बार विफलताओं का सामना करना पड़ा।"
    game_statement: "चेहरा-सत्यापन की विफलताएँ कथित तौर पर उन कारणों में से थीं जिनसे कुछ लोगों को सामाजिक लाभ पाने में मुश्किल हुई, हालाँकि खास तौर पर चेहरा-पहचान से प्रभावित लोगों की सटीक संख्या तय नहीं हुई।"
    counterfactual: "एक स्वचालित पहचान-सत्यापन सिस्टम ने कथित तौर पर सेल्फ़ी मिलान में बार-बार विफलता के बाद बेरोज़गारी भत्ते के हज़ारों आवेदकों को खारिज कर दिया, जिससे कई लोगों को व्यक्तिगत रूप से अपील करनी पड़ी।"
    simple_explanation: "दक्षिण अफ़्रीका में सामाजिक अनुदान पाने वालों को कथित तौर पर SASSA के चेहरा-सत्यापन पोर्टल पर बार-बार विफलताओं का सामना करना पड़ा। बाद में संसदीय रिपोर्टों में कहा गया कि चेहरा-पहचान की विफलता सत्यापन न होने के कारणों में से एक थी और एक तिमाही में 67,868 अनुदान निलंबनों की पुष्टि की गई, लेकिन यह नहीं बताया गया कि इनमें से कितने खास तौर पर चेहरा-सत्यापन की विफलता से हुए।"
    why_bad: "जब ज़रूरी सार्वजनिक सेवाओं तक पहुँच स्वचालित पहचान-सत्यापन पर निर्भर हो, तो यह ऊँचे दाँव का मामला बन जाता है। गलत अस्वीकृति सिर्फ़ असुविधा नहीं है: अनुदान पाने वाले के लिए इसका मतलब भोजन, आवास, यात्रा या इलाज के पैसे मिलने में देरी हो सकता है। केंद्रीकृत तैनाती आपस में जुड़ी विफलताओं का खतरा भी पैदा करती है—एक डिज़ाइन या संचालन की समस्या एक साथ बहुत से लोगों को प्रभावित कर सकती है। गलती सुधारने का बोझ असमान रूप से उन पर पड़ सकता है जिनके पास अपील करने के लिए सबसे कम समय, आवाजाही, इंटरनेट या प्रशासनिक क्षमता है।"
    future_escalation: "सरकारें और कंपनियाँ कल्याण योजनाओं, बैंकिंग, बीमा, रोज़गार और प्रवेश-नियंत्रण में बायोमेट्रिक और AI-आधारित सत्यापन का इस्तेमाल बढ़ा सकती हैं। अगर तैनाती वैकल्पिक प्रक्रियाओं, ऑडिट और अपील व्यवस्था से तेज़ी से बढ़ी, तो स्वचालित बहिष्कार ज़्यादा व्यापक हो सकता है और प्रभावित लोगों के लिए उसे चुनौती देना कठिन हो जाएगा।"
