    future_escalation: "자동 감시가 더 널리 도입되면 기계가 만드는 경보가 훨씬 많아질 수 있다. 이후의 결정까지 점점 자동화되거나 시간에 쫓겨 내려진다면, 오탐은 제대로 된 검토가 이뤄지기도 전에 경찰, 국경 통제, 출입 시스템 등 위험도가 높은 기관 전반으로 퍼질 수 있다. AI 감시에는 또 다른 위험도 있다. 카메라가 모든 차량과 얼굴을 추적할 수 있게 되면 모든 사람이 항상 감시당하고, 한 번의 잘못된 일치 판정이 한 사람을 이 시스템에서 저 시스템으로 따라다닐 수 있다."
