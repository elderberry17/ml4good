    simple_explanation: "남아프리카공화국의 사회보장 급여 수급자들이 SASSA 얼굴 인증 포털에서 반복적인 실패를 겪은 것으로 알려졌다. 이후 의회 보고에서는 얼굴 인식 실패가 인증 불발의 원인 중 하나였다고 밝히며 한 분기 동안 67,868건의 급여 중지를 확인했지만, 그중 얼굴 인증 실패로 인한 건수는 밝히지 않았다."
    why_bad: "필수 공공 서비스 이용이 자동 신원 인증에 달려 있을 때 그 인증은 매우 중요한 문제가 된다. 잘못된 거부는 단순한 불편이 아니다. 수급자에게는 식비, 주거비, 교통비, 의료비에 쓰일 돈을 늦게 받는다는 뜻일 수 있다. 중앙집중식 도입은 상관된 실패의 위험도 만든다. 하나의 설계나 운영 문제가 많은 사람에게 동시에 영향을 줄 수 있다. 오류를 바로잡는 부담은 이의신청에 필요한 시간, 이동 수단, 인터넷 접속, 행정 역량이 가장 부족한 사람들에게 불균형하게 돌아갈 수 있다."
    future_escalation: "정부와 기업은 복지, 은행, 보험, 고용, 출입 통제에 생체 인식과 AI 기반 인증을 점점 더 많이 사용할 수 있다. 도입 속도가 대체 절차, 감사, 이의신청 제도보다 빠르면 자동화된 배제가 더 널리 퍼지고, 피해자가 이를 다투기는 더 어려워질 수 있다."
    highlight: {real: ["얼굴 인증 포털", "사회복지 급여를 받지 못한"], fake: ["주민 우편물을 분류하는", "이의신청 기한을 놓친"]}
