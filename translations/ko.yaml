    simple_explanation: "펜실베이니아의 한 학교 학생 두 명이 약 6개월 동안 AI 도구로 같은 반 여학생들과 다른 여학생들의 부적절한 딥페이크 이미지 수백 장을 만들어 주고받았다는 혐의를 받았습니다. 이후 당국은 피해자 60명을 확인했고, 그중 59명이 미성년자였습니다. 소년법원은 두 학생에게 책임이 있다고 판단했습니다. 이후 가족들은 학교와 이름이 밝혀지지 않은 AI 기업들을 상대로 소송을 냈습니다."
    why_bad: "여기서는 아무것도 고장 나지 않았습니다. 도구는 설계된 대로 작동했고, 동의한 적 없는 사람들을 상대로 쓰였습니다. 이미지 생성기를 쓰면 어린이를 포함해 누구나 평범한 사진으로 실제 인물의 사실적이고 모욕적인 가짜 이미지를 만들 수 있습니다. 보는 사람이 가짜라는 것을 알든 모르든 피해자는 해를 입습니다. 학교, 부모, 법원은 그런 이미지를 만들려면 기술과 노력이 필요하던 시절에 쓰인 규칙으로 대응해야 합니다."
    future_escalation: "가짜 이미지와 영상을 만드는 일은 계속 더 싸고, 더 사실적이고, 더 쉬워지고 있으며, 대상이 된 사람의 사진도 더 적게 필요합니다. 도구 안의 안전장치, 학교의 신고 절차, 법적 책임이 이를 따라가지 못하면, 이런 가해는 괴롭힘과 협박의 흔한 일부가 될 수 있습니다. 가해자는 거의 힘을 들이지 않고도 훨씬 많은 아이들에게 피해를 줄 수 있습니다."
