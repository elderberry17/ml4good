    excerpt: "남아프리카공화국의 사회보장 급여 수급자들이 SASSA의 eLife 얼굴 인증 포털에서 반복적인 실패를 겪은 것으로 알려졌다."
    game_statement: "얼굴 인증 포털의 반복된 오류가 일부 사람들이 사회복지 급여를 받지 못한 이유 중 하나였던 것으로 알려졌다."
