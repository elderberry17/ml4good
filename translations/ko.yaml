    simple_explanation: "병원 AI 시스템이 투석 중인 고령 환자에게 패혈증 경보를 생성한 것으로 알려졌다. 표준 응급 대응에는 정맥 수액 투여가 포함됐지만, 간호사는 이것이 위험한 수분 과부하를 일으킬 수 있다고 판단했다. 의사가 개입해 치료를 바꿨다."
