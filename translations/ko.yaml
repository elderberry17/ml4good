    future_escalation: "이미지와 영상 생성은 점점 더 싸고, 더 사실적이고, 더 쉬워지고 있으며, 대상의 사진도 점점 덜 필요해진다. 도구의 안전장치, 학교의 신고 절차, 법적 책임이 이 속도를 따라가지 못하면 이런 가해가 괴롭힘과 협박의 흔한 수단이 되어, 가해자가 거의 힘을 들이지 않고도 훨씬 많은 아이들에게 피해를 줄 수 있다."
