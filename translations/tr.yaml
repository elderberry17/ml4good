    game_statement: "Otomatik bir plaka okuyucunun bir aracın plakasını yanlış okuduğu bildirildi. Polis bunun üzerine, hata fark edilmeden önce sürücüyü silah doğrultarak durdurdu."
    counterfactual: "Drone görüntülerinden kalabalığın büyüklüğünü tahmin eden bir yapay zekâ sisteminin, bir düğün kutlamasını izinsiz protesto sandığı bildirildi. Hata fark edilmeden önce çevik kuvvet gönderildi."
    simple_explanation: "Otomatik bir plaka okuyucu, bir kamyoneti yanlışlıkla çalıntı bir plakayla eşleştirdi. Polis sürücüyü silah doğrultarak durdurdu, onu ısıran bir polis köpeğini saldı ve sürücüyü tutukladı. Polis daha sonra uyarının bir okuma hatası olduğunu söyledi. Suçlamalar düşürüldü."
    why_bad: "Tanıma sistemleri her zaman bazı hatalar yapar. Tehlike, bir uyarıya güç kullanmayı haklı çıkaracak kadar güvenildiğinde ortaya çıkar. O zaman küçük bir teknik hata bile yaralanmayla veya tutuklamayla bitebilir. Bu olayda uyarının ayrıca bir insan tarafından kontrol edilmesi gerekiyordu ve bu kontrolün düzgün yapılmadığı bildirildi."
    future_escalation: "Otomatik gözetim yaygınlaştıkça makineler çok daha fazla uyarı üretiyor. Sonraki kararlar da otomatikleşir veya aceleyle alınırsa, yanlış alarmlar kimse kontrol etmeden polisten, sınır kontrolünden ve diğer güçlü kurumlardan geçebilir. Yapay zekâ gözetiminin ikinci bir tehlikesi var. Kameralar her arabayı ve her yüzü izleyebildiğinde herkes sürekli gözetlenir ve tek bir yanlış eşleşme bir insanı sistemden sisteme takip edebilir."
    highlight: {real: ["plaka okuyucunun", "sürücüyü silah doğrultarak durdurdu"], fake: ["Drone görüntülerinden kalabalığın büyüklüğünü tahmin eden", "düğün kutlamasını izinsiz protesto sandığı"]}
