incidents:
  1701:
    domain: "Askerî istihbarat"
    hook: "tek bir hatalı rapor"
    title: "Nükleer konusunda yanlış istihbarat raporu"
    excerpt: "2026 baharında bir ABD özel harekât analistinin, bir Çin gemisinin yüküne ilişkin istihbaratı analiz etmek için bir yapay zekâ sohbet botu kullandığı bildirildi"
    game_statement: "Yapay zekâ desteğiyle hazırlanan bir istihbarat raporu, bir geminin yükünü yanlışlıkla nükleer silah programı parçaları olarak tanımladı; bildirildiğine göre sonuç yeniden kontrol edilmeden önce askerî bir müdahale hazırlanıyordu."
    counterfactual: "Yapay zekâ desteğiyle hazırlanan bir istihbarat raporu, sıradan endüstriyel ekipmanı yanlışlıkla kimyasal silah programı parçaları olarak tanımladı ve bir insan analist hatayı fark edene kadar yetkililer el koyma hazırlığına başladı."
    simple_explanation: "Bir ABD askerî analistinin, bir Çin gemisine ilişkin istihbaratı analiz ederken bir yapay zekâ sohbet botu kullandığı bildirildi. Ortaya çıkan rapor, yükü yanlışlıkla bir nükleer silah programıyla ilişkili olarak tanımladı. Bildirildiğine göre ordu, yetkililer sonucu yeniden kontrol edip operasyonu durdurmadan önce bir müdahale hazırlığına başlamıştı."
    why_bad: "Bu, hata maliyetinin son derece yüksek olabileceği bir karar sürecine giren epistemik bir başarısızlık örneğidir. Sorun yalnızca bir sohbet botunun olgusal bir hata yapması değil: Yapay zekâ destekli bir sonucun, kurumsal iş akışında operasyonel hazırlıkları etkileyecek kadar ilerlediği bildirildi. Yüksek riskli ortamlarda akıcı metin, zaman baskısı ve otomasyon yanlılığı (automation bias), zayıf dayanaklı sonuçları olduklarından daha karara hazır gösterebilir."
    future_escalation: "Yapay zekâ sistemleri istihbarat sentezi, planlama ve özerk analizde geliştikçe kurumlar karar zincirinin giderek daha büyük kısımlarını onlara devredebilir. Doğrulama, kaynak izlenebilirliği (provenance) ve insan itirazı mekanizmaları aynı hızda büyümezse, yanlış sonuçlar daha hızlı yayılabilir ve ciddi adımlar atılmadan önce düzeltme için daha az zaman kalabilir."
