    hook: "jedno lažno podudaranje"
    title: "Greška UI pri čitanju tablica dovela do zaustavljanja pod prijetnjom oružjem"
    excerpt: "Policija u Toledu, u Ohaju, zaustavila je vozača Brandona Upchurcha pod prijetnjom oružjem nakon što je čitač registarskih tablica Flock Safety pogrešno povezao njegov pikap s ukradenom tablicom."
    game_statement: "Automatski sistem za čitanje registarskih tablica je, kako se navodi, pogrešno očitao tablicu vozila, nakon čega je policija zaustavila vozača pod prijetnjom oružjem prije nego što je greška otkrivena."
    counterfactual: "UI sistem koji procjenjuje veličinu okupljanja na osnovu snimaka s drona je, kako se navodi, svadbu označio kao neprijavljeni protest, nakon čega je na lice mjesta poslana interventna policija prije nego što je greška otkrivena."
    simple_explanation: "Automatski čitač tablica pogrešno je povezao pikap s ukradenom tablicom. Policija je zaustavila vozača pod prijetnjom oružjem, pustila na njega policijskog psa koji ga je ujeo i uhapsila ga. Policija je kasnije rekla da je uzbuna bila pogrešno očitavanje; optužbe su odbačene."
    why_bad: "Suština je u sprezi probabilističkog sistema za prepoznavanje i institucije koja ima moć prinude. Sistemi za prepoznavanje neizbježno imaju stopu greške; kada se uzbuna smatra dovoljno pouzdanom da opravda rizičnu intervenciju, čak i mala tehnička greška može imati teške fizičke i pravne posljedice. Prijavljeni propust uključivao je i korak ljudske provjere koji nije ispravno proveden."
    future_escalation: "Šira primjena automatizovanog nadzora može proizvesti mnogo više uzbuna koje generišu mašine. Ako i naredne odluke postanu sve automatizovanije ili se donose pod vremenskim pritiskom, lažno pozitivni rezultati mogli bi se proširiti kroz policiju, graničnu kontrolu, sisteme kontrole pristupa i druge institucije visokog rizika prije bilo kakve suštinske provjere. Nadzor pomoću UI nosi i drugu opasnost: kada kamere mogu pratiti svaki automobil i svako lice, svi su stalno pod nadzorom, a jedno pogrešno podudaranje može pratiti čovjeka iz jednog sistema u drugi."
    highlight: {real: ["sistem za čitanje registarskih tablica", "zaustavila vozača pod prijetnjom oružjem"], fake: ["procjenjuje veličinu okupljanja na osnovu snimaka s drona", "svadbu označio kao neprijavljeni protest"]}
  1505:
    domain: "Prevare"
    hook: "jedan klonirani glas"
    title: "Glas kloniran pomoću UI u lažnoj otmici"
    excerpt: "Deborah Del Mastro je, kako se navodi, poslala 5.400 dolara u Meksiko nakon što su prevaranti lažno tvrdili da je njena kćerka Sarah oteta"
    game_statement: "Prevaranti su, kako se navodi, u pozivu o lažnoj otmici koristili glas kloniran pomoću UI i uvjerili majku da pošalje nekoliko hiljada dolara."
    counterfactual: "Prevaranti su, kako se navodi, majci koja je bila na odmoru poslali video generisan pomoću UI na kojem njena kuća gori i uvjerili je da plati nekoliko hiljada dolara za hitnu ekipu za popravke."
    simple_explanation: "Ženi su se javili prevaranti tvrdeći da su joj oteli kćerku. Pustili su joj nešto što je zvučalo kao uplašeni glas njene kćerke. Poslala je 5.400 dolara prije nego što je saznala da joj je kćerka na sigurnom; glas je, kako se navodi, imitiran pomoću UI."
    why_bad: "Društveni inženjering se obično oslanja na to da se meta uvjeri da je napadač neko kome vjeruje. Kloniranje glasa čini jeftinim oponašanje jednog od najjačih intuitivnih znakova identiteta. To može povećati uvjerljivost i emocionalni pritisak prevara, naročito kada napadači kombinuju sintetičke medije s ličnim podacima iz javnih izvora ili curenja podataka."
    future_escalation: "Sposobniji sistemi mogli bi kombinovati kloniranje glasa, generisani video, pretragu ličnih podataka i konverzacijske agente. To bi visoko personalizovane prevare moglo pretvoriti iz radno zahtjevnih operacija u djelimično automatizovane kampanje koje istovremeno ciljaju mnoge ljude."
    highlight: {real: ["lažnoj otmici", "glas kloniran pomoću UI"], fake: ["video generisan pomoću UI na kojem njena kuća gori", "hitnu ekipu za popravke"]}
  1379:
    domain: "Sudovi i dokazi"
    hook: "jedan sporni dokaz"
    title: "Dokazi navodno fabrikovani pomoću UI doveli do zatvaranja"
    excerpt: "Medicinska sestra s Floride, Melissa Sims, je, kako se navodi, provela dva dana u pritvoru zbog navodnog kršenja uslova kaucije / zabrane kontakta."
    game_statement: "Žena je, kako se navodi, privedena u pritvor nakon što su podnesene tekstualne poruke koje su joj pripisane; kasnije je tvrđeno da su poruke fabrikovane pomoću UI."
    counterfactual: "Žena je, kako se navodi, na nekoliko sedmica izgubila pravo na viđanje djeteta nakon što je podnesena historija pregleda na društvenim mrežama koja joj je pripisana; kasnije je tvrđeno da su ti podaci generisani pomoću UI."
    simple_explanation: "Medicinska sestra s Floride je, kako se navodi, provela dva dana u pritvoru nakon što je njen bivši partner podnio tekstualne poruke koje su joj pripisane. Kasnije je tvrđeno da su te poruke generisane ili fabrikovane pomoću UI."
    why_bad: "Pravosudni sistemi se oslanjaju na to da se dokazi mogu povezati sa stvarnim ljudima i događajima. Generativna UI smanjuje cijenu pravljenja uvjerljivih digitalnih artefakata, dok se mnogi postupci i dalje oslanjaju na snimke ekrana, snimke ili poruke čije je porijeklo teško provjeriti. Dublji rizik je epistemički: institucije bi mogle i prihvatiti lažne dokaze i lakše odbaciti prave kao sintetičke."
    future_escalation: "Kako lažni tekstovi, slike, zvuk i video postaju sve bolji, sudovima, novinarima, poslodavcima i javnosti sve je teže razlikovati istinu od izmišljotine. To povećava rizik od pogrešnih odluka: nedužna osoba može biti kažnjena na osnovu falsifikata, a pravi dokaz odbačen kao lažan."
    highlight: {real: ["privedena u pritvor", "tekstualne poruke"], fake: ["izgubila pravo na viđanje djeteta", "historija pregleda na društvenim mrežama"]}
  1374:
