  1701: {domain: Military intelligence, hook: one bad report}
  1628: {domain: Cybersecurity, hook: one escaped test}
  1672: {domain: "Software engineering", hook: "one deleted database", highlight: {real: ["deleted a real production database"], fake: ["emailed a test message to thousands of real customers"]}}
  1556: {domain: Finance, hook: one hijacked transfer}
  1596: {domain: "Corporate fraud", hook: "one fake director", highlight: {real: ["posed as a company director using deepfake methods"], fake: ["fake audit report", "overdue tax payment"]}}
