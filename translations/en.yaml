  1505: {domain: "Scams", hook: "one cloned voice", highlight: {real: ["AI-cloned voice", "fake kidnapping call"], fake: ["AI-generated video of her house on fire", "emergency repair crew"]}}
  1379: {domain: "Courts & evidence", hook: "one disputed piece of evidence", highlight: {real: ["jailed", "text messages"], fake: ["lost the right to see her child", "social-media viewing history"]}}
  1374: {domain: "Healthcare", hook: "one wrong alert", highlight: {real: ["sepsis alert", "IV fluids"], fake: ["schedules operating rooms", "put an urgent operation after routine ones"]}}
