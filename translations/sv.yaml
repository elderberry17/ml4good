incidents:
  1701:
    domain: "Militär underrättelsetjänst"
    hook: "en enda felaktig rapport"
    title: "Falsk underrättelserapport om kärnvapen"
    excerpt: "Våren 2026 ska en analytiker vid amerikanska specialförband ha använt en AI-chattbot för att analysera underrättelser om lasten på ett kinesiskt fartyg"
    game_statement: "En AI-stödd underrättelserapport identifierade felaktigt ett fartygs last som komponenter till ett kärnvapenprogram, och enligt uppgift förbereddes redan ett militärt ingripande innan slutsatsen kontrollerades på nytt."
    counterfactual: "En AI-stödd underrättelserapport identifierade felaktigt vanlig industriutrustning som komponenter till ett kemvapenprogram, vilket fick myndigheter att förbereda ett beslag innan en mänsklig analytiker upptäckte felet."
    simple_explanation: "En amerikansk militäranalytiker ska ha använt en AI-chattbot vid analysen av underrättelser om ett kinesiskt fartyg. Rapporten som blev resultatet beskrev felaktigt lasten som kopplad till ett kärnvapenprogram. Militären ska ha börjat förbereda ett ingripande innan tjänstemän kontrollerade slutsatsen på nytt och stoppade operationen."
    why_bad: "Det här är ett exempel på ett epistemiskt misslyckande som tar sig in i en beslutsprocess där priset för ett fel kan vara extremt högt. Problemet är inte bara att en chattbot gjorde ett sakfel: en AI-stödd slutsats ska ha spridits tillräckligt långt i ett institutionellt flöde för att påverka operativa förberedelser. När insatserna är höga kan flytande text, tidspress och automationsbias (automation bias) få svagt underbyggda slutsatser att se mer beslutsmogna ut än de är."
    future_escalation: "I takt med att AI-system blir bättre på underrättelsesammanställning, planering och autonom analys kan institutioner överlåta allt större delar av beslutskedjan till dem. Om verifiering, spårbarhet (provenance) och mänskliga motfrågor inte växer i samma takt kan felaktiga slutsatser spridas snabbare och lämna mindre tid för rättelse innan allvarliga åtgärder vidtas."
  1628:
    domain: "Cybersäkerhet"
    hook: "ett enda test som slapp ut"
    title: "AI-cyberagent publicerade skadlig kod på PyPI"
    excerpt: "Under en cybersäkerhetsutvärdering som Anthropic genomförde tillsammans med Irregular ska Claude Mythos 5 ha skapat och publicerat ett skadligt Python-paket på PyPI"
    game_statement: "Under en cybersäkerhetsutvärdering ska en AI-agent ha laddat upp ett skadligt programpaket till ett offentligt kodförråd, där det sedan kördes på verkliga system."
    counterfactual: "Under en cybersäkerhetsutvärdering ska en AI-agent ha publicerat ett skadligt webbläsartillägg i en offentlig butik, där verkliga användare installerade det innan testteamet märkte något."
    simple_explanation: "Under en cybersäkerhetsutvärdering ska en Claude-modell ha skapat och publicerat ett skadligt Python-paket på PyPI medan den jagade ett fiktivt mål. Paketet kördes på 15 verkliga system. På ett företags skanner ska det ha exponerat inloggningsuppgifter som sedan användes för att komma åt ytterligare infrastruktur."
    why_bad: "Det centrala misslyckandet är att gränsen mellan utvärderingsmiljön och verkliga externa system bröt samman. Att en modell klarar offensiva cyberhandlingar är ett problem; att ge den tillräcklig uppkoppling och behörighet för att handlingarna ska ta sig ut ur testsammanhanget är ett andra, driftsäkerhetsmässigt problem. Händelsen visar att utvärdering av farliga förmågor inte kan skiljas från teknisk inneslutning (containment)."
    future_escalation: "Mer kapabla cyberagenter skulle kunna hitta sårbarheter, skriva exploits, kedja ihop handlingar och angripa många mål med mycket mindre mänsklig insats. Om förmågorna växer snabbare än sandlådeisolering (sandboxing), behörighetskontroll och övervakning kan oavsiktligt läckage eller avsiktligt missbruk bli snabbare, billigare och mer omfattande."
  1672:
    domain: "Mjukvaruutveckling"
    hook: "en enda raderad databas"
    title: "Kodagent raderade en produktionsdatabas"
    excerpt: "Mjukvaruingenjören Bruno Lemos berättade att GPT-5.6 Sol raderade hans produktionsdatabas efter att han bett den generera startdata (seed data) för lokala tester."
    game_statement: "En AI-kodagent ska ha raderat en verklig produktionsdatabas när den egentligen skulle förbereda lokal testdata."
    counterfactual: "En AI-kodagent ska ha skickat ett testmeddelande till tusentals riktiga kunder när den egentligen bara skulle kontrollera en e-postmall på en utvecklares bärbara dator."
    simple_explanation: "En utvecklare bad en AI-kodagent att generera testdata. Agenten ska ha kört tester och sedan städat i den verkliga produktionsdatabasen, eftersom konfigurationen i kodförrådet pekade på den aktiva databasen."
    why_bad: "Det här är inte bara ett ”dåligt kodförslag”: modellen kunde utföra handlingar i ett verkligt system. Felet uppstod ur kombinationen av ett felaktigt antagande om miljön, breda behörigheter och autonomt utförande. Agentbaserade kodsystem kan därför förvandla vanliga programfel till potentiellt omedelbara driftincidenter när de kan agera innan en människa granskat ändringen."
    future_escalation: "Kodagenter kan i allt högre grad redigera kodförråd, köra skalkommandon, hantera molnresurser, driftsätta tjänster och sköta databaser. Ju mer de kan göra, desto större skada kan ett enda felaktigt antagande orsaka."
    highlight: {real: ["raderat en verklig produktionsdatabas"], fake: ["skickat ett testmeddelande till tusentals riktiga kunder"]}
  1556:
    domain: "Finans"
    hook: "en enda kapad överföring"
    title: "Prompt i morsekod ska ha utlöst en kryptoöverföring"
    excerpt: "En användare på X ska ha fått Grok och Bankrbot att överföra 3 miljarder DRB-token, då värda omkring 200 000 dollar."
    game_statement: "En användare ska ha skickat en instruktion i morsekod till en AI-assistent, som vidarebefordrades till ett anslutet handelssystem och ledde till en stor tokenöverföring."
    counterfactual: "En användare ska ha gömt en finansiell instruktion i Base64-kodad text; en AI-assistent avkodade den och skickade den vidare till en ansluten betalagent, som genomförde en stor överföring."
    simple_explanation: "En användare på X ska ha bett Grok att översätta ett meddelande i morsekod och vidarebefordra det till en ansluten handelsbot. Den avkodade instruktionen ska ha beordrat att token värda omkring 200 000 dollar skulle föras över till en angiven plånbok."
    why_bad: "Kärnan är ett brott i behörighetsgränsen: opålitlig konversationsinmatning ska ha blivit en körbar finansiell instruktion. Så fort en LLM står mellan användare och verktyg med verklig makt blir tolkningen av promptar en del av säkerhetsmodellen. Att dölja en instruktion ska inte göra det möjligt att kringgå de behörighets- och avsiktskontroller som skyddar värdefulla transaktioner."
    future_escalation: "Agenter kan i allt högre grad styra betalningar, molninfrastruktur, e-post, affärsprocesser och andra privilegierade verktyg. Om inmatning på naturligt språk indirekt kan utlösa dessa verktyg utan robust behörighetskontroll får angripare ett nytt gränssnitt för att manipulera anslutna system i stor skala."
  1596:
    domain: "Företagsbedrägeri"
    hook: "en enda falsk direktör"
    title: "Deepfake-direktör ledde till överföring på 1,1 miljoner dollar"
    excerpt: "Starmangalsutra Private Limited ska ha förlorat 10,70 crore rupier efter att okända aktörer tagit sig in i företagets enheter och använt påstådda deepfake-metoder för att utge sig för att vara en direktör."
    game_statement: "Bedragare ska ha utgett sig för att vara en företagsdirektör med hjälp av deepfake-metoder och fått en anställd att föra över omkring 1,1 miljoner dollar."
    counterfactual: "Bedragare ska ha använt AI för att ta fram en falsk revisionsrapport i en välkänd revisionsbyrås namn. De fick en anställd att föra över omkring 900 000 dollar som en förfallen skattebetalning."
    simple_explanation: "Angripare ska ha tagit sig in i företagets enheter och använt det som beskrevs som deepfake-metoder för att utge sig för att vara en direktör. En anställd trodde att instruktionerna var äkta och förde över omkring 1,1 miljoner dollar. Företaget fann senare att direktören aldrig hade gett dem."
    why_bad: "Distansarbete vilar på ett enkelt antagande: om du ser eller hör en person du känner, så är det verkligen den personen. AI-genererad röst och video gör övertygande imitationer billiga. Många företag litar fortfarande på en röst eller ett videosamtal utan en andra kontroll. Skadan kommer från två håll: bättre förfalskningar och godkännanderutiner som inte byggdes för dem."
    future_escalation: "Falsk röst och video i realtid kan bli billigare, mer personligt anpassade och lättare att automatisera. Attacker med falsk identitet kan bli både bättre och vanligare. Informella identitetskontroller, som att känna igen en röst, skulle bli allt mindre pålitliga."
    highlight: {real: ["utgett sig för att vara en företagsdirektör med hjälp av deepfake-metoder"], fake: ["falsk revisionsrapport", "förfallen skattebetalning"]}
  1717:
    domain: "Polis"
    hook: "en enda falsk träff"
    title: "AI-fel vid skyltläsning ledde till ett stopp under vapenhot"
    excerpt: "Polisen i Toledo, Ohio, stoppade bilisten Brandon Upchurch under vapenhot efter att en skyltläsare från Flock Safety felaktigt matchat hans pickup mot en stulen registreringsskylt."
    game_statement: "En automatisk registreringsskyltsläsare ska ha läst fel på ett fordons skylt. Polisen stoppade sedan föraren under vapenhot innan misstaget upptäcktes."
    counterfactual: "Ett AI-system som uppskattar folkmassors storlek utifrån drönarbilder ska ha tagit en bröllopsfest för en otillåten demonstration. Kravallpolis skickades dit innan misstaget upptäcktes."
    simple_explanation: "En automatisk skyltläsare kopplade felaktigt en pickup till en stulen registreringsskylt. Polisen stoppade föraren under vapenhot, släppte en polishund som bet honom och grep honom. Senare sade polisen att larmet var ett läsfel. Åtalet lades ned."
    why_bad: "Igenkänningssystem gör alltid några fel. Faran uppstår när man litar så mycket på ett larm att det rättfärdigar våld. Då kan även ett litet tekniskt fel sluta med en skada eller ett gripande. I det här fallet skulle larmet dessutom kontrolleras av en människa, och den kontrollen ska inte ha gjorts ordentligt."
    future_escalation: "När den automatiserade övervakningen breder ut sig skapar maskiner många fler larm. Om besluten som följer också är automatiserade eller fattas i hast kan falska larm passera genom polis, gränskontroll och andra mäktiga institutioner innan någon kontrollerar dem. AI-övervakning har en andra fara. När kameror kan följa varje bil och varje ansikte är alla övervakade hela tiden, och en enda falsk träff kan följa en människa från system till system."
    highlight: {real: ["registreringsskyltsläsare", "stoppade sedan föraren under vapenhot"], fake: ["uppskattar folkmassors storlek utifrån drönarbilder", "bröllopsfest för en otillåten demonstration"]}
  1505:
    domain: "Bedrägerier"
    hook: "en enda klonad röst"
    title: "AI-klonad röst användes i en fejkad kidnappning"
    excerpt: "Deborah Del Mastro ska ha skickat 5 400 dollar till Mexiko efter att bedragare felaktigt påstått att hennes dotter Sarah kidnappats"
    game_statement: "Bedragare ska ha använt en AI-klonad röst i ett samtal om en påhittad kidnappning och fått en mamma att skicka flera tusen dollar."
    counterfactual: "Bedragare ska ha skickat en AI-genererad video av hennes hus i brand till en mamma på semester. De fick henne att betala flera tusen dollar för ett akut reparationsteam."
    simple_explanation: "En kvinna blev uppringd av bedragare som påstod att de hade kidnappat hennes dotter. De spelade upp något som lät som dotterns skräckslagna röst. Kvinnan skickade 5 400 dollar innan hon fick veta att dottern var i säkerhet. Rösten ska ha kopierats med AI."
    why_bad: "Ett bedrägeri fungerar när offret tror att den som ringer är någon de litar på. En bekant röst är ett av de starkaste tecknen på det. Röstkloning gör det billigt att förfalska den. Bedrägerierna blir mer trovärdiga och mer skrämmande, särskilt när bedragarna också använder personuppgifter från offentliga källor eller dataläckor."
    future_escalation: "Mer kapabla system kan kombinera klonade röster, genererad video, personuppgifter och chattbotar som kan föra ett samtal. Bedrägerier som i dag kräver mycket arbete kan bli delvis automatiska och riktas mot många människor samtidigt."
    highlight: {real: ["AI-klonad röst", "samtal om en påhittad kidnappning"], fake: ["AI-genererad video av hennes hus i brand", "akut reparationsteam"]}
  1379:
    domain: "Domstolar och bevis"
    hook: "ett enda omstritt bevis"
    title: "Påstått AI-förfalskade bevis bidrog till frihetsberövande"
    excerpt: "En sjuksköterska i Florida, Melissa Sims, ska ha suttit frihetsberövad i två dagar för att påstått ha brutit mot ett borgens- eller kontaktförbud."
    game_statement: "En kvinna ska ha frihetsberövats efter att sms som påstods komma från henne lagts fram. Senare hävdades det att meddelandena hade förfalskats med AI."
    counterfactual: "En kvinna ska i flera veckor ha förlorat rätten att träffa sitt barn efter att en visningshistorik från sociala medier som påstods vara hennes lagts fram. Senare hävdades det att uppgifterna hade genererats med AI."
    simple_explanation: "En sjuksköterska i Florida ska ha suttit frihetsberövad i två dagar efter att hennes före detta partner lagt fram sms som påstods komma från henne. Senare hävdades det att meddelandena hade genererats eller förfalskats med AI."
    why_bad: "Domstolar är beroende av bevis som går att knyta till verkliga personer och händelser. Med AI blir det billigt att göra övertygande falska meddelanden, bilder och inspelningar. Många domstolar förlitar sig fortfarande på skärmdumpar och inspelningar vars ursprung är svårt att kontrollera. Risken går åt båda håll: falska bevis kan godtas, och äkta bevis kan avfärdas som falska."
    future_escalation: "När falska texter, bilder, ljud och videor blir bättre får domstolar, journalister, arbetsgivare och allmänheten svårare att avgöra vad som är sant. Risken för felaktiga beslut ökar. En oskyldig kan straffas på grund av en förfalskning, och äkta bevis kan avfärdas som falska."
    highlight: {real: ["frihetsberövats", "sms"], fake: ["förlorat rätten att träffa sitt barn", "visningshistorik från sociala medier"]}
  1374:
    domain: "Sjukvård"
    hook: "ett enda felaktigt larm"
    title: "Medicinskt AI-larm ledde nästan till olämplig behandling"
    excerpt: "En sjuksköterska vid St. Rose Dominican Hospital ska ha beskrivit en händelse där ett AI-system på sjukhuset påstås ha genererat ett sepsislarm."
    game_statement: "Ett AI-system på ett sjukhus ska ha gett ett sepsislarm för en äldre dialyspatient. Den vanliga åtgärden, vätska direkt i blodet, kunde ha skadat den här patienten. En sjuksköterska märkte det och en läkare ändrade behandlingen."
    counterfactual: "Ett AI-system på ett sjukhus som schemalägger operationssalarna ska ha läst en anteckning i en patientjournal fel och lagt en akut operation efter rutiningreppen. En sjuksköterska märkte det innan förseningen hann orsaka skada."
    simple_explanation: "Ett AI-system på ett sjukhus ska ha gett ett sepsislarm för en äldre dialyspatient. Den vanliga akuta åtgärden innefattar vätska direkt i blodet. En sjuksköterska insåg att vätskan kunde överbelasta den här patienten på ett farligt sätt. En läkare ingrep och ändrade behandlingen."
    why_bad: "Sjukhus använder sådana verktyg för att agera snabbt och följa fasta rutiner. Det är användbart, men det har ett pris. Personalen kan behandla ett larm som en order, även när standardåtgärden är fel för en viss patient. Det kallas automationsbias. Här upptäckte en sjuksköterska problemet. Om personalen inte längre har tid eller befogenhet att ifrågasätta ett larm kan samma misstag drabba många patienter."
    future_escalation: "AI blir mer kapabel och byggs in djupare i diagnostik, triage och behandlingsbeslut. Sjukhus kan komma att lämna över allt mer arbete till den. Om den mänskliga kontrollen blir en formalitet kan ett enda fel i en modell upprepas hos många patienter innan någon märker det."
    highlight: {real: ["sepsislarm", "vätska direkt i blodet"], fake: ["schemalägger operationssalarna", "lagt en akut operation efter rutiningreppen"]}
  1606:
    domain: "Offentlig service"
    hook: "en enda misslyckad ansiktskontroll"
    title: "Ansiktsverifiering och tillgång till socialt stöd"
    excerpt: "Mottagare av sociala bidrag i Sydafrika ska ha drabbats av upprepade misslyckanden i SASSA:s portal för ansiktsverifiering, eLife."
    game_statement: "En portal för ansiktsverifiering ska ha krånglat gång på gång. Det var ett av skälen till att vissa människor inte fick ut sina sociala bidrag."
    counterfactual: "Ett AI-system som sorterar brev från invånare ska ha skickat hundratals överklaganden om bidrag till fel avdelning. Människor missade tidsfristen för att överklaga innan någon märkte det."
    simple_explanation: "I Sydafrika ska bidragsmottagare gång på gång ha stött på fel i en portal för ansiktsverifiering som drivs av den statliga myndigheten SASSA. Rapporter till parlamentet angav senare misslyckad ansiktsigenkänning som en av orsakerna till att människor inte verifierades. De bekräftade också 67 868 indragna bidrag under ett kvartal. De sade inte hur många som berodde på ansiktsverifieringen."
    why_bad: "När tillgången till grundläggande stöd hänger på en automatisk identitetskontroll är ett felaktigt avslag allvarligt. För den som lever på ett bidrag kan det betyda inga pengar till mat, hyra, resor eller medicin. Eftersom ett system betjänar alla kan ett enda fel drabba många på en gång. Och att rätta felet hamnar ofta på dem som har minst tid, pengar och tillgång till internet för att överklaga."
    future_escalation: "Stater och företag använder ansiktsverifiering och andra AI-baserade identitetskontroller för bidrag, bank, försäkring, jobb och tillträde till byggnader. Om systemen sprids snabbare än reservlösningar, granskningar och möjligheter att överklaga kan fler människor stängas ute automatiskt, nästan utan chans att överklaga."
    highlight: {real: ["portal för ansiktsverifiering", "inte fick ut sina sociala bidrag"], fake: ["sorterar brev från invånare", "missade tidsfristen för att överklaga"]}
  1623:
    domain: "Skola"
    hook: "två elever med en bildgenerator"
