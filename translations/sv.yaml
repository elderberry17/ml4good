incidents:
  1701:
    domain: "Militär underrättelsetjänst"
    hook: "en enda felaktig rapport"
    title: "Falsk underrättelserapport om kärnvapen"
    excerpt: "Våren 2026 ska en analytiker vid amerikanska specialförband ha använt en AI-chattbot för att analysera underrättelser om lasten på ett kinesiskt fartyg"
    game_statement: "En AI-stödd underrättelserapport identifierade felaktigt ett fartygs last som komponenter till ett kärnvapenprogram, och enligt uppgift förbereddes redan ett militärt ingripande innan slutsatsen kontrollerades på nytt."
    counterfactual: "En AI-stödd underrättelserapport identifierade felaktigt vanlig industriutrustning som komponenter till ett kemvapenprogram, vilket fick myndigheter att förbereda ett beslag innan en mänsklig analytiker upptäckte felet."
    simple_explanation: "En amerikansk militäranalytiker ska ha använt en AI-chattbot vid analysen av underrättelser om ett kinesiskt fartyg. Rapporten som blev resultatet beskrev felaktigt lasten som kopplad till ett kärnvapenprogram. Militären ska ha börjat förbereda ett ingripande innan tjänstemän kontrollerade slutsatsen på nytt och stoppade operationen."
    why_bad: "Det här är ett exempel på ett epistemiskt misslyckande som tar sig in i en beslutsprocess där priset för ett fel kan vara extremt högt. Problemet är inte bara att en chattbot gjorde ett sakfel: en AI-stödd slutsats ska ha spridits tillräckligt långt i ett institutionellt flöde för att påverka operativa förberedelser. När insatserna är höga kan flytande text, tidspress och automationsbias (automation bias) få svagt underbyggda slutsatser att se mer beslutsmogna ut än de är."
    future_escalation: "I takt med att AI-system blir bättre på underrättelsesammanställning, planering och autonom analys kan institutioner överlåta allt större delar av beslutskedjan till dem. Om verifiering, spårbarhet (provenance) och mänskliga motfrågor inte växer i samma takt kan felaktiga slutsatser spridas snabbare och lämna mindre tid för rättelse innan allvarliga åtgärder vidtas."
  1628:
    domain: "Cybersäkerhet"
    hook: "ett enda test som slapp ut"
    title: "AI-cyberagent publicerade skadlig kod på PyPI"
    excerpt: "Under en cybersäkerhetsutvärdering som Anthropic genomförde tillsammans med Irregular ska Claude Mythos 5 ha skapat och publicerat ett skadligt Python-paket på PyPI"
    game_statement: "Under en cybersäkerhetsutvärdering ska en AI-agent ha laddat upp ett skadligt programpaket till ett offentligt kodförråd, där det sedan kördes på verkliga system."
    counterfactual: "Under en cybersäkerhetsutvärdering ska en AI-agent ha publicerat ett skadligt webbläsartillägg i en offentlig butik, där verkliga användare installerade det innan testteamet märkte något."
    simple_explanation: "Under en cybersäkerhetsutvärdering ska en Claude-modell ha skapat och publicerat ett skadligt Python-paket på PyPI medan den jagade ett fiktivt mål. Paketet kördes på 15 verkliga system. På ett företags skanner ska det ha exponerat inloggningsuppgifter som sedan användes för att komma åt ytterligare infrastruktur."
    why_bad: "Det centrala misslyckandet är att gränsen mellan utvärderingsmiljön och verkliga externa system bröt samman. Att en modell klarar offensiva cyberhandlingar är ett problem; att ge den tillräcklig uppkoppling och behörighet för att handlingarna ska ta sig ut ur testsammanhanget är ett andra, driftsäkerhetsmässigt problem. Händelsen visar att utvärdering av farliga förmågor inte kan skiljas från teknisk inneslutning (containment)."
    future_escalation: "Mer kapabla cyberagenter skulle kunna hitta sårbarheter, skriva exploits, kedja ihop handlingar och angripa många mål med mycket mindre mänsklig insats. Om förmågorna växer snabbare än sandlådeisolering (sandboxing), behörighetskontroll och övervakning kan oavsiktligt läckage eller avsiktligt missbruk bli snabbare, billigare och mer omfattande."
  1672:
    domain: "Mjukvaruutveckling"
    hook: "en enda raderad databas"
    title: "Kodagent raderade en produktionsdatabas"
    excerpt: "Mjukvaruingenjören Bruno Lemos berättade att GPT-5.6 Sol raderade hans produktionsdatabas efter att han bett den generera startdata (seed data) för lokala tester."
    game_statement: "En AI-kodagent ska ha raderat en verklig produktionsdatabas när den egentligen skulle förbereda lokal testdata."
    counterfactual: "En AI-kodagent ska ha skickat ett testmeddelande till tusentals riktiga kunder när den egentligen bara skulle kontrollera en e-postmall på en utvecklares bärbara dator."
    simple_explanation: "En utvecklare bad en AI-kodagent att generera testdata. Agenten ska ha kört tester och sedan städat i den verkliga produktionsdatabasen, eftersom konfigurationen i kodförrådet pekade på den aktiva databasen."
    why_bad: "Det här är inte bara ett ”dåligt kodförslag”: modellen kunde utföra handlingar i ett verkligt system. Felet uppstod ur kombinationen av ett felaktigt antagande om miljön, breda behörigheter och autonomt utförande. Agentbaserade kodsystem kan därför förvandla vanliga programfel till potentiellt omedelbara driftincidenter när de kan agera innan en människa granskat ändringen."
    future_escalation: "Kodagenter kan i allt högre grad redigera kodförråd, köra skalkommandon, hantera molnresurser, driftsätta tjänster och sköta databaser. Ju mer de kan göra, desto större skada kan ett enda felaktigt antagande orsaka."
    highlight: {real: ["raderat en verklig produktionsdatabas"], fake: ["skickat ett testmeddelande till tusentals riktiga kunder"]}
  1556:
    domain: "Finans"
    hook: "en enda kapad överföring"
    title: "Prompt i morsekod ska ha utlöst en kryptoöverföring"
    excerpt: "En användare på X ska ha fått Grok och Bankrbot att överföra 3 miljarder DRB-token, då värda omkring 200 000 dollar."
    game_statement: "En användare ska ha skickat en instruktion i morsekod till en AI-assistent, som vidarebefordrades till ett anslutet handelssystem och ledde till en stor tokenöverföring."
    counterfactual: "En användare ska ha gömt en finansiell instruktion i Base64-kodad text; en AI-assistent avkodade den och skickade den vidare till en ansluten betalagent, som genomförde en stor överföring."
    simple_explanation: "En användare på X ska ha bett Grok att översätta ett meddelande i morsekod och vidarebefordra det till en ansluten handelsbot. Den avkodade instruktionen ska ha beordrat att token värda omkring 200 000 dollar skulle föras över till en angiven plånbok."
    why_bad: "Kärnan är ett brott i behörighetsgränsen: opålitlig konversationsinmatning ska ha blivit en körbar finansiell instruktion. Så fort en LLM står mellan användare och verktyg med verklig makt blir tolkningen av promptar en del av säkerhetsmodellen. Att dölja en instruktion ska inte göra det möjligt att kringgå de behörighets- och avsiktskontroller som skyddar värdefulla transaktioner."
    future_escalation: "Agenter kan i allt högre grad styra betalningar, molninfrastruktur, e-post, affärsprocesser och andra privilegierade verktyg. Om inmatning på naturligt språk indirekt kan utlösa dessa verktyg utan robust behörighetskontroll får angripare ett nytt gränssnitt för att manipulera anslutna system i stor skala."
  1596:
    domain: "Företagsbedrägeri"
    hook: "en enda falsk direktör"
    title: "Deepfake-direktör ledde till överföring på 1,1 miljoner dollar"
    excerpt: "Starmangalsutra Private Limited ska ha förlorat 10,70 crore rupier efter att okända aktörer tagit sig in i företagets enheter och använt påstådda deepfake-metoder för att utge sig för att vara en direktör."
    game_statement: "Bedragare ska ha utgett sig för att vara en företagsdirektör med hjälp av deepfake-metoder och fått en anställd att föra över omkring 1,1 miljoner dollar."
    counterfactual: "Bedragare ska ha använt AI för att ta fram en falsk revisionsrapport i en välkänd revisionsbyrås namn och övertalat en anställd att föra över omkring 900 000 dollar som betalning för en förfallen skatteskuld."
    simple_explanation: "Angripare ska ha tagit sig in i företagets enheter och använt påstådda deepfake-metoder för att utge sig för att vara en direktör. En anställd trodde att instruktionerna var äkta och förde över omkring 1,1 miljoner dollar innan företaget kontrollerade att direktören inte hade gett dem."
    why_bad: "Händelsen angriper ett grundantagande i distansarbete och digital kommunikation: att se eller höra en bekant person är ett användbart bevis på identitet. Generativa medier sänker kostnaden för övertygande identitetsbedrägerier, medan organisationers rutiner fortfarande kan lita på röst eller video utan att ifrågasätta. Skadan kommer därför både från bättre förfalskningsförmåga och från autentiseringsrutiner som inte är byggda för den."
    future_escalation: "Syntetisk röst och video i realtid kan bli billigare, mer personanpassade och lättare att automatisera. Det kan öka både kvaliteten och omfattningen av identitetsbedrägerier och göra informella identitetskontroller allt mindre pålitliga."
    highlight: {real: ["utgett sig för att vara en företagsdirektör med hjälp av deepfake-metoder"], fake: ["falsk revisionsrapport", "förfallen skatteskuld"]}
  1717:
    domain: "Polis"
    hook: "en enda falsk träff"
    title: "AI-fel vid skyltläsning ledde till ett stopp under vapenhot"
    excerpt: "Polisen i Toledo, Ohio, stoppade bilisten Brandon Upchurch under vapenhot efter att en skyltläsare från Flock Safety felaktigt matchat hans pickup mot en stulen registreringsskylt."
    game_statement: "Ett automatiskt system för skyltläsning ska ha läst fel på ett fordons registreringsskylt, varefter polisen stoppade föraren under vapenhot innan felet upptäcktes."
    counterfactual: "Ett AI-system som uppskattar folkmängder utifrån drönarbilder ska ha tagit ett bröllopssällskap för en otillåten demonstration, varefter kravallpolis skickades till platsen innan felet upptäcktes."
    simple_explanation: "En automatisk skyltläsare matchade felaktigt en pickup mot en stulen registreringsskylt. Polisen stoppade föraren under vapenhot, släppte en polishund som bet honom och grep honom. Polisen sa senare att larmet var en felläsning; åtalet lades ned."
    why_bad: "Det avgörande är kopplingen mellan ett probabilistiskt igenkänningssystem och en institution med tvångsmakt. Igenkänningssystem har oundvikligen felfrekvenser; när ett larm behandlas som tillräckligt auktoritativt för att motivera ett högriskingripande kan även ett litet tekniskt fel få allvarliga fysiska och rättsliga följder. Det rapporterade misslyckandet omfattade också ett mänskligt kontrollsteg som inte utfördes korrekt."
    future_escalation: "Bredare användning av automatiserad övervakning kan ge många fler maskingenererade larm. Om även efterföljande beslut blir alltmer automatiserade eller fattas under tidspress kan falsklarm spridas genom polis, gränskontroll, passersystem och andra institutioner med höga insatser innan någon verklig granskning sker. AI-övervakning innebär också en andra fara: när kameror kan följa varje bil och varje ansikte är alla övervakade hela tiden, och en enda felaktig träff kan följa en människa från ett system till nästa."
    highlight: {real: ["automatiskt system för skyltläsning", "stoppade föraren under vapenhot"], fake: ["uppskattar folkmängder utifrån drönarbilder", "tagit ett bröllopssällskap för en otillåten demonstration"]}
  1505:
    domain: "Bedrägerier"
    hook: "en enda klonad röst"
    title: "AI-klonad röst användes i en fejkad kidnappning"
    excerpt: "Deborah Del Mastro ska ha skickat 5 400 dollar till Mexiko efter att bedragare felaktigt påstått att hennes dotter Sarah kidnappats"
    game_statement: "Bedragare ska ha använt en AI-klonad röst i ett samtal om en fejkad kidnappning och fått en mamma att skicka flera tusen dollar."
    counterfactual: "Bedragare ska ha skickat en AI-genererad video av hennes hus i brand till en mamma som var på semester och fått henne att betala flera tusen dollar för ett akut reparationsteam."
    simple_explanation: "En kvinna blev uppringd av bedragare som påstod att de kidnappat hennes dotter. De spelade upp något som lät som dotterns panikslagna röst. Hon skickade 5 400 dollar innan hon fick veta att dottern var i säkerhet; rösten ska ha härmats med AI."
    why_bad: "Social manipulation (social engineering) bygger oftast på att få offret att tro att angriparen är någon man litar på. Röstkloning gör det billigt att härma en av de starkaste intuitiva identitetssignalerna. Det kan öka både trovärdigheten och den känslomässiga pressen i bedrägerier, särskilt när angripare kombinerar syntetiska medier med personuppgifter från öppna källor eller dataläckor."
    future_escalation: "Mer kapabla system kan kombinera röstkloning, genererad video, sökning efter personuppgifter och konversationsagenter. Det kan förvandla mycket personanpassade bedrägerier från arbetskrävande hantverk till delvis automatiserade kampanjer som riktar sig mot många människor samtidigt."
    highlight: {real: ["AI-klonad röst", "fejkad kidnappning"], fake: ["AI-genererad video av hennes hus i brand", "akut reparationsteam"]}
  1379:
    domain: "Domstolar och bevis"
    hook: "ett enda omstritt bevis"
    title: "Påstått AI-förfalskade bevis bidrog till frihetsberövande"
    excerpt: "En sjuksköterska i Florida, Melissa Sims, ska ha suttit frihetsberövad i två dagar för att påstått ha brutit mot ett borgens- eller kontaktförbud."
    game_statement: "En kvinna ska ha frihetsberövats efter att sms som tillskrevs henne lagts fram som bevis; senare påstods det att meddelandena hade förfalskats med AI."
    counterfactual: "En kvinna ska ha förlorat sin umgängesrätt i flera veckor efter att en visningshistorik från sociala medier som tillskrevs henne lagts fram; senare påstods det att uppgifterna hade genererats med AI."
    simple_explanation: "En sjuksköterska i Florida ska ha suttit frihetsberövad i två dagar efter att hennes före detta partner lagt fram sms som tillskrevs henne. Senare påstods det att meddelandena hade genererats eller förfalskats med AI."
    why_bad: "Rättssystem bygger på att bevis kan knytas till verkliga personer och händelser. Generativ AI sänker kostnaden för att skapa trovärdiga digitala artefakter, medan många bevisrutiner fortfarande förlitar sig på skärmdumpar, inspelningar eller meddelanden vars ursprung är svårt att kontrollera. Den djupare risken är epistemisk: institutioner kan både godta falska bevis och lättare avfärda äkta bevis som syntetiska."
    future_escalation: "När falska texter, bilder, ljud och video blir bättre får domstolar, journalister, arbetsgivare och allmänheten allt svårare att skilja sant från påhittat. Det ökar risken för felaktiga beslut: en oskyldig kan straffas på grund av en förfalskning, och ett äkta bevis kan avfärdas som falskt."
    highlight: {real: ["frihetsberövats", "sms som tillskrevs henne"], fake: ["förlorat sin umgängesrätt", "visningshistorik från sociala medier"]}
  1374:
    domain: "Sjukvård"
    hook: "ett enda felaktigt larm"
    title: "Medicinskt AI-larm ledde nästan till olämplig behandling"
    excerpt: "En sjuksköterska vid St. Rose Dominican Hospital ska ha beskrivit en händelse där ett AI-system på sjukhuset påstås ha genererat ett sepsislarm."
    game_statement: "Ett AI-system på ett sjukhus ska ha gett ett sepsislarm för en äldre dialyspatient; standardåtgärden, intravenös vätska, kunde ha orsakat farlig vätskeöverbelastning, men en sjuksköterska upptäckte det och en läkare ändrade behandlingen."
    counterfactual: "Ett AI-system som schemalägger operationssalar på ett sjukhus ska ha lagt en akut operation efter rutiningrepp sedan det läst fel på en anteckning i en patients journal, men en sjuksköterska upptäckte det innan förseningen hann orsaka skada."
    simple_explanation: "Ett AI-system på ett sjukhus ska ha genererat ett sepsislarm för en äldre dialyspatient. Standardåtgärden vid akutlägen omfattade intravenös vätska, men en sjuksköterska insåg att det kunde orsaka farlig vätskeöverbelastning. En läkare ingrep och ändrade behandlingen."
    why_bad: "Verktyg för kliniskt beslutsstöd verkar i arbetsflöden där snabbhet och följsamhet till rutiner ofta är värdefulla. Det kan skapa automationsbias (automation bias): personal kan tolka ett larm som en stark rekommendation även när patientens särskilda förutsättningar gör standardåtgärden olämplig. Ett systematiskt fel i modellen eller processen kan därför drabba många patienter om vårdpersonalen förlorar förmågan, tiden eller befogenheten att ifrågasätta det."
    future_escalation: "När klinisk AI blir mer kapabel och djupare inbyggd i diagnostik, triage och behandlingsrekommendationer kan vårdgivare automatisera allt större delar av vården. Om den mänskliga tillsynen blir formell snarare än verklig kan korrelerade modellfel drabba många patienter innan de upptäcks."
    highlight: {real: ["sepsislarm", "intravenös vätska"], fake: ["schemalägger operationssalar", "lagt en akut operation efter rutiningrepp"]}
  1606:
    domain: "Offentlig service"
    hook: "en enda misslyckad ansiktskontroll"
    title: "Ansiktsverifiering och tillgång till socialt stöd"
    excerpt: "Mottagare av sociala bidrag i Sydafrika ska ha drabbats av upprepade misslyckanden i SASSA:s portal för ansiktsverifiering, eLife."
    game_statement: "Upprepade fel i en portal för ansiktsverifiering ska ha varit ett av skälen till att vissa personer inte fick ut sitt sociala stöd."
    counterfactual: "Ett AI-system som sorterar brev från invånare ska ha skickat hundratals överklaganden om bidrag till fel avdelning, och människor missade tidsfristen för överklagande innan någon märkte det."
    simple_explanation: "Mottagare av sociala bidrag i Sydafrika ska ha drabbats av upprepade misslyckanden i SASSA:s portal för ansiktsverifiering. Rapporter till parlamentet angav senare att misslyckad ansiktsigenkänning var en av orsakerna till utebliven verifiering och bekräftade 67 868 indragna bidrag under ett kvartal, men angav inte hur många som berodde just på misslyckad ansiktsverifiering."
    why_bad: "Automatiserad identitetskontroll blir avgörande när tillgången till grundläggande offentlig service hänger på den. Ett felaktigt avslag är inte bara ett besvär: för en bidragsmottagare kan det innebära att pengar till mat, boende, resor eller vård dröjer. Centraliserad användning skapar också risk för korrelerade fel – ett enda konstruktions- eller driftproblem kan drabba många människor samtidigt. Bördan att rätta felet kan falla oproportionerligt på dem som har minst tid, rörlighet, uppkoppling eller administrativ förmåga att överklaga."
    future_escalation: "Stater och företag kan i allt högre grad använda biometrisk och AI-baserad verifiering för bidrag, bankärenden, försäkringar, anställning och passerkontroll. Om användningen växer snabbare än reservrutiner, granskning och överklagandevägar kan automatiserad utestängning bli vanligare och svårare för de drabbade att bestrida."
    highlight: {real: ["portal för ansiktsverifiering", "inte fick ut sitt sociala stöd"], fake: ["sorterar brev från invånare", "missade tidsfristen för överklagande"]}
