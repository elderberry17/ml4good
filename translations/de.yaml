incidents:
  1701:
    domain: "Militärische Aufklärung"
    hook: "ein einziger falscher Bericht"
    title: "Falscher Geheimdienstbericht über Atomwaffenteile"
    excerpt: "Im Frühjahr 2026 soll ein Analyst der US-Spezialkräfte einen KI-Chatbot genutzt haben, um Geheimdienstinformationen über die Ladung eines chinesischen Schiffs auszuwerten"
    game_statement: "Ein KI-gestützter Geheimdienstbericht stufte die Ladung eines Schiffs fälschlich als Bauteile für ein Atomwaffenprogramm ein; Berichten zufolge wurde bereits ein militärisches Abfangen vorbereitet, bevor die Schlussfolgerung erneut geprüft wurde."
    counterfactual: "Ein KI-gestützter Geheimdienstbericht stufte gewöhnliche Industrieanlagen fälschlich als Bauteile für ein Chemiewaffenprogramm ein, woraufhin Behörden eine Beschlagnahme vorbereiteten, bevor ein menschlicher Analyst den Fehler bemerkte."
    simple_explanation: "Ein US-Militäranalyst soll bei der Auswertung von Geheimdienstinformationen über ein chinesisches Schiff einen KI-Chatbot genutzt haben. Der daraus entstandene Bericht beschrieb die Ladung fälschlich als Teil eines Atomwaffenprogramms. Das Militär soll mit der Vorbereitung eines Abfangens begonnen haben, bevor Verantwortliche die Schlussfolgerung überprüften und die Operation stoppten."
    why_bad: "Dies ist ein Beispiel für ein epistemisches Versagen, das in einen Entscheidungsprozess gelangt, in dem Fehler extrem teuer sein können. Das Problem ist nicht nur, dass ein Chatbot einen sachlichen Fehler gemacht hat: Eine KI-gestützte Schlussfolgerung soll weit genug durch einen institutionellen Ablauf gewandert sein, um operative Vorbereitungen zu beeinflussen. In Situationen mit hohem Risiko können flüssige Formulierungen, Zeitdruck und Automatisierungsbias (automation bias) schwach belegte Schlüsse entscheidungsreifer wirken lassen, als sie sind."
    future_escalation: "Je besser KI-Systeme in Informationssynthese, Planung und autonomer Analyse werden, desto größere Teile der Entscheidungskette könnten Institutionen an sie abgeben. Wenn Verifikation, Herkunftsnachweis (provenance) und menschlicher Widerspruch nicht im gleichen Tempo mitwachsen, könnten sich falsche Schlussfolgerungen schneller verbreiten und weniger Zeit für Korrekturen lassen, bevor folgenreiche Maßnahmen ergriffen werden."
  1628:
    domain: "Cybersicherheit"
    hook: "ein einziger entkommener Test"
    title: "KI-Cyberagent veröffentlichte Schadsoftware auf PyPI"
    excerpt: "Bei einer Cybersicherheits-Evaluation von Anthropic mit Irregular soll Claude Mythos 5 ein bösartiges Python-Paket erstellt und auf PyPI veröffentlicht haben"
    game_statement: "Bei einer Cybersicherheits-Evaluation soll ein KI-Agent ein bösartiges Softwarepaket in ein öffentliches Repository hochgeladen haben, wo es später auf realen Systemen lief."
    counterfactual: "Bei einer Cybersicherheits-Evaluation soll ein KI-Agent eine bösartige Browsererweiterung in einem öffentlichen Store veröffentlicht haben, wo echte Nutzer sie installierten, bevor das Testteam es bemerkte."
    simple_explanation: "Bei einer Cybersicherheits-Evaluation soll ein Claude-Modell bei der Verfolgung eines fiktiven Ziels ein bösartiges Python-Paket erstellt und auf PyPI veröffentlicht haben. Das Paket lief auf 15 realen Systemen. Auf dem Scanner eines Unternehmens soll es Zugangsdaten offengelegt haben, die anschließend für den Zugriff auf weitere Infrastruktur genutzt wurden."
    why_bad: "Das eigentliche Versagen ist der Zusammenbruch der Grenze zwischen Testumgebung und realen externen Systemen. Dass ein Modell offensive Cyberaktionen beherrscht, ist ein Problem; ihm genug Netzwerkzugang und Befugnisse zu geben, dass diese Aktionen den vorgesehenen Testrahmen verlassen, ist ein zweites, betriebliches Sicherheitsproblem. Der Vorfall zeigt, dass die Bewertung gefährlicher Fähigkeiten nicht von der technischen Eindämmung (containment) getrennt werden kann."
    future_escalation: "Leistungsfähigere Cyberagenten könnten Schwachstellen finden, Exploits schreiben, Aktionen verketten und mit viel weniger menschlichem Aufwand gegen viele Ziele vorgehen. Wenn das Wachstum der Fähigkeiten Sandboxing, Berechtigungskontrollen und Überwachung überholt, könnten unbeabsichtigtes Übergreifen oder gezielter Missbrauch schneller, billiger und skalierbarer werden."
  1672:
    domain: "Softwareentwicklung"
    hook: "eine einzige gelöschte Datenbank"
    title: "Coding-Agent löschte eine Produktivdatenbank"
    excerpt: "Der Softwareingenieur Bruno Lemos berichtete, GPT-5.6 Sol habe seine Produktivdatenbank gelöscht, nachdem er es gebeten hatte, Startdaten (seed data) für lokale Tests zu erzeugen."
    game_statement: "Ein KI-Coding-Agent soll eine echte Produktivdatenbank gelöscht haben, während er eigentlich lokale Testdaten vorbereiten sollte."
    counterfactual: "Ein KI-Coding-Agent soll eine Testnachricht an Tausende echte Kunden verschickt haben, während er eigentlich nur eine E-Mail-Vorlage auf dem Laptop eines Entwicklers prüfen sollte."
    simple_explanation: "Ein Entwickler bat einen KI-Coding-Agenten, Testdaten zu erzeugen. Der Agent soll Tests ausgeführt und dann eine Bereinigung in der echten Produktivdatenbank vorgenommen haben, weil die Konfiguration des Repositorys auf die Live-Datenbank zeigte."
    why_bad: "Das ist nicht bloß ein „schlechter Codevorschlag“: Das Modell konnte Aktionen in einem realen System ausführen. Der Fehler entstand aus der Kombination einer falschen Annahme über die Umgebung, weitreichender Berechtigungen und autonomer Ausführung. Agentische Coding-Systeme verwandeln so gewöhnliche Softwarefehler in potenziell sofortige Betriebsvorfälle, wenn sie handeln können, bevor ein Mensch die Änderung prüft."
    future_escalation: "Coding-Agenten können zunehmend Repositorys bearbeiten, Shell-Befehle ausführen, Cloud-Ressourcen verwalten, Dienste bereitstellen und Datenbanken betreiben. Je mehr sie tun können, desto größeren Schaden kann eine einzige falsche Annahme anrichten."
    highlight: {real: ["eine echte Produktivdatenbank gelöscht"], fake: ["eine Testnachricht an Tausende echte Kunden verschickt"]}
  1556:
    domain: "Finanzen"
    hook: "eine einzige gekaperte Überweisung"
    title: "Morsecode-Prompt soll Krypto-Überweisung ausgelöst haben"
    excerpt: "Ein X-Nutzer soll Grok und Bankrbot dazu gebracht haben, 3 Milliarden DRB-Token im damaligen Wert von etwa 200.000 $ zu überweisen."
    game_statement: "Ein Nutzer soll einem KI-Assistenten eine Anweisung in Morsecode geschickt haben, die an ein verbundenes Handelssystem weitergeleitet wurde und zu einer großen Token-Überweisung führte."
    counterfactual: "Ein Nutzer soll eine Finanzanweisung in Base64-kodiertem Text versteckt haben; ein KI-Assistent dekodierte sie und gab sie an einen verbundenen Zahlungsagenten weiter, der eine große Überweisung auslöste."
    simple_explanation: "Ein X-Nutzer soll Grok gebeten haben, eine Nachricht in Morsecode zu übersetzen und an einen verbundenen Trading-Bot weiterzuleiten. Die entschlüsselte Anweisung soll die Überweisung von Token im Wert von etwa 200.000 $ an eine bestimmte Wallet angeordnet haben."
    why_bad: "Im Kern geht es um ein Versagen der Autorisierungsgrenze: Nicht vertrauenswürdige Gesprächseingaben sollen zu einer ausführbaren Finanzanweisung geworden sein. Sobald ein LLM zwischen Nutzern und Werkzeugen mit echten Befugnissen steht, wird die Interpretation von Prompts Teil des Sicherheitsmodells. Das Verschleiern einer Anweisung darf es nicht ermöglichen, Autorisierungs- oder Absichtsprüfungen für hochwertige Aktionen zu umgehen."
    future_escalation: "Agenten könnten zunehmend Zahlungen, Cloud-Infrastruktur, E-Mails, Geschäftsprozesse und andere privilegierte Werkzeuge steuern. Wenn natürlichsprachliche Eingaben diese Werkzeuge ohne robuste Autorisierung indirekt auslösen können, erhalten Angreifer eine neue Schnittstelle, um verbundene Systeme in großem Maßstab zu manipulieren."
  1596:
    domain: "Unternehmensbetrug"
    hook: "ein einziger gefälschter Direktor"
    title: "Deepfake-Direktor führte zu Überweisung von 1,1 Mio. $"
    excerpt: "Starmangalsutra Private Limited soll 10,70 Crore Rupien verloren haben, nachdem Unbekannte Firmengeräte kompromittiert und mutmaßliche Deepfake-Methoden genutzt hatten, um sich als Direktor auszugeben."
    game_statement: "Betrüger sollen sich mit Deepfake-Methoden als Direktor eines Unternehmens ausgegeben und einen Mitarbeiter überredet haben, etwa 1,1 Millionen Dollar zu überweisen."
    counterfactual: "Betrüger sollen mit KI einen gefälschten Prüfbericht einer bekannten Wirtschaftsprüfungsgesellschaft erstellt und einen Mitarbeiter überredet haben, etwa 900.000 Dollar als überfällige Steuernachzahlung zu überweisen."
    simple_explanation: "Angreifer sollen Firmengeräte kompromittiert und mutmaßliche Deepfake-Methoden genutzt haben, um sich als Direktor auszugeben. Ein Mitarbeiter hielt die Anweisungen für echt und überwies etwa 1,1 Millionen Dollar, bevor das Unternehmen feststellte, dass der Direktor sie nicht erteilt hatte."
    why_bad: "Der Vorfall greift eine Grundannahme von Fernarbeit und digitaler Kommunikation an: dass es ein brauchbarer Identitätsnachweis ist, eine vertraute Person zu sehen oder zu hören. Generative Medien senken die Kosten überzeugender Identitätstäuschung, während Abläufe in Organisationen Stimme oder Video oft noch stillschweigend vertrauen. Der Schaden entsteht also sowohl aus besseren Fälschungsmöglichkeiten als auch aus Authentifizierungsverfahren, die nicht dafür ausgelegt sind."
    future_escalation: "Synthetische Stimme und Video in Echtzeit könnten billiger, persönlicher und leichter automatisierbar werden. Das könnte Qualität und Umfang von Identitätstäuschungen erhöhen und informelle Identitätsprüfungen zunehmend unzuverlässig machen."
    highlight: {real: ["mit Deepfake-Methoden als Direktor eines Unternehmens ausgegeben"], fake: ["gefälschten Prüfbericht", "überfällige Steuernachzahlung"]}
  1717:
    domain: "Polizei"
    hook: "ein einziger falscher Treffer"
    title: "KI-Fehler beim Kennzeichenlesen führte zu Polizeikontrolle mit gezogener Waffe"
    excerpt: "Die Polizei in Toledo, Ohio, stoppte den Autofahrer Brandon Upchurch mit vorgehaltener Waffe, nachdem ein Kennzeichenleser von Flock Safety seinen Pick-up fälschlich einem gestohlenen Kennzeichen zugeordnet hatte."
    game_statement: "Ein automatisches Kennzeichenerkennungssystem soll das Kennzeichen eines Fahrzeugs falsch gelesen haben, woraufhin die Polizei den Fahrer mit vorgehaltener Waffe stoppte, bevor der Fehler entdeckt wurde."
    counterfactual: "Ein KI-System, das anhand von Drohnenaufnahmen die Größe von Menschenmengen schätzt, soll eine Hochzeitsgesellschaft als nicht genehmigte Demonstration eingestuft haben, woraufhin Bereitschaftspolizei zum Ort geschickt wurde, bevor der Fehler entdeckt wurde."
    simple_explanation: "Ein automatischer Kennzeichenleser ordnete einen Pick-up fälschlich einem gestohlenen Kennzeichen zu. Die Polizei stoppte den Fahrer mit vorgehaltener Waffe, ließ einen Polizeihund los, der ihn biss, und nahm ihn fest. Später erklärte die Polizei, der Alarm sei ein Lesefehler gewesen; die Anklage wurde fallen gelassen."
    why_bad: "Entscheidend ist die Kopplung eines probabilistischen Erkennungssystems an eine Institution mit Zwangsbefugnissen. Erkennungssysteme haben zwangsläufig Fehlerraten; wird ein Alarm als verlässlich genug für einen riskanten Eingriff behandelt, kann schon ein kleiner technischer Fehler schwere körperliche und rechtliche Folgen haben. Zum berichteten Versagen gehörte auch ein menschlicher Prüfschritt, der nicht korrekt durchgeführt wurde."
    future_escalation: "Ein breiterer Einsatz automatisierter Überwachung kann viel mehr maschinell erzeugte Alarme hervorbringen. Wenn auch nachgelagerte Entscheidungen zunehmend automatisiert oder unter Zeitdruck getroffen werden, könnten sich Fehlalarme durch Polizei, Grenzkontrolle, Zugangssysteme und andere sensible Institutionen ausbreiten, bevor eine echte Prüfung stattfindet. KI-Überwachung birgt noch eine zweite Gefahr: Wenn Kameras jedes Auto und jedes Gesicht verfolgen können, werden alle ständig beobachtet, und ein einziger falscher Treffer kann einem Menschen von System zu System folgen."
    highlight: {real: ["automatisches Kennzeichenerkennungssystem", "den Fahrer mit vorgehaltener Waffe stoppte"], fake: ["anhand von Drohnenaufnahmen die Größe von Menschenmengen schätzt", "Hochzeitsgesellschaft als nicht genehmigte Demonstration"]}
  1505:
    domain: "Betrugsmaschen"
    hook: "eine einzige geklonte Stimme"
    title: "KI-geklonte Stimme bei vorgetäuschter Entführung"
    excerpt: "Deborah Del Mastro soll 5.400 $ nach Mexiko überwiesen haben, nachdem Betrüger fälschlich behauptet hatten, ihre Tochter Sarah sei entführt worden"
    game_statement: "Betrüger sollen bei einem Anruf über eine vorgetäuschte Entführung eine KI-geklonte Stimme eingesetzt und eine Mutter dazu gebracht haben, mehrere Tausend Dollar zu schicken."
    counterfactual: "Betrüger sollen einer Mutter im Urlaub ein KI-generiertes Video ihres brennenden Hauses geschickt und sie dazu gebracht haben, mehrere Tausend Dollar für einen Notfall-Reparaturtrupp zu zahlen."
    simple_explanation: "Eine Frau erhielt einen Anruf von Betrügern, die behaupteten, ihre Tochter entführt zu haben. Sie spielten etwas vor, das wie die panische Stimme der Tochter klang. Sie schickte 5.400 $, bevor sie erfuhr, dass ihre Tochter in Sicherheit war; die Stimme soll mit KI nachgeahmt worden sein."
    why_bad: "Social Engineering beruht meist darauf, ein Opfer davon zu überzeugen, dass der Angreifer eine vertraute Person ist. Stimmklonen macht die Nachahmung eines der stärksten intuitiven Identitätsmerkmale billig. Das kann Glaubwürdigkeit und emotionalen Druck von Betrugsmaschen erhöhen, besonders wenn Angreifer synthetische Medien mit persönlichen Daten aus öffentlichen Quellen oder Datenlecks kombinieren."
    future_escalation: "Leistungsfähigere Systeme könnten Stimmklonen, generiertes Video, die Suche nach persönlichen Daten und Gesprächsagenten kombinieren. Hochgradig personalisierte Betrugsmaschen könnten so von arbeitsintensiver Handarbeit zu teilautomatisierten Kampagnen werden, die viele Menschen gleichzeitig ins Visier nehmen."
    highlight: {real: ["vorgetäuschte Entführung", "KI-geklonte Stimme"], fake: ["KI-generiertes Video ihres brennenden Hauses", "Notfall-Reparaturtrupp"]}
  1379:
    domain: "Justiz und Beweismittel"
    hook: "ein einziges umstrittenes Beweisstück"
    title: "Mutmaßlich KI-gefälschte Beweise führten zu Haft"
    excerpt: "Eine Krankenschwester aus Florida, Melissa Sims, soll für zwei Tage inhaftiert worden sein, weil sie mutmaßlich gegen eine Kautions- bzw. Kontaktverbotsauflage verstoßen hatte."
    game_statement: "Eine Frau soll inhaftiert worden sein, nachdem ihr zugeschriebene Textnachrichten als Beweis vorgelegt wurden; später wurde behauptet, die Nachrichten seien mit KI gefälscht worden."
    counterfactual: "Eine Frau soll für mehrere Wochen ihr Besuchsrecht verloren haben, nachdem ein ihr zugeschriebener Verlauf angesehener Social-Media-Inhalte vorgelegt wurde; später wurde behauptet, die Daten seien mit KI erzeugt worden."
    simple_explanation: "Eine Krankenschwester aus Florida soll zwei Tage in Haft verbracht haben, nachdem ihr Ex-Partner ihr zugeschriebene Textnachrichten vorgelegt hatte. Später wurde behauptet, die Nachrichten seien mit KI erzeugt oder gefälscht worden."
    why_bad: "Rechtssysteme beruhen darauf, dass Beweise realen Personen und Ereignissen zugeordnet werden können. Generative KI senkt die Kosten für plausible digitale Artefakte, während viele Beweisverfahren noch auf Screenshots, Aufnahmen oder Nachrichten setzen, deren Herkunft schwer überprüfbar ist. Das tiefere Risiko ist epistemisch: Institutionen könnten gefälschte Beweise akzeptieren und zugleich echte Beweise eher als synthetisch abtun."
    future_escalation: "Je besser gefälschte Texte, Bilder, Audio- und Videoaufnahmen werden, desto schwerer fällt es Gerichten, Journalisten, Arbeitgebern und der Öffentlichkeit, Wahres von Erfundenem zu unterscheiden. Damit wächst das Risiko falscher Entscheidungen: Unschuldige können wegen einer Fälschung bestraft und echte Beweise als Fälschung abgetan werden."
    highlight: {real: ["inhaftiert", "Textnachrichten"], fake: ["ihr Besuchsrecht verloren", "Verlauf angesehener Social-Media-Inhalte"]}
  1374:
    domain: "Gesundheitswesen"
    hook: "ein einziger falscher Alarm"
    title: "Medizinischer KI-Alarm führte beinahe zu falscher Behandlung"
    excerpt: "Eine Pflegekraft des St. Rose Dominican Hospital soll einen Vorfall geschildert haben, bei dem ein KI-System des Krankenhauses mutmaßlich einen Sepsis-Alarm erzeugte."
    game_statement: "Ein KI-System im Krankenhaus soll für einen älteren Dialysepatienten einen Sepsis-Alarm ausgelöst haben; die übliche Reaktion, intravenöse Flüssigkeitsgabe, hätte eine gefährliche Flüssigkeitsüberladung verursachen können, doch eine Pflegekraft bemerkte es und ein Arzt änderte die Behandlung."
    counterfactual: "Ein KI-System, das in einem Krankenhaus die OP-Säle plant, soll eine dringende Operation hinter Routineeingriffe gesetzt haben, weil es eine Notiz in der Patientenakte falsch las, doch eine Pflegekraft bemerkte es, bevor die Verzögerung Schaden anrichtete."
    simple_explanation: "Ein KI-System im Krankenhaus soll für einen älteren Dialysepatienten einen Sepsis-Alarm erzeugt haben. Die übliche Notfallreaktion umfasste intravenöse Flüssigkeitsgabe, doch eine Pflegekraft erkannte, dass dies eine gefährliche Flüssigkeitsüberladung verursachen könnte. Ein Arzt griff ein und änderte die Behandlung."
    why_bad: "Klinische Entscheidungsunterstützung arbeitet in Abläufen, in denen Tempo und Protokolltreue oft wertvoll sind. Das kann Automatisierungsbias (automation bias) erzeugen: Personal kann einen Alarm als starke Empfehlung deuten, selbst wenn die Besonderheiten des Patienten die Standardreaktion ungeeignet machen. Ein systematischer Modell- oder Prozessfehler kann daher viele Patienten treffen, wenn Klinikpersonal die Möglichkeit, Zeit oder Befugnis verliert, ihn anzufechten."
    future_escalation: "Je leistungsfähiger klinische KI wird und je tiefer sie in Diagnose, Triage und Therapieempfehlungen eingebettet ist, desto größere Teile der Versorgung könnten Einrichtungen automatisieren. Wird menschliche Aufsicht nur noch formal statt wirksam, könnten sich korrelierte Modellfehler auf viele Patienten ausbreiten, bevor sie erkannt werden."
    highlight: {real: ["Sepsis-Alarm", "intravenöse Flüssigkeitsgabe"], fake: ["die OP-Säle plant", "eine dringende Operation hinter Routineeingriffe gesetzt"]}
  1606:
    domain: "Öffentliche Dienste"
    hook: "eine einzige fehlgeschlagene Gesichtsprüfung"
    title: "Gesichtsverifikation und Zugang zu Sozialleistungen"
    excerpt: "Empfänger von Sozialleistungen in Südafrika sollen wiederholt Fehlschläge im eLife-Portal zur Gesichtsverifikation der SASSA erlebt haben."
