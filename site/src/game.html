<title>Incident or Fiction?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the city map on the left (sticky on wide screens), the round on the right.
   Each round zooms into one building; the record and a dark "what if" band unfold below the reports. */
:root {
  --bg: #ECEFEC;
  --surface: #F8FAF8;
  --ink: #141D1B;
  --muted: #586561;
  --line: #D2D9D5;
  --accent: #2E46C8;
  --accent-ink: #FFFFFF;
  --real: #1C7556;
  --real-soft: #DCEFE6;
  --fake: #B24F27;
  --fake-soft: #F6E3D9;
  --night: #0C1120;
  --night-2: #151C33;
  --night-ink: #E4E8F4;
  --night-muted: #9AA3C0;
  --ember: #FF8A5B;
  --shadow: 0 1px 2px rgb(20 29 27 / .06), 0 8px 24px -12px rgb(20 29 27 / .18);

  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-ui-base: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ui: var(--f-ui-base);
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1312; --surface: #161D1B; --ink: #E5EBE8; --muted: #93A09B; --line: #29322F;
    --accent: #93A4FF; --accent-ink: #0E1312;
    --real: #5CC7A0; --real-soft: #15302A; --fake: #F08C62; --fake-soft: #3A2118;
    --night: #070A14; --night-2: #10162A; --night-ink: #E4E8F4; --night-muted: #9AA3C0;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px -12px rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1312; --surface: #161D1B; --ink: #E5EBE8; --muted: #93A09B; --line: #29322F;
  --accent: #93A4FF; --accent-ink: #0E1312;
  --real: #5CC7A0; --real-soft: #15302A; --fake: #F08C62; --fake-soft: #3A2118;
  --night: #070A14; --night-2: #10162A; --night-ink: #E4E8F4; --night-muted: #9AA3C0;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px -12px rgb(0 0 0 / .6);
  color-scheme: dark;
}

/* Per-script faces. Newsreader has no Cyrillic, Hangul, Han or Devanagari.
   Extra faces are loaded on demand by ensureFonts(). */
:root:is([lang="ru"], [lang="uk"], [lang="sr"]) { --f-display: "Literata", "PT Serif", Georgia, serif; }
:root[lang="vi"] { --f-ui: "Be Vietnam Pro", var(--f-ui-base); }
:root[lang="ko"] { --f-display: "Noto Serif KR", serif; --f-ui: "Noto Sans KR", var(--f-ui-base); }
:root[lang="zh"] { --f-display: "Noto Serif SC", serif; --f-ui: "Noto Sans SC", var(--f-ui-base); }
:root[lang="hi"] { --f-display: "Noto Serif Devanagari", serif; --f-ui: "Noto Sans Devanagari", var(--f-ui-base); }
:root[lang="ta"] { --f-display: "Noto Serif Tamil", serif; --f-ui: "Noto Sans Tamil", var(--f-ui-base); }
/* Italic and uppercase mean nothing in these scripts */
:root:is([lang="ko"], [lang="zh"], [lang="hi"], [lang="ta"]) .round-head h1 em { font-style: normal; }

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.6 var(--f-ui);
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 20px 72px;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.mono { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .04em; }
.eyebrow {
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
}

/* Header */
header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  flex-wrap: wrap; padding-block: 8px 28px;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font: 600 1.15rem/1 var(--f-display); letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: .8rem; }
.track { display: flex; gap: 6px; align-items: center; }
.track i {
  width: 22px; height: 6px; border-radius: 3px; background: var(--line);
  transition: background .3s;
}
.track i.now { background: var(--ink); }
.track i.ok { background: var(--real); }
.track i.no { background: var(--fake); }
.score { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 8px; }
.top-right { display: flex; align-items: center; gap: 14px; min-width: 0; }
@media (max-width: 560px) {
  .brand span { display: none; }
  .track { gap: 3px; } .track i { width: 10px; }
}

/* Language switcher: globe button + popover */
.settings { position: relative; }
.globe {
  height: 36px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  padding: 0 12px 0 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em;
  transition: color .2s, border-color .2s;
}
.globe:hover, .globe[aria-expanded="true"] { color: var(--ink); border-color: var(--ink); }
.globe svg { width: 17px; height: 17px; flex: none; }
.flag {
  width: 20px; height: 14px; flex: none; display: block; border-radius: 3px; overflow: hidden;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent);
}
.menu {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 10;
  width: min(360px, calc(100vw - 32px)); max-height: min(72vh, 560px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  padding: 8px;
}
.menu .eyebrow { padding: 6px 10px 6px; }
.lang-group { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.lang-group + .lang-group { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
.menu label {
  position: relative; display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: 0;
  padding: 8px 10px; border-radius: 8px; font: 500 .9rem/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.menu label:hover { background: color-mix(in srgb, var(--bg) 70%, var(--surface)); }
.menu label:has(input:checked) { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.menu label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.menu label .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu label .code { font-family: var(--f-mono); font-size: .66rem; color: var(--muted); }
.menu input { position: absolute; opacity: 0; pointer-events: none; }
@media (max-width: 380px) { .lang-group { grid-template-columns: 1fr; } }

/* Round head */
.round-head { display: grid; gap: 8px; margin-bottom: 24px; }
.round-head h1 {
  font: 500 clamp(1.6rem, 3.2vw, 2.2rem)/1.14 var(--f-display);
  letter-spacing: -.02em; margin: 0; text-wrap: balance;
}
.round-head h1 em { font-style: italic; color: var(--accent); }

/* The face-off */
.pair { display: grid; grid-template-columns: 1fr; gap: 14px; position: relative; }
.card {
  position: relative; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 18px; min-width: 0;
  padding: 24px 24px 20px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow);
  transition: transform .2s ease, border-color .2s, box-shadow .2s, opacity .3s;
}
.card:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--accent); }
.card:disabled { cursor: default; }
.card .label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .letter {
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.card .key {
  font-family: var(--f-mono); font-size: .7rem; color: var(--muted);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px;
}
.card p.stmt {
  margin: 0; font: 400 clamp(1.15rem, 2.2vw, 1.32rem)/1.45 var(--f-display); text-wrap: pretty;
}
.card p.stmt strong { font-weight: 600; background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 3px; padding: 0 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.revealed .card p.stmt strong { background: none; }
.card .cta {
  margin-top: auto; font-weight: 600; font-size: .88rem; color: var(--accent);
  display: inline-flex; gap: 6px; align-items: center;
}
.card .stamp {
  margin-top: auto; display: none; align-items: center; gap: 8px; flex-wrap: wrap;
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
  padding: 6px 10px; border-radius: 6px; width: fit-content;
}
.revealed .card .cta { display: none; }
.revealed .card .stamp { display: inline-flex; }
.revealed .card.is-real { border-color: var(--real); }
.revealed .card.is-real .stamp { background: var(--real-soft); color: var(--real); }
.revealed .card.is-fake { opacity: .78; }
.revealed .card.is-fake .stamp { background: var(--fake-soft); color: var(--fake); }
.revealed .card.is-fake p.stmt { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--fake) 55%, transparent); text-decoration-thickness: 1px; }
.card .picked {
  position: absolute; top: -11px; right: 18px; display: none;
  font-family: var(--f-mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase;
  background: var(--ink); color: var(--bg); padding: 3px 8px; border-radius: 4px;
}
.revealed .card.chosen .picked { display: block; }

/* Verdict + record */
.reveal { display: grid; gap: 20px; margin-top: 28px; animation: rise .5s ease both; }
@keyframes rise { from { transform: translateY(10px); opacity: .001; } to { transform: none; opacity: 1; } }
.verdict { display: flex; gap: 14px; align-items: center; }
.verdict .dot {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; color: var(--accent-ink);
}
.verdict.ok .dot { background: var(--real); }
.verdict.no .dot { background: var(--fake); }
.verdict h2 { margin: 0; font: 500 1.4rem/1.2 var(--f-display); }
.verdict p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }

.record {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 28px; display: grid; gap: 18px;
}
@media (max-width: 520px) { .record { padding: 20px; } }
.record-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.record h3 { margin: 0; font: 600 1.35rem/1.25 var(--f-display); text-wrap: balance; }
.record .body { margin: 0; max-width: 66ch; font-size: 1.02rem; }
blockquote.src {
  margin: 0; padding: 14px 18px; border-left: 3px solid var(--line);
  background: color-mix(in srgb, var(--bg) 60%, var(--surface));
  border-radius: 0 8px 8px 0; display: grid; gap: 6px;
}
blockquote.src p { margin: 0; font: italic 400 1.05rem/1.5 var(--f-display); }
blockquote.src cite { font-style: normal; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: .92rem;
  text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  transition: background .2s, border-color .2s, transform .15s;
}
.btn:hover { border-color: var(--ink); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost-night { background: transparent; color: var(--night-ink); border-color: rgb(255 255 255 / .25); }
.btn.ghost-night:hover { border-color: var(--night-ink); }
.btn.solid-night { background: var(--night-ink); color: var(--night); border-color: var(--night-ink); }

details.why { border-top: 1px solid var(--line); padding-top: 14px; }
details.why summary { cursor: pointer; font-weight: 600; font-size: .92rem; list-style: none; display: flex; gap: 8px; align-items: center; }
details.why summary::-webkit-details-marker { display: none; }
details.why summary::before { content: "+"; font-family: var(--f-mono); color: var(--muted); width: 1ch; }
details.why[open] summary::before { content: "–"; }
details.why p { margin: 10px 0 0; max-width: 66ch; color: var(--muted); }

/* The "what if" band: the one dramatic moment */
.whatif-cta {
  display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 22px 24px; border-radius: var(--r);
  background: var(--night); color: var(--night-ink);
}
.whatif-cta p { margin: 0; font: 500 1.2rem/1.3 var(--f-display); }
.whatif-cta p span { display: block; font: 400 .85rem/1.4 var(--f-ui); color: var(--night-muted); margin-top: 4px; }

.whatif {
  position: relative; overflow: hidden; border-radius: var(--r);
  background: linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
  color: var(--night-ink);
  animation: rise .6s ease both;
}
.whatif canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.whatif .inner {
  position: relative; padding: clamp(28px, 5vw, 56px); display: grid; gap: 22px;
}
.whatif .eyebrow { color: var(--night-muted); }
.whatif h3 {
  margin: 0; font: 500 clamp(1.6rem, 3.6vw, 2.3rem)/1.15 var(--f-display); letter-spacing: -.015em;
  max-width: 22ch; text-wrap: balance;
}
.whatif .steps { display: grid; gap: 14px; max-width: 62ch; margin: 0; padding: 0; list-style: none; }
.whatif .steps li {
  display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start;
  font: 400 1.12rem/1.55 var(--f-display); color: var(--night-ink);
  animation: rise .7s ease both;
}
.whatif .steps li::before {
  content: ""; width: 9px; height: 9px; margin-top: .6em; border-radius: 50%;
  background: var(--night-muted); box-shadow: 0 0 0 4px color-mix(in srgb, var(--night-muted) 22%, transparent);
}
.whatif .note { font-size: .8rem; color: var(--night-muted); max-width: 62ch; margin: 0; }

/* End screen */
.end { display: grid; gap: 28px; }
.end .big { font: 500 clamp(3.5rem, 12vw, 6rem)/1 var(--f-display); letter-spacing: -.03em; margin: 0; font-variant-numeric: tabular-nums; }
.end .big small { font-size: .35em; color: var(--muted); letter-spacing: 0; }
.end h1 { margin: 0; font: 500 clamp(1.6rem, 4vw, 2.3rem)/1.15 var(--f-display); text-wrap: balance; max-width: 26ch; }
.end p.lead { margin: 0; max-width: 60ch; color: var(--muted); }
.ledger { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ledger li {
  display: grid; grid-template-columns: 18px 1fr auto; gap: 14px; align-items: baseline;
  padding: 14px 2px; border-bottom: 1px solid var(--line);
}
.ledger .m { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.ledger .m.ok { background: var(--real); }
.ledger .m.no { background: var(--fake); }
.ledger .t { min-width: 0; }
.ledger .t b { font-weight: 600; display: block; }
.ledger .t span { color: var(--muted); font-size: .85rem; }
.ledger a { font-family: var(--f-mono); font-size: .75rem; white-space: nowrap; }

footer.foot { margin-top: 48px; color: var(--muted); font-size: .8rem; max-width: 70ch; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- City map ---------- */
/* Map palette: daytime in light theme, night in dark theme (windows glow). */
:root {
  --m-sky: #DCEBEF; --m-sky-2: #EAF3F2;
  --m-water: #A6D3E0; --m-wave: rgb(255 255 255 / .6);
  --m-grass: #C9E2B1; --m-block: #BCD9A1; --m-side1: #9DBF86; --m-side2: #86AC70; --m-soil: #B39572;
  --m-road: #E4E0D5; --m-road-line: #FFFFFF;
  --m-tree: #79B162; --m-tree-2: #5F9A4F; --m-trunk: #8B6B4E;
  --m-win: #D3E9F4; --m-win-lit: #FFD27A; --m-win-off: #4A4F55;
  --m-bldg-filter: none; --m-smoke: #6E7378;
  --warn: #D08A12;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --m-sky: #0F1820; --m-sky-2: #15222C;
    --m-water: #1B3243; --m-wave: rgb(255 255 255 / .14);
    --m-grass: #2E4936; --m-block: #2A4331; --m-side1: #213628; --m-side2: #1B2E22; --m-soil: #3A2F25;
    --m-road: #394146; --m-road-line: #6A7379;
    --m-tree: #3F6E46; --m-tree-2: #325A39; --m-trunk: #5A4636;
    --m-win: #3B4F62; --m-win-lit: #FFC861; --m-win-off: #1E2226;
    --m-bldg-filter: brightness(.74) saturate(.85); --m-smoke: #A3A9AE; --warn: #F2B84B;
  }
}
:root[data-theme="dark"] {
  --m-sky: #0F1820; --m-sky-2: #15222C;
  --m-water: #1B3243; --m-wave: rgb(255 255 255 / .14);
  --m-grass: #2E4936; --m-block: #2A4331; --m-side1: #213628; --m-side2: #1B2E22; --m-soil: #3A2F25;
  --m-road: #394146; --m-road-line: #6A7379;
  --m-tree: #3F6E46; --m-tree-2: #325A39; --m-trunk: #5A4636;
  --m-win: #3B4F62; --m-win-lit: #FFC861; --m-win-off: #1E2226;
  --m-bldg-filter: brightness(.74) saturate(.85); --m-smoke: #A3A9AE; --warn: #F2B84B;
}

.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 960px) {
  .stage { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 36px; align-items: start; }
  .map-pane { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  .map { height: min(80vh, 660px) !important; }
}
.map {
  position: relative; height: clamp(250px, 64vw, 400px); border-radius: 20px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 35%, var(--m-sky-2), var(--m-sky));
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
#city { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.map-caption {
  position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 24px);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 7px 14px; border-radius: 999px; font-size: .84rem; font-weight: 600;
  background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(6px);
  border: 1px solid var(--line); transition: opacity .3s;
}
.map-caption:empty { opacity: 0; }
.map-tip {
  position: absolute; z-index: 2; transform: translate(-50%, calc(-100% - 8px)); pointer-events: none; white-space: nowrap;
  padding: 5px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: .8rem; font-weight: 600;
  opacity: 0; transition: opacity .15s;
}
.map-tip.on { opacity: 1; }
.map-tip small { font-weight: 500; opacity: .75; margin-left: 6px; }
.bldg { cursor: help; }
.map-caption .st { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.map-caption .st.safe { background: var(--real-soft); color: var(--real); }
.map-caption .st.hit { background: var(--fake-soft); color: var(--fake); }
.map-caption .st.wait { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--ink); }

.m-water { fill: var(--m-water); }
.m-wave { stroke: var(--m-wave); stroke-width: 2; stroke-linecap: round; fill: none; stroke-dasharray: 10 14; animation: wave 6s linear infinite; }
@keyframes wave { to { stroke-dashoffset: -48; } }
.m-grass { fill: var(--m-grass); } .m-block { fill: var(--m-block); }
.m-side1 { fill: var(--m-side1); } .m-side2 { fill: var(--m-side2); } .m-soil { fill: var(--m-soil); }
.m-road { fill: var(--m-road); }
.m-road-line { stroke: var(--m-road-line); stroke-width: 1.4; stroke-dasharray: 7 7; fill: none; }
.m-tree { fill: var(--m-tree); } .m-tree-2 { fill: var(--m-tree-2); } .m-trunk { fill: var(--m-trunk); }

.bldgs { filter: var(--m-bldg-filter); }
.win { fill: var(--m-win); transition: fill .9s ease; }
.bldg .body { transition: filter 1s ease; }
.bldg.hit .body { filter: grayscale(.8) brightness(.8); }
.bldg.hit .win { fill: var(--m-win-off); }
.bldg.safe .win { fill: var(--m-win-lit); }
.fx { opacity: 0; transition: opacity .8s ease; }
.hit > .fx-hit, .safe > .fx-safe, .current > .fx-cur, .waiting > .fx-wait { opacity: 1; }
.fx-wait .dot { fill: var(--warn); } .fx-wait .halo { fill: none; stroke: var(--warn); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: halo 2.2s ease-out infinite; }
.map.pick .bldg { cursor: pointer; }
.map.pick .bldg:not(.hit):hover .body { filter: brightness(1.08); }
.fx-hit .glow { fill: var(--fake); opacity: .32; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.18); opacity: .16; } }
.fx-safe .ring { fill: none; stroke: var(--real); stroke-width: 2; stroke-dasharray: 6 5; }
.smoke circle { fill: var(--m-smoke); opacity: 0; transform-box: fill-box; transform-origin: center; animation: smoke 3.3s ease-out infinite; }
.smoke circle:nth-child(2) { animation-delay: 1.1s; } .smoke circle:nth-child(3) { animation-delay: 2.2s; }
@keyframes smoke { 0% { transform: translate(0, 0) scale(.5); opacity: 0; } 15% { opacity: .75; } 100% { transform: translate(-12px, -58px) scale(1.9); opacity: 0; } }
.badge text { font: 700 13px/1 var(--f-ui-base); fill: #fff; text-anchor: middle; dominant-baseline: central; }
.fx-cur .dot { fill: var(--accent); } .fx-cur .halo { fill: none; stroke: var(--accent); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: halo 1.8s ease-out infinite; }
@keyframes halo { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.8); opacity: 0; } }
.fx-safe .dot { fill: var(--real); } .fx-hit .dot { fill: var(--fake); }
.badge path { stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.blink { animation: blink 1.6s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: .15; } }

/* Big-map mode: the city takes the whole width while you choose a building */
.stage[data-mode="map"] { grid-template-columns: minmax(0, 1fr) !important; gap: 14px; }
.stage[data-mode="map"] .map-pane { position: static; }
.stage[data-mode="map"] .map { height: clamp(380px, 74vh, 780px) !important; }
.map { touch-action: pan-y; }
.map.zoomed { touch-action: none; cursor: grab; }
.map.dragging, .map.dragging .bldg { cursor: grabbing !important; }
.map-hud {
  position: absolute; left: 14px; top: 14px; z-index: 1; max-width: min(300px, calc(100% - 90px));
  padding: 12px 14px; border-radius: 14px; display: grid; gap: 6px; pointer-events: none;

}

@media (max-width: 640px) { .map-hud p { display: none; } .map-hud { padding: 10px 12px; } }
.map-ctl { position: absolute; right: 12px; top: 12px; z-index: 2; display: grid; gap: 6px; }
.map-ctl button {
  width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font: 600 1.15rem/1 var(--f-ui-base); color: var(--ink);
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(6px); border: 1px solid var(--line);

}

.bl-chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }

  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .88rem; transition: border-color .2s;
}

.bl-chips .m.wait { background: var(--warn); } .bl-chips .m.ok { background: var(--real); } .bl-chips .m.no { background: var(--fake); }

/* City overview: pick a building */
.cityview { display: grid; gap: 16px; }
.cityview h1 { margin: 0; font: 500 clamp(1.6rem, 3.2vw, 2.2rem)/1.14 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }

}

/* Landing */

/* Resilience meter */

<script>
const INCIDENTS = /*__INCIDENTS__*/[];

// Interface strings and the language list come from translations/<lang>.yaml (see build.py).
const I18N = /*__I18N__*/{};
const LANG_CODES = I18N.langs.map(l => l.code);

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sentences = t => t.match(/[^.!?。！？।]+(?:[.!?]+(?=\s|$)|[。！？।]+)\s*/g)?.map(s => s.trim()) ?? [t];
const fmt = (str, vars) => str.replace(/\{(\w+)\}/g, (m, k) => k in vars ? vars[k] : m);
const withAiid = str => fmt(esc(str), { aiid: `<a href="https://incidentdatabase.ai" target="_blank" rel="noopener">AI Incident Database</a>` });
const strong = str => esc(str).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const plain = str => String(str).replace(/\*\*/g, "");
const emph = str => esc(str).replace(/\*([^*]+)\*/g, "<em>$1</em>");
const smooth = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";

// Language: saved choice, else the browser's, else English.
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let lang = (() => {
  const saved = store.get("lang");
  if (saved && LANG_CODES.includes(saved)) return saved;
  for (const pref of navigator.languages || [navigator.language || "en"]) {
    const code = pref.slice(0, 2).toLowerCase();
    if (LANG_CODES.includes(code)) return code;
  }
  return "en";
})();
const t = () => I18N.ui[lang];
const tx = inc => inc.text[lang] || inc.text.en; // incident text in the current language

function renderChrome() {
  const u = t();
  document.documentElement.lang = lang;
  ensureFonts(lang);
  document.title = u.brand;
  $("#brand-name").textContent = u.brand;
  $("#foot").innerHTML = withAiid(u.foot);
  $("#globe").setAttribute("aria-label", u.language);
  $("#globe-code").textContent = lang.toUpperCase();
  $("#menu-lang-label").textContent = u.language;
  track.setAttribute("aria-label", u.progress);
  const item = l => `
    <label for="lang-${l.code}" lang="${l.code}">
      <input type="radio" name="lang" id="lang-${l.code}" value="${l.code}" ${l.code === lang ? "checked" : ""}>
      ${flagSVG(l.flag)}<span class="name">${esc(l.name)}</span><span class="code">${l.code.toUpperCase()}</span>
    </label>`;
  $("#lang-options").innerHTML = ["main", "more"].map(g =>
    `<div class="lang-group">${I18N.langs.filter(l => l.group === g).map(item).join("")}</div>`).join("");
}

// Faces for scripts the base fonts don't cover, fetched only when that language is picked.
const EXTRA_FONTS = {
  vi: "Be+Vietnam+Pro:wght@400;500;600;700",
  ko: "Noto+Serif+KR:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700",
  zh: "Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700",
  hi: "Noto+Serif+Devanagari:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700",
  ta: "Noto+Serif+Tamil:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600;700",
};
function ensureFonts(code) {
  if (!EXTRA_FONTS[code] || document.getElementById("font-" + code)) return;
  const link = document.createElement("link");
  link.id = "font-" + code;
  link.rel = "stylesheet";
  link.href = `https://fonts.googleapis.com/css2?family=${EXTRA_FONTS[code]}&display=swap`;
  document.head.appendChild(link);
}

// Small flags drawn inline: emoji flags don't render on Windows.
function star(cx, cy, r, rot = 0) {
  let d = "";
  for (let i = 0; i < 10; i++) {
    const a = (rot - 90 + i * 36) * Math.PI / 180, rr = i % 2 ? r * .382 : r;
    d += (i ? "L" : "M") + (cx + rr * Math.cos(a)).toFixed(2) + "," + (cy + rr * Math.sin(a)).toFixed(2);
  }
  return `<path d="${d}Z"/>`;
}
const hstripes = (...c) => c.map((col, i) => `<rect y="${i * 20 / c.length}" width="30" height="${20 / c.length}" fill="${col}"/>`).join("");
const vstripes = (...c) => c.map((col, i) => `<rect x="${i * 10}" width="10" height="20" fill="${col}"/>`).join("");
const FLAGS = {
  gb: `<rect width="30" height="20" fill="#012169"/><path d="M0,0L30,20M30,0L0,20" stroke="#fff" stroke-width="4"/><path d="M0,0L30,20M30,0L0,20" stroke="#C8102E" stroke-width="1.6"/><path d="M15,0V20M0,10H30" stroke="#fff" stroke-width="6"/><path d="M15,0V20M0,10H30" stroke="#C8102E" stroke-width="3.4"/>`,
  fr: vstripes("#0055A4", "#fff", "#EF4135"),
  de: hstripes("#000", "#DD0000", "#FFCE00"),
  ru: hstripes("#fff", "#0039A6", "#D52B1E"),
  it: vstripes("#009246", "#fff", "#CE2B37"),
  es: `<rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/>`,
  kr: `<rect width="30" height="20" fill="#fff"/><g transform="rotate(33.7 15 10)"><path d="M10,10a5,5 0 0 1 10,0z" fill="#CD2E3A"/><path d="M10,10a5,5 0 0 0 10,0z" fill="#0047A0"/><circle cx="12.5" cy="10" r="2.5" fill="#CD2E3A"/><circle cx="17.5" cy="10" r="2.5" fill="#0047A0"/></g><g fill="#000"><rect x="3.4" y="3.2" width="5" height="1" transform="rotate(-56.3 5.9 3.7)"/><rect x="21.6" y="15.8" width="5" height="1" transform="rotate(-56.3 24.1 16.3)"/><rect x="21.6" y="3.2" width="5" height="1" transform="rotate(56.3 24.1 3.7)"/><rect x="3.4" y="15.8" width="5" height="1" transform="rotate(56.3 5.9 16.3)"/></g>`,
  cn: `<rect width="30" height="20" fill="#EE1C25"/><g fill="#FFFF00">${star(5, 5, 3)}${star(10, 2, 1)}${star(12, 4, 1)}${star(12, 7, 1)}${star(10, 9, 1)}</g>`,
  rs: hstripes("#C6363C", "#0C4076", "#fff"),
  ba: `<rect width="30" height="20" fill="#002395"/><path d="M8,0H22V20Z" fill="#FECB00"/><g fill="#fff">${[0,1,2,3,4,5,6].map(i => star(6.6 + i * 2.2, 1.2 + i * 3.1, .9)).join("")}</g>`,
  ro: vstripes("#002B7F", "#FCD116", "#CE1126"),
  vn: `<rect width="30" height="20" fill="#DA251D"/><g fill="#FFFF00">${star(15, 10.4, 6)}</g>`,
  ua: hstripes("#0057B7", "#FFD700"),
  in: `${hstripes("#FF9933", "#fff", "#138808")}<circle cx="15" cy="10" r="2.4" fill="none" stroke="#000080" stroke-width=".8"/>`,
  se: `<rect width="30" height="20" fill="#006AA7"/><rect x="9" width="4" height="20" fill="#FECC02"/><rect y="8" width="30" height="4" fill="#FECC02"/>`,
  pl: hstripes("#fff", "#DC143C"),
  tr: `<rect width="30" height="20" fill="#E30A17"/><circle cx="11" cy="10" r="5" fill="#fff"/><circle cx="12.3" cy="10" r="4" fill="#E30A17"/><g fill="#fff">${star(17, 10, 2.2, -18)}</g>`,
};
const flagSVG = code => `<svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none" aria-hidden="true">${FLAGS[code] || ""}</svg>`;

// ---------- City map ----------
// Isometric SVG drawn from code. x grows to the lower right, y to the lower left, z is height in px.
const City = (() => {
  const TW = 64, TH = 32;
  const pt = (x, y, z = 0) => [(x - y) * TW / 2, (x + y) * TH / 2 - z];
  const f = n => n.toFixed(1);
  const poly = (pts, a = "") => `<polygon points="${pts.map(p => f(p[0]) + "," + f(p[1])).join(" ")}" ${a}/>`;
  const line = (p, q, a) => `<line x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}" ${a}/>`;
  const shade = (hex, k) => {
    const n = parseInt(hex.slice(1), 16), c = v => Math.round(Math.min(255, v * k)).toString(16).padStart(2, "0");
    return "#" + c(n >> 16 & 255) + c(n >> 8 & 255) + c(n & 255);
  };
  // A box: front-left face (y+d), front-right face (x+w), roof.
  const box = (x, y, z, w, d, h, c) =>
    poly([pt(x, y + d, z), pt(x + w, y + d, z), pt(x + w, y + d, z + h), pt(x, y + d, z + h)], `fill="${shade(c, .88)}"`) +
    poly([pt(x + w, y, z), pt(x + w, y + d, z), pt(x + w, y + d, z + h), pt(x + w, y, z + h)], `fill="${shade(c, .74)}"`) +
    poly([pt(x, y, z + h), pt(x + w, y, z + h), pt(x + w, y + d, z + h), pt(x, y + d, z + h)], `fill="${c}"`);
  // Window grid on both visible faces.
  function wins(x, y, z, w, d, h, cl, cr, rows, ww = .5, wh = .45) {
    let s = "";
    for (let j = 0; j < rows; j++) {
      const za = z + h * (j + (1 - wh) / 2) / rows, zb = za + h * wh / rows;
      for (let i = 0; i < cl; i++) {
        const a = x + w * (i + (1 - ww) / 2) / cl, b = a + w * ww / cl;
        s += poly([pt(a, y + d, za), pt(b, y + d, za), pt(b, y + d, zb), pt(a, y + d, zb)], 'class="win"');
      }
      for (let i = 0; i < cr; i++) {
        const a = y + d * (i + (1 - ww) / 2) / cr, b = a + d * ww / cr;
        s += poly([pt(x + w, a, za), pt(x + w, b, za), pt(x + w, b, zb), pt(x + w, a, zb)], 'class="win"');
      }
    }
    return s;
  }
  // Pitched roof with the ridge along x.
  function gable(x, y, z, w, d, rh, c) {
    const m = y + d / 2;
    return poly([pt(x, y, z), pt(x + w, y, z), pt(x + w, m, z + rh), pt(x, m, z + rh)], `fill="${shade(c, 1.05)}"`) +
      poly([pt(x, y + d, z), pt(x + w, y + d, z), pt(x + w, m, z + rh), pt(x, m, z + rh)], `fill="${shade(c, .86)}"`) +
      poly([pt(x + w, y, z), pt(x + w, y + d, z), pt(x + w, m, z + rh)], `fill="${shade(c, .7)}"`);
  }
  function dome(cx, cy, z, r, c) {
    const [X, Y] = pt(cx, cy, z);
    return `<ellipse cx="${f(X)}" cy="${f(Y)}" rx="${r}" ry="${r / 2}" fill="${shade(c, .8)}"/>` +
      `<path d="M${f(X - r)},${f(Y)} A${r},${r * .9} 0 0 1 ${f(X + r)},${f(Y)} Z" fill="${c}"/>` +
      `<path d="M${f(X - r * .6)},${f(Y - r * .2)} A${r * .6},${r * .6} 0 0 1 ${f(X - r * .1)},${f(Y - r * .75)}" stroke="#fff" stroke-opacity=".55" stroke-width="2" fill="none"/>`;
  }
  function tree(x, y, s = 1) {
    const [X, Y] = pt(x, y);
    return `<ellipse cx="${f(X)}" cy="${f(Y)}" rx="${7 * s}" ry="${3.5 * s}" fill="#000" opacity=".12"/>` +
      `<rect x="${f(X - 1.5 * s)}" y="${f(Y - 9 * s)}" width="${3 * s}" height="${9 * s}" class="m-trunk"/>` +
      `<circle cx="${f(X)}" cy="${f(Y - 15 * s)}" r="${8 * s}" class="m-tree"/>` +
      `<circle cx="${f(X + 3 * s)}" cy="${f(Y - 12 * s)}" r="${4.5 * s}" class="m-tree-2"/>`;
  }
  const quadTop = (x0, y0, x1, y1, z, a) => poly([pt(x0, y0, z), pt(x1, y0, z), pt(x1, y1, z), pt(x0, y1, z)], a);

  // Each building: footprint centre (cx, cy), roof height (top) and its drawing.
  const SPECS = {
    hospital() {
      const x = 4.3, y = 8.3, w = 2.4, d = 2.4, h = 66, cx = x + w / 2, cy = y + d / 2;
      return { cx, cy, top: h, svg: box(x, y, 0, w, d, h, "#F2F4F3") + wins(x, y, 0, w, d, h, 4, 4, 5) +
        box(x + .9, y + d, 0, .6, .25, 9, "#E05A5F") +
        quadTop(cx - .55, cy - .16, cx + .55, cy + .16, h, 'fill="#E05A5F"') + quadTop(cx - .16, cy - .55, cx + .16, cy + .55, h, 'fill="#E05A5F"') };
    },
    police() {
      const x = 8.3, y = 8.4, w = 2.4, d = 2.2, h = 42, cx = x + w / 2, cy = y + d / 2;

let S; // game state
function newGame(phase = "landing") {
  S = {
    realFirst: INCIDENTS.map(() => Math.random() < .5),
    answers: {},       // incident index -> true (spotted the real threat) / false
    seen: {},          // incident index -> the "what if" panel was opened
    cur: null,         // incident index of the building that is open
    phase,             // landing | map | ask | revealed | whatif | end
  };
}

const app = $("#app");
const track = $("#track");
// Buildings in map order; each entry is an index into INCIDENTS.
const ORDER = City.KEYS.map(k => INCIDENTS.findIndex(i => i.building === k)).filter(i => i >= 0);
const N = ORDER.length;
const inRound = () => ["ask", "revealed", "whatif"].includes(S.phase);
const curInc = () => INCIDENTS[S.cur];
const done = i => i in S.answers;
const doneCount = () => Object.keys(S.answers).length;
const score = () => Object.values(S.answers).filter(Boolean).length;
const mostSafe = () => score() * 2 > N; // more than half
const bName = key => t().buildings?.[key] || key;
const isWide = () => matchMedia("(min-width: 960px)").matches;
const toMap = () => { if (!isWide()) $(".map-pane").scrollIntoView({ behavior: smooth(), block: "start" }); };

function renderTrack() {
  track.innerHTML = ORDER.map(i => {
    const cls = done(i) ? (S.answers[i] ? "ok" : "no") : (i === S.cur && inRound() ? "now" : "");
    return `<i class="${cls}"></i>`;
  }).join("") + `<span class="score">${score()}/${N}</span>`;
}

// Building states + camera + caption follow the game state.
function renderCity(instant) {
  const u = t(), states = {};
  for (const i of ORDER) {
    const key = INCIDENTS[i].building;
    if (done(i)) states[key] = S.answers[i] ? "safe" : "hit";
    else if (i === S.cur && inRound()) states[key] = "current";
    else if (S.phase !== "landing") states[key] = "waiting";
  }
  City.setStates(states);
  City.setTitles(u.buildings || {});
  $("#city").setAttribute("aria-label", u.mapAria);
  $("#map").classList.toggle("pick", S.phase !== "landing");
  $(".stage").dataset.mode = S.phase === "map" ? "map" : "split";
  const hud = $("#map-hud");
  hud.hidden = S.phase !== "map";
  if (S.phase === "map") hud.innerHTML = `<div class="eyebrow">${esc(u.resultEyebrow)} · ${doneCount()}/${N}</div><h1>${esc(u.mapTitle)}</h1>`;
  for (const [id, key] of [["z-in", "zoomIn"], ["z-out", "zoomOut"], ["z-all", "zoomReset"]]) { $("#" + id).title = u[key]; $("#" + id).setAttribute("aria-label", u[key]); }

  const cap = $("#map-caption");
  if (inRound()) {
    const key = curInc().building, st = states[key];
    cap.innerHTML = `<span>${esc(bName(key))}</span>` +
      (st === "safe" ? `<span class="st safe">${esc(u.statusSafe)}</span>` : st === "hit" ? `<span class="st hit">${esc(u.statusHit)}</span>` : "");
    City.look(City.focusOf(key), instant);
  } else {
    cap.innerHTML = S.phase === "end"
      ? `<span>${esc(u.resilience)}</span><span class="st ${mostSafe() ? "safe" : "hit"}">${Math.round(score() / N * 100)}%</span>`
      : S.phase === "map" ? `<span>${esc(u.statusNew)}</span><span class="st wait">${N - doneCount()}</span>` : "";
    City.look(City.FULL, instant);
  }
}

function render(instant) {
  renderChrome();
  renderTrack();
  renderCity(instant);
  if (S.phase === "landing") return renderLanding();
  if (S.phase === "map") return renderMap();
  if (S.phase === "end") return renderEnd();
  const inc = curInc(), c = tx(inc), u = t();
  const cards = S.realFirst[S.cur] ? [["real", c.real], ["fake", c.fake]] : [["fake", c.fake], ["real", c.real]];
  const answered = S.phase !== "ask";
  const chosenKind = answered ? (S.answers[S.cur] ? "real" : "fake") : null;

  app.innerHTML = `
    <div class="round-head">
      <div class="head-row">
        <div class="eyebrow">${esc(bName(inc.building))}${answered ? "" : " · " + esc(fmt(u.round, { i: doneCount() + 1, n: N }))}</div>
        <button class="backlink" data-back>${esc(u.back)}</button>
      </div>
      <h1>${emph(u.question)}</h1>
    </div>
    <div class="pair ${answered ? "revealed" : ""}">
      ${cards.map(([kind, text], i) => `
        <button class="card is-${kind} ${chosenKind === kind ? "chosen" : ""}" data-kind="${kind}" ${answered ? "disabled" : ""}
          aria-label="${u.report} ${"AB"[i]}: ${esc(plain(text))}">
          <span class="picked">${u.yourPick}</span>
          <span class="label"><span class="letter">${u.report} ${"AB"[i]}</span>${answered ? "" : `<span class="key" aria-hidden="true">${"AB"[i]}</span>`}</span>
          <p class="stmt">${strong(text)}</p>
          <span class="cta">${u.pick}</span>
          <span class="stamp">${kind === "real" ? esc(fmt(u.stampReal, { id: inc.id })) : u.stampFake}</span>
        </button>`).join("")}
    </div>
    ${answered ? renderReveal(inc) : ""}
  `;

  app.querySelectorAll(".card:not(:disabled)").forEach(b => b.addEventListener("click", () => choose(b.dataset.kind)));
  $("#go-whatif")?.addEventListener("click", showWhatIf);
  app.querySelectorAll("[data-next], [data-back]").forEach(b => b.addEventListener("click", backToCity));
  if (S.phase === "whatif") startGloom($(".whatif canvas"));
}

function renderLanding() {
  const u = t();
  app.innerHTML = `
    <section class="landing">
      <div class="eyebrow">${esc(u.landingEyebrow)}</div>
      <h1>${esc(u.landingH)}</h1>
      <p class="lede">${withAiid(u.landingP)}</p>
      <ul class="roster">${ORDER.map(i => `<li>${esc(bName(INCIDENTS[i].building))}</li>`).join("")}</ul>
      <button class="btn primary big" id="start">${esc(u.start)}</button>
    </section>`;
  $("#start").addEventListener("click", startGame);
}

function startGame() {
  S.phase = "map";
  render();
  toMap();
}

// The city overview: the map is the whole screen; the chips below mirror it for touch and keyboard.
function renderMap() {
  const u = t();
  app.innerHTML = `
    <p class="map-hint">${esc(u.mapP)}</p>
    <ul class="bl-chips">
      ${ORDER.map(i => { const st = done(i) ? (S.answers[i] ? "ok" : "no") : "wait"; const lbl = st === "ok" ? u.statusSafe : st === "no" ? u.statusHit : u.statusNew; return `
        <li><button data-open="${i}" title="${esc(lbl)}" aria-label="${esc(bName(INCIDENTS[i].building))}: ${esc(lbl)}"><span class="m ${st}"></span>${esc(bName(INCIDENTS[i].building))}</button></li>`; }).join("")}
    </ul>`;
  app.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openBuilding(+b.dataset.open)));
}

function openBuilding(i) {
  if (!ORDER.includes(i)) return;
  S.cur = i;
  S.phase = done(i) ? (S.seen[i] ? "whatif" : "revealed") : "ask";
  render();
  if (isWide()) window.scrollTo({ top: 0, behavior: smooth() }); else toMap();
}

function backToCity() {
  S.cur = null;
  S.phase = doneCount() === N ? "end" : "map";
  render();
  window.scrollTo({ top: 0, behavior: "auto" });
}

function renderReveal(inc) {
  const ok = S.answers[S.cur], c = tx(inc), u = t();
  const verdict = `
    <div class="verdict ${ok ? "ok" : "no"}">
      <div class="dot" aria-hidden="true">${ok ? "✓" : "✕"}</div>
      <div>
        <h2>${ok ? u.rightH : u.wrongH}</h2>
        <p>${ok ? u.rightP : u.wrongP}</p>
      </div>
    </div>`;
  const record = `
    <section class="record" aria-label="${u.recordAria}">
      <div class="record-head">
        <h3>${esc(c.title)}</h3>
        <span class="mono" style="color:var(--muted)">AI Incident Database · #${inc.id}</span>
      </div>
      <p class="body">${esc(c.explanation)}</p>
      <blockquote class="src">
        <p>${u.quotes[0]}${esc(c.excerpt.replace(/[.。।\s]+$/, ""))}…${u.quotes[1]}</p>
        <cite class="mono" style="color:var(--muted)">${u.quoteCite}</cite>
      </blockquote>
      <div class="actions">
        <a class="btn" href="${esc(inc.url)}" target="_blank" rel="noopener">${u.readFull}</a>
      </div>
      ${c.whyBad ? `<details class="why"><summary>${u.why}</summary><p>${esc(c.whyBad)}</p></details>` : ""}
    </section>`;
  const whatif = S.phase === "whatif" ? `
    <section class="whatif" id="whatif" aria-label="${u.whatifEyebrow}">
      <canvas aria-hidden="true"></canvas>
      <div class="inner">
        <div class="eyebrow">${u.whatifEyebrow}</div>
        <h3>${esc(fmt(u.whatifH, { hook: c.hook }))}</h3>
        <ol class="steps">
          ${sentences(c.escalation).map((s, i) => `<li style="animation-delay:${.25 + i * .55}s">${esc(s)}</li>`).join("")}
        </ol>
        <p class="note">${u.whatifNote}</p>
        <div class="actions">
          <button class="btn solid-night" data-next>${doneCount() < N ? u.back : u.results}</button>
        </div>
      </div>
    </section>` : `
    <div class="whatif-cta">
      <p>${u.ctaH}<span>${u.ctaP}</span></p>
      <div class="actions">
        <button class="btn solid-night" id="go-whatif">${u.ctaBtn}</button>
        <button class="btn ghost-night" data-back>${doneCount() < N ? u.back : u.results}</button>
      </div>
    </div>`;
  return `<div class="reveal">${verdict}${record}${whatif}</div>`;
}

function choose(kind) {
  if (S.phase !== "ask") return;
  S.answers[S.cur] = kind === "real";
  S.phase = "revealed";
  render();
  // On wide screens the map stays in view; on phones show the building change first.
  if (isWide()) $(".reveal")?.scrollIntoView({ behavior: smooth(), block: "start" }); else toMap();
}

function showWhatIf() {
  S.seen[S.cur] = true;
  S.phase = "whatif";
  render();
  $("#whatif")?.scrollIntoView({ behavior: smooth(), block: "start" });
}

function renderEnd() {
  const c = score(), u = t(), pct = Math.round(c / N * 100);
  // Three outcomes: everything safe, most safe ("it gets harder"), city in decline.
  const head = u.ends[c === N ? 0 : mostSafe() ? 1 : 2];
  const col = mostSafe() ? "var(--real)" : "var(--fake)";
  app.innerHTML = `
    <section class="end">
      <div class="eyebrow">${esc(u.resultEyebrow)}</div>
      <p class="big">${c}<small> / ${N}</small></p>
      <div class="meter-row">
        <div class="lbl"><span>${esc(fmt(u.endScore, { c, n: N }))}</span><span>${pct}%</span></div>
        <div class="meter" role="img" aria-label="${esc(u.resilience)} ${pct}%"><i style="width:${pct}%;background:${col}"></i></div>
      </div>
      <h1>${esc(head)}</h1>
      <p class="lead">${esc(u.endLead)}</p>
      <ul class="ledger">
        ${ORDER.map(i => { const inc = INCIDENTS[i], x = tx(inc); return `
          <li><span class="m ${S.answers[i] ? "ok" : "no"}" title="${S.answers[i] ? u.statusSafe : u.statusHit}"></span>
            <span class="t"><button class="backlink" data-open="${i}">${esc(bName(inc.building))}</button><span>${esc(x.title)}</span></span>
            <a href="${esc(inc.url)}" target="_blank" rel="noopener">AIID #${inc.id} ↗</a></li>`; }).join("")}
      </ul>
      <div class="actions"><button class="btn primary" id="again">${u.again}</button></div>
    </section>`;
  app.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openBuilding(+b.dataset.open)));
  $("#again").addEventListener("click", () => { newGame("map"); render(); window.scrollTo({ top: 0 }); });
}

// Settings menu
const gear = $("#globe"), menu = $("#menu");
function setMenu(open) {
  menu.hidden = !open;
  gear.setAttribute("aria-expanded", String(open));
  if (open) menu.querySelector("input:checked")?.focus({ preventScroll: true });
}
gear.addEventListener("click", e => { e.stopPropagation(); setMenu(menu.hidden); });
document.addEventListener("click", e => { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
menu.addEventListener("change", e => {
  if (e.target.name !== "lang") return;
  lang = e.target.value;
  store.set("lang", lang);
  render(); // the game keeps its place; only the words change
  setMenu(false);
  gear.focus();
});

// Keyboard: A / B (or Russian А / Б) to pick, Enter for the next step, Esc closes the menu.
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape" && !menu.hidden) { setMenu(false); gear.focus(); return; }
  if (e.key === "Escape" && inRound()) { backToCity(); return; }
  if (!menu.hidden) return;
  const k = e.key.toLowerCase();
  const pick = { a: 0, b: 1, "а": 0, "б": 1, "ф": 0, "и": 1 }[k]; // ф/и = A/B keys on a Russian layout
  if (S.phase === "ask" && pick !== undefined) {
    const card = app.querySelectorAll(".card")[pick];
    card && choose(card.dataset.kind);
  } else if (k === "enter" && document.activeElement === document.body) {
    if (S.phase === "landing") startGame();
    else if (S.phase === "revealed") showWhatIf();
    else if (S.phase === "whatif") backToCity();
  }
});

// The gloom: a city at night in the rain, its windows going dark one by one.
// Quiet backdrop for the "what if" text; no glow, nothing pretty.
let gloomRAF = 0;
function startGloom(canvas) {
  cancelAnimationFrame(gloomRAF);
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; ctx.scale(dpr, dpr);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Skyline along the bottom edge.
  const blocks = [], wins = [];
  for (let x = -10; x < W + 10;) {
    const w = 26 + Math.random() * 46, h = 40 + Math.random() * Math.min(150, H * .32);
    blocks.push({ x, w, h });
    for (let wx = x + 6; wx < x + w - 8; wx += 11) for (let wy = H - h + 9; wy < H - 10; wy += 13)
      if (Math.random() < .5) wins.push({ x: wx, y: wy, off: 2000 + Math.random() * 22000 }); // ms until it goes dark
    x += w + 2;
  }
  const keep = Math.max(3, Math.round(wins.length * .04)); // a few stay lit
  wins.sort(() => Math.random() - .5).slice(0, keep).forEach(w => w.off = Infinity);
  const drops = Array.from({ length: Math.round(W * H / 5200) }, () => ({ x: Math.random() * W, y: Math.random() * H, v: 260 + Math.random() * 220, l: 9 + Math.random() * 12 }));

  let last = performance.now(); const t0 = last;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000), t = now - t0; last = now;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "rgba(4,6,12,.55)";
    for (const b of blocks) ctx.fillRect(b.x, H - b.h, b.w, b.h);
    for (const w of wins) {
      const left = reduce ? (w.off === Infinity ? 1 : 0) : Math.max(0, Math.min(1, (w.off - t) / 1500));
      ctx.fillStyle = left > 0 ? `rgba(214,196,150,${.07 + .22 * left})` : "rgba(160,170,190,.035)";
      ctx.fillRect(w.x, w.y, 5, 7);
    }
    if (!reduce) {
      ctx.strokeStyle = "rgba(170,182,205,.13)"; ctx.lineWidth = 1; ctx.beginPath();
      for (const d of drops) {
        d.y += d.v * dt; d.x -= d.v * dt * .12;
        if (d.y > H) { d.y = -d.l; d.x = Math.random() * (W + 40); }
        ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * .12, d.y + d.l);
      }
      ctx.stroke();
      gloomRAF = requestAnimationFrame(frame);
    }
  }
  gloomRAF = requestAnimationFrame(frame);
}

// Keep the game state across live republishes of the artifact.
window.claude?.hot?.snapshot?.(() => S);
City.mount($("#map"), () => $("#map-tip")?.classList.remove("on"));
$("#z-in").addEventListener("click", () => City.zoomAt(.62));
$("#z-out").addEventListener("click", () => City.zoomAt(1 / .62));
$("#z-all").addEventListener("click", () => City.look(City.FULL));

// Building name on hover (or tap).
(() => {
  const map = $("#map"), tip = $("#map-tip");
  let hideT = 0;
  const show = g => {
    const u = t(), key = g.dataset.b, r = g.querySelector(".body").getBoundingClientRect(), m = map.getBoundingClientRect();
    const st = g.classList.contains("safe") ? u.statusSafe : g.classList.contains("hit") ? u.statusHit : "";
    tip.innerHTML = esc(bName(key)) + (st ? `<small>${esc(st)}</small>` : "");
    tip.style.left = Math.max(60, Math.min(m.width - 60, r.left + r.width / 2 - m.left)) + "px";
    tip.style.top = Math.max(34, r.top - m.top) + "px";
    tip.classList.add("on");
  };
  const hide = () => tip.classList.remove("on");
  map.addEventListener("pointerover", e => { const g = e.target.closest?.(".bldg"); if (g) { clearTimeout(hideT); show(g); } });
  map.addEventListener("pointerout", e => { if (e.target.closest?.(".bldg")) hide(); });
  map.addEventListener("click", e => {
    const g = e.target.closest?.(".bldg");
    if (!g || City.wasDrag()) return;
    const i = INCIDENTS.findIndex(x => x.building === g.dataset.b);
    if (i < 0) return;
    hide();
    openBuilding(i); // works from the first screen too: clicking a building starts the game there
  });
  map.addEventListener("pointerdown", e => {
    const g = e.target.closest?.(".bldg");
    if (g && e.pointerType !== "mouse") { show(g); clearTimeout(hideT); hideT = setTimeout(hide, 1800); }
  });
})();
function start(saved) {
  if (saved && saved.answers && !Array.isArray(saved.answers) && Array.isArray(saved.realFirst) && saved.realFirst.length === INCIDENTS.length) S = saved;
  else newGame();
  render(true);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
</script>
