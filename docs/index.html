றை அவர்கள் ஒலிக்கவிட்டனர். மகள் பாதுகாப்பாக இருக்கிறார் என்று தெரிவதற்கு முன் அவர் 5,400 டாலர்களை அனுப்பினார். அந்தக் குரல் AI மூலம் நகலெடுக்கப்பட்டதாகக் கூறப்படுகிறது.", "whyBad": "அழைப்பவர் தான் நம்பும் ஒருவர் என்று பாதிக்கப்பட்டவர் நம்பும்போதுதான் மோசடி வெற்றி பெறுகிறது. பழக்கமான குரல் அதற்கான மிக வலுவான அடையாளங்களில் ஒன்று. குரல் நகலாக்கம் அதைப் போலியாக உருவாக்குவதை மலிவாக்குகிறது. மோசடிகள் மேலும் நம்பத்தகுந்தவையாகவும் மேலும் அச்சமூட்டுபவையாகவும் மாறுகின்றன; குறிப்பாக, மோசடிக்காரர்கள் பொது மூலங்களிலிருந்தோ தரவுக் கசிவுகளிலிருந்தோ பெற்ற தனிப்பட்ட தகவல்களையும் பயன்படுத்தும்போது.", "escalation": "மேலும் திறன் வாய்ந்த அமைப்புகள், நகலெடுக்கப்பட்ட குரல்கள், உருவாக்கப்பட்ட காணொளி, தனிப்பட்ட தரவு, உரையாடலைத் தொடரக்கூடிய சாட்பாட்கள் ஆகியவற்றை இணைக்க முடியும். இன்று அதிக உழைப்புத் தேவைப்படும் மோசடிகள் ஓரளவு தானியங்கியாக மாறி, ஒரே நேரத்தில் பலரைக் குறிவைக்கக்கூடும்."}, "sv": {"title": "AI-klonad röst användes i en fejkad kidnappning", "domain": "Bedrägerier", "hook": "en enda klonad röst", "real": "Bedragare ska ha använt en **AI-klonad röst** i ett **samtal om en påhittad kidnappning** och fått en mamma att skicka flera tusen dollar.", "fake": "Bedragare ska ha skickat en **AI-genererad video av hennes hus i brand** till en mamma på semester. De fick henne att betala flera tusen dollar för ett **akut reparationsteam**.", "excerpt": "Deborah Del Mastro ska ha skickat 5 400 dollar till Mexiko efter att bedragare felaktigt påstått att hennes dotter Sarah kidnappats", "explanation": "En kvinna blev uppringd av bedragare som påstod att de hade kidnappat hennes dotter. De spelade upp något som lät som dotterns skräckslagna röst. Kvinnan skickade 5 400 dollar innan hon fick veta att dottern var i säkerhet. Rösten ska ha kopierats med AI.", "whyBad": "Ett bedrägeri fungerar när offret tror att den som ringer är någon de litar på. En bekant röst är ett av de starkaste tecknen på det. Röstkloning gör det billigt att förfalska den. Bedrägerierna blir mer trovärdiga och mer skrämmande, särskilt när bedragarna också använder personuppgifter från offentliga källor eller dataläckor.", "escalation": "Mer kapabla system kan kombinera klonade röster, genererad video, personuppgifter och chattbotar som kan föra ett samtal. Bedrägerier som i dag kräver mycket arbete kan bli delvis automatiska och riktas mot många människor samtidigt."}, "tr": {"title": "Sahte kaçırma vakasında yapay zekâyla klonlanmış ses", "domain": "Dolandırıcılık", "hook": "tek bir klonlanmış ses", "real": "Dolandırıcıların, bir **sahte kaçırma aramasında** **yapay zekâyla klonlanmış bir ses** kullandığı ve bir anneyi birkaç bin dolar göndermeye ikna ettiği bildirildi.", "fake": "Dolandırıcıların, tatildeki bir anneye **evinin yandığını gösteren, yapay zekâyla üretilmiş bir video** gönderdiği bildirildi. Onu bir **acil onarım ekibi** için birkaç bin dolar ödemeye ikna ettiler.", "excerpt": "Deborah Del Mastro'nun, dolandırıcılar kızı Sarah'nın kaçırıldığını yalan yere iddia ettikten sonra Meksika'ya 5.400 dolar gönderdiği bildirildi", "explanation": "Bir kadını, kızını kaçırdıklarını söyleyen dolandırıcılar aradı. Kızının panik içindeki sesine benzeyen bir ses dinlettiler. Kadın, kızının güvende olduğunu öğrenmeden önce 5.400 dolar gönderdi. Sesin yapay zekâyla kopyalandığı bildirildi.", "whyBad": "Bir dolandırıcılık, kurban arayanın güvendiği biri olduğuna inandığında işe yarar. Tanıdık bir ses bunun en güçlü işaretlerinden biridir. Ses klonlama, bu sesi taklit etmeyi ucuzlatıyor. Dolandırıcılıklar, özellikle dolandırıcılar kamuya açık kaynaklardan veya veri sızıntılarından alınan kişisel bilgileri de kullandığında, daha inandırıcı ve daha korkutucu hâle geliyor.", "escalation": "Daha yetenekli sistemler klonlanmış sesleri, üretilmiş videoyu, kişisel verileri ve sohbet sürdürebilen sohbet botlarını birleştirebilir. Bugün çok emek isteyen dolandırıcılıklar kısmen otomatik hâle gelebilir ve aynı anda birçok insanı hedef alabilir."}}}, {"id": 1379, "url": "https://incidentdatabase.ai/cite/1379/", "building": "court", "text": {"en": {"title": "Allegedly AI-fabricated evidence contributed to imprisonment", "domain": "Courts & evidence", "hook": "one disputed piece of evidence", "real": "A woman was reportedly **jailed** after **text messages** said to be hers were submitted as evidence. It was later alleged that the messages had been faked with AI.", "fake": "A woman reportedly **lost the right to see her child** for several weeks after a **social-media viewing history** said to be hers was submitted. It was later alleged that the records had been generated with AI.", "excerpt": "A Florida nurse, Melissa Sims, was reportedly jailed for two days for purportedly violating a bond/no-contact order.", "explanation": "A Florida nurse was reportedly jailed for two days after her ex-partner submitted text messages said to be from her. It was later alleged that the messages had been generated or faked with AI.", "whyBad": "Courts depend on evidence that can be traced to real people and real events. AI makes convincing fake messages, images and recordings cheap to produce. Many courts still rely on screenshots and recordings whose origin is hard to check. The risk runs both ways: fake evidence may be accepted, and real evidence may be dismissed as fake.", "escalation": "As fake text, images, audio and video get better, courts, journalists, employers and the public find it harder to tell what is true. That raises the risk of wrong decisions. An innocent person can be punished because of a fake, and real evidence can be thrown out as one."}, "fr": {"title": "Des preuves prétendument fabriquées par IA ont contribué à une incarcération", "domain": "Justice et preuves", "hook": "une seule preuve contestée", "real": "Une femme aurait été **incarcérée** après la production de **SMS** qui lui étaient attribués. Il a ensuite été allégué que ces messages avaient été falsifiés avec l’IA.", "fake": "Une femme aurait **perdu le droit de voir son enfant** pendant plusieurs semaines après la production d’un **historique de consultation des réseaux sociaux** qui lui était attribué. Il a ensuite été allégué que ces relevés avaient été générés avec l’IA.", "excerpt": "Une infirmière de Floride, Melissa Sims, aurait été incarcérée pendant deux jours pour une présumée violation d’une ordonnance de caution / d’interdiction de contact.", "explanation": "Une infirmière de Floride aurait passé deux jours en détention après que son ex-partenaire a produit des SMS qui lui étaient attribués. Il a ensuite été allégué que ces messages avaient été générés ou falsifiés avec l’IA.", "whyBad": "Les tribunaux s’appuient sur des preuves que l’on peut rattacher à des personnes et à des faits réels. L’IA permet de produire à bas coût de faux messages, images et enregistrements convaincants. Beaucoup de tribunaux se fient encore à des captures d’écran et à des enregistrements dont l’origine est difficile à vérifier. Le risque va dans les deux sens : une fausse preuve peut être acceptée, et une vraie preuve peut être écartée comme fausse.", "escalation": "À mesure que les faux textes, images, sons et vidéos s’améliorent, les tribunaux, les journalistes, les employeurs et le public ont plus de mal à savoir ce qui est vrai. Le risque de mauvaises décisions augmente. Un innocent peut être sanctionné à cause d’un faux, et une vraie preuve peut être rejetée comme telle."}, "de": {"title": "Mutmaßlich KI-gefälschte Beweise führten zu Haft", "domain": "Justiz und Beweismittel", "hook": "ein einziges umstrittenes Beweisstück", "real": "Eine Frau soll **inhaftiert** worden sein, nachdem **Textnachrichten** vorgelegt wurden, die von ihr stammen sollten. Später wurde behauptet, die Nachrichten seien mit KI gefälscht worden.", "fake": "Eine Frau soll für mehrere Wochen **das Recht verloren haben, ihr Kind zu sehen**, nachdem ein **Verlauf angesehener Social-Media-Inhalte** vorgelegt wurde, der von ihr stammen sollte. Später wurde behauptet, die Daten seien mit KI erzeugt worden.", "excerpt": "Eine Krankenschwester aus Florida, Melissa Sims, soll für zwei Tage inhaftiert worden sein, weil sie mutmaßlich gegen eine Kautions- bzw. Kontaktverbotsauflage verstoßen hatte.", "explanation": "Eine Krankenschwester aus Florida soll zwei Tage in Haft verbracht haben, nachdem ihr Ex-Partner Textnachrichten vorgelegt hatte, die von ihr stammen sollten. Später wurde behauptet, die Nachrichten seien mit KI erzeugt oder gefälscht worden.", "whyBad": "Gerichte sind auf Beweise angewiesen, die sich realen Personen und Ereignissen zuordnen lassen. Mit KI lassen sich überzeugende gefälschte Nachrichten, Bilder und Aufnahmen billig herstellen. Viele Gerichte verlassen sich noch auf Screenshots und Aufnahmen, deren Herkunft schwer zu prüfen ist. Das Risiko besteht in beide Richtungen: Ein gefälschter Beweis kann akzeptiert und ein echter Beweis als Fälschung abgetan werden.", "escalation": "Je besser gefälschte Texte, Bilder, Audio- und Videoaufnahmen werden, desto schwerer fällt es Gerichten, Journalisten, Arbeitgebern und der Öffentlichkeit zu erkennen, was wahr ist. Das erhöht das Risiko falscher Entscheidungen. Ein Unschuldiger kann wegen einer Fälschung bestraft werden, und ein echter Beweis kann als Fälschung verworfen werden."}, "ru": {"title": "Предположительно сфабрикованные ИИ доказательства привели к заключению под стражу", "domain": "Суд и доказательства", "hook": "одно спорное доказательство", "real": "Женщину, по имеющимся данным, **заключили под стражу** после того, как суду представили **СМС-переписку**, которую приписали ей. Позже утверждалось, что сообщения подделали с помощью ИИ.", "fake": "Женщину, по имеющимся данным, на несколько недель **лишили права видеться с ребёнком** после того, как суду представили **историю просмотров в социальных сетях**, которую приписали ей. Позже утверждалось, что эти записи сгенерировал ИИ.", "excerpt": "Медсестру из Флориды Мелиссу Симс, по имеющимся данным, на два дня заключили под стражу за предполагаемое нарушение условий залога / запрета на контакт.", "explanation": "Медсестра из Флориды, по имеющимся данным, провела два дня под стражей после того, как её бывший партнёр представил СМС-переписку, которую приписал ей. Позже утверждалось, что сообщения были сгенерированы или подделаны с помощью ИИ.", "whyBad": "Суды опираются на доказательства, которые можно связать с реальными людьми и событиями. ИИ позволяет дёшево создавать убедительные поддельные сообщения, изображения и записи. При этом многие суды по-прежнему полагаются на скриншоты и записи, происхождение которых трудно проверить. Риск двусторонний: подделку могут принять за доказательство, а настоящее доказательство — отвергнуть как подделку.", "escalation": "Поддельные тексты, изображения, аудио и видео становятся всё качественнее. Судам, журналистам, работодателям и обществу всё труднее понять, что правда. Из-за этого растёт риск ошибочных решений. Невиновного могут наказать из-за подделки, а настоящее доказательство — отвергнуть как фальшивку."}, "it": {"title": "Prove presumibilmente fabbricate con l’IA hanno contribuito a una detenzione", "domain": "Giustizia e prove", "hook": "una sola prova contestata", "real": "Una donna sarebbe stata **detenuta** dopo la presentazione di **messaggi di testo** attribuiti a lei. In seguito è stato sostenuto che i messaggi erano stati falsificati con l’IA.", "fake": "Una donna avrebbe **perso il diritto di vedere suo figlio** per alcune settimane dopo la presentazione di una **cronologia delle visualizzazioni sui social network** attribuita a lei. In seguito è stato sostenuto che quei dati erano stati generati con l’IA.", "excerpt": "Un’infermiera della Florida, Melissa Sims, sarebbe stata detenuta per due giorni per una presunta violazione di un ordine di cauzione / divieto di contatto.", "explanation": "Un’infermiera della Florida avrebbe trascorso due giorni in detenzione dopo che il suo ex partner aveva presentato messaggi di testo attribuiti a lei. In seguito è stato sostenuto che i messaggi erano stati generati o falsificati con l’IA.", "whyBad": "I tribunali dipendono da prove che si possano ricondurre a persone e fatti reali. L’IA rende economico produrre messaggi, immagini e registrazioni false ma convincenti. Molti tribunali si affidano ancora a screenshot e registrazioni la cui origine è difficile da verificare. Il rischio va in entrambe le direzioni: una prova falsa può essere accettata e una prova vera può essere scartata come falsa.", "escalation": "Man mano che testi, immagini, audio e video falsi migliorano, tribunali, giornalisti, datori di lavoro e pubblico fanno più fatica a capire che cosa è vero. Cresce il rischio di decisioni sbagliate. Un innocente può essere punito a causa di un falso, e una prova vera può essere respinta come falsa."}, "es": {"title": "Pruebas presuntamente fabricadas con IA contribuyeron a un encarcelamiento", "domain": "Justicia y pruebas", "hook": "una sola prueba en disputa", "real": "Una mujer habría sido **encarcelada** después de que se presentaran **mensajes de texto** atribuidos a ella. Más tarde se alegó que los mensajes habían sido falsificados con IA.", "fake": "Una mujer habría **perdido el derecho a ver a su hijo** durante varias semanas después de que se presentara un **historial de visualizaciones en redes sociales** atribuido a ella. Más tarde se alegó que esos registros se habían generado con IA.", "excerpt": "Según se informa, una enfermera de Florida, Melissa Sims, fue encarcelada durante dos días por presuntamente violar una orden de fianza / prohibición de contacto.", "explanation": "Una enfermera de Florida habría pasado dos días detenida después de que su expareja presentara mensajes de texto atribuidos a ella. Más tarde se alegó que los mensajes habían sido generados o falsificados con IA.", "whyBad": "Los tribunales dependen de pruebas que se puedan vincular a personas y hechos reales. La IA abarata la producción de mensajes, imágenes y grabaciones falsos pero convincentes. Muchos tribunales siguen apoyándose en capturas de pantalla y grabaciones cuyo origen es difícil de comprobar. El riesgo va en ambas direcciones: una prueba falsa puede aceptarse y una prueba real puede descartarse como falsa.", "escalation": "A medida que mejoran los textos, imágenes, audios y vídeos falsos, a los tribunales, periodistas, empleadores y al público les cuesta más saber qué es verdad. Aumenta el riesgo de decisiones equivocadas. Una persona inocente puede ser castigada por una falsificación, y una prueba real puede rechazarse como falsa."}, "ko": {"title": "AI로 조작됐다는 의혹이 있는 증거로 구금", "domain": "법원과 증거", "hook": "논란이 된 증거 하나", "real": "한 여성이 자신이 보낸 것이라는 **문자 메시지**가 제출된 뒤 **구금된** 것으로 알려졌습니다. 이후 그 메시지가 AI로 조작됐다는 주장이 나왔습니다.", "fake": "한 여성이 자신의 것이라는 **소셜 미디어 시청 기록**이 제출된 뒤 몇 주 동안 **자녀를 만날 권리를 잃은** 것으로 알려졌습니다. 이후 그 기록이 AI로 생성됐다는 주장이 나왔습니다.", "excerpt": "미국 플로리다의 간호사 멜리사 심스가 보석 조건 또는 접근 금지 명령을 위반했다는 이유로 이틀간 구금된 것으로 알려졌다.", "explanation": "플로리다의 한 간호사가 전 파트너가 그녀의 것이라는 문자 메시지를 제출한 뒤 이틀 동안 구금된 것으로 알려졌습니다. 이후 그 메시지가 AI로 생성되거나 조작됐다는 주장이 나왔습니다.", "whyBad": "법원은 실제 사람과 사건에 연결할 수 있는 증거에 의존합니다. AI는 그럴듯한 가짜 메시지, 이미지, 녹음을 싸게 만들 수 있게 합니다. 많은 법원이 여전히 출처를 확인하기 어려운 스크린샷과 녹음에 의존합니다. 위험은 양쪽으로 작용합니다. 가짜 증거가 받아들여질 수 있고, 진짜 증거가 가짜로 몰려 배척될 수 있습니다.", "escalation": "가짜 글, 이미지, 음성, 영상이 정교해질수록 법원, 언론인, 고용주, 대중은 무엇이 사실인지 알기 더 어려워집니다. 잘못된 결정이 내려질 위험이 커집니다. 무고한 사람이 조작물 때문에 처벌받을 수 있고, 진짜 증거가 가짜로 몰려 배척될 수 있습니다."}, "zh": {"title": "被指由 AI 伪造的证据导致入狱", "domain": "司法与证据", "hook": "一份有争议的证据", "real": "据报道，在有人提交了据称由一名女子发出的**短信**之后，她被**羁押**。后来有人指称，这些短信是用AI伪造的。", "fake": "据报道，在有人提交了据称属于一名女子的**社交媒体浏览记录**之后，她在几周内**失去了探视孩子的权利**。后来有人指称，这些记录是用AI生成的。", "excerpt": "据报道，佛罗里达州护士 Melissa Sims 因被指违反保释条件/禁止接触令而被关押两天。", "explanation": "据报道，佛罗里达州一名护士在前伴侣提交了据称由她发出的短信之后，被羁押了两天。后来有人指称，这些短信是用AI生成或伪造的。", "whyBad": "法院依靠的是能够与真实的人和事件对应起来的证据。AI让制作足以乱真的虚假信息、图片和录音变得很便宜。许多法院仍然依赖来源难以核实的截图和录音。风险是双向的：假证据可能被采信，真证据也可能被当作假的而不予采信。", "escalation": "随着伪造的文字、图片、音频和视频越来越逼真，法院、记者、雇主和公众更难判断什么是真的。做出错误决定的风险在上升。无辜的人可能因为伪造的东西受到惩罚，真实的证据也可能被当作假的而被驳回。"}, "sr": {"title": "Докази наводно фабриковани помоћу ВИ довели до затварања", "domain": "Судови и докази", "hook": "један спорни доказ", "real": "Жена је, према наводима, **притворена** након што су поднете **текстуалне поруке** које су јој приписане. Касније је изнета тврдња да су поруке фалсификоване помоћу вештачке интелигенције.", "fake": "Жена је, према наводима, на неколико недеља **изгубила право да виђа дете** након што је поднета **историја прегледаног садржаја на друштвеним мрежама** која јој је приписана. Касније је изнета тврдња да су ти подаци генерисани помоћу вештачке интелигенције.", "excerpt": "Медицинска сестра из Флориде, Мелиса Симс, је, како се наводи, провела два дана у притвору због наводног кршења услова кауције / забране контакта.", "explanation": "Медицинска сестра са Флориде је, према наводима, провела два дана у притвору након што је њен бивши партнер поднео текстуалне поруке које су јој приписане. Касније је изнета тврдња да су поруке генерисане или фалсификоване помоћу вештачке интелигенције.", "whyBad": "Судови зависе од доказа који се могу повезати са стварним људима и догађајима. Вештачка интелигенција чини јефтином израду уверљивих лажних порука, слика и снимака. Многи судови се и даље ослањају на снимке екрана и снимке чије је порекло тешко проверити. Ризик иде у оба смера: лажан доказ може бити прихваћен, а прави доказ одбачен као лажан.", "escalation": "Како лажни текстови, слике, звучни и видео снимци постају бољи, судовима, новинарима, послодавцима и јавности је све теже да утврде шта је истина. Расте ризик од погрешних одлука. Невина особа може бити кажњена због фалсификата, а прави доказ може бити одбачен као лажан."}, "bs": {"title": "Dokazi navodno fabrikovani pomoću UI doveli do zatvaranja", "domain": "Sudovi i dokazi", "hook": "jedan sporni dokaz", "real": "Žena je, prema navodima, **pritvorena** nakon što su podnesene **tekstualne poruke** koje su joj pripisane. Kasnije je iznesena tvrdnja da su poruke falsifikovane pomoću AI-ja.", "fake": "Žena je, prema navodima, na nekoliko sedmica **izgubila pravo da viđa dijete** nakon što je podnesena **historija pregledanog sadržaja na društvenim mrežama** koja joj je pripisana. Kasnije je iznesena tvrdnja da su ti podaci generisani pomoću AI-ja.", "excerpt": "Medicinska sestra s Floride, Melissa Sims, je, kako se navodi, provela dva dana u pritvoru zbog navodnog kršenja uslova kaucije / zabrane kontakta.", "explanation": "Medicinska sestra s Floride je, prema navodima, provela dva dana u pritvoru nakon što je njen bivši partner podnio tekstualne poruke koje su joj pripisane. Kasnije je iznesena tvrdnja da su poruke generisane ili falsifikovane pomoću AI-ja.", "whyBad": "Sudovi zavise od dokaza koji se mogu povezati sa stvarnim ljudima i događajima. AI čini jeftinom izradu uvjerljivih lažnih poruka, slika i snimaka. Mnogi sudovi se i dalje oslanjaju na snimke ekrana i snimke čije je porijeklo teško provjeriti. Rizik ide u oba smjera: lažan dokaz može biti prihvaćen, a pravi dokaz odbačen kao lažan.", "escalation": "Kako lažni tekstovi, slike, zvučni i video snimci postaju bolji, sudovima, novinarima, poslodavcima i javnosti je sve teže utvrditi šta je istina. Raste rizik od pogrešnih odluka. Nevina osoba može biti kažnjena zbog falsifikata, a pravi dokaz može biti odbačen kao lažan."}, "ro": {"title": "Probe presupus fabricate cu IA au contribuit la o încarcerare", "domain": "Justiție și probe", "hook": "o singură probă contestată", "real": "O femeie ar fi fost **reținută** după ce au fost prezentate **mesaje text** atribuite ei. Ulterior s-a susținut că mesajele fuseseră falsificate cu IA.", "fake": "O femeie ar fi **pierdut dreptul de a-și vedea copilul** pentru câteva săptămâni după ce a fost prezentat un **istoric de vizualizări de pe rețelele sociale** atribuit ei. Ulterior s-a susținut că acele date fuseseră generate cu IA.", "excerpt": "O asistentă medicală din Florida, Melissa Sims, ar fi fost încarc a vào những bằng chứng có thể gắn với con người và sự việc có thật. AI khiến việc tạo tin nhắn, hình ảnh và bản ghi giả nhưng thuyết phục trở nên rẻ. Nhiều tòa án vẫn dựa vào ảnh chụp màn hình và bản ghi khó kiểm tra nguồn gốc. Rủi ro đi theo cả hai hướng: bằng chứng giả có thể được chấp nhận, còn bằng chứng thật có thể bị bác bỏ vì bị coi là giả.", "escalation": "Khi văn bản, hình ảnh, âm thanh và video giả ngày càng tốt hơn, tòa án, nhà báo, người sử dụng lao động và công chúng khó biết điều gì là thật hơn. Nguy cơ ra quyết định sai tăng lên. Một người vô tội có thể bị trừng phạt vì một thứ giả mạo, và bằng chứng thật có thể bị bác bỏ vì bị coi là giả."}, "uk": {"title": "Імовірно сфабриковані ШІ докази призвели до взяття під варту", "domain": "Суд і докази", "hook": "один спірний доказ", "real": "Жінку, за наявними даними, **взяли під варту** після того, як було надано **текстові повідомлення**, приписані їй. Пізніше стверджувалося, що повідомлення підробили за допомогою ШІ.", "fake": "Жінка, за наявними даними, на кілька тижнів **втратила право бачитися з дитиною** після того, як було надано **історію переглядів у соціальних мережах**, приписану їй. Пізніше стверджувалося, що ці записи згенерували за допомогою ШІ.", "excerpt": "Медсестру з Флориди Мелісу Сімс, за наявними даними, на два дні взяли під варту за імовірне порушення умов застави / заборони на контакт.", "explanation": "Медсестра з Флориди, за наявними даними, провела два дні під вартою після того, як її колишній партнер надав текстові повідомлення, приписані їй. Пізніше стверджувалося, що повідомлення згенерували або підробили за допомогою ШІ.", "whyBad": "Суди залежать від доказів, які можна пов’язати з реальними людьми та подіями. ШІ робить дешевим виготовлення переконливих підроблених повідомлень, зображень і записів. Багато судів досі покладаються на знімки екрана та записи, походження яких важко перевірити. Ризик діє в обидва боки: підроблений доказ можуть прийняти, а справжній можуть відкинути як підробку.", "escalation": "Що кращими стають підроблені тексти, зображення, аудіо та відео, то важче судам, журналістам, роботодавцям і суспільству зрозуміти, що є правдою. Зростає ризик хибних рішень. Невинну людину можуть покарати через підробку, а справжній доказ можуть відкинути як підробку."}, "pl": {"title": "Dowody rzekomo sfabrykowane przez AI przyczyniły się do pozbawienia wolności", "domain": "Sąd i dowody", "hook": "jeden sporny dowód", "real": "Kobieta miała zostać **osadzona w areszcie** po tym, jak przedstawiono **wiadomości tekstowe** przypisywane jej. Później twierdzono, że wiadomości sfałszowano przy użyciu AI.", "fake": "Kobieta miała na kilka tygodni **stracić prawo do widywania dziecka** po tym, jak przedstawiono **historię oglądanych treści w mediach społecznościowych** przypisywaną jej. Później twierdzono, że te dane wygenerowano przy użyciu AI.", "excerpt": "Pielęgniarka z Florydy, Melissa Sims, miała trafić na dwa dni do aresztu za rzekome naruszenie warunków kaucji / zakazu kontaktu.", "explanation": "Pielęgniarka z Florydy miała spędzić dwa dni w areszcie po tym, jak jej były partner przedstawił wiadomości tekstowe przypisywane jej. Później twierdzono, że wiadomości wygenerowano lub sfałszowano przy użyciu AI.", "whyBad": "Sądy opierają się na dowodach, które można powiązać z prawdziwymi osobami i zdarzeniami. Dzięki AI tanio powstają przekonujące fałszywe wiadomości, obrazy i nagrania. Wiele sądów wciąż polega na zrzutach ekranu i nagraniach, których pochodzenie trudno sprawdzić. Ryzyko działa w obie strony: fałszywy dowód może zostać przyjęty, a prawdziwy odrzucony jako fałszywy.", "escalation": "Im lepsze są fałszywe teksty, obrazy, nagrania audio i wideo, tym trudniej sądom, dziennikarzom, pracodawcom i opinii publicznej ustalić, co jest prawdą. Rośnie ryzyko błędnych decyzji. Niewinna osoba może zostać ukarana z powodu fałszerstwa, a prawdziwy dowód może zostać odrzucony jako fałszywy."}, "ta": {"title": "AI மூலம் புனையப்பட்டதாகக் குற்றம் சாட்டப்பட்ட சான்றுகளால் சிறைவாசம்", "domain": "நீதிமன்றங்களும் சான்றுகளும்", "hook": "சர்ச்சைக்குரிய ஒரு சான்று", "real": "ஒரு பெண் அனுப்பியதாகக் கூறப்பட்ட **குறுஞ்செய்திகள்** சமர்ப்பிக்கப்பட்ட பிறகு, அவர் **காவலில் வைக்கப்பட்டதாகக்** கூறப்படுகிறது. அந்தச் செய்திகள் AI மூலம் போலியாக உருவாக்கப்பட்டவை என்று பின்னர் குற்றம் சாட்டப்பட்டது.", "fake": "ஒரு பெண்ணுடையது எனக் கூறப்பட்ட **சமூக ஊடகப் பார்வை வரலாறு** சமர்ப்பிக்கப்பட்ட பிறகு, அவர் சில வாரங்களுக்கு **தன் குழந்தையைப் பார்க்கும் உரிமையை இழந்ததாகக்** கூறப்படுகிறது. அந்தப் பதிவுகள் AI மூலம் உருவாக்கப்பட்டவை என்று பின்னர் குற்றம் சாட்டப்பட்டது.", "excerpt": "பிணை / தொடர்புத் தடை உத்தரவை மீறியதாகக் கூறப்படும் காரணத்துக்காக, ஃபுளோரிடா செவிலியர் மெலிசா சிம்ஸ் இரண்டு நாட்கள் சிறையில் அடைக்கப்பட்டதாகக் கூறப்படுகிறது.", "explanation": "புளோரிடாவைச் சேர்ந்த ஒரு செவிலியர், அவர் அனுப்பியதாகக் கூறப்பட்ட குறுஞ்செய்திகளை அவருடைய முன்னாள் துணைவர் சமர்ப்பித்த பிறகு, இரண்டு நாட்கள் காவலில் இருந்ததாகக் கூறப்படுகிறது. அந்தச் செய்திகள் AI மூலம் உருவாக்கப்பட்டவை அல்லது போலியாகத் தயாரிக்கப்பட்டவை என்று பின்னர் குற்றம் சாட்டப்பட்டது.", "whyBad": "நீதிமன்றங்கள், உண்மையான நபர்களுடனும் நிகழ்வுகளுடனும் இணைக்கக்கூடிய சான்றுகளைச் சார்ந்துள்ளன. நம்பத்தகுந்த போலிச் செய்திகள், படங்கள், பதிவுகளை உருவாக்குவதை AI மலிவாக்குகிறது. பல நீதிமன்றங்கள், மூலத்தைச் சரிபார்ப்பது கடினமான திரைப்பிடிப்புகளையும் பதிவுகளையும் இன்னும் நம்பியுள்ளன. ஆபத்து இரு திசைகளிலும் உள்ளது: போலிச் சான்று ஏற்கப்படலாம், உண்மையான சான்று போலி என்று நிராகரிக்கப்படலாம்.", "escalation": "போலி உரை, படங்கள், ஒலி, காணொளி ஆகியவை மேம்படும்போது, நீதிமன்றங்கள், பத்திரிகையாளர்கள், முதலாளிகள், பொதுமக்கள் ஆகியோருக்கு எது உண்மை என்று அறிவது கடினமாகிறது. தவறான முடிவுகளின் ஆபத்து அதிகரிக்கிறது. ஒரு நிரபராதி போலியின் காரணமாகத் தண்டிக்கப்படலாம்; உண்மையான சான்று போலி என்று நிராகரிக்கப்படலாம்."}, "sv": {"title": "Påstått AI-förfalskade bevis bidrog till frihetsberövande", "domain": "Domstolar och bevis", "hook": "ett enda omstritt bevis", "real": "En kvinna ska ha **frihetsberövats** efter att **sms** som påstods komma från henne lagts fram. Senare hävdades det att meddelandena hade förfalskats med AI.", "fake": "En kvinna ska i flera veckor ha **förlorat rätten att träffa sitt barn** efter att en **visningshistorik från sociala medier** som påstods vara hennes lagts fram. Senare hävdades det att uppgifterna hade genererats med AI.", "excerpt": "En sjuksköterska i Florida, Melissa Sims, ska ha suttit frihetsberövad i två dagar för att påstått ha brutit mot ett borgens- eller kontaktförbud.", "explanation": "En sjuksköterska i Florida ska ha suttit frihetsberövad i två dagar efter att hennes före detta partner lagt fram sms som påstods komma från henne. Senare hävdades det att meddelandena hade genererats eller förfalskats med AI.", "whyBad": "Domstolar är beroende av bevis som går att knyta till verkliga personer och händelser. Med AI blir det billigt att göra övertygande falska meddelanden, bilder och inspelningar. Många domstolar förlitar sig fortfarande på skärmdumpar och inspelningar vars ursprung är svårt att kontrollera. Risken går åt båda håll: falska bevis kan godtas, och äkta bevis kan avfärdas som falska.", "escalation": "När falska texter, bilder, ljud och videor blir bättre får domstolar, journalister, arbetsgivare och allmänheten svårare att avgöra vad som är sant. Risken för felaktiga beslut ökar. En oskyldig kan straffas på grund av en förfalskning, och äkta bevis kan avfärdas som falska."}, "tr": {"title": "Yapay zekâyla üretildiği iddia edilen deliller hapse girmeye katkıda bulundu", "domain": "Mahkemeler ve deliller", "hook": "tek bir tartışmalı delil", "real": "Bir kadının, kendisine atfedilen **kısa mesajlar** sunulduktan sonra **gözaltında tutulduğu** bildirildi. Daha sonra mesajların yapay zekâyla uydurulduğu iddia edildi.", "fake": "Bir kadının, kendisine atfedilen **sosyal medya izleme geçmişi** sunulduktan sonra birkaç hafta boyunca **çocuğunu görme hakkını kaybettiği** bildirildi. Daha sonra bu kayıtların yapay zekâyla üretildiği iddia edildi.", "excerpt": "Floridalı hemşire Melissa Sims'in, iddiaya göre kefalet / temas yasağı kararını ihlal ettiği gerekçesiyle iki gün tutuklu kaldığı bildirildi.", "explanation": "Floridalı bir hemşirenin, eski partneri kendisine atfedilen kısa mesajları sunduktan sonra iki gün gözaltında kaldığı bildirildi. Daha sonra mesajların yapay zekâyla üretildiği veya uydurulduğu iddia edildi.", "whyBad": "Mahkemeler, gerçek kişilere ve olaylara bağlanabilen delillere dayanır. Yapay zekâ, inandırıcı sahte mesajlar, görüntüler ve kayıtlar üretmeyi ucuzlatıyor. Birçok mahkeme hâlâ kaynağı zor doğrulanan ekran görüntülerine ve kayıtlara güveniyor. Risk iki yönlü: sahte delil kabul edilebilir, gerçek delil de sahte diye reddedilebilir.", "escalation": "Sahte metinler, görüntüler, ses ve videolar iyileştikçe mahkemeler, gazeteciler, işverenler ve kamuoyu neyin doğru olduğunu anlamakta daha çok zorlanıyor. Yanlış karar riski artıyor. Masum bir kişi bir sahtecilik yüzünden cezalandırılabilir, gerçek bir delil de sahte diye reddedilebilir."}}}, {"id": 1374, "url": "https://incidentdatabase.ai/cite/1374/", "building": "hospital", "text": {"en": {"title": "AI medical alert nearly led to inappropriate treatment", "domain": "Healthcare", "hook": "one wrong alert", "real": "A hospital AI system reportedly raised a **sepsis alert** for an older patient on dialysis. The usual response, **IV fluids**, could have harmed this patient. A nurse noticed, and a doctor changed the treatment.", "fake": "A hospital AI system that **schedules operating rooms** reportedly misread a note in a patient's chart and **put an urgent operation after routine ones**. A nurse noticed before the delay did any harm.", "excerpt": "A nurse at St. Rose Dominican Hospital reportedly described an episode in which a hospital AI system purportedly generated a sepsis alert.", "explanation": "A hospital AI system reportedly raised a sepsis alert for an older patient on dialysis. The standard urgent response includes IV fluids. A nurse saw that fluids could dangerously overload this patient. A doctor stepped in and changed the treatment.", "whyBad": "Hospitals use tools like this to act fast and follow set procedures. That is useful, but it has a cost. Staff may treat an alert as an instruction, even when the standard response is wrong for a particular patient. This is called automation bias. Here a nurse caught the problem. If staff lose the time or the authority to question an alert, the same mistake could reach many patients.", "escalation": "AI is getting more capable and is being built deeper into diagnosis, triage and treatment decisions. Hospitals may hand over more and more of the work. If human checks become a formality, one error in a model could repeat across many patients before anyone notices."}, "fr": {"title": "Une alerte médicale de l’IA a failli entraîner un traitement inadapté", "domain": "Santé", "hook": "une seule alerte erronée", "real": "Un système d’IA hospitalier aurait émis une **alerte de sepsis** pour un patient âgé sous dialyse. La réponse habituelle, une **perfusion de liquides**, aurait pu nuire à ce patient. Une infirmière l’a remarqué et un médecin a modifié le traitement.", "fake": "Un système d’IA hospitalier qui **planifie les blocs opératoires** aurait mal lu une note du dossier d’un patient et **placé une opération urgente après des opérations de routine**. Une infirmière l’a remarqué avant que le retard ne cause de tort.", "excerpt": "Une infirmière de l’hôpital St. Rose Dominican aurait décrit un épisode au cours duquel un système d’IA de l’hôpital aurait généré une alerte de sepsis.", "explanation": "Un système d’IA hospitalier aurait émis une alerte de sepsis pour un patient âgé sous dialyse. La réponse d’urgence standard comprend une perfusion de liquides. Une infirmière a vu que ces liquides pouvaient provoquer une surcharge dangereuse chez ce patient. Un médecin est intervenu et a modifié le traitement.", "whyBad": "Les hôpitaux utilisent ce type d’outil pour agir vite et suivre des procédures établies. C’est utile, mais cela a un coût. Le personnel peut prendre une alerte pour une consigne, même quand la réponse standard ne convient pas à un patient donné. C’est ce qu’on appelle le biais d’automatisation. Ici, une infirmière a repéré le problème. Si le personnel n’a plus le temps ou l’autorité de contester une alerte, la même erreur pourrait toucher de nombreux patients.", "escalation": "L’IA devient plus performante et s’intègre plus profondément au diagnostic, au triage et aux décisions de traitement. Les hôpitaux pourraient lui confier de plus en plus de travail. Si le contrôle humain devient une formalité, une seule erreur d’un modèle pourrait se répéter chez de nombreux patients avant que quelqu’un ne s’en aperçoive."}, "de": {"title": "Medizinischer KI-Alarm führte beinahe zu falscher Behandlung", "domain": "Gesundheitswesen", "hook": "ein einziger falscher Alarm", "real": "Ein KI-System im Krankenhaus soll für einen älteren Dialysepatienten einen **Sepsis-Alarm** ausgelöst haben. Die übliche Reaktion, **Flüssigkeit über die Vene**, hätte diesem Patienten schaden können. Eine Pflegekraft bemerkte es, und ein Arzt änderte die Behandlung.", "fake": "Ein KI-System, das im Krankenhaus **die OP-Säle plant**, soll eine Notiz in einer Patientenakte falsch gelesen und **eine dringende Operation hinter Routineeingriffe gesetzt** haben. Eine Pflegekraft bemerkte es, bevor die Verzögerung Schaden anrichtete.", "excerpt": "Eine Pflegekraft des St. Rose Dominican Hospital soll einen Vorfall geschildert haben, bei dem ein KI-System des Krankenhauses mutmaßlich einen Sepsis-Alarm erzeugte.", "explanation": "Ein KI-System im Krankenhaus soll für einen älteren Dialysepatienten einen Sepsis-Alarm ausgelöst haben. Zur üblichen Notfallreaktion gehört Flüssigkeit über die Vene. Eine Pflegekraft erkannte, dass die Flüssigkeit diesen Patienten gefährlich überlasten könnte. Ein Arzt griff ein und änderte die Behandlung.", "whyBad": "Krankenhäuser nutzen solche Werkzeuge, um schnell zu handeln und festen Abläufen zu folgen. Das ist nützlich, hat aber einen Preis. Das Personal kann einen Alarm wie eine Anweisung behandeln, auch wenn die Standardreaktion für einen bestimmten Patienten falsch ist. Das nennt man Automatisierungsbias. Hier hat eine Pflegekraft das Problem bemerkt. Wenn dem Personal die Zeit oder die Befugnis fehlt, einen Alarm zu hinterfragen, könnte derselbe Fehler viele Patienten treffen.", "escalation": "KI wird leistungsfähiger und tiefer in Diagnose, Triage und Behandlungsentscheidungen eingebaut. Krankenhäuser könnten ihr immer mehr Arbeit überlassen. Wenn die Kontrolle durch Menschen zur Formsache wird, könnte sich ein einziger Modellfehler bei vielen Patienten wiederholen, bevor es jemand bemerkt."}, "ru": {"title": "Медицинское оповещение ИИ едва не привело к неподходящему лечению", "domain": "Здравоохранение", "hook": "одно ошибочное оповещение", "real": "Больничная ИИ-система, по имеющимся данным, выдала **оповещение о сепсисе** для пожилого пациента на диализе. Обычная мера в таких случаях, **капельница с жидкостью**, могла ему навредить. Медсестра это заметила, и врач изменил лечение.", "fake": "Больничная ИИ-система, которая **составляет расписание операционных**, по имеющимся данным, неверно прочитала запись в карте пациента и **поставила срочную операцию после плановых**. Медсестра заметила это раньше, чем задержка причинила вред.", "excerpt": "Медсестра больницы St. Rose Dominican, по имеющимся данным, описала случай, когда больничная ИИ-система предположительно сгенерировала оповещение о сепсисе.", "explanation": "Больничная ИИ-система, по имеющимся данным, выдала оповещение о сепсисе для пожилого пациента на диализе. Стандартная срочная мера включает внутривенное введение жидкости. Медсестра поняла, что этому пациенту жидкость может опасно перегрузить организм. Врач вмешался и изменил лечение.", "whyBad": "Такие инструменты помогают больницам действовать быстро и по протоколу. Это полезно, но у этого есть цена. Персонал может воспринять оповещение как указание, даже если стандартная мера не подходит конкретному пациенту. Это называют автоматизационной предвзятостью. Здесь ошибку заметила медсестра. Если у персонала не останется времени или права оспорить оповещение, та же ошибка может затронуть многих пациентов.", "escalation": "ИИ становится способнее и глубже встраивается в диагностику, сортировку пациентов и решения о лечении. Больницы могут передавать ему всё больше работы. Если проверка человеком станет формальностью, одна ошибка модели сможет повториться у многих пациентов, прежде чем её заметят."}, "it": {"title": "Un allarme medico dell’IA ha quasi portato a un trattamento inappropriato", "domain": "Sanità", "hook": "un solo allarme sbagliato", "real": "Un sistema di IA ospedaliero avrebbe generato un **allarme di sepsi** per un paziente anziano in dialisi. La risposta abituale, i **liquidi per via endovenosa**, avrebbe potuto danneggiare questo paziente. Un’infermiera se n’è accorta e un medico ha cambiato il trattamento.", "fake": "Un sistema di IA ospedaliero che **pianifica le sale operatorie** avrebbe letto male una nota nella cartella di un paziente e **messo un intervento urgente dopo quelli di routine**. Un’infermiera se n’è accorta prima che il ritardo causasse danni.", "excerpt": "Un’infermiera del St. Rose Dominican Hospital avrebbe descritto un episodio in cui un sistema di IA dell’ospedale avrebbe generato un allarme di sepsi.", "explanation": "Un sistema di IA ospedaliero avrebbe generato un allarme di sepsi per un paziente anziano in dialisi. La risposta d’urgenza standard comprende liquidi per via endovenosa. Un’infermiera ha capito che i liquidi potevano sovraccaricare pericolosamente questo paziente. Un medico è intervenuto e ha cambiato il trattamento.", "whyBad": "Gli ospedali usano strumenti come questo per agire in fretta e seguire procedure stabilite. È utile, ma ha un costo. Il personale può trattare un allarme come un ordine, anche quando la risposta standard è sbagliata per un certo paziente. Questo si chiama bias da automazione. Qui un’infermiera ha notato il problema. Se il personale non ha più il tempo o l’autorità di mettere in dubbio un allarme, lo stesso errore potrebbe raggiungere molti pazienti.", "escalation": "L’IA diventa più capace e viene integrata più a fondo in diagnosi, triage e decisioni sulle cure. Gli ospedali potrebbero affidarle sempre più lavoro. Se il controllo umano diventa una formalità, un solo errore di un modello potrebbe ripetersi su molti pazienti prima che qualcuno se ne accorga."}, "es": {"title": "Una alerta médica de IA casi provocó un tratamiento inadecuado", "domain": "Sanidad", "hook": "una sola alerta equivocada", "real": "Un sistema de IA hospitalario habría generado una **alerta de sepsis** para un paciente mayor en diálisis. La respuesta habitual, **líquidos por vía intravenosa**, podría haber dañado a este paciente. Una enfermera lo notó y un médico cambió el tratamiento.", "fake": "Un sistema de IA hospitalario que **programa los quirófanos** habría leído mal una nota en la historia de un paciente y **colocado una operación urgente detrás de las de rutina**. Una enfermera lo notó antes de que el retraso causara daño.", "excerpt": "Según se informa, una enfermera del hospital St. Rose Dominican describió un episodio en el que un sistema de IA del hospital presuntamente generó una alerta de sepsis.", "explanation": "Un sistema de IA hospitalario habría generado una alerta de sepsis para un paciente mayor en diálisis. La respuesta de urgencia estándar incluye líquidos por vía intravenosa. Una enfermera vio que los líquidos podían sobrecargar peligrosamente a este paciente. Un médico intervino y cambió el tratamiento.", "whyBad": "Los hospitales usan herramientas como esta para actuar rápido y seguir procedimientos establecidos. Es útil, pero tiene un coste. El personal puede tratar una alerta como una orden, incluso cuando la respuesta estándar no es adecuada para un paciente concreto. Esto se llama sesgo de automatización. Aquí una enfermera detectó el problema. Si el personal ya no tiene tiempo o autoridad para cuestionar una alerta, el mismo error podría llegar a muchos pacientes.", "escalation": "La IA es cada vez más capaz y se integra más a fondo en el diagnóstico, el triaje y las decisiones de tratamiento. Los hospitales podrían dejarle cada vez más trabajo. Si la supervisión humana se convierte en una formalidad, un solo error de un modelo podría repetirse en muchos pacientes antes de que alguien lo note."}, "ko": {"title": "AI 의료 경보가 부적절한 치료로 이어질 뻔한 사례", "domain": "의료", "hook": "잘못된 경보 하나", "real": "병원의 AI 시스템이 투석을 받는 고령 환자에게 **패혈증 경보**를 낸 것으로 알려졌습니다. 통상적인 대응인 **정맥 수액 투여**는 이 환자에게 해로울 수 있었습니다. 간호사가 이를 알아차렸고 의사가 치료를 바꿨습니다.", "fake": "**수술실 일정을 짜는** 병원 AI 시스템이 환자 기록의 메모를 잘못 읽고 **응급 수술을 일반 수술 뒤로 배정한** 것으로 알려졌습니다. 지연으로 피해가 생기기 전에 간호사가 이를 알아차렸습니다.", "excerpt": "St. Rose Dominican 병원의 한 간호사가 병원 AI 시스템이 패혈증 경보를 생성한 것으로 추정되는 사례를 설명한 것으로 알려졌다.", "explanation": "병원의 AI 시스템이 투석을 받는 고령 환자에게 패혈증 경보를 낸 것으로 알려졌습니다. 표준 응급 대응에는 정맥 수액 투여가 포함됩니다. 간호사는 수액이 이 환자에게 위험한 과부하를 줄 수 있다는 점을 알아차렸습니다. 의사가 개입해 치료를 바꿨습니다.", "whyBad": "병원은 빠르게 대응하고 정해진 절차를 따르기 위해 이런 도구를 씁니다. 유용하지만 대가가 있습니다. 표준 대응이 특정 환자에게 맞지 않을 때도 의료진이 경보를 지시처럼 받아들일 수 있습니다. 이를 자동화 편향이라고 합니다. 이번에는 간호사가 문제를 발견했습니다. 의료진에게 경보에 의문을 제기할 시간이나 권한이 없어지면 같은 실수가 많은 환자에게 미칠 수 있습니다.", "escalation": "AI는 더 유능해지고 있고 진단, 중증도 분류, 치료 결정에 더 깊이 들어가고 있습니다. 병원은 AI에 점점 더 많은 일을 맡길 수 있습니다. 사람의 감독이 형식에 그치면, 모델의 오류 하나가 누군가 알아차리기 전에 많은 환자에게 반복될 수 있습니다."}, "zh": {"title": "AI 医疗警报差点导致不当治疗", "domain": "医疗", "hook": "一次错误的警报", "real": "据报道，一家医院的AI系统为一名正在透析的老年患者发出了**脓毒症警报**。常规的处理方式是**静脉输液**，这可能会伤害这名患者。一名护士注意到了这一点，医生随后更改了治疗方案。", "fake": "据报道，一家医院**负责排手术室的**AI系统读错了一名患者病历中的备注，**把一台急诊手术排在了常规手术之后**。一名护士在延误造成伤害之前发现了问题。", "excerpt": "据报道，St. Rose Dominican 医院的一名护士描述了一起医院 AI 系统疑似生成败血症警报的事件。", "explanation": "据报道，一家医院的AI系统为一名正在透析的老年患者发出了脓毒症警报。标准的急救处理包括静脉输液。一名护士意识到，输液可能让这名患者的身体负荷过重，十分危险。一名医生介入并更改了治疗方案。", "whyBad": "医院使用这类工具，是为了快速行动并遵循既定流程。这很有用，但也有代价。即使标准处理并不适合某位患者，医护人员也可能把警报当成指令。这种现象叫作自动化偏见。这一次，是一名护士发现了问题。如果医护人员不再有时间或权限去质疑警报，同样的错误就可能波及许多患者。", "escalation": "AI的能力越来越强，也越来越深地嵌入诊断、分诊和治疗决策。医院可能会把越来越多的工作交给它。如果人的监督变成走形式，模型的一个错误就可能在许多患者身上重复，直到有人发现。"}, "sr": {"title": "Медицинско упозорење ВИ замало довело до неодговарајућег лечења", "domain": "Здравство", "hook": "једно погрешно упозорење", "real": "Болнички систем вештачке интелигенције је, према наводима, издао **упозорење на сепсу** за старијег пацијента на дијализи. Уобичајена реакција, **течност у вену**, могла је да нашкоди овом пацијенту. Медицинска сестра је то приметила и лекар је променио терапију.", "fake": "Болнички систем вештачке интелигенције који **прави распоред операционих сала** је, према наводима, погрешно прочитао белешку у картону пацијента и **ставио хитну операцију иза рутинских**. Медицинска сестра је то приметила пре него што је кашњење нанело штету.", "excerpt": "Медицинска сестра болнице St. Rose Dominican је, како се наводи, описала случај у ком је болнички ВИ систем наводно генерисао упозорење на сепсу.", "explanation": "Болнички систем вештачке интелигенције је, према наводима, издао упозорење на сепсу за старијег пацијента на дијализи. Стандардна хитна реакција укључује течност у вену. Медицинска сестра је схватила да течност може опасно да оптерети овог пацијента. Лекар је интервенисао и променио терапију.", "whyBad": "Болнице користе овакве алате да би деловале брзо и пратиле утврђене процедуре. То је корисно, али има цену. Особље може да схвати упозорење као наредбу, чак и када стандардна реакција није добра за одређеног пацијента. То се зове пристрасност аутоматизације. Овде је проблем приметила медицинска сестра. Ако особље више нема времена или овлашћења да доведе упозорење у питање, иста грешка би могла да погоди много пацијената.", "escalation": "Вештачка интелигенција постаје способнија и дубље се уграђује у дијагностику, тријажу и одлуке о лечењу. Болнице би могле да јој препуштају све више посла. Ако људски надзор постане формалност, једна грешка модела могла би да се понови код много пацијената пре него што је ико примети."}, "bs": {"title": "Medicinsko upozorenje UI zamalo dovelo do neodgovarajućeg liječenja", "domain": "Zdravstvo", "hook": "jedno pogrešno upozorenje", "real": "Bolnički AI sistem je, prema navodima, izdao **upozorenje na sepsu** za starijeg pacijenta na dijalizi. Uobičajena reakcija, **tečnost u venu**, mogla je naškoditi ovom pacijentu. Medicinska sestra je to primijetila i ljekar je promijenio terapiju.", "fake": "Bolnički AI sistem koji **pravi raspored operacionih sala** je, prema navodima, pogrešno pročitao bilješku u kartonu pacijenta i **stavio hitnu operaciju iza rutinskih**. Medicinska sestra je to primijetila prije nego što je kašnjenje nanijelo štetu.", "excerpt": "Medicinska sestra bolnice St. Rose Dominican je, kako se navodi, opisala slučaj u kojem je bolnički UI sistem navodno generisao upozorenje na sepsu.", "explanation": "Bolnički AI sistem je, prema navodima, izdao upozorenje na sepsu za starijeg pacijenta na dijalizi. Standardna hitna reakcija uključuje tečnost u venu. Medicinska sestra je shvatila da tečnost može opasno opteretiti ovog pacijenta. Ljekar je intervenisao i promijenio terapiju.", "whyBad": "Bolnice koriste ovakve alate da bi djelovale brzo i pratile utvrđene procedure. To je korisno, ali ima cijenu. Osoblje može shvatiti upozorenje kao naredbu, čak i kada standardna reakcija nije dobra za određenog pacijenta. To se zove pristrasnost automatizacije. Ovdje je problem primijetila medicinska sestra. Ako osoblje više nema vremena ili ovlaštenja da dovede upozorenje u pitanje, ista greška bi mogla pogoditi mnogo pacijenata.", "escalation": "AI postaje sposobniji i dublje se ugrađuje u dijagnostiku, trijažu i odluke o liječenju. Bolnice bi mu mogle prepuštati sve više posla. Ako ljudski nadzor postane formalnost, jedna greška modela mogla bi se ponoviti kod mnogo pacijenata prije nego što je iko primijeti."}, "ro": {"title": "O alertă medicală IA a fost cât pe ce să ducă la un tratament nepotrivit", "domain": "Sănătate", "hook": "o singură alertă greșită", "real": "Un sistem de IA dintr-un spital ar fi emis o **alertă de sepsis** pentru un pacient în vârstă aflat la dializă. Răspunsul obișnuit, **lichide administrate intravenos**, i-ar fi putut face rău acestui pacient. O asistentă a observat, iar un medic a schimbat tratamentul.", "fake": "Un sistem de IA dintr-un spital care **programează sălile de operație** ar fi citit greșit o notă din fișa unui pacient și ar fi **pus o operație urgentă după cele de rutină**. O asistentă a observat înainte ca întârzierea să facă rău.", "excerpt": "O asistentă de la spitalul St. Rose Dominican ar fi descris un episod în care un sistem IA al spitalului ar fi generat o alertă de sepsis.", "explanation": "Un sistem de IA dintr-un spital ar fi emis o alertă de sepsis pentru un pacient în vârstă aflat la dializă. Răspunsul standard de urgență include lichide administrate intravenos. O asistentă și-a dat seama că lichidele îl puteau supraîncărca periculos pe acest pacient. Un medic a intervenit și a schimbat tratamentul.", "whyBad": "Spitalele folosesc astfel de instrumente ca să acționeze repede și să urmeze proceduri stabilite. Este util, dar are un cost. Personalul poate trata o alertă ca pe un ordin, chiar și atunci când răspunsul standard este greșit pentru un anumit pacient. Acest lucru se numește bias de automatizare. Aici, o asistentă a observat problema. Dacă personalul nu mai are timpul sau autoritatea de a pune la îndoială o alertă, aceeași greșeală ar putea ajunge la mulți pacienți.", "escalation": "IA devine mai capabilă și este integrată mai adânc în diagnostic, triaj și decizii de tratament. Spitalele i-ar putea lăsa tot mai multă muncă. Dacă supravegherea umană devine o formalitate, o singură greșeală a unui model s-ar putea repeta la mulți pacienți înainte să o observe cineva."}, "vi": {"title": "Cảnh báo y tế của AI suýt dẫn đến điều trị không phù hợp", "domain": "Y tế", "hook": "một cảnh báo sai", "real": "Một hệ thống AI của bệnh viện được cho là đã đưa ra **cảnh báo nhiễm trùng huyết** cho một bệnh nhân lớn tuổi đang chạy thận. Cách xử lý thông thường là **truyền dịch qua tĩnh mạch**, có thể gây hại cho bệnh nhân này. Một y tá đã nhận ra điều đó và bác sĩ đã đổi cách điều trị.", "fake": "Một hệ thống AI của bệnh viện chuyên **xếp lịch phòng mổ** được cho là đã đọc sai một ghi chú trong hồ sơ bệnh nhân và **xếp một ca mổ khẩn cấp sau các ca mổ thường quy**. Một y tá đã nhận ra trước khi sự chậm trễ gây hại.", "excerpt": "Một y tá tại bệnh viện St. Rose Dominican được cho là đã kể về một trường hợp hệ thống AI của bệnh viện được cho là đã đưa ra cảnh báo nhiễm trùng huyết.", "explanation": "Một hệ thống AI của bệnh viện được cho là đã đưa ra cảnh báo nhiễm trùng huyết cho một bệnh nhân lớn tuổi đang chạy thận. Cách xử lý khẩn cấp tiêu chuẩn bao gồm truyền dịch qua tĩnh mạch. Một y tá nhận thấy dịch truyền có thể gây quá tải nguy hiểm cho bệnh nhân này. Một bác sĩ đã can thiệp và đổi cách điều trị.", "whyBad": "Bệnh viện dùng những công cụ như vậy để hành động nhanh và làm theo quy trình có sẵn. Điều đó có ích, nhưng cũng có cái giá. Nhân viên có thể coi cảnh báo như một mệnh lệnh, ngay cả khi cách xử lý tiêu chuẩn không phù hợp với một bệnh nhân cụ thể. Hiện tượng này gọi là thiên kiến tự động hóa. Ở đây, một y tá đã phát hiện vấn đề. Nếu nhân viên không còn thời gian hoặc thẩm quyền để đặt câu hỏi về một cảnh báo, cùng một sai sót có thể ảnh hưởng đến nhiều bệnh nhân.", "escalation": "AI ngày càng có năng lực hơn và được đưa sâu hơn vào chẩn đoán, phân loại bệnh nhân và quyết định điều trị. Bệnh viện có thể giao cho AI ngày càng nhiều việc. Nếu sự giám sát của con người chỉ còn là hình thức, một lỗi của mô hình có thể lặp lại ở nhiều bệnh nhân trước khi có người nhận ra."}, "uk": {"title": "Медичне сповіщення åtgärden, **vätska direkt i blodet**, kunde ha skadat den här patienten. En sjuksköterska märkte det och en läkare ändrade behandlingen.", "fake": "Ett AI-system på ett sjukhus som **schemalägger operationssalarna** ska ha läst en anteckning i en patientjournal fel och **lagt en akut operation efter rutiningreppen**. En sjuksköterska märkte det innan förseningen hann orsaka skada.", "excerpt": "En sjuksköterska vid St. Rose Dominican Hospital ska ha beskrivit en händelse där ett AI-system på sjukhuset påstås ha genererat ett sepsislarm.", "explanation": "Ett AI-system på ett sjukhus ska ha gett ett sepsislarm för en äldre dialyspatient. Den vanliga akuta åtgärden innefattar vätska direkt i blodet. En sjuksköterska insåg att vätskan kunde överbelasta den här patienten på ett farligt sätt. En läkare ingrep och ändrade behandlingen.", "whyBad": "Sjukhus använder sådana verktyg för att agera snabbt och följa fasta rutiner. Det är användbart, men det har ett pris. Personalen kan behandla ett larm som en order, även när standardåtgärden är fel för en viss patient. Det kallas automationsbias. Här upptäckte en sjuksköterska problemet. Om personalen inte längre har tid eller befogenhet att ifrågasätta ett larm kan samma misstag drabba många patienter.", "escalation": "AI blir mer kapabel och byggs in djupare i diagnostik, triage och behandlingsbeslut. Sjukhus kan komma att lämna över allt mer arbete till den. Om den mänskliga kontrollen blir en formalitet kan ett enda fel i en modell upprepas hos många patienter innan någon märker det."}, "tr": {"title": "Yapay zekâ tıbbi uyarısı neredeyse uygunsuz bir tedaviye yol açıyordu", "domain": "Sağlık", "hook": "tek bir yanlış uyarı", "real": "Bir hastane yapay zekâ sisteminin, diyalize giren yaşlı bir hasta için **sepsis uyarısı** verdiği bildirildi. Olağan müdahale olan **damardan sıvı verilmesi** bu hastaya zarar verebilirdi. Bir hemşire bunu fark etti ve bir doktor tedaviyi değiştirdi.", "fake": "**Ameliyathane programını hazırlayan** bir hastane yapay zekâ sisteminin, bir hastanın dosyasındaki notu yanlış okuduğu ve **acil bir ameliyatı rutin ameliyatların arkasına koyduğu** bildirildi. Bir hemşire, gecikme zarar vermeden önce bunu fark etti.", "excerpt": "St. Rose Dominican Hastanesi'nden bir hemşirenin, hastanedeki bir yapay zekâ sisteminin iddiaya göre sepsis uyarısı ürettiği bir olayı anlattığı bildirildi.", "explanation": "Bir hastane yapay zekâ sisteminin, diyalize giren yaşlı bir hasta için sepsis uyarısı verdiği bildirildi. Standart acil müdahale damardan sıvı verilmesini içerir. Bir hemşire, sıvının bu hastayı tehlikeli biçimde yükleyebileceğini fark etti. Bir doktor devreye girdi ve tedaviyi değiştirdi.", "whyBad": "Hastaneler bu tür araçları hızlı davranmak ve belirlenmiş prosedürleri izlemek için kullanır. Bu yararlıdır ama bir bedeli vardır. Personel, standart müdahale belirli bir hasta için yanlış olsa bile uyarıyı bir talimat gibi görebilir. Buna otomasyon yanlılığı denir. Burada sorunu bir hemşire fark etti. Personelin bir uyarıyı sorgulayacak zamanı ya da yetkisi kalmazsa aynı hata birçok hastaya ulaşabilir.", "escalation": "Yapay zekâ daha yetenekli hâle geliyor ve tanıya, triyaja ve tedavi kararlarına daha derinden yerleşiyor. Hastaneler ona giderek daha fazla iş bırakabilir. İnsan denetimi bir formaliteye dönüşürse, bir modelin tek bir hatası kimse fark etmeden birçok hastada tekrarlanabilir."}}}, {"id": 1606, "url": "https://incidentdatabase.ai/cite/1606/", "building": "cityhall", "text": {"en": {"title": "Facial verification and access to social benefits", "domain": "Public services", "hook": "one failed face check", "real": "A **face-check portal** reportedly kept failing. This was one of the reasons some people **could not get their social benefits**.", "fake": "An AI system that **sorts letters from residents** reportedly sent hundreds of benefit appeals to the wrong department. People **missed their appeal deadlines** before anyone noticed.", "excerpt": "South African social grant beneficiaries reportedly encountered repeated failures in SASSA's eLife facial-verification portal.", "explanation": "In South Africa, people receiving social grants reportedly ran into repeated failures on a face-check portal run by the government agency SASSA. Reports to parliament later said that failed face recognition was one cause of people not being verified. They also confirmed 67,868 grant suspensions in one quarter. They did not say how many of those were caused by face-check failures.", "whyBad": "When access to basic support depends on an automated identity check, a wrong rejection is serious. For someone living on a grant, it can mean no money for food, rent, transport or medicine. Because one system serves everyone, one fault can hit many people at once. And fixing the error often falls on the people with the least time, money and internet access to appeal.", "escalation": "Governments and companies are using face checks and other AI identity checks for benefits, banking, insurance, jobs and building access. If these systems spread faster than backup options, audits and appeal routes, more people could be shut out automatically, with little chance to contest it."}, "fr": {"title": "Vérification faciale et accès aux aides sociales", "domain": "Services publics", "hook": "une seule vérification faciale ratée", "real": "Un **portail de vérification faciale** aurait connu des pannes à répétition. C’est l’une des raisons pour lesquelles certaines personnes **n’ont pas pu toucher leurs aides sociales**.", "fake": "Un système d’IA qui **trie le courrier des habitants** aurait envoyé des centaines de recours concernant des aides au mauvais service. Des personnes ont **dépassé le délai de recours** avant que quiconque ne s’en aperçoive.", "excerpt": "Des bénéficiaires d’allocations sociales en Afrique du Sud auraient rencontré des échecs répétés sur le portail de vérification faciale eLife de la SASSA.", "explanation": "En Afrique du Sud, des bénéficiaires d’allocations sociales auraient rencontré des pannes répétées sur un portail de vérification faciale géré par l’agence publique SASSA. Des rapports au parlement ont ensuite indiqué que l’échec de la reconnaissance faciale était l’une des causes de non-vérification. Ils ont aussi confirmé 67 868 suspensions d’allocations en un trimestre. Ils n’ont pas précisé combien étaient dues à la vérification faciale.", "whyBad": "Quand l’accès à une aide de base dépend d’un contrôle d’identité automatisé, un refus erroné est grave. Pour une personne qui vit d’une allocation, cela peut vouloir dire pas d’argent pour se nourrir, se loger, se déplacer ou se soigner. Comme un seul système sert tout le monde, une seule panne peut toucher beaucoup de gens à la fois. Et corriger l’erreur revient souvent à ceux qui ont le moins de temps, d’argent et d’accès à internet pour faire appel.", "escalation": "Les États et les entreprises utilisent la vérification faciale et d’autres contrôles d’identité par IA pour les aides, la banque, l’assurance, l’emploi et l’accès aux bâtiments. Si ces systèmes se répandent plus vite que les solutions de secours, les audits et les voies de recours, davantage de personnes pourraient être exclues automatiquement, avec peu de moyens de contester."}, "de": {"title": "Gesichtsverifikation und Zugang zu Sozialleistungen", "domain": "Öffentliche Dienste", "hook": "eine einzige fehlgeschlagene Gesichtsprüfung", "real": "Ein **Portal zur Gesichtsprüfung** soll immer wieder ausgefallen sein. Das war einer der Gründe, warum manche Menschen **ihre Sozialleistungen nicht erhielten**.", "fake": "Ein KI-System, das **Briefe von Bürgern sortiert**, soll Hunderte Widersprüche zu Sozialleistungen an die falsche Abteilung geschickt haben. Menschen **versäumten die Widerspruchsfrist**, bevor es jemand bemerkte.", "excerpt": "Empfänger von Sozialleistungen in Südafrika sollen wiederholt Fehlschläge im eLife-Portal zur Gesichtsverifikation der SASSA erlebt haben.", "explanation": "In Südafrika sollen Empfänger von Sozialleistungen immer wieder auf Ausfälle in einem Portal zur Gesichtsprüfung gestoßen sein, das die staatliche Behörde SASSA betreibt. Berichte an das Parlament nannten später fehlgeschlagene Gesichtserkennung als eine Ursache dafür, dass Menschen nicht verifiziert wurden. Sie bestätigten außerdem 67.868 ausgesetzte Leistungen in einem Quartal. Wie viele davon auf die Gesichtsprüfung zurückgingen, sagten sie nicht.", "whyBad": "Wenn der Zugang zu grundlegender Unterstützung von einer automatischen Identitätsprüfung abhängt, ist eine falsche Ablehnung ernst. Für jemanden, der von einer Leistung lebt, kann sie bedeuten: kein Geld für Essen, Miete, Fahrten oder Medikamente. Weil ein System alle bedient, kann ein einziger Fehler viele Menschen zugleich treffen. Und den Fehler zu beheben, bleibt oft an denen hängen, die am wenigsten Zeit, Geld und Internetzugang für einen Widerspruch haben.", "escalation": "Staaten und Unternehmen nutzen Gesichtsprüfungen und andere KI-Identitätsprüfungen für Sozialleistungen, Banken, Versicherungen, Jobs und den Zugang zu Gebäuden. Wenn sich diese Systeme schneller verbreiten als Ausweichmöglichkeiten, Kontrollen und Beschwerdewege, könnten mehr Menschen automatisch ausgeschlossen werden und kaum eine Chance haben, sich zu wehren."}, "ru": {"title": "Верификация по лицу и доступ к социальным выплатам", "domain": "Социальные услуги", "hook": "одна неудачная проверка лица", "real": "**Портал проверки по лицу**, по имеющимся данным, раз за разом давал сбой. Это стало одной из причин, по которым часть людей **не могла получить социальные выплаты**.", "fake": "ИИ-система, которая **сортирует письма от жителей**, по имеющимся данным, отправила сотни жалоб на отказ в пособиях не в тот отдел. Люди **пропустили срок обжалования**, прежде чем это заметили.", "excerpt": "Получатели социальных пособий в ЮАР, по имеющимся данным, сталкивались с повторяющимися сбоями на портале верификации по лицу eLife агентства SASSA.", "explanation": "В ЮАР получатели социальных пособий, по имеющимся данным, раз за разом сталкивались со сбоями на портале проверки по лицу, который ведёт государственное агентство SASSA. Позже в отчётах для парламента говорилось, что неудачное распознавание лица было одной из причин, по которым люди не проходили проверку. Там же подтверждалась приостановка 67 868 выплат за один квартал. Сколько из них вызвано именно сбоями проверки по лицу, не уточнялось.", "whyBad": "Когда доступ к базовой поддержке зависит от автоматической проверки личности, ложный отказ обходится дорого. Для человека, живущего на пособие, это может означать отсутствие денег на еду, жильё, транспорт или лекарства. Одна система обслуживает всех, поэтому один сбой бьёт сразу по многим. А исправлять ошибку часто приходится тем, у кого меньше всего времени, денег и доступа к интернету, чтобы подать жалобу.", "escalation": "Государства и компании всё шире применяют проверку по лицу и другие ИИ-проверки личности: для пособий, банков, страховок, работы и доступа в здания. Если такие системы распространяются быстрее, чем запасные варианты, аудит и способы обжалования, всё больше людей могут автоматически остаться без доступа и почти без возможности это оспорить."}, "it": {"title": "Verifica facciale e accesso ai sussidi sociali", "domain": "Servizi pubblici", "hook": "una sola verifica facciale fallita", "real": "Un **portale di verifica facciale** avrebbe continuato a dare errori. È stato uno dei motivi per cui alcune persone **non sono riuscite a ottenere i sussidi sociali**.", "fake": "Un sistema di IA che **smista le lettere dei cittadini** avrebbe inviato centinaia di ricorsi sui sussidi all’ufficio sbagliato. Le persone hanno **perso i termini per il ricorso** prima che qualcuno se ne accorgesse.", "excerpt": "I beneficiari di sussidi sociali in Sudafrica avrebbero riscontrato ripetuti errori nel portale di verifica facciale eLife della SASSA.", "explanation": "In Sudafrica, chi riceveva sussidi sociali avrebbe incontrato ripetuti errori su un portale di verifica facciale gestito dall’agenzia pubblica SASSA. Rapporti al parlamento hanno poi indicato il mancato riconoscimento facciale come una delle cause delle verifiche fallite. Hanno anche confermato 67.868 sospensioni di sussidi in un trimestre. Non hanno detto quante fossero dovute alla verifica facciale.", "whyBad": "Quando l’accesso a un sostegno di base dipende da un controllo automatico dell’identità, un rifiuto sbagliato è grave. Per chi vive di un sussidio può voler dire niente soldi per cibo, affitto, trasporti o medicine. Poiché un solo sistema serve tutti, un solo guasto può colpire molte persone insieme. E correggere l’errore tocca spesso a chi ha meno tempo, denaro e accesso a internet per fare ricorso.", "escalation": "Governi e aziende usano la verifica facciale e altri controlli d’identità basati sull’IA per sussidi, banche, assicurazioni, lavoro e accesso agli edifici. Se questi sistemi si diffondono più in fretta delle alternative, dei controlli e delle vie di ricorso, più persone potrebbero essere escluse in automatico, con poche possibilità di contestare."}, "es": {"title": "Verificación facial y acceso a prestaciones sociales", "domain": "Servicios públicos", "hook": "una sola verificación facial fallida", "real": "Un **portal de verificación facial** habría fallado una y otra vez. Fue una de las razones por las que algunas personas **no pudieron cobrar sus ayudas sociales**.", "fake": "Un sistema de IA que **clasifica las cartas de los ciudadanos** habría enviado cientos de recursos sobre ayudas al departamento equivocado. Las personas **perdieron el plazo para recurrir** antes de que alguien lo notara.", "excerpt": "Según se informa, beneficiarios de subsidios sociales en Sudáfrica sufrieron fallos repetidos en el portal de verificación facial eLife de la SASSA.", "explanation": "En Sudáfrica, beneficiarios de ayudas sociales se habrían encontrado con fallos repetidos en un portal de verificación facial gestionado por la agencia pública SASSA. Informes al parlamento señalaron después el fallo del reconocimiento facial como una de las causas de que no se verificara a algunas personas. También confirmaron 67.868 suspensiones de ayudas en un trimestre. No dijeron cuántas se debieron a la verificación facial.", "whyBad": "Cuando el acceso a un apoyo básico depende de una comprobación automática de identidad, un rechazo erróneo es grave. Para quien vive de una ayuda puede significar no tener dinero para comida, alquiler, transporte o medicinas. Como un solo sistema atiende a todos, un solo fallo puede afectar a muchas personas a la vez. Y corregir el error suele recaer en quienes tienen menos tiempo, dinero y acceso a internet para reclamar.", "escalation": "Gobiernos y empresas usan la verificación facial y otras comprobaciones de identidad con IA para ayudas, banca, seguros, empleo y acceso a edificios. Si estos sistemas se extienden más rápido que las alternativas, las auditorías y las vías de reclamación, más personas podrían quedar excluidas automáticamente, con pocas posibilidades de recurrir."}, "ko": {"title": "얼굴 인증과 사회복지 급여 접근", "domain": "공공 서비스", "hook": "실패한 얼굴 인증 한 번", "real": "**얼굴 인증 포털**이 계속 오류를 낸 것으로 알려졌습니다. 일부 사람들이 **사회 보조금을 받지 못한** 이유 가운데 하나였습니다.", "fake": "**주민의 편지를 분류하는** AI 시스템이 보조금 관련 이의 신청 수백 건을 엉뚱한 부서로 보낸 것으로 알려졌습니다. 누군가 알아차리기 전에 사람들은 **이의 신청 기한을 놓쳤습니다**.", "excerpt": "남아프리카공화국의 사회보장 급여 수급자들이 SASSA의 eLife 얼굴 인증 포털에서 반복적인 실패를 겪은 것으로 알려졌다.", "explanation": "남아프리카공화국에서 사회 보조금 수급자들이 국가 기관 SASSA가 운영하는 얼굴 인증 포털에서 반복적으로 오류를 겪은 것으로 알려졌습니다. 이후 의회 보고서는 얼굴 인식 실패를 사람들이 인증받지 못한 원인 가운데 하나로 꼽았습니다. 보고서는 한 분기에 보조금 67,868건이 중단됐다는 점도 확인했습니다. 그중 몇 건이 얼굴 인증 때문이었는지는 밝히지 않았습니다.", "whyBad": "기본적인 지원을 받는 일이 자동 신원 확인에 달려 있으면 잘못된 거부는 심각한 문제입니다. 보조금으로 사는 사람에게는 식비, 집세, 교통비, 약값이 없다는 뜻일 수 있습니다. 하나의 시스템이 모두를 처리하기 때문에 한 번의 장애가 많은 사람에게 한꺼번에 영향을 줄 수 있습니다. 그리고 오류를 바로잡는 부담은 이의를 제기할 시간, 돈, 인터넷 접근이 가장 부족한 사람들에게 돌아가는 경우가 많습니다.", "escalation": "정부와 기업은 보조금, 은행, 보험, 일자리, 건물 출입에 얼굴 인증과 그 밖의 AI 신원 확인을 쓰고 있습니다. 이런 시스템이 대체 수단, 감사, 이의 제기 절차보다 빨리 퍼지면, 더 많은 사람이 이의를 제기할 기회도 거의 없이 자동으로 배제될 수 있습니다."}, "zh": {"title": "人脸核验与社会福利的获取", "domain": "公共服务", "hook": "一次失败的人脸核验", "real": "据报道，一个**人脸验证门户**反复出现故障。这是一些人**无法领取社会救助金**的原因之一。", "fake": "据报道，一个**负责分拣居民来信的**AI系统把数百份关于救助金的申诉发到了错误的部门。在有人发现之前，人们已经**错过了申诉期限**。", "excerpt": "据报道，南非社会补助金领取者在 SASSA 的 eLife 人脸核验门户上反复遭遇核验失败。", "explanation": "据报道，在南非，社会救助金领取者在国家机构SASSA运营的人脸验证门户上反复遇到故障。提交给议会的报告后来指出，人脸识别失败是人们未能通过验证的原因之一。报告还确认，一个季度内有67,868笔救助金被暂停发放。报告没有说明其中有多少是人脸验证造成的。", "whyBad": "当获得基本援助取决于自动身份核验时，一次错误的拒绝后果很严重。对靠救助金生活的人来说，这可能意味着没有钱买食物、付房租、乘车或买药。由于一个系统服务所有人，一次故障就可能同时影响很多人。而纠正错误的负担，往往落在最缺少时间、金钱和上网条件去申诉的人身上。", "escalation": "政府和企业正在把人脸验证和其他AI身份核验用于救助金、银行、保险、就业和楼宇出入。如果这些系统推广的速度超过了备用方案、审计和申诉渠道，可能会有更多的人被自动排除在外，而且几乎没有申诉的机会。"}, "sr": {"title": "Провера лица и приступ социјалној помоћи", "domain": "Јавне услуге", "hook": "једна неуспела провера лица", "real": "**Портал за проверу лица** је, према наводима, стално отказивао. То је био један од разлога због којих неки људи **нису могли да добију социјалну помоћ**.", "fake": "Систем вештачке интелигенције који **разврстава писма грађана** је, према наводима, послао стотине жалби у вези са социјалном помоћи погрешном одељењу. Људи су **пропустили рок за жалбу** пре него што је ико то приметио.", "excerpt": "Корисници социјалних давања у Јужноафричкој Републици су, како се наводи, наилазили на поновљене неуспехе на SASSA порталу за проверу лица eLife.", "explanation": "У Јужној Африци су корисници социјалне помоћи, према наводима, више пута наилазили на кварове на порталу за проверу лица који води државна агенција SASSA. У извештајима парламенту је касније неуспело препознавање лица наведено као један од узрока тога што људи нису верификовани. Потврђено је и 67.868 обустављених исплата у једном кварталу. Није речено колико их је било због провере лица.", "whyBad": "Када приступ основној подршци зависи од аутоматске провере идентитета, погрешно одбијање је озбиљно. За некога ко живи од помоћи то може да значи да нема новца за храну, кирију, превоз или лекове. Пошто један систем опслужује све, један квар може да погоди много људи одједном. А исправљање грешке често пада на оне који имају најмање времена, новца и приступа интернету да се жале.", "escalation": "Државе и компаније користе проверу лица и друге провере идентитета помоћу вештачке интелигенције за социјалну помоћ, банкарство, осигурање, посао и улазак у зграде. Ако се ови системи буду ширили брже од резервних решења, ревизија и могућности жалбе, више људи би могло бити аутоматски искључено, скоро без шансе да се жали."}, "bs": {"title": "Provjera lica i pristup socijalnoj pomoći", "domain": "Javne usluge", "hook": "jedna neuspjela provjera lica", "real": "**Portal za provjeru lica** je, prema navodima, stalno otkazivao. To je bio jedan od razloga zbog kojih neki ljudi **nisu mogli dobiti socijalnu pomoć**.", "fake": "AI sistem koji **razvrstava pisma građana** je, prema navodima, poslao stotine žalbi u vezi sa socijalnom pomoći pogrešnom odjelu. Ljudi su **propustili rok za žalbu** prije nego što je iko to primijetio.", "excerpt": "Korisnici socijalnih davanja u Južnoafričkoj Republici su, kako se navodi, nailazili na ponovljene neuspjehe na SASSA portalu za provjeru lica eLife.", "explanation": "U Južnoj Africi su korisnici socijalne pomoći, prema navodima, više puta nailazili na kvarove na portalu za provjeru lica koji vodi državna agencija SASSA. U izvještajima parlamentu je kasnije neuspjelo prepoznavanje lica navedeno kao jedan od uzroka toga što ljudi nisu verificirani. Potvrđeno je i 67.868 obustavljenih isplata u jednom kvartalu. Nije rečeno koliko ih je bilo zbog provjere lica.", "whyBad": "Kada pristup osnovnoj podršci zavisi od automatske provjere identiteta, pogrešno odbijanje je ozbiljno. Za nekoga ko živi od pomoći to može značiti da nema novca za hranu, kiriju, prijevoz ili lijekove. Pošto jedan sistem opslužuje sve, jedan kvar može pogoditi mnogo ljudi odjednom. A ispravljanje greške često pada na one koji imaju najmanje vremena, novca i pristupa internetu da se žale.", "escalation": "Države i kompanije koriste provjeru lica i druge AI provjere identiteta za socijalnu pomoć, bankarstvo, osiguranje, posao i ulazak u zgrade. Ako se ovi sistemi budu širili brže od rezervnih rješenja, revizija i mogućnosti žalbe, više ljudi bi moglo biti automatski isključeno, skoro bez šanse da se žali."}, "ro": {"title": "Verificarea facială și accesul la beneficii sociale", "domain": "Servicii publice", "hook": "o singură verificare facială eșuată", "real": "Un **portal de verificare facială** ar fi dat erori în mod repetat. A fost unul dintre motivele pentru care unii oameni **nu și-au putut primi ajutoarele sociale**.", "fake": "Un sistem de IA care **sortează scrisorile cetățenilor** ar fi trimis sute de contestații privind ajutoarele sociale la departamentul greșit. Oamenii au **depășit termenul de contestație** înainte să observe cineva.", "excerpt": "Beneficiarii de alocații sociale din Africa de Sud s-ar fi confruntat cu eșecuri repetate pe portalul de verificare facială eLife al SASSA.", "explanation": "În Africa de Sud, beneficiarii de ajutoare sociale s-ar fi lovit în mod repetat de erori pe un portal de verificare facială administrat de agenția de stat SASSA. Rapoarte către parlament au numit ulterior eșecul recunoașterii faciale drept una dintre cauzele pentru care oamenii nu au fost verificați. Ele au confirmat și 67.868 de suspendări de ajutoare într-un trimestru. Nu au spus câte s-au datorat verificării faciale.", "whyBad": "Când accesul la un sprijin de bază depinde de o verificare automată a identității, un refuz greșit este grav. Pentru cineva care trăiește dintr-un ajutor poate însemna lipsa banilor pentru mâncare, chirie, transport sau medicamente. Pentru că un singur sistem îi deservește pe toți, o singură defecțiune poate afecta mulți oameni deodată. Iar repararea greșelii cade adesea pe cei care au cel mai puțin timp, bani și acces la internet pentru a contesta.", "escalation": "Guvernele și companiile folosesc verificarea facială și alte verificări de identitate cu IA pentru ajutoare sociale, bănci, asigurări, locuri de muncă și accesul în clădiri. Dacă aceste sisteme se răspândesc mai repede decât soluțiile de rezervă, auditurile și căile de contestare, mai mulți oameni ar putea fi excluși automat, aproape fără șanse de a contesta."}, "vi": {"title": "Xác minh khuôn mặt và quyền tiếp cận trợ cấp xã hội", "domain": "Dịch vụ công", "hook": "một lần xác minh khuôn mặt thất bại", "real": "Một **cổng xác minh khuôn mặt** được cho là đã liên tục gặp lỗi. Đó là một trong những lý do khiến một số người **không nhận được trợ cấp xã hội**.", "fake": "Một hệ thống AI chuyên **phân loại thư của người dân** được cho là đã gửi hàng trăm đơn khiếu nại về trợ cấp đến nhầm phòng ban. Người dân đã **lỡ hạn khiếu nại** trước khi có người nhận ra.", "excerpt": "Người nhận trợ cấp xã hội ở Nam Phi được cho là đã liên tục gặp lỗi trên cổng xác minh khuôn mặt eLife của SASSA.", "explanation": "Tại Nam Phi, những người nhận trợ cấp xã hội được cho là đã nhiều lần gặp lỗi trên một cổng xác minh khuôn mặt do cơ quan nhà nước SASSA vận hành. Các báo cáo gửi quốc hội sau đó nêu việc nhận dạng khuôn mặt thất bại là một trong những nguyên nhân khiến người dân không được xác minh. Các báo cáo cũng xác nhận 67.868 khoản trợ cấp bị đình chỉ trong một quý. Báo cáo không nói bao nhiêu trường hợp là do xác minh khuôn mặt.", "whyBad": "Khi việc tiếp cận hỗ trợ cơ bản phụ thuộc vào kiểm tra danh tính tự động, một lần từ chối sai là nghiêm trọng. Với người sống nhờ trợ cấp, điều đó có thể nghĩa là không có tiền cho thức ăn, tiền thuê nhà, đi lại hoặc thuốc men. Vì một hệ thống phục vụ tất cả mọi người, một lỗi có thể ảnh hưởng đến nhiều người cùng lúc. Và việc sửa lỗi thường rơi vào những người có ít thời gian, tiền bạc và khả năng truy cập internet nhất để khiếu nại.", "escalation": "Chính phủ và doanh nghiệp dùng xác minh khuôn mặt và các hình thức kiểm tra danh tính bằng AI khác cho trợ cấp, ngân hàng, bảo hiểm, việc làm và việc ra vào tòa nhà. Nếu các hệ thống này lan rộng nhanh hơn phương án dự phòng, hoạt động kiểm toán và kênh khiếu nại, nhiều người hơn có thể bị loại ra một cách tự động, gần như không có cơ hội khiếu nại."}, "uk": {"title": "Верифікація за обличчям і доступ до соціальних виплат", "domain": "Соціальні послуги", "hook": "одна невдала перевірка обличчя", "real": "**Портал перевірки особи за обличчям**, за наявними даними, раз у раз давав збої. Це стало однією з причин, через які деякі люди **не змогли отримати соціальні виплати**.", "fake": "ШІ-система, яка **сортує листи громадян**, за наявними даними, надіслала сотні скарг щодо виплат не до того відділу. Люди **пропустили строк оскарження**, перш ніж це хтось помітив.", "excerpt": "Отримувачі соціальних допомог у ПАР, за наявними даними, стикалися з повторюваними збоями на порталі верифікації за обличчям eLife агентства SASSA.", "explanation": "У Південній Африці отримувачі соціальних виплат, за наявними даними, стикалися з повторними збоями на порталі перевірки особи за обличчям, яким керує державне агентство SASSA. У звітах парламенту пізніше назвали невдале розпізнавання обличчя однією з причин того, що людей не вдалося верифікувати. Там також підтвердили 67 868 призупинень виплат за один квартал. Скільки з них сталося через перевірку обличчя, не уточнили.", "whyBad": "Коли доступ до базової підтримки залежить від автоматичної перевірки особи, хибна відмова є серйозною. Для людини, яка живе на виплату, вона може означати відсутність грошей на їжу, оренду, проїзд чи ліки. Оскільки одна система обслуговує всіх, один збій може зачепити багатьох людей одразу. А виправляти помилку часто доводиться тим, хто має найменше часу, грошей і доступу до інтернету для оскарження.", "escalation": "Держави й компанії використовують перевірку за обличчям та інші ШІ-перевірки особи для соціальних виплат, банків, страхування, роботи і доступу до будівель. Якщо ці системи поширюватимуться швидше, ніж запасні варіанти, аудити та способи оскарження, більше людей можуть бути виключені автоматично, майже без можливості оскаржити це."}, "pl": {"title": "Weryfikacja twarzy a dostęp do świadczeń socjalnych", "domain": "Usługi publiczne", "hook": "jedna nieudana weryfikacja twarzy", "real": "**Portal weryfikacji twarzy** miał raz po raz zawodzić. Był to jeden z powodów, dla których część osób **nie mogła otrzymać świadczeń socjalnych**.", "fake": "System AI, który **sortuje listy od mieszkańców**, miał wysłać setki odwołań w sprawie świadczeń do niewłaściwego wydziału. Ludzie **przekroczyli termin na odwołanie**, zanim ktokolwiek to zauważył.", "excerpt": "Beneficjenci zasiłków socjalnych w Republice Południowej Afryki mieli wielokrotnie napotykać błędy w portalu weryfikacji twarzy eLife agencji SASSA.", "explanation": "W RPA osoby pobierające świadczenia socjalne miały wielokrotnie napotykać awarie portalu weryfikacji twarzy, prowadzonego przez państwową agencję SASSA. W raportach dla parlamentu wskazano później nieudane rozpoznawanie twarzy jako jedną z przyczyn braku weryfikacji. Potwierdzono w nich też 67 868 zawieszeń świadczeń w jednym kwartale. Nie podano, ile z nich wynikało z weryfikacji twarzy.", "whyBad": "Gdy dostęp do podstawowego wsparcia zależy od automatycznej kontroli tożsamości, błędna odmowa jest poważna. Dla osoby żyjącej ze świadczenia może oznaczać brak pieniędzy na jedzenie, czynsz, dojazdy lub leki. Ponieważ jeden system obsługuje wszystkich, jedna awaria może dotknąć wielu osób naraz. A naprawianie błędu często spada na tych, którzy mają najmniej czasu, pieniędzy i dostępu do internetu, żeby się odwołać.", "escalation": "Państwa i firmy stosują weryfikację twarzy i inne kontrole tożsamości oparte na AI przy świadczeniach, w bankach, ubezpieczeniach, pracy i przy wejściach do budynków. Jeśli te systemy będą się rozpowszechniać szybciej niż rozwiązania zapasowe, audyty i ścieżki odwoławcze, więcej osób może zostać wykluczonych automatycznie, prawie bez możliwości odwołania."}, "ta": {"title": "முகச் சரிபார்ப்பும் சமூக நலத் திட்டங்களுக்கான அணுகலும்", "domain": "பொதுச் சேவைகள்", "hook": "தோல்வியடைந்த ஒரு முகச் சரிபார்ப்பு", "real": "ஒரு **முகச் சரிபார்ப்பு இணையதளம்** மீண்டும் மீண்டும் செயலிழந்ததாகக் கூறப்படுகிறது. சிலர் **சமூக நல உதவித்தொகையைப் பெற முடியாமல் போனதற்கு** இது ஒரு காரணம்.", "fake": "**குடிமக்களின் கடிதங்களை வகைப்படுத்தும்** ஒரு AI அமைப்பு, உதவித்தொகை தொடர்பான நூற்றுக்கணக்கான மேல்முறையீடுகளைத் தவறான துறைக்கு அனுப்பியதாகக் கூறப்படுகிறது. யாரும் கவனிப்பதற்கு முன் மக்கள் **மேல்முறையீட்டுக் காலக்கெடுவைத் தவறவிட்டனர்**.", "excerpt": "தென்னாப்பிரிக்காவில் சமூக உதவித்தொகை பெறுவோர் SASSA-வின் eLife முகச் சரிபார்ப்புத் தளத்தில் மீண்டும் மீண்டும் தோல்விகளைச் சந்தித்ததாகக் கூறப்படுகிறது.", "explanation": "தென்னாப்பிரிக்காவில், சமூக நல உதவித்தொகை பெறுவோர், அரசு நிறுவனமான SASSA நடத்தும் முகச் சரிபார்ப்பு இணையதளத்தில் மீண்டும் மீண்டும் கோளாறுகளை எதிர்கொண்டதாகக் கூறப்படுகிறது. மக்கள் சரிபார்க்கப்படாமல் போனதற்கான காரணங்களில் ஒன்றாக முக அடையாளம் தோல்வியடைந்ததை நாடாளுமன்றத்துக்கு அளிக்கப்பட்ட அறிக்கைகள் பின்னர் குறிப்பிட்டன. ஒரு காலாண்டில் 67,868 உதவித்தொகைகள் நிறுத்திவைக்கப்பட்டதையும் அவை உறுதிப்படுத்தின. அவற்றில் எத்தனை முகச் சரிபார்ப்பால் ஏற்பட்டன என்று அவை கூறவில்லை.", "whyBad": "அடிப்படை உதவியைப் பெறுவது தானியங்கி அடையாளச் சரிபார்ப்பைச் சார்ந்திருக்கும்போது, தவறான மறுப்பு தீவிரமானது. உதவித்தொகையை நம்பி வாழ்பவருக்கு, அது உணவு, வாடகை, போக்குவரத்து, மருந்து ஆகியவற்றுக்குப் பணம் இல்லை என்று பொருள்படலாம். ஒரே அமைப்பு எல்லோருக்கும் சேவை செய்வதால், ஒரு கோளாறு ஒரே நேரத்தில் பலரைப் பாதிக்கலாம். பிழையைச் சரிசெய்யும் சுமை, மேல்முறையீடு செய்ய நேரம், பணம், இணைய வசதி ஆகியவை மிகக் குறைவாக உள்ளவர்கள் மீதே பெரும்பாலும் விழுகிறது.", "escalation": "அரசுகளும் நிறுவனங்களும் உதவித்தொகை, வங்கி, காப்பீடு, வேலை, கட்டடங்களுக்குள் நுழைதல் ஆகியவற்றுக்கு முகச் சரிபார்ப்பையும் பிற AI அடையாளச் சரிபார்ப்புகளையும் பயன்படு
