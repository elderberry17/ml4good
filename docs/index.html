்து ஒரு பெண்ணுக்கு அழைப்பு வந்தது. மகளின் பதற்றமான குரல் போல ஒலித்த ஒன்றை அவர்கள் ஒலிக்கச் செய்தனர். மகள் பாதுகாப்பாக இருக்கிறார் என்று தெரிவதற்கு முன்பே அவர் 5,400 டாலர் அனுப்பினார்; அந்தக் குரல் AI மூலம் போலியாக உருவாக்கப்பட்டதாகக் கூறப்படுகிறது.", "whyBad": "சமூகப் பொறியியல் (social engineering) தாக்குதல்கள் பொதுவாக, தாக்குபவர் நம்பகமான ஒருவர் என்று இலக்கை நம்பவைப்பதைச் சார்ந்திருக்கின்றன. குரல் நகலாக்கம், மிக வலுவான உள்ளுணர்வு அடையாளக் குறிகளில் ஒன்றைப் போலியாக்குவதை மலிவாக்குகிறது. குறிப்பாகத் தாக்குபவர்கள் செயற்கை ஊடகங்களைப் பொது மூலங்கள் அல்லது தரவுக் கசிவுகளிலிருந்து பெற்ற தனிப்பட்ட தகவல்களுடன் இணைக்கும்போது, மோசடிகளின் நம்பகத்தன்மையும் உணர்ச்சி அழுத்தமும் அதிகரிக்கலாம்.", "escalation": "அதிகத் திறன் கொண்ட அமைப்புகள் குரல் நகலாக்கம், உருவாக்கப்பட்ட வீடியோ, தனிப்பட்ட தரவுத் தேடல், உரையாடல் முகவர்கள் ஆகியவற்றை ஒன்றிணைக்கக்கூடும். இதனால், அதிக உழைப்பு தேவைப்படும் தனிப்பயன் மோசடிகள், ஒரே நேரத்தில் பலரைக் குறிவைக்கும் பகுதி-தானியங்கிப் பிரச்சாரங்களாக மாறக்கூடும்."}, "sv": {"title": "AI-klonad röst användes i en fejkad kidnappning", "domain": "Bedrägerier", "hook": "en enda klonad röst", "real": "Bedragare ska ha använt en **AI-klonad röst** i ett samtal om en **fejkad kidnappning** och fått en mamma att skicka flera tusen dollar.", "fake": "Bedragare ska ha skickat en **AI-genererad video av hennes hus i brand** till en mamma som var på semester och fått henne att betala flera tusen dollar för ett **akut reparationsteam**.", "excerpt": "Deborah Del Mastro ska ha skickat 5 400 dollar till Mexiko efter att bedragare felaktigt påstått att hennes dotter Sarah kidnappats", "explanation": "En kvinna blev uppringd av bedragare som påstod att de kidnappat hennes dotter. De spelade upp något som lät som dotterns panikslagna röst. Hon skickade 5 400 dollar innan hon fick veta att dottern var i säkerhet; rösten ska ha härmats med AI.", "whyBad": "Social manipulation (social engineering) bygger oftast på att få offret att tro att angriparen är någon man litar på. Röstkloning gör det billigt att härma en av de starkaste intuitiva identitetssignalerna. Det kan öka både trovärdigheten och den känslomässiga pressen i bedrägerier, särskilt när angripare kombinerar syntetiska medier med personuppgifter från öppna källor eller dataläckor.", "escalation": "Mer kapabla system kan kombinera röstkloning, genererad video, sökning efter personuppgifter och konversationsagenter. Det kan förvandla mycket personanpassade bedrägerier från arbetskrävande hantverk till delvis automatiserade kampanjer som riktar sig mot många människor samtidigt."}, "tr": {"title": "Sahte kaçırma vakasında yapay zekâyla klonlanmış ses", "domain": "Dolandırıcılık", "hook": "tek bir klonlanmış ses", "real": "Dolandırıcıların **sahte bir kaçırma aramasında** **yapay zekâyla klonlanmış bir ses** kullandığı ve bir anneyi birkaç bin dolar göndermeye ikna ettiği bildirildi.", "fake": "Dolandırıcıların tatilde olan bir anneye **evinin yandığını gösteren yapay zekâ üretimi bir video** gönderdiği ve onu **acil onarım ekibi** için birkaç bin dolar ödemeye ikna ettiği bildirildi.", "excerpt": "Deborah Del Mastro'nun, dolandırıcılar kızı Sarah'nın kaçırıldığını yalan yere iddia ettikten sonra Meksika'ya 5.400 dolar gönderdiği bildirildi", "explanation": "Bir kadın, kızını kaçırdıklarını iddia eden dolandırıcılardan bir telefon aldı. Ona kızının panik içindeki sesine benzeyen bir ses dinlettiler. Kızının güvende olduğunu öğrenmeden önce 5.400 dolar gönderdi; bildirildiğine göre ses yapay zekâyla taklit edilmişti.", "whyBad": "Sosyal mühendislik genellikle hedefi, saldırganın güvendiği biri olduğuna inandırmaya dayanır. Ses klonlama, en güçlü sezgisel kimlik işaretlerinden birini taklit etmeyi ucuzlatır. Bu, özellikle saldırganlar sentetik medyayı açık kaynaklardan veya veri sızıntılarından elde edilen kişisel bilgilerle birleştirdiğinde dolandırıcılıkların inandırıcılığını ve duygusal baskısını artırabilir.", "escalation": "Daha yetenekli sistemler ses klonlamayı, üretilmiş videoyu, kişisel veri aramayı ve sohbet ajanlarını bir araya getirebilir. Bu, son derece kişiselleştirilmiş dolandırıcılıkları emek yoğun işlerden aynı anda çok sayıda kişiyi hedef alan kısmen otomatik kampanyalara dönüştürebilir."}}}, {"id": 1379, "url": "https://incidentdatabase.ai/cite/1379/", "building": "court", "text": {"en": {"title": "Allegedly AI-fabricated evidence contributed to imprisonment", "domain": "Courts & evidence", "hook": "one disputed piece of evidence", "real": "A woman was reportedly **jailed** after **text-message evidence** attributed to her was submitted, with the messages later alleged to have been fabricated using AI.", "fake": "A woman reportedly **lost visitation rights** for several weeks after a **social-media viewing history** attributed to her was submitted, with the records later alleged to have been generated using AI.", "excerpt": "A Florida nurse, Melissa Sims, was reportedly jailed for two days for purportedly violating a bond/no-contact order.", "explanation": "A Florida nurse was reportedly jailed for two days after her ex-partner produced text-message evidence attributed to her. The messages were later alleged to have been generated or fabricated using AI.", "whyBad": "Legal systems depend on evidence being attributable to real people and events. Generative AI reduces the cost of producing plausible digital artifacts while many evidentiary workflows still rely on screenshots, recordings, or messages whose provenance is difficult to verify. The deeper risk is epistemic: institutions may both accept fake evidence and become more willing to dismiss genuine evidence as synthetic.", "escalation": "As fake text, images, audio and video get better, it becomes harder for courts, journalists, employers and the public to tell what is true from what is made up. That raises the risk of wrong decisions: innocent people can be punished on the strength of a fake, and real evidence can be dismissed as one."}, "fr": {"title": "Des preuves prétendument fabriquées par IA ont contribué à une incarcération", "domain": "Justice et preuves", "hook": "une seule preuve contestée", "real": "Une femme aurait été **incarcérée** après la production de **SMS qui lui étaient attribués** ; il a ensuite été allégué que ces messages avaient été fabriqués à l’aide de l’IA.", "fake": "Une femme aurait **perdu son droit de visite** pendant plusieurs semaines après la production d’un **historique de consultation des réseaux sociaux** qui lui était attribué ; il a ensuite été allégué que ces relevés avaient été générés à l’aide de l’IA.", "excerpt": "Une infirmière de Floride, Melissa Sims, aurait été incarcérée pendant deux jours pour une présumée violation d’une ordonnance de caution / d’interdiction de contact.", "explanation": "Une infirmière de Floride aurait passé deux jours en détention après que son ex-partenaire a produit des SMS qui lui étaient attribués. Il a ensuite été allégué que ces messages avaient été générés ou fabriqués à l’aide de l’IA.", "whyBad": "Les systèmes judiciaires reposent sur le fait que les preuves puissent être rattachées à des personnes et à des événements réels. L’IA générative réduit le coût de production d’artefacts numériques plausibles, alors que de nombreuses procédures s’appuient encore sur des captures d’écran, des enregistrements ou des messages dont l’origine est difficile à vérifier. Le risque le plus profond est épistémique : les institutions pourraient à la fois accepter de fausses preuves et rejeter plus facilement des preuves authentiques comme synthétiques.", "escalation": "À mesure que les faux textes, images, sons et vidéos s’améliorent, les tribunaux, les journalistes, les employeurs et le public ont de plus en plus de mal à distinguer le vrai du faux. Le risque de mauvaises décisions augmente : un innocent peut être sanctionné sur la base d’un faux, et une preuve authentique peut être écartée comme telle."}, "de": {"title": "Mutmaßlich KI-gefälschte Beweise führten zu Haft", "domain": "Justiz und Beweismittel", "hook": "ein einziges umstrittenes Beweisstück", "real": "Eine Frau soll **inhaftiert** worden sein, nachdem ihr zugeschriebene **Textnachrichten** als Beweis vorgelegt wurden; später wurde behauptet, die Nachrichten seien mit KI gefälscht worden.", "fake": "Eine Frau soll für mehrere Wochen **ihr Besuchsrecht verloren** haben, nachdem ein ihr zugeschriebener **Verlauf angesehener Social-Media-Inhalte** vorgelegt wurde; später wurde behauptet, die Daten seien mit KI erzeugt worden.", "excerpt": "Eine Krankenschwester aus Florida, Melissa Sims, soll für zwei Tage inhaftiert worden sein, weil sie mutmaßlich gegen eine Kautions- bzw. Kontaktverbotsauflage verstoßen hatte.", "explanation": "Eine Krankenschwester aus Florida soll zwei Tage in Haft verbracht haben, nachdem ihr Ex-Partner ihr zugeschriebene Textnachrichten vorgelegt hatte. Später wurde behauptet, die Nachrichten seien mit KI erzeugt oder gefälscht worden.", "whyBad": "Rechtssysteme beruhen darauf, dass Beweise realen Personen und Ereignissen zugeordnet werden können. Generative KI senkt die Kosten für plausible digitale Artefakte, während viele Beweisverfahren noch auf Screenshots, Aufnahmen oder Nachrichten setzen, deren Herkunft schwer überprüfbar ist. Das tiefere Risiko ist epistemisch: Institutionen könnten gefälschte Beweise akzeptieren und zugleich echte Beweise eher als synthetisch abtun.", "escalation": "Je besser gefälschte Texte, Bilder, Audio- und Videoaufnahmen werden, desto schwerer fällt es Gerichten, Journalisten, Arbeitgebern und der Öffentlichkeit, Wahres von Erfundenem zu unterscheiden. Damit wächst das Risiko falscher Entscheidungen: Unschuldige können wegen einer Fälschung bestraft und echte Beweise als Fälschung abgetan werden."}, "ru": {"title": "Предположительно сфабрикованные ИИ доказательства привели к заключению под стражу", "domain": "Суд и доказательства", "hook": "одно спорное доказательство", "real": "Женщину, по имеющимся данным, **заключили под стражу** после того, как суду представили приписываемую ей **СМС-переписку**; позже утверждалось, что эти сообщения были сфабрикованы с помощью ИИ.", "fake": "Женщину, по имеющимся данным, на несколько недель **лишили права видеться с ребёнком** после того, как суду представили приписываемую ей **историю просмотров в социальных сетях**; позже утверждалось, что эти записи были сгенерированы с помощью ИИ.", "excerpt": "Медсестру из Флориды Мелиссу Симс, по имеющимся данным, на два дня заключили под стражу за предполагаемое нарушение условий залога / запрета на контакт.", "explanation": "Медсестра из Флориды, по имеющимся данным, провела два дня под стражей после того, как её бывший партнёр представил приписываемую ей СМС-переписку. Позже утверждалось, что эти сообщения были сгенерированы или сфабрикованы с помощью ИИ.", "whyBad": "Правовые системы опираются на то, что доказательства можно связать с реальными людьми и событиями. Генеративный ИИ удешевляет создание правдоподобных цифровых артефактов, тогда как многие процессы работы с доказательствами всё ещё полагаются на скриншоты, записи или сообщения, происхождение которых трудно проверить. Более глубокий риск — эпистемический: институты могут как принимать поддельные доказательства, так и охотнее отвергать подлинные как синтетические.", "escalation": "Поддельные тексты, изображения, аудио и видео становятся всё качественнее, и судам, журналистам, работодателям и обществу всё труднее отличить правду от вымысла. Из-за этого растёт риск ошибочных решений: невиновного могут наказать на основании подделки, а настоящее доказательство — отвергнуть как фальшивку."}, "it": {"title": "Prove presumibilmente fabbricate con l’IA hanno contribuito a una detenzione", "domain": "Giustizia e prove", "hook": "una sola prova contestata", "real": "Una donna sarebbe stata **detenuta** dopo la presentazione di **messaggi di testo** a lei attribuiti; in seguito è stato sostenuto che i messaggi erano stati fabbricati con l’IA.", "fake": "Una donna avrebbe **perso per alcune settimane il diritto di visita** dopo la presentazione di una **cronologia delle visualizzazioni sui social network** a lei attribuita; in seguito è stato sostenuto che quei dati erano stati generati con l’IA.", "excerpt": "Un’infermiera della Florida, Melissa Sims, sarebbe stata detenuta per due giorni per una presunta violazione di un ordine di cauzione / divieto di contatto.", "explanation": "Un’infermiera della Florida avrebbe trascorso due giorni in detenzione dopo che il suo ex partner aveva presentato messaggi di testo a lei attribuiti. In seguito è stato sostenuto che i messaggi erano stati generati o fabbricati con l’IA.", "whyBad": "I sistemi giudiziari si basano sul fatto che le prove siano riconducibili a persone ed eventi reali. L’IA generativa abbassa il costo di produrre artefatti digitali plausibili, mentre molte procedure si affidano ancora a screenshot, registrazioni o messaggi la cui origine è difficile da verificare. Il rischio più profondo è epistemico: le istituzioni potrebbero sia accettare prove false sia respingere più facilmente prove autentiche come sintetiche.", "escalation": "Man mano che testi, immagini, audio e video falsi migliorano, per tribunali, giornalisti, datori di lavoro e pubblico diventa più difficile distinguere il vero dall’inventato. Cresce così il rischio di decisioni sbagliate: un innocente può essere punito sulla base di un falso, e una prova autentica può essere scartata come tale."}, "es": {"title": "Pruebas presuntamente fabricadas con IA contribuyeron a un encarcelamiento", "domain": "Justicia y pruebas", "hook": "una sola prueba en disputa", "real": "Según se informa, una mujer fue **encarcelada** tras presentarse **mensajes de texto** que se le atribuían; más tarde se alegó que esos mensajes habían sido fabricados con IA.", "fake": "Según se informa, una mujer **perdió durante varias semanas su derecho de visitas** tras presentarse un **historial de visualizaciones en redes sociales** que se le atribuía; más tarde se alegó que esos registros habían sido generados con IA.", "excerpt": "Según se informa, una enfermera de Florida, Melissa Sims, fue encarcelada durante dos días por presuntamente violar una orden de fianza / prohibición de contacto.", "explanation": "Según se informa, una enfermera de Florida pasó dos días detenida después de que su expareja presentara mensajes de texto que se le atribuían. Más tarde se alegó que los mensajes habían sido generados o fabricados con IA.", "whyBad": "Los sistemas judiciales dependen de que las pruebas puedan atribuirse a personas y hechos reales. La IA generativa abarata la producción de artefactos digitales verosímiles, mientras que muchos procedimientos todavía se basan en capturas de pantalla, grabaciones o mensajes cuyo origen es difícil de verificar. El riesgo de fondo es epistémico: las instituciones podrían aceptar pruebas falsas y, a la vez, descartar con más facilidad pruebas auténticas por considerarlas sintéticas.", "escalation": "A medida que los textos, imágenes, audios y vídeos falsos mejoran, a los tribunales, periodistas, empleadores y al público les cuesta más distinguir lo verdadero de lo inventado. Eso aumenta el riesgo de decisiones equivocadas: se puede castigar a una persona inocente por una falsificación y descartar una prueba auténtica como si lo fuera."}, "ko": {"title": "AI로 조작됐다는 의혹이 있는 증거로 구금", "domain": "법원과 증거", "hook": "논란이 된 증거 하나", "real": "한 여성이 자신이 보낸 것으로 제시된 **문자 메시지 증거** 때문에 **구금된** 것으로 알려졌으며, 이후 이 메시지가 AI로 조작됐다는 주장이 제기됐다.", "fake": "한 여성이 자신의 것이라고 제출된 **소셜미디어 시청 기록** 때문에 몇 주 동안 **자녀 면접교섭권을 잃은** 것으로 알려졌으며, 이후 이 기록이 AI로 생성됐다는 주장이 제기됐다.", "excerpt": "미국 플로리다의 간호사 멜리사 심스가 보석 조건 또는 접근 금지 명령을 위반했다는 이유로 이틀간 구금된 것으로 알려졌다.", "explanation": "플로리다의 한 간호사가 전 연인이 그녀가 보냈다는 문자 메시지를 제출한 뒤 이틀간 구금된 것으로 알려졌다. 이후 이 메시지가 AI로 생성되거나 조작됐다는 주장이 제기됐다.", "whyBad": "사법 시스템은 증거를 실제 사람과 사건에 연결할 수 있다는 전제에 기대고 있다. 생성형 AI는 그럴듯한 디지털 자료를 만드는 비용을 낮추지만, 많은 증거 절차는 여전히 출처를 확인하기 어려운 스크린숏, 녹음, 메시지에 의존한다. 더 깊은 위험은 인식론적인 것이다. 기관이 가짜 증거를 받아들이는 동시에 진짜 증거를 합성물이라며 더 쉽게 배척할 수도 있다.", "escalation": "가짜 글, 이미지, 음성, 영상이 정교해질수록 법원, 언론인, 고용주, 대중이 사실과 꾸며낸 것을 구별하기가 점점 어려워진다. 그만큼 잘못된 결정의 위험이 커진다. 죄 없는 사람이 가짜 증거 때문에 처벌받을 수 있고, 진짜 증거가 가짜로 몰려 배척될 수도 있다."}, "zh": {"title": "被指由 AI 伪造的证据导致入狱", "domain": "司法与证据", "hook": "一份有争议的证据", "real": "据报道，一名女性在被归于她名下的**短信**作为证据提交后**遭到关押**；这些短信后来被指是用 AI 伪造的。", "fake": "据报道，在一份被归于她名下的**社交媒体浏览记录**被提交后，一名女性**失去了数周的探视权**；这些记录后来被指是用 AI 生成的。", "excerpt": "据报道，佛罗里达州护士 Melissa Sims 因被指违反保释条件/禁止接触令而被关押两天。", "explanation": "据报道，佛罗里达州一名护士在前伴侣提交了被归于她名下的短信后被关押了两天。这些短信后来被指是用 AI 生成或伪造的。", "whyBad": "司法系统依赖于证据能够对应到真实的人和事件。生成式 AI 降低了制造逼真数字材料的成本，而许多取证流程仍依赖难以核实来源的截图、录音或消息。更深层的风险在于认知层面：机构既可能采信伪造证据，也可能更轻易地把真实证据当作合成内容而排除。", "escalation": "随着伪造的文字、图像、音频和视频越来越逼真，法院、记者、雇主和公众越来越难分清真假。这会增加作出错误决定的风险：无辜的人可能因为伪造的证据受到惩罚，而真实的证据也可能被当作伪造而不予采信。"}, "sr": {"title": "Докази наводно фабриковани помоћу ВИ довели до затварања", "domain": "Судови и докази", "hook": "један спорни доказ", "real": "Жена је, како се наводи, **приведена у притвор** након што су поднете **текстуалне поруке** које су јој приписане; касније је тврђено да су поруке фабриковане помоћу ВИ.", "fake": "Жена је, како се наводи, на неколико недеља **изгубила право на виђање детета** након што је поднета **историја прегледа на друштвеним мрежама** која јој је приписана; касније је тврђено да су ти подаци генерисани помоћу ВИ.", "excerpt": "Медицинска сестра из Флориде, Мелиса Симс, је, како се наводи, провела два дана у притвору због наводног кршења услова кауције / забране контакта.", "explanation": "Медицинска сестра из Флориде је, како се наводи, провела два дана у притвору након што је њен бивши партнер поднео текстуалне поруке које су јој приписане. Касније је тврђено да су те поруке генерисане или фабриковане помоћу ВИ.", "whyBad": "Правосудни системи се ослањају на то да се докази могу повезати са стварним људима и догађајима. Генеративна ВИ смањује цену прављења уверљивих дигиталних артефаката, док се многи поступци и даље ослањају на снимке екрана, снимке или поруке чије је порекло тешко проверити. Дубљи ризик је епистемички: институције би могле и да прихвате лажне доказе и да лакше одбаце праве као синтетичке.", "escalation": "Како лажни текстови, слике, звук и видео постају све бољи, судовима, новинарима, послодавцима и јавности све је теже да разликују истину од измишљотине. То повећава ризик од погрешних одлука: недужна особа може бити кажњена на основу фалсификата, а прави доказ одбачен као лажан."}, "bs": {"title": "Dokazi navodno fabrikovani pomoću UI doveli do zatvaranja", "domain": "Sudovi i dokazi", "hook": "jedan sporni dokaz", "real": "Žena je, kako se navodi, **privedena u pritvor** nakon što su podnesene **tekstualne poruke** koje su joj pripisane; kasnije je tvrđeno da su poruke fabrikovane pomoću UI.", "fake": "Žena je, kako se navodi, na nekoliko sedmica **izgubila pravo na viđanje djeteta** nakon što je podnesena **historija pregleda na društvenim mrežama** koja joj je pripisana; kasnije je tvrđeno da su ti podaci generisani pomoću UI.", "excerpt": "Medicinska sestra s Floride, Melissa Sims, je, kako se navodi, provela dva dana u pritvoru zbog navodnog kršenja uslova kaucije / zabrane kontakta.", "explanation": "Medicinska sestra s Floride je, kako se navodi, provela dva dana u pritvoru nakon što je njen bivši partner podnio tekstualne poruke koje su joj pripisane. Kasnije je tvrđeno da su te poruke generisane ili fabrikovane pomoću UI.", "whyBad": "Pravosudni sistemi se oslanjaju na to da se dokazi mogu povezati sa stvarnim ljudima i događajima. Generativna UI smanjuje cijenu pravljenja uvjerljivih digitalnih artefakata, dok se mnogi postupci i dalje oslanjaju na snimke ekrana, snimke ili poruke čije je porijeklo teško provjeriti. Dublji rizik je epistemički: institucije bi mogle i prihvatiti lažne dokaze i lakše odbaciti prave kao sintetičke.", "escalation": "Kako lažni tekstovi, slike, zvuk i video postaju sve bolji, sudovima, novinarima, poslodavcima i javnosti sve je teže razlikovati istinu od izmišljotine. To povećava rizik od pogrešnih odluka: nedužna osoba može biti kažnjena na osnovu falsifikata, a pravi dokaz odbačen kao lažan."}, "ro": {"title": "Probe presupus fabricate cu IA au contribuit la o încarcerare", "domain": "Justiție și probe", "hook": "o singură probă contestată", "real": "O femeie ar fi fost **încarcerată** după ce au fost prezentate **mesaje text** atribuite ei; ulterior s-a susținut că mesajele fuseseră fabricate cu ajutorul IA.", "fake": "O femeie și-ar fi **pierdut pentru câteva săptămâni dreptul de vizită** după ce a fost prezentat un **istoric de vizionări de pe rețelele sociale** atribuit ei; ulterior s-a susținut că datele fuseseră generate cu ajutorul IA.", "excerpt": "O asistentă medicală din Florida, Melissa Sims, ar fi fost încarcerată două zile pentru presupusa încălcare a unui ordin de cauțiune / de interdicție de contact.", "explanation": "O asistentă medicală din Florida ar fi petrecut două zile în arest după ce fostul partener a prezentat mesaje text atribuite ei. Ulterior s-a susținut că mesajele fuseseră generate sau fabricate cu ajutorul IA.", "whyBad": "Sistemele juridice se bazează pe faptul că probele pot fi legate de oameni și evenimente reale. IA generativă reduce costul producerii unor artefacte digitale plauzibile, în timp ce multe proceduri se bazează încă pe capturi de ecran, înregistrări sau mesaje a căror proveniență e greu de verificat. Riscul mai profund este epistemic: instituțiile ar putea atât să accepte probe false, cât și să respingă mai ușor probe autentice drept sintetice.", "escalation": "Pe măsură ce textele, imaginile, înregistrările audio și video false devin mai bune, instanțelor, jurnaliștilor, angajatorilor și publicului le este tot mai greu să deosebească adevărul de invenție. Crește astfel riscul unor decizii greșite: un om nevinovat poate fi pedepsit pe baza unui fals, iar o probă autentică poate fi respinsă ca fiind falsă."}, "vi": { சா சிம்ஸ் இரண்டு நாட்கள் சிறையில் அடைக்கப்பட்டதாகக் கூறப்படுகிறது.", "explanation": "ஃபுளோரிடாவைச் சேர்ந்த ஒரு செவிலியர், அவருடையவை என்று கூறப்பட்ட குறுஞ்செய்திகளை அவரது முன்னாள் துணை சமர்ப்பித்த பிறகு இரண்டு நாட்கள் காவலில் இருந்ததாகக் கூறப்படுகிறது. அந்தச் செய்திகள் AI மூலம் உருவாக்கப்பட்டவை அல்லது புனையப்பட்டவை என்று பின்னர் குற்றம் சாட்டப்பட்டது.", "whyBad": "சான்றுகளை உண்மையான மனிதர்களுடனும் நிகழ்வுகளுடனும் இணைக்க முடியும் என்பதை நீதி அமைப்புகள் சார்ந்திருக்கின்றன. உருவாக்க AI நம்பும்படியான டிஜிட்டல் பொருட்களை உருவாக்கும் செலவைக் குறைக்கிறது; ஆனால் பல சான்று நடைமுறைகள் இன்னும் மூலத்தைச் சரிபார்க்கக் கடினமான திரைப்பிடிப்புகள், பதிவுகள் அல்லது செய்திகளையே சார்ந்துள்ளன. ஆழமான ஆபத்து அறிவுசார்ந்தது: நிறுவனங்கள் போலிச் சான்றுகளை ஏற்கவும் கூடும், உண்மையான சான்றுகளைச் செயற்கையானவை என்று எளிதில் நிராகரிக்கவும் கூடும்.", "escalation": "போலி உரை, படங்கள், ஒலி, வீடியோ ஆகியவை மேம்பட மேம்பட, நீதிமன்றங்கள், ஊடகவியலாளர்கள், வேலை வழங்குநர்கள், பொதுமக்கள் ஆகியோருக்கு உண்மையையும் புனைவையும் பிரித்தறிவது மேலும் கடினமாகிறது. இதனால் தவறான முடிவுகளின் ஆபத்து அதிகரிக்கிறது: போலிச் சான்றின் அடிப்படையில் நிரபராதி தண்டிக்கப்படலாம்; உண்மையான சான்று போலி என்று நிராகரிக்கப்படலாம்."}, "sv": {"title": "Påstått AI-förfalskade bevis bidrog till frihetsberövande", "domain": "Domstolar och bevis", "hook": "ett enda omstritt bevis", "real": "En kvinna ska ha **frihetsberövats** efter att **sms som tillskrevs henne** lagts fram som bevis; senare påstods det att meddelandena hade förfalskats med AI.", "fake": "En kvinna ska ha **förlorat sin umgängesrätt** i flera veckor efter att en **visningshistorik från sociala medier** som tillskrevs henne lagts fram; senare påstods det att uppgifterna hade genererats med AI.", "excerpt": "En sjuksköterska i Florida, Melissa Sims, ska ha suttit frihetsberövad i två dagar för att påstått ha brutit mot ett borgens- eller kontaktförbud.", "explanation": "En sjuksköterska i Florida ska ha suttit frihetsberövad i två dagar efter att hennes före detta partner lagt fram sms som tillskrevs henne. Senare påstods det att meddelandena hade genererats eller förfalskats med AI.", "whyBad": "Rättssystem bygger på att bevis kan knytas till verkliga personer och händelser. Generativ AI sänker kostnaden för att skapa trovärdiga digitala artefakter, medan många bevisrutiner fortfarande förlitar sig på skärmdumpar, inspelningar eller meddelanden vars ursprung är svårt att kontrollera. Den djupare risken är epistemisk: institutioner kan både godta falska bevis och lättare avfärda äkta bevis som syntetiska.", "escalation": "När falska texter, bilder, ljud och video blir bättre får domstolar, journalister, arbetsgivare och allmänheten allt svårare att skilja sant från påhittat. Det ökar risken för felaktiga beslut: en oskyldig kan straffas på grund av en förfalskning, och ett äkta bevis kan avfärdas som falskt."}, "tr": {"title": "Yapay zekâyla üretildiği iddia edilen deliller hapse girmeye katkıda bulundu", "domain": "Mahkemeler ve deliller", "hook": "tek bir tartışmalı delil", "real": "Bir kadının, kendisine atfedilen **kısa mesajların** delil olarak sunulmasının ardından **tutuklandığı** bildirildi; daha sonra bu mesajların yapay zekâyla üretildiği iddia edildi.", "fake": "Bir kadının, kendisine atfedilen **sosyal medya izleme geçmişinin** sunulmasının ardından birkaç hafta boyunca **çocuğuyla görüşme hakkını kaybettiği** bildirildi; daha sonra bu kayıtların yapay zekâyla üretildiği iddia edildi.", "excerpt": "Floridalı hemşire Melissa Sims'in, iddiaya göre kefalet / temas yasağı kararını ihlal ettiği gerekçesiyle iki gün tutuklu kaldığı bildirildi.", "explanation": "Floridalı bir hemşirenin, eski partnerinin kendisine atfedilen kısa mesajları sunmasının ardından iki gün gözaltında kaldığı bildirildi. Daha sonra bu mesajların yapay zekâyla oluşturulduğu veya uydurulduğu iddia edildi.", "whyBad": "Hukuk sistemleri, delillerin gerçek kişi ve olaylarla ilişkilendirilebilmesine dayanır. Üretken yapay zekâ inandırıcı dijital içerik üretmenin maliyetini düşürürken pek çok delil süreci hâlâ kaynağı doğrulanması zor ekran görüntülerine, kayıtlara veya mesajlara dayanıyor. Daha derin risk epistemiktir: Kurumlar hem sahte delilleri kabul edebilir hem de gerçek delilleri sentetik diye daha kolay reddedebilir.", "escalation": "Sahte metin, görsel, ses ve video kalitesi arttıkça mahkemelerin, gazetecilerin, işverenlerin ve kamuoyunun gerçeği uydurmadan ayırt etmesi zorlaşıyor. Bu, yanlış karar riskini artırıyor: Masum biri sahte bir delil yüzünden cezalandırılabilir, gerçek bir delil ise sahte diye reddedilebilir."}}}, {"id": 1374, "url": "https://incidentdatabase.ai/cite/1374/", "building": "hospital", "text": {"en": {"title": "AI medical alert nearly led to inappropriate treatment", "domain": "Healthcare", "hook": "one wrong alert", "real": "A hospital AI system reportedly raised a **sepsis alert** for an older dialysis patient; the standard response, **IV fluids**, could have caused dangerous fluid overload, but a nurse noticed and a doctor changed the treatment.", "fake": "A hospital AI system that **schedules operating rooms** reportedly **moved an urgent operation behind routine ones** after misreading a note in a patient's chart, but a nurse noticed before the delay caused harm.", "excerpt": "A nurse at St. Rose Dominican Hospital reportedly described an episode in which a hospital AI system purportedly generated a sepsis alert.", "explanation": "A hospital AI system reportedly generated a sepsis alert for an older dialysis patient. The standard urgent response included IV fluids, but a nurse recognized that this could cause dangerous fluid overload. A doctor intervened and changed the treatment.", "whyBad": "Clinical decision-support tools operate inside workflows where speed and protocol compliance are often valuable. That can create automation bias: staff may interpret an alert as a strong recommendation even when patient-specific context makes the standard response inappropriate. A systematic model or workflow failure can therefore affect many patients if clinicians lose the ability, time, or authority to challenge it.", "escalation": "As clinical AI becomes more capable and embedded into diagnosis, triage, and treatment recommendations, organizations may automate larger parts of care. If human oversight becomes nominal rather than meaningful, correlated model failures could propagate across many patients before they are recognized."}, "fr": {"title": "Une alerte médicale de l’IA a failli entraîner un traitement inadapté", "domain": "Santé", "hook": "une seule alerte erronée", "real": "Un système d’IA hospitalier aurait émis une **alerte de sepsis** pour un patient âgé sous dialyse ; la réponse standard, des **perfusions de liquides**, pouvait provoquer une surcharge hydrique dangereuse, mais une infirmière l’a remarqué et un médecin a modifié le traitement.", "fake": "Un système d’IA hospitalier **chargé de planifier les blocs opératoires** aurait **placé une opération urgente après des interventions de routine** en lisant mal une note du dossier d’un patient, mais une infirmière s’en est aperçue avant que le retard ne cause de tort.", "excerpt": "Une infirmière de l’hôpital St. Rose Dominican aurait décrit un épisode au cours duquel un système d’IA de l’hôpital aurait généré une alerte de sepsis.", "explanation": "Un système d’IA hospitalier aurait généré une alerte de sepsis pour un patient âgé sous dialyse. La réponse d’urgence standard comprenait des perfusions de liquides, mais une infirmière a compris que cela pouvait provoquer une surcharge hydrique dangereuse. Un médecin est intervenu et a modifié le traitement.", "whyBad": "Les outils d’aide à la décision clinique fonctionnent dans des circuits où la rapidité et le respect des protocoles sont souvent précieux. Cela peut créer un biais d’automatisation (automation bias) : le personnel peut interpréter une alerte comme une recommandation forte, même quand la situation du patient rend la réponse standard inadaptée. Une défaillance systématique du modèle ou du processus peut donc toucher de nombreux patients si les soignants perdent la capacité, le temps ou l’autorité de la contester.", "escalation": "À mesure que l’IA clinique devient plus performante et s’intègre au diagnostic, au triage et aux recommandations thérapeutiques, les établissements pourraient automatiser une part croissante des soins. Si la supervision humaine devient formelle plutôt que réelle, des défaillances corrélées du modèle pourraient toucher de nombreux patients avant d’être détectées."}, "de": {"title": "Medizinischer KI-Alarm führte beinahe zu falscher Behandlung", "domain": "Gesundheitswesen", "hook": "ein einziger falscher Alarm", "real": "Ein KI-System im Krankenhaus soll für einen älteren Dialysepatienten einen **Sepsis-Alarm** ausgelöst haben; die übliche Reaktion, **intravenöse Flüssigkeitsgabe**, hätte eine gefährliche Flüssigkeitsüberladung verursachen können, doch eine Pflegekraft bemerkte es und ein Arzt änderte die Behandlung.", "fake": "Ein KI-System, das in einem Krankenhaus **die OP-Säle plant**, soll **eine dringende Operation hinter Routineeingriffe gesetzt** haben, weil es eine Notiz in der Patientenakte falsch las, doch eine Pflegekraft bemerkte es, bevor die Verzögerung Schaden anrichtete.", "excerpt": "Eine Pflegekraft des St. Rose Dominican Hospital soll einen Vorfall geschildert haben, bei dem ein KI-System des Krankenhauses mutmaßlich einen Sepsis-Alarm erzeugte.", "explanation": "Ein KI-System im Krankenhaus soll für einen älteren Dialysepatienten einen Sepsis-Alarm erzeugt haben. Die übliche Notfallreaktion umfasste intravenöse Flüssigkeitsgabe, doch eine Pflegekraft erkannte, dass dies eine gefährliche Flüssigkeitsüberladung verursachen könnte. Ein Arzt griff ein und änderte die Behandlung.", "whyBad": "Klinische Entscheidungsunterstützung arbeitet in Abläufen, in denen Tempo und Protokolltreue oft wertvoll sind. Das kann Automatisierungsbias (automation bias) erzeugen: Personal kann einen Alarm als starke Empfehlung deuten, selbst wenn die Besonderheiten des Patienten die Standardreaktion ungeeignet machen. Ein systematischer Modell- oder Prozessfehler kann daher viele Patienten treffen, wenn Klinikpersonal die Möglichkeit, Zeit oder Befugnis verliert, ihn anzufechten.", "escalation": "Je leistungsfähiger klinische KI wird und je tiefer sie in Diagnose, Triage und Therapieempfehlungen eingebettet ist, desto größere Teile der Versorgung könnten Einrichtungen automatisieren. Wird menschliche Aufsicht nur noch formal statt wirksam, könnten sich korrelierte Modellfehler auf viele Patienten ausbreiten, bevor sie erkannt werden."}, "ru": {"title": "Медицинское оповещение ИИ едва не привело к неподходящему лечению", "domain": "Здравоохранение", "hook": "одно ошибочное оповещение", "real": "Больничная ИИ-система, по имеющимся данным, выдала **оповещение о сепсисе** для пожилого пациента на диализе; стандартная мера, **внутривенное введение жидкости**, могла вызвать опасную перегрузку жидкостью, но медсестра это заметила, и врач изменил лечение.", "fake": "Больничная ИИ-система, **составляющая расписание операционных**, по имеющимся данным, **поставила срочную операцию после плановых**, неверно прочитав запись в карте пациента, но медсестра заметила это раньше, чем задержка причинила вред.", "excerpt": "Медсестра больницы St. Rose Dominican, по имеющимся данным, описала случай, когда больничная ИИ-система предположительно сгенерировала оповещение о сепсисе.", "explanation": "Больничная ИИ-система, по имеющимся данным, сгенерировала оповещение о сепсисе для пожилого пациента на диализе. Стандартный экстренный протокол включал внутривенное введение жидкости, но медсестра поняла, что это может вызвать опасную перегрузку жидкостью. Врач вмешался и изменил лечение.", "whyBad": "Системы поддержки клинических решений работают в процессах, где скорость и соблюдение протоколов часто ценны. Это может порождать автоматизационную предвзятость (automation bias): персонал может воспринимать оповещение как сильную рекомендацию, даже когда особенности конкретного пациента делают стандартную реакцию неподходящей. Поэтому систематический сбой модели или процесса может затронуть множество пациентов, если у клиницистов не останется возможности, времени или полномочий его оспорить.", "escalation": "По мере того как клинический ИИ становится способнее и глубже встраивается в диагностику, сортировку пациентов (триаж) и рекомендации по лечению, организации могут автоматизировать всё большую часть медицинской помощи. Если человеческий надзор станет номинальным, а не содержательным, коррелированные сбои модели смогут затронуть множество пациентов, прежде чем их обнаружат."}, "it": {"title": "Un allarme medico dell’IA ha quasi portato a un trattamento inappropriato", "domain": "Sanità", "hook": "un solo allarme sbagliato", "real": "Un sistema di IA ospedaliero avrebbe generato un **allarme di sepsi** per un paziente anziano in dialisi; la risposta standard, i **liquidi per via endovenosa**, poteva causare un pericoloso sovraccarico di liquidi, ma un’infermiera se n’è accorta e un medico ha cambiato il trattamento.", "fake": "Un sistema di IA ospedaliero che **pianifica le sale operatorie** avrebbe **messo un intervento urgente dopo quelli di routine** per aver letto male una nota nella cartella di un paziente, ma un’infermiera se n’è accorta prima che il ritardo causasse danni.", "excerpt": "Un’infermiera del St. Rose Dominican Hospital avrebbe descritto un episodio in cui un sistema di IA dell’ospedale avrebbe generato un allarme di sepsi.", "explanation": "Un sistema di IA ospedaliero avrebbe generato un allarme di sepsi per un paziente anziano in dialisi. La risposta d’urgenza standard prevedeva liquidi per via endovenosa, ma un’infermiera ha capito che potevano causare un pericoloso sovraccarico di liquidi. Un medico è intervenuto e ha cambiato il trattamento.", "whyBad": "Gli strumenti di supporto alle decisioni cliniche operano in flussi di lavoro in cui velocità e rispetto dei protocolli sono spesso preziosi. Ciò può creare bias da automazione (automation bias): il personale può interpretare un allarme come una raccomandazione forte anche quando la situazione del singolo paziente rende inadatta la risposta standard. Un errore sistematico del modello o del processo può quindi colpire molti pazienti se i clinici perdono la possibilità, il tempo o l’autorità di contestarlo.", "escalation": "Man mano che l’IA clinica diventa più capace e integrata in diagnosi, triage e raccomandazioni terapeutiche, le strutture potrebbero automatizzare parti sempre più ampie dell’assistenza. Se la supervisione umana diventa solo formale anziché effettiva, errori correlati del modello potrebbero colpire molti pazienti prima di essere riconosciuti."}, "es": {"title": "Una alerta médica de IA casi provocó un tratamiento inadecuado", "domain": "Sanidad", "hook": "una sola alerta equivocada", "real": "Según se informa, un sistema de IA hospitalario generó una **alerta de sepsis** para un paciente mayor en diálisis; la respuesta estándar, **líquidos intravenosos**, podía causar una sobrecarga de líquidos peligrosa, pero una enfermera lo advirtió y un médico cambió el tratamiento.", "fake": "Según se informa, un sistema de IA hospitalario que **programa los quirófanos** **colocó una operación urgente detrás de otras rutinarias** tras leer mal una nota en la historia clínica de un paciente, pero una enfermera lo advirtió antes de que el retraso causara daño.", "excerpt": "Según se informa, una enfermera del hospital St. Rose Dominican describió un episodio en el que un sistema de IA del hospital presuntamente generó una alerta de sepsis.", "explanation": "Según se informa, un sistema de IA hospitalario generó una alerta de sepsis para un paciente mayor en diálisis. La respuesta urgente estándar incluía líquidos intravenosos, pero una enfermera se dio cuenta de que podían causar una sobrecarga de líquidos peligrosa. Un médico intervino y cambió el tratamiento.", "whyBad": "Las herramientas de apoyo a la decisión clínica funcionan en flujos de trabajo donde la rapidez y el cumplimiento de protocolos suelen ser valiosos. Eso puede generar sesgo de automatización (automation bias): el personal puede interpretar una alerta como una recomendación firme incluso cuando las particularidades del paciente hacen inadecuada la respuesta estándar. Un fallo sistemático del modelo o del proceso puede afectar así a muchos pacientes si los clínicos pierden la capacidad, el tiempo o la autoridad para cuestionarlo.", "escalation": "A medida que la IA clínica sea más capaz y se integre en el diagnóstico, el triaje y las recomendaciones de tratamiento, los centros podrían automatizar partes cada vez mayores de la atención. Si la supervisión humana pasa a ser nominal en lugar de real, los fallos correlacionados del modelo podrían afectar a muchos pacientes antes de detectarse."}, "ko": {"title": "AI 의료 경보가 부적절한 치료로 이어질 뻔한 사례", "domain": "의료", "hook": "잘못된 경보 하나", "real": "병원 AI 시스템이 투석 중인 고령 환자에게 **패혈증 경보**를 냈고, 표준 대응인 **정맥 수액 투여**가 위험한 수분 과부하를 일으킬 수 있었으나, 간호사가 이를 알아채고 의사가 치료를 바꾼 것으로 알려졌다.", "fake": "**수술실 일정을 짜는** 병원 AI 시스템이 환자 차트의 메모를 잘못 읽어 **응급 수술을 일반 수술 뒤로 미뤘으나**, 지연으로 피해가 생기기 전에 간호사가 이를 알아챈 것으로 알려졌다.", "excerpt": "St. Rose Dominican 병원의 한 간호사가 병원 AI 시스템이 패혈증 경보를 생성한 것으로 추정되는 사례를 설명한 것으로 알려졌다.", "explanation": "병원 AI 시스템이 투석 중인 고령 환자에게 패혈증 경보를 생성한 것으로 알려졌다. 표준 응급 대응에는 정맥 수액 투여가 포함됐지만, 간호사는 이것이 위험한 수분 과부하를 일으킬 수 있다고 판단했다. 의사가 개입해 치료를 바꿨다.", "whyBad": "임상 의사결정 지원 도구는 속도와 프로토콜 준수가 중요한 업무 흐름 안에서 작동한다. 이는 자동화 편향(automation bias)을 낳을 수 있다. 환자 개인의 상황상 표준 대응이 부적절한 경우에도 의료진이 경보를 강한 권고로 받아들일 수 있다. 의료진이 이를 반박할 능력, 시간, 권한을 잃으면 모델이나 절차의 체계적 실패가 많은 환자에게 영향을 줄 수 있다.", "escalation": "임상 AI가 더 유능해지고 진단, 환자 분류(트리아지), 치료 권고에 깊이 통합될수록 의료 기관은 진료의 더 많은 부분을 자동화할 수 있다. 인간의 감독이 실질적이지 않고 형식적인 것이 되면, 모델의 상관된 실패가 발견되기 전에 많은 환자에게 퍼질 수 있다."}, "zh": {"title": "AI 医疗警报差点导致不当治疗", "domain": "医疗", "hook": "一次错误的警报", "real": "据报道，一个医院 AI 系统为一名正在透析的老年患者发出了**败血症警报**；标准处置是**静脉输液**，这可能导致危险的液体超负荷，但一名护士发现了问题，医生调整了治疗。", "fake": "据报道，一个**负责安排手术室**的医院 AI 系统因误读了患者病历中的一条备注，**把一台紧急手术排在了常规手术之后**，但一名护士在延误造成伤害之前发现了问题。", "excerpt": "据报道，St. Rose Dominican 医院的一名护士描述了一起医院 AI 系统疑似生成败血症警报的事件。", "explanation": "据报道，一个医院 AI 系统为一名正在透析的老年患者生成了败血症警报。标准的紧急处置包括静脉输液，但一名护士意识到这可能导致危险的液体超负荷。一名医生介入并调整了治疗。", "whyBad": "临床决策支持工具运行在重视速度和遵守规程的工作流程中。这可能造成自动化偏见（automation bias）：即使患者的具体情况使标准处置并不合适，医护人员也可能把警报当作强烈建议。如果临床人员失去质疑它的能力、时间或权限，模型或流程的系统性故障就可能影响大量患者。", "escalation": "随着临床 AI 能力增强，并更深地嵌入诊断、分诊和治疗建议，医疗机构可能把越来越多的诊疗环节自动化。如果人工监督变得流于形式而不是真正有效，模型的关联性故障可能在被发现之前就波及大量患者。"}, "sr": {"title": "Медицинско упозорење ВИ замало довело до неодговарајућег лечења", "domain": "Здравство", "hook": "једно погрешно упозорење", "real": "Болнички ВИ систем је, како се наводи, генерисао **упозорење на сепсу** за старијег пацијента на дијализи; стандардни одговор, **интравенске течности**, могао је изазвати опасно преоптерећење течношћу, али је медицинска сестра то приметила и лекар је променио терапију.", "fake": "Болнички ВИ систем који **прави распоред операционих сала** је, како се наводи, **хитну операцију ставио иза рутинских** јер је погрешно прочитао белешку у картону пацијента, али је медицинска сестра то приметила пре него што је кашњење нанело штету.", "excerpt": "Медицинска сестра болнице St. Rose Dominican је, како се наводи, описала случај у ком је болнички ВИ систем наводно генерисао упозорење на сепсу.", "explanation": "Болнички ВИ систем је, како се наводи, генерисао упозорење на сепсу за старијег пацијента на дијализи. Стандардни хитни одговор подразумевао је интравенске течности, али је медицинска сестра схватила да то може изазвати опасно преоптерећење течношћу. Лекар је интервенисао и променио терапију.", "whyBad": "Алати за подршку клиничком одлучивању раде у токовима рада у којима су брзина и поштовање протокола често драгоцени. То може изазвати пристрасност према аутоматизацији (automation bias): особље може тумачити упозорење као снажну препоруку чак и када специфичности пацијента чине стандардни одговор неодговарајућим. Системски пропуст модела или процеса зато може погодити многе пацијенте ако клиничари изгубе могућност, време или овлашћење да га оспоре.", "escalation": "Како клиничка ВИ постаје способнија и дубље уграђена у дијагностику, тријажу и препоруке за лечење, установе би могле да аутоматизују све веће делове неге. Ако људски надзор постане формалан уместо суштински, корелисане грешке модела могле би да погоде многе пацијенте пре него што буду откривене."}, "bs": {"title": "Medicinsko upozorenje UI zamalo dovelo do neodgovarajućeg liječenja", "domain": "Zdravstvo", "hook": "jedno pogrešno upozorenje", "real": "Bolnički UI sistem je, kako se navodi, generisao **upozorenje na sepsu** za starijeg pacijenta na dijalizi; standardni odgovor, **intravenske tečnosti**, mogao je izazvati opasno preopterećenje tečnošću, ali je medicinska sestra to primijetila i ljekar je promijenio terapiju.", "fake": "Bolnički UI sistem koji **pravi raspored operacionih sala** je, kako se navodi, **hitnu operaciju stavio iza rutinskih** jer je pogrešno pročitao bilješku u kartonu pacijenta, ali je medicinska sestra to primijetila prije nego što je kašnjenje nanijelo štetu.", "excerpt": "Medicinska sestra bolnice St. Rose Dominican je, kako se navodi, opisala slučaj u kojem je bolnički UI sistem navodno generisao upozorenje na sepsu.", "explanation": "Bolnički UI sistem je, kako se navodi, generisao upozorenje na sepsu za starijeg pacijenta na dijalizi. Standardni hitni odgovor podrazumijevao je intravenske tečnosti, ali je medicinska sestra shvatila da to može izazvati opasno preopterećenje tečnošću. Ljekar je intervenisao i promijenio terapiju.", "whyBad": "Alati za podršku kliničkom odlučivanju rade u tokovima rada u kojima su brzina i poštovanje protokola često dragocjeni. To može izazvati pristrasnost prema automatizaciji (automation bias): osoblje može tumačiti upozorenje kao snažnu preporuku čak i kada specifičnosti pacijenta čine standardni odgovor neodgovarajućim. Sistemski propust modela ili procesa zato može pogoditi mnoge pacijente ako kliničari izgube mogućnost, vrijeme ili ovlaštenje da ga ospore.", "escalation": "Kako klinička UI postaje sposobnija i dublje ugrađena u dijagnostiku, trijažu i preporuke za liječenje, ustanove bi mogle automatizovati sve veće dijelove njege. Ako ljudski nadzor postane formalan umjesto suštinskog, korelisane greške modela mogle bi pogoditi mnoge pacijente prije nego što budu otkrivene."}, "ro": {"title": "O alertă medicală IA a fost cât pe ce să ducă la un tratament nepotrivit", "domain": "Sănătate", "hook": "o singură alertă greșită", "real": "Un sistem IA dintr-un spital ar fi generat o **alertă de sepsis** pentru un pacient în vârstă aflat la dializă; răspunsul standard, **fluidele intravenoase**, putea provoca o supraîncărcare periculoasă cu lichide, dar o asistentă a observat și un medic a schimbat tratamentul.", "fake": "Un sistem IA dintr-un spital care **programează sălile de operație** ar fi **mutat o operație urgentă după cele de rutină**, după ce a citit greșit o notă din fișa unui pacient, dar o asistentă a observat înainte ca întârzierea să facă rău.", "excerpt": "O asistentă de la spitalul St. Rose Dominican ar fi descris un episod în care un sistem IA al spitalului ar fi generat o alertă de sepsis.", "explanation": "Un sistem IA dintr-un spital ar fi generat o alertă de sepsis pentru un pacient în vârstă aflat la dializă. Răspunsul standard de urgență includea fluide intravenoase, dar o asistentă și-a dat seama că acestea puteau provoca o supraîncărcare periculoasă cu lichide. Un medic a intervenit și a schimbat tratamentul.", "whyBad": "Instrumentele de sprijin pentru decizii clinice funcționează în fluxuri de lucru în care viteza și respectarea protocoalelor sunt adesea valoroase. Asta poate crea tendința de a ne baza pe automatizare (automation bias): personalul poate interpreta o alertă ca pe o recomandare fermă chiar și când particularitățile pacientului fac răspunsul standard nepotrivit. Un eșec sistematic al modelului sau al procesului poate afecta astfel mulți pacienți dacă clinicienii pierd capacitatea, timpul sau autoritatea de a-l contesta.", "escalation": "Pe măsură ce IA clinică devine mai capabilă și mai integrată în diagnostic, triaj și recomandări de tratament, unitățile medicale ar putea automatiza părți tot mai mari din îngrijire. Dacă supravegherea umană devine formală în loc de reală, eșecurile corelate ale modelului ar putea afecta mulți pacienți înainte de a fi descoperite."}, "vi": {"title": "Cảnh báo y tế của AI suýt dẫn đến điều trị không phù hợp", "domain": "Y tế", "hook": "một cảnh báo sai", "real": "Một hệ thống AI của bệnh viện được cho là đã đưa ra **cảnh báo nhiễm trùng huyết** cho một bệnh nhân lớn tuổi đang chạy thận; cách xử trí tiêu chuẩn là **truyền dịch tĩnh mạch**, có thể gây quá tải dịch nguy hiểm, nhưng một y tá đã nhận ra và bác sĩ đã đổi phác đồ điều trị.", "fake": "Một hệ thống AI **xếp lịch phòng mổ** của bệnh viện được cho là đã **đẩy một ca mổ khẩn cấp xuống sau các ca thông thường** vì đọc sai một ghi chú trong hồ sơ bệnh nhân, nhưng một y tá đã phát hiện trước khi sự chậm trễ gây hại.", "excerpt": "Một y tá tại bệnh viện St. Rose Dominican được cho là đã kể về một trường hợp hệ thống AI của bệnh viện được cho là đã đưa ra cảnh báo nhiễm trùng huyết.", "explanation": "Một hệ thống AI của bệnh viện được cho là đã đưa ra cảnh báo nhiễm trùng huyết cho một bệnh nhân lớn tuổi đang chạy thận. Phản ứng cấp cứu tiêu chuẩn bao gồm truyền dịch tĩnh mạch, nhưng một y tá nhận ra điều này có thể gây quá tải dịch nguy hiểm. Một bác sĩ đã can thiệp và thay đổi phác đồ điều trị.", "whyBad": "Các công cụ hỗ trợ quyết định lâm sàng vận hành trong quy trình mà tốc độ và việc tuân thủ phác đồ thường rất quan trọng. Điều này có thể tạo ra thiên kiến tự động hóa (automation bias): nhân viên có thể coi cảnh báo là một khuyến nghị mạnh ngay cả khi đặc điểm riêng của bệnh nhân khiến phản ứng tiêu chuẩn không phù hợp. Vì thế, một lỗi có hệ thống của mô hình hoặc quy trình có thể ảnh hưởng đến nhiều bệnh nhân nếu nhân viên y tế mất khả năng, thời gian hoặc thẩm quyền để phản bác.", "escalation": "Khi AI lâm sàng ngày càng mạnh và được tích hợp sâu vào chẩn đoán, phân loại bệnh nhân (triage) và khuyến nghị điều trị, các cơ sở y tế có thể tự động hóa ngày càng nhiều phần của việc chăm sóc. Nếu sự giám sát của con người chỉ còn mang tính hình thức thay vì thực chất, các lỗi tương quan của mô hình có thể ảnh hưởng đến nhiều bệnh nhân trước khi được phát hiện."}, "uk": {"title": "Медичне сповіщення ШІ ледь не призвело до невідповідного лікування", "domain": "Охорона здоров'я", "hook": "одне хибне сповіщення", "real": "Лікарняна ШІ-система, за наявними даними, видала **сповіщення про сепсис** для літнього пацієнта на діалізі; стандартний захід, **внутрішньовенне введення рідини**, міг спричинити небезпечне перевантаження рідиною, але медсестра це помітила, і лікар змінив лікування.", "fake": "Лікарняна ШІ-система, що **складає розклад операційних**, за наявними даними, **поставила термінову операцію після планових**, неправильно прочитавши запис у картці пацієнта, але медсестра помітила це раніше, ніж затримка завдала шкоди.", "excerpt": "Медсестра лікарні St. Rose Dominican, за наявними даними, описала випадок, коли лікарняна ШІ-система імовірно згенерувала сповіщення про сепсис.", "explanation": "Лікарняна ШІ-система, за наявними даними, згенерувала сповіщення про сепсис для літнього пацієнта на діалізі. Стандартний екстрений протокол передбачав внутрішньовенне введення рідини, але медсестра зрозуміла, що це може спричинити небезпечне перевантаження рідиною. Лікар утрутився й змінив лікування.", "whyBad": "Системи підтримки клінічних рішень працюють у процесах, де швидкість і дотримання протоколів часто цінні. Це може породжувати упередженість до автоматизації (automation bias): персонал може сприймати сповіщення як сильну рекомендацію, навіть коли особливості конкретного пацієнта роблять стандартну реакцію невідповідною. Тому систематичний збій моделі чи процесу може зачепити багатьох пацієнтів, якщо в клініцистів не залишиться можливості, часу чи повноважень його оскаржити.", "escalation": "У міру того як клінічний ШІ стає здібнішим і глибше вбудовується в діагностику, сортування пацієнтів (тріаж) і рекомендації щодо лікування, заклади можуть автоматизувати дедалі більшу частину медичної допомоги. Якщо людський нагляд стане номінальним, а не змістовним, корельовані збої моделі зможуть зачепити багатьох пацієнтів, перш ніж їх виявлять."}, "pl": {"title": "Alert medyczny AI omal nie doprowadził do niewłaściwego leczenia", "domain": "Ochrona zdrowia", "hook": "jeden błędny alert", "real": "Szpitalny system AI miał wygenerować **alert sepsy** dla starszego pacjenta dializowanego; standardowa reakcja, **dożylne podanie płynów**, mogła spowodować niebezpieczne przewodnienie, ale pielęgniarka to zauważyła, a lekarz zmienił leczenie.", "fake": "Szpitalny system AI **układający grafik sal operacyjnych** miał **przesunąć pilną operację za zabiegi planowe** po błędnym odczytaniu notatki w karcie pacjenta, ale pielęgniarka zauważyła to, zanim opóźnienie wyrządziło szkodę.", "excerpt": "Pielęgniarka ze szpitala St. Rose Dominican miała opisać zdarzenie, w którym szpitalny system AI rzekomo wygenerował alert sepsy.", "explanation": "Szpitalny system AI miał wygenerować alert sepsy dla starszego pacjenta dializowanego. Standardowa pilna reakcja obejmowała dożylne podanie płynów, ale pielęgniarka zorientowała się, że może to spowodować niebezpieczne przewodnienie. Lekarz interweniował i zmienił leczenie.", "whyBad": "Narzędzia wspomagające decyzje kliniczne działają w procesach, w których szybkość i trzymanie się procedur są często cenne. Może to rodzić nadmierne zaufanie do automatyzacji (automation bias): personel może potraktować alert jako mocne zalecenie nawet wtedy, gdy sytuacja konkretnego pacjenta sprawia, że standardowa reakcja jest niewłaściwa. Systematyczny błąd modelu lub procesu może więc dotknąć wielu pacjentów, jeśli klinicyści stracą możliwość, czas lub uprawnienia, by go zakwestionować.", "escalation": "W miarę jak kliniczna AI staje się coraz zdolniejsza i głębiej wbudowana w diagnostykę, triaż i zalecenia terapeutyczne, placówki mogą automatyzować coraz większą część opieki. Jeśli nadzór człowieka stanie się formalnością, a nie realną kontrolą, skorelowane błędy modelu mogą dotknąć wielu pacjentów, zanim zostaną wykryte."}, "ta": {"title": "AI மருத்துவ எச்சரிக்கையால் கிட்டத்தட்டப் பொருத்தமற்ற சிகிச்சை", "domain": "சுகாதாரம்", "hook": "ஒரு தவறான எச்சரிக்கை", "real": "டயாலிசிஸ் சிகிச்சை பெறும் வயதான நோயாளி ஒருவருக்கு மருத்துவமனை AI அமைப்பு **செப்சிஸ் எச்சரிக்கை** விடுத்ததாகக் கூறப்படுகிறது; நிலையான நடைமுறையான **நரம்பு வழித் திரவங்கள்** ஆபத்தான திரவ மிகைச்சுமையை ஏற்படுத்தியிருக்கலாம்; ஆனால் ஒரு செவிலியர் அதைக் கவனித்தார், மருத்துவர் சிகிச்சையை மாற்றினார்.", "fake": "**அறுவை அரங்குகளுக்கு நேரம் ஒதுக்கும்** மருத்துவமனை AI அமைப்பு ஒன்று, நோயாளியின் பதிவேட்டில் இருந்த குறிப்பைத் தவறாகப் படித்து, **அவசர அறுவை சிகிச்சையை வழக்கமானவற்றுக்குப் பின்னால் தள்ளியதாகக்** கூறப்படுகிறது; ஆனால் தாமதம் தீங்கு விளைவிப்பதற்கு முன்பே ஒரு செவிலியர் அதைக் கவனித்தார்.", "excerpt": "St. Rose Dominican மருத்துவமனையின் செவிலியர் ஒருவர், மருத்துவமனையின் AI அமைப்பு ஒரு செப்சிஸ் எச்சரிக்கையை உருவாக்கியதாகக் கூறப்படும் நிகழ்வை விவரித்ததாகக் கூறப்படுகிறது.", "explanation": "டயாலிசிஸ் சிகிச்சை பெறும் வயதான நோயாளி ஒருவருக்கு மருத்துவமனை AI அமைப்பு செப்சிஸ் எச்சரிக்கையை உருவாக்கியதாகக் கூறப்படுகிறது. நிலையான அவசர நடைமுறையில் நரம்பு வழித் திரவங்கள் அடங்கியிருந்தன; ஆனால் இது ஆபத்தான திரவ மிகைச்சுமையை ஏற்படுத்தக்கூடும் என்று ஒரு செவிலியர் உணர்ந்தார். ஒரு மருத்துவர் தலையிட்டுச் சிகிச்சையை மாற்றினார்.", "whyBad": "மருத்துவ முடிவெடுக்க உதவும் கருவிகள், வேகமும் நடைமுறை விதிகளைப் பின்பற்றுவதும் பெரும்பாலும் மதிப்புமிக்கவையாக இருக்கும் பணிச்சூழல்களில் இயங்குகின்றன. இது தானியக்கச் சார்புநிலையை (automation bias) உருவாக்கலாம்: நோயாளியின் தனிப்பட்ட நிலை நிலையான நடைமுறையைப் பொருத்தமற்றதாக்கும் போதும், பணியாளர்கள் எச்சரிக்கையை வலுவான பரிந்துரையாகக் கருதக்கூடும். எனவே, மருத்துவர்கள் அதை எதிர்க்கும் திறன், நேரம் அல்லது அதிகாரத்தை இழந்தால், மாதிரியிலோ செயல்முறையிலோ ஏற்படும் முறையான தோல்வி பல நோயாளிகளைப் பாதிக்கலாம்.", "escalation": "மருத்துவ AI மேலும் திறன் பெற்று, நோயறிதல், நோயாளி முன்னுரிமைப்படுத்தல் (triage), சிகிச்சைப் பரிந்துரைகள் ஆகியவற்றில் ஆழமாகப் பதியும்போது, மருத்துவ நிறுவனங்கள் பராமரிப்பின் பெரும் பகுதிகளைத் தானியக்கமாக்கக்கூடும். மனித மேற்பார்வை உண்மையானதாக இல்லாமல் பெயரளவுக்கு மட்டுமே இருந்தால், மாதிரியின் ஒன்றோடொன்று தொடர்புடைய தோல்விகள் கண்டறியப்படுவதற்கு முன்பே பல நோயாளிகளைப் பாதிக்கக்கூடும்."}, "sv": {"title": "Medicinskt AI-larm ledde nästan till olämplig behandling", "domain": "Sjukvård", "hook": "ett enda felaktigt larm", "real": "Ett AI-system på ett sjukhus ska ha gett ett **sepsislarm** för en äldre dialyspatient; standardåtgärden, **intravenös vätska**, kunde ha orsakat farlig vätskeöverbelastning, men en sjuksköterska upptäckte det och en läkare ändrade behandlingen.", "fake": "Ett AI-system som **schemalägger operationssalar** på ett sjukhus ska ha **lagt en akut operation efter rutiningrepp** sedan det läst fel på en anteckning i en patients journal, men en sjuksköterska upptäckte det innan förseningen hann orsaka skada.", "excerpt": "En sjuksköterska vid St. Rose Dominican Hospital ska ha beskrivit en händelse där ett AI-system på sjukhuset påstås ha genererat ett sepsislarm.", "explanation": "Ett AI-system på ett sjukhus ska ha genererat ett sepsislarm för en äldre dialyspatient. Standardåtgärden vid akutlägen omfattade intravenös vätska, men en sjuksköterska insåg att det kunde orsaka farlig vätskeöverbelastning. En läkare ingrep och ändrade behandlingen.", "whyBad": "Verktyg för kliniskt beslutsstöd verkar i arbetsflöden där snabbhet och följsamhet till rutiner ofta är värdefulla. Det kan skapa automationsbias (automation bias): personal kan tolka ett larm som en stark rekommendation även när patientens särskilda förutsättningar gör standardåtgärden olämplig. Ett systematiskt fel i modellen eller processen kan därför drabba många patienter om vårdpersonalen förlorar förmågan, tiden eller befogenheten att ifrågasätta det.", "escalation": "När klinisk AI blir mer kapabel och djupare inbyggd i diagnostik, triage och behandlingsrekommendationer kan vårdgivare automatisera allt större delar av vården. Om den mänskliga tillsynen blir formell snarare än verklig kan korrelerade modellfel drabba många patienter innan de upptäcks."}, "tr": {"title": "Yapay zekâ tıbbi uyarısı neredeyse uygunsuz bir tedaviye yol açıyordu", "domain": "Sağlık", "hook": "tek bir yanlış uyarı", "real": "Bir hastane yapay zekâ sisteminin diyalize giren yaşlı bir hasta için **sepsis uyarısı** verdiği bildirildi; standart müdahale olan **damar yoluyla sıvı verilmesi** tehlikeli bir sıvı yüklenmesine yol açabilirdi, ancak bir hemşire durumu fark etti ve doktor tedaviyi değiştirdi.", "fake": "**Ameliyathane programını hazırlayan** bir hastane yapay zekâ sisteminin, hasta dosyasındaki bir notu yanlış okuyarak **acil bir ameliyatı rutin ameliyatların arkasına aldığı**, ancak gecikme zarar vermeden önce bir hemşirenin durumu fark ettiği bildirildi.", "excerpt": "St. Rose Dominican Hastanesi'nden bir hemşirenin, hastanedeki bir yapay zekâ sisteminin iddiaya göre sepsis uyarısı ürettiği bir olayı anlattığı bildirildi.", "explanation": "Bir hastane yapay zekâ sisteminin diyalize giren yaşlı bir hasta için sepsis uyarısı ürettiği bildirildi. Standart acil müdahale damar yoluyla sıvı vermeyi içeriyordu, ancak bir hemşire bunun tehlikeli bir sıvı yüklenmesine neden olabileceğini fark etti. Bir doktor müdahale ederek tedaviyi değiştirdi.", "whyBad": "Klinik karar destek araçları, hızın ve protokollere uymanın çoğu zaman değerli olduğu iş akışlarında çalışır. Bu durum otomasyon yanlılığına (automation bias) yol açabilir: Personel, hastaya özgü koşullar standart müdahaleyi uygunsuz kılsa bile bir uyarıyı güçlü bir tavsiye olarak yorumlayabilir. Bu yüzden klinisyenler itiraz etme imkânını, zamanını veya yetkisini kaybederse, modelde ya da süreçte sistematik bir hata birçok hastayı etkileyebilir.", "escalation": "Klinik yapay zekâ daha yetenekli hâle gelip tanı, triyaj ve tedavi önerilerine daha derinden yerleştikçe sağlık kurumları bakımın giderek daha büyük kısımlarını otomatikleştirebilir. İnsan denetimi anlamlı olmaktan çıkıp göstermelik hâle gelirse, modelin birbiriyle bağlantılı hataları fark edilmeden önce birçok hastayı etkileyebilir."}}}, {"id": 1606, "url": "https://incidentdatabase.ai/cite/1606/", "building": "cityhall", "text": {"en": {"title": "Facial verification and access to social benefits", "domain": "Public services", "hook": "one failed face check", "real": "Repeated failures of a **facial-verification portal** were reportedly among the reasons some people **could not get their social benefits**.", "fake": "An AI system that **sorts letters from residents** reportedly sent hundreds of benefit appeals to the wrong department, and people **missed their appeal deadlines** before anyone noticed.", "excerpt": "South African social grant beneficiaries reportedly encountered repeated failures in SASSA's eLife facial-verification portal.", "explanation": "South African social-grant recipients reportedly experienced repeated failures with SASSA's facial-verification portal. Parliamentary reporting later said unsuccessful facial recognition was one cause of non-verification and confirmed 67,868 grant suspensions in one quarter, but did not say how many were specifically caused by facial-verification failures.", "whyBad": "Automated identity verification becomes high stakes when access to essential public services depends on it. A false rejection is not merely an inconvenience: for a grant recipient it can mean delayed access to income used for food, housing, transport, or healthcare. Centralized deployment also creates correlated failure risk—one design or operational problem can affect many people at once. The burden of correcting the error may also fall disproportionately on people with the least time, mobility, connectivity, or administrative capacity to navigate an appeal.", "escalation": "Governments and companies may increasingly use biometric and AI-based verification for benefits, banking, insurance, employment, and access control. If deployment scales faster than fallback procedures, auditing, and appeals, automated exclusion can become more widespread and harder for affected individuals to contest."}, "fr": {"title": "Vérification faciale et accès aux aides sociales", "domain": "Services publics", "hook": "une seule vérification faciale ratée", "real": "Les échecs répétés d’un **portail de vérification faciale** figureraient parmi les raisons pour lesquelles certaines personnes **n’ont pas pu toucher leurs aides sociales**.", "fake": "Un système d’IA qui **trie le courrier des habitants** aurait envoyé des centaines de recours concernant des aides au mauvais service, et des personnes ont **dépassé le délai de recours** avant que quiconque ne s’en aperçoive.", "excerpt": "Des bénéficiaires d’allocations sociales en Afrique du Sud auraient rencontré des échecs répétés sur le portail de vérification faciale eLife de la SASSA.", "explanation": "Des bénéficiaires d’allocations sociales en Afrique du Sud auraient rencontré des échecs répétés sur le portail de vérification faciale de la SASSA. Des rapports parlementaires ont ensuite indiqué que l’échec de la reconnaissance faciale était l’une des causes de non-vérification et confirmé 67 868 suspensions d’allocations en un trimestre, sans préciser combien étaient dues spécifiquement à la vérification faciale.", "whyBad": "La vérification d’identité automatisée devient un enjeu majeur quand l’accès à des services publics essentiels en dépend. Un faux rejet n’est pas un simple désagrément : pour un allocataire, il peut retarder l’accès à un revenu utilisé pour se nourrir, se loger, se déplacer ou se soigner. Un déploiement centralisé crée aussi un risque de défaillance corrélée : un seul problème de conception ou d’exploitation peut toucher beaucoup de personnes à la fois. La charge de corriger l’erreur peut aussi peser de façon disproportionnée sur celles qui ont le moins de temps, de mobilité, de connexion ou de capacités administratives pour faire appel.", "escalation": "Les États et les entreprises pourraient recourir de plus en plus à la vérification biométrique et fondée sur l’IA pour les prestations, la banque, l’assurance, l’emploi et le contrôle d’accès. Si le déploiement progresse plus vite que les procédures de repli, les audits et les voies de recours, l’exclusion automatisée pourrait se généraliser et devenir plus difficile à contester pour les personnes concernées."}, "de": {"title": "Gesichtsverifikation und Zugang zu Sozialleistungen", "domain": "Öffentliche Dienste", "hook": "eine einzige fehlgeschlagene Gesichtsprüfung", "real": "Wiederholte Fehlschläge eines **Portals zur Gesichtsverifikation** sollen zu den Gründen gehört haben, warum manche Menschen **ihre Sozialleistungen nicht erhielten**.", "fake": "Ein KI-System, das **Briefe von Bürgern sortiert**, soll Hunderte Widersprüche zu Sozialleistungen an die falsche Abteilung geleitet haben, sodass Menschen **die Widerspruchsfrist versäumten**, bevor es jemand bemerkte.", "excerpt": "Empfänger von Sozialleistungen in Südafrika sollen wiederholt Fehlschläge im eLife-Portal zur Gesichtsverifikation der SASSA erlebt haben.", "explanation": "Empfänger von Sozialleistungen in Südafrika sollen wiederholt Fehlschläge im Gesichtsverifikationsportal der SASSA erlebt haben. Parlamentsberichte nannten später erfolglose Gesichtserkennung als eine Ursache fehlgeschlagener Verifikationen und bestätigten 67.868 ausgesetzte Leistungen in einem Quartal, ohne anzugeben, wie viele davon speziell auf die Gesichtsverifikation zurückgingen.", "whyBad": "Automatisierte Identitätsprüfung wird folgenreich, wenn der Zugang zu grundlegenden öffentlichen Leistungen von ihr abhängt. Eine falsche Ablehnung ist keine bloße Unannehmlichkeit: Für Leistungsempfänger kann sie verzögerten Zugang zu Geld für Essen, Wohnen, Mobilität oder Gesundheit bedeuten. Ein zentraler Einsatz schafft zudem das Risiko korrelierter Ausfälle: Ein einziges Design- oder Betriebsproblem kann viele Menschen zugleich treffen. Die Last der Fehlerkorrektur kann unverhältnismäßig auf jene fallen, die am wenigsten Zeit, Mobilität, Internetzugang oder Verwaltungskompetenz für einen Widerspruch haben.", "escalation": "Staaten und Unternehmen könnten biometrische und KI-gestützte Verifikation zunehmend für Sozialleistungen, Bankgeschäfte, Versicherungen, Beschäftigung und Zugangskontrolle einsetzen. Wächst der Einsatz schneller als Ausweichverfahren, Audits und Beschwerdewege, könnte automatisierter Ausschluss häufiger werden und für Betroffene schwerer anzufechten sein."}, "ru": {"title": "Верификация по лицу и доступ к социальным выплатам", "domain": "Социальные услуги", "hook": "одна неудачная проверка лица", "real": "Повторяющиеся сбои **портала верификации по лицу**, по имеющимся данным, были одной из причин, по которым часть людей **не могла получить социальные выплаты**.", "fake": "ИИ-система, которая **сортирует письма от жителей**, по имеющимся данным, направила сотни жалоб на отказ в пособиях не в тот отдел, и люди **пропустили срок обжалования**, прежде чем это заметили.", "excerpt": "Получатели социальных пособий в ЮАР, по имеющимся данным, сталкивались с повторяющимися сбоями на портале верификации по лицу eLife агентства SASSA.", "explanation": "Получатели социальных пособий в ЮАР, по имеющимся данным, сталкивались с повторяющимися сбоями на портале верификации по лицу агентства SASSA. Позднее в отчётах для парламента говорилось, что неудачное распознавание лица было одной из причин непрохождения верификации, и подтверждалась приостановка 67 868 выплат за один квартал, но не уточнялось, сколько из них вызвано именно сбоями верификации по лицу.", "whyBad": "Автоматическая проверка личности становится критически важной, когда от неё зависит доступ к базовым государственным услугам. Ложный отказ — не просто неудобство: для получателя пособия он может означать задержку денег на еду, жильё, транспорт или лечение. Централизованное внедрение также создаёт риск коррелированных сбоев — одна проблема в проектировании или эксплуатации может затронуть множество людей сразу. Бремя исправления ошибки может непропорционально ложиться на тех, у кого меньше всего времени, мобильности, доступа к связи или административных возможностей, чтобы пройти апелляцию.", "escalation": "Государства и компании могут всё шире использовать биометрическую и основанную на ИИ верификацию для пособий, банковских услуг, страхования, трудоустройства и контроля доступа. Если внедрение будет масштабироваться быстрее, чем резервные процедуры, аудит и механизмы обжалования, автоматизированное исключение может стать более распространённым, а пострадавшим будет сложнее его оспорить."}, "it": {"title": "Verifica facciale e accesso ai sussidi sociali", "domain": "Servizi pubblici", "hook": "una sola verifica facciale fallita", "real": "I ripetuti errori di un **portale di verifica facciale** sarebbero stati tra i motivi per cui alcune persone **non sono riuscite a ottenere i sussidi sociali**.", "fake": "Un sistema di IA che **smista le lettere dei cittadini** avrebbe inviato centinaia di ricorsi sui sussidi all’ufficio sbagliato, e le persone hanno **perso i termini per il ricorso** prima che qualcuno se ne accorgesse.", "excerpt": "I beneficiari di sussidi sociali in Sudafrica avrebbero riscontrato ripetuti errori nel portale di verifica facciale eLife della SASSA.", "explanation": "I beneficiari di sussidi sociali in Sudafrica avrebbero riscontrato ripetuti errori nel portale di verifica facciale della SASSA. Rapporti parlamentari hanno poi indicato il mancato riconoscimento facciale come una delle cause delle verifiche fallite e confermato 67.868 sospensioni di sussidi in un trimestre, senza precisare quante fossero dovute specificamente alla verifica facciale.", "whyBad": "La verifica automatica dell’identità diventa critica quando da essa dipende l’accesso a servizi pubblici essenziali. Un falso rifiuto non è un semplice disagio: per chi riceve un sussidio può significare ritardi nell’accesso al denaro per cibo, casa, trasporti o cure. Un’adozione centralizzata crea anche un rischio di guasti correlati: un singolo problema di progettazione o di gestione può colpire molte persone insieme. L’onere di correggere l’errore può ricadere in modo sproporzionato su chi ha meno tempo, mobilità, connessione o capacità amministrative per fare ricorso.", "escalation": "Governi e aziende potrebbero usare sempre più la verifica biometrica e basata sull’IA per sussidi, servizi bancari, assicurazioni, lavoro e controllo degli accessi. Se l’adozione cresce più in fretta delle procedure alternative, degli audit e dei ricorsi, l’esclusione automatizzata potrebbe diffondersi e diventare più difficile da contestare per le persone colpite."}, "es": {"title": "Verificación facial y acceso a prestaciones sociales", "domain": "Servicios públicos", "hook": "una sola verificación facial fallida", "real": "Según se informa, los fallos repetidos de un **portal de verificación facial** estuvieron entre los motivos por los que algunas personas **no pudieron cobrar sus prestaciones sociales**.", "fake": "Según se informa, un sistema de IA que **clasifica las cartas de los vecinos** envió cientos de recursos sobre prestaciones al departamento equivocado, y la gente **perdió el plazo para recurrir** antes de que alguien lo notara.", "excerpt": "Según se informa, beneficiarios de subsidios sociales en Sudáfrica sufrieron fallos repetidos en el portal de verificación facial eLife de la SASSA.", "explanation": "Según se informa, beneficiarios de subsidios sociales en Sudáfrica sufrieron fallos repetidos en el portal de verificación facial de la SASSA. Informes parlamentarios señalaron después que el reconocimiento facial fallido fue una de las causas de la falta de verificación y confirmaron 67 868 suspensiones de subsidios en un trimestre, sin precisar cuántas se debieron específicamente a fallos de verificación facial.", "whyBad": "La verificación automática de identidad se vuelve crítica cuando de ella depende el acceso a servicios públicos esenciales. Un rechazo falso no es una simple molestia: para quien recibe un subsidio puede significar retrasos en el acceso a ingresos para comida, vivienda, transporte o atención médica. Un despliegue centralizado también crea riesgo de fallos correlacionados: un único problema de diseño u operación puede afectar a muchas personas a la vez. La carga de corregir el error puede recaer desproporcionadamente en quienes tienen menos tiempo, movilidad, conexión o capacidad administrativa para recurrir.", "escalation": "Gobiernos y empresas podrían usar cada vez más la verificación biométrica y basada en IA para prestaciones, banca, seguros, empleo y control de acceso. Si el despliegue crece más rápido que los procedimientos alternativos, las auditorías y las vías de recurso, la exclusión automatizada podría extenderse y ser más difícil de impugnar para las personas afectadas."}, "ko": {"title": "얼굴 인증과 사회복지 급여 접근", "domain": "공공 서비스", "hook": "실패한 얼굴 인증 한 번", "real": "**얼굴 인증 포털**의 반복된 오류가 일부 사람들이 **사회복지 급여를 받지 못한** 이유 중 하나였던 것으로 알려졌다.", "fake": "**주민 우편물을 분류하는** AI 시스템이 복지 급여 이의신청 수백 건을 엉뚱한 부서로 보냈고, 아무도 알아채지 못하는 사이 사람들이 **이의신청 기한을 놓친** 것으로 알려졌다.", "excerpt": "남아프리카공화국의 사회보장 급여 수급자들이 SASSA의 eLife 얼굴 인증 포털에서 반복적인 실패를 겪은 것으로 알려졌다.", "explanation": "남아프리카공화국의 사회보장 급여 수급자들이 SASSA 얼굴 인증 포털에서 반복적인 실패를 겪은 것으로 알려졌다. 이후 의회 보고에서는 얼굴 인식 실패가 인증 불발의 원인 중 하나였다고 밝히며 한 분기 동안 67,868건의 급여 중지를 확인했지만, 그중 얼굴 인증 실패로 인한 건수는 밝히지 않았다.", "whyBad": "필수 공공 서비스 이용이 자동 신원 인증에 달려 있을 때 그 인증은 매우 중요한 문제가 된다. 잘못된 거부는 단순한 불편이 아니다. 수급자에게는 식비, 주거비, 교통비, 의료비에 쓰일 돈을 늦게 받는다는 뜻일 수 있다. 중앙집중식 도입은 상관된 실패의 위험도 만든다. 하나의 설계나 운영 문제가 많은 사람에게 동시에 영향을 줄 수 있다. 오류를 바로잡는 부담은 이의신청에 필요한 시간, 이동 수단, 인터넷 접속, 행정 역량이 가장 부족한 사람들에게 불균형하게 돌아갈 수 있다.", "escalation": "정부와 기업은 복지, 은행, 보험, 고용, 출입 통제에 생체 인식과 AI 기반 인증을 점점 더 많이 사용할 수 있다. 도입 속도가 대체 절차, 감사, 이의신청 제도보다 빠르면 자동화된 배제가 더 널리 퍼지고, 피해자가 이를 다투기는 더 어려워질 수 있다."}, "zh": {"title": "人脸核验与社会福利的获取", "domain": "公共服务", "hook": "一次失败的人脸核验", "real": "据报道，**人脸核验门户**反复出错，是部分人**领不到社会福利**的原因之一。", "fake": "据报道，一个**分拣居民来信**的 AI 系统把数百份福利申诉送错了部门，等到有人发现时，人们已经**错过了申诉期限**。", "excerpt": "据报道，南非社会补助金领取者在 SASSA 的 eLife 人脸核验门户上反复遭遇核验失败。", "explanation": "据报道，南非社会补助金领取者在 SASSA 的人脸核验门户上反复遭遇失败。议会报告后来指出，人脸识别失败是核验未通过的原因之一，并确认一个季度内有 67,868 笔补助金被暂停，但未说明其中有多少是专门由人脸核验失败造成的。", "whyBad": "当获取基本公共服务取决于自动身份核验时，它就成了高风险环节。错误拒绝不只是不便：对补助金领取者来说，这可能意味着用于食物、住房、交通或医疗的钱被延误。集中式部署还带来关联性故障的风险——一个设计或运营问题可能同时影响许多人。纠正错误的负担可能不成比例地落在那些最缺乏时间、出行能力、网络连接或行政能力去申诉的人身上。", "escalation": "政府和企业可能越来越多地在福利、银行、保险、就业和门禁中使用生物识别和基于 AI 的核验。如果部署扩张快于备用流程、审计和申诉机制，自动化排斥可能变得更加普遍，受影响者也更难提出异议。"}, "sr": {"title": "Провера лица и приступ социјалној помоћи", "domain": "Јавне услуге", "hook": "једна неуспела провера лица", "real": "Поновљени неуспеси **портала за проверу лица** су, како се наводи, били међу разлозима због којих неки људи **нису могли да добију социјална давања**.", "fake": "ВИ систем који **разврстава писма грађана** је, како се наводи, стотине жалби у вези са социјалним давањима послао погрешном одељењу, па су људи **пропустили рок за жалбу** пре него што је ико приметио.", "excerpt": "Корисници социјалних давања у Јужноафричкој Републици су, како се наводи, наилазили на поновљене неуспехе на SASSA порталу за проверу лица eLife.", "explanation": "Корисници социјалних давања у Јужноафричкој Републици су, како се наводи, наилазили на поновљене неуспехе на SASSA порталу за проверу лица. Парламентарни извештаји су касније навели да је неуспешно п jedan od uzroka neuspjele provjere i potvrdili 67.868 obustava davanja u jednom kvartalu, ali nisu naveli koliko je njih izazvano upravo neuspjesima provjere lica.", "whyBad": "Automatizovana provjera identiteta postaje pitanje visokog rizika kada od nje zavisi pristup osnovnim javnim uslugama. Lažno odbijanje nije puka neugodnost: za korisnika davanja to može značiti kašnjenje novca za hranu, stanovanje, prijevoz ili liječenje. Centralizovana primjena stvara i rizik korelisanih otkaza — jedan problem u dizajnu ili radu može istovremeno pogoditi mnoge ljude. Teret ispravljanja greške može nesrazmjerno pasti na one koji imaju najmanje vremena, pokretljivosti, pristupa internetu ili administrativnih kapaciteta da ulože žalbu.", "escalation": "Države i kompanije bi sve više mogle koristiti biometrijsku i na UI zasnovanu provjeru za socijalna davanja, bankarstvo, osiguranje, zapošljavanje i kontrolu pristupa. Ako primjena bude rasla brže od rezervnih procedura, revizija i mehanizama žalbe, automatizovano isključivanje moglo bi postati raširenije i teže osporivo za pogođene."}, "ro": {"title": "Verificarea facială și accesul la beneficii sociale", "domain": "Servicii publice", "hook": "o singură verificare facială eșuată", "real": "Eșecurile repetate ale unui **portal de verificare facială** s-ar fi numărat printre motivele pentru care unele persoane **nu și-au putut primi beneficiile sociale**.", "fake": "Un sistem IA care **sortează scrisorile locuitorilor** ar fi trimis sute de contestații privind beneficiile la departamentul greșit, iar oamenii au **pierdut termenul de contestație** înainte ca cineva să observe.", "excerpt": "Beneficiarii de alocații sociale din Africa de Sud s-ar fi confruntat cu eșecuri repetate pe portalul de verificare facială eLife al SASSA.", "explanation": "Beneficiarii de alocații sociale din Africa de Sud s-ar fi confruntat cu eșecuri repetate pe portalul de verificare facială al SASSA. Rapoarte parlamentare au arătat ulterior că recunoașter
