dạng khuôn mặt thất bại là một trong những nguyên nhân khiến việc xác minh không thành công và xác nhận 67.868 khoản trợ cấp bị tạm dừng trong một quý, nhưng không nói rõ bao nhiêu trường hợp là do lỗi xác minh khuôn mặt.", "whyBad": "Xác minh danh tính tự động trở nên hệ trọng khi quyền tiếp cận các dịch vụ công thiết yếu phụ thuộc vào nó. Một lần từ chối sai không chỉ là bất tiện: với người nhận trợ cấp, nó có thể khiến khoản tiền dành cho ăn uống, nhà ở, đi lại hay chữa bệnh bị chậm trễ. Triển khai tập trung cũng tạo ra rủi ro lỗi tương quan — một vấn đề thiết kế hay vận hành có thể ảnh hưởng đến nhiều người cùng lúc. Gánh nặng sửa sai có thể đổ dồn một cách bất cân xứng lên những người có ít thời gian, khả năng đi lại, kết nối mạng hoặc năng lực hành chính nhất để khiếu nại.", "escalation": "Chính phủ và doanh nghiệp có thể ngày càng dùng xác minh sinh trắc học và dựa trên AI cho trợ cấp, ngân hàng, bảo hiểm, việc làm và kiểm soát ra vào. Nếu việc triển khai mở rộng nhanh hơn các quy trình dự phòng, kiểm toán và cơ chế khiếu nại, tình trạng bị loại trừ tự động có thể trở nên phổ biến hơn và người bị ảnh hưởng sẽ khó phản đối hơn."}, "uk": {"title": "Верифікація за обличчям і доступ до соціальних виплат", "domain": "Соціальні послуги", "hook": "одна невдала перевірка обличчя", "real": "Повторювані збої **порталу верифікації за обличчям**, за наявними даними, були однією з причин, через які частина людей **не могла отримати соціальні виплати**.", "fake": "ШІ-система, яка **сортує листи від мешканців**, за наявними даними, спрямувала сотні скарг щодо відмов у допомозі не до того відділу, і люди **пропустили термін оскарження**, перш ніж це помітили.", "excerpt": "Отримувачі соціальних допомог у ПАР, за наявними даними, стикалися з повторюваними збоями на порталі верифікації за обличчям eLife агентства SASSA.", "explanation": "Отримувачі соціальних допомог у ПАР, за наявними даними, стикалися з повторюваними збоями на порталі верифікації за обличчям агентства SASSA. Згодом у звітах для парламенту зазначалося, що невдале розпізнавання обличчя було однією з причин непроходження верифікації, і підтверджувалося призупинення 67 868 виплат за один квартал, але не уточнювалося, скільки з них спричинено саме збоями верифікації за обличчям.", "whyBad": "Автоматична перевірка особи стає критично важливою, коли від неї залежить доступ до базових державних послуг. Хибна відмова — не просто незручність: для отримувача допомоги вона може означати затримку грошей на їжу, житло, транспорт чи лікування. Централізоване впровадження також створює ризик корельованих збоїв — одна проблема в проєктуванні чи експлуатації може зачепити багатьох людей одразу. Тягар виправлення помилки може непропорційно лягати на тих, хто має найменше часу, мобільності, доступу до зв'язку чи адміністративних можливостей, щоб пройти апеляцію.", "escalation": "Держави й компанії можуть дедалі ширше використовувати біометричну та засновану на ШІ верифікацію для допомог, банківських послуг, страхування, працевлаштування й контролю доступу. Якщо впровадження масштабуватиметься швидше, ніж резервні процедури, аудит і механізми оскарження, автоматизоване виключення може стати поширенішим, а постраждалим буде складніше його оскаржити."}, "pl": {"title": "Weryfikacja twarzy a dostęp do świadczeń socjalnych", "domain": "Usługi publiczne", "hook": "jedna nieudana weryfikacja twarzy", "real": "Powtarzające się błędy **portalu weryfikacji twarzy** miały być jednym z powodów, dla których część osób **nie mogła otrzymać świadczeń socjalnych**.", "fake": "System AI, który **sortuje listy od mieszkańców**, miał skierować setki odwołań w sprawie świadczeń do niewłaściwego wydziału, przez co ludzie **przegapili termin odwołania**, zanim ktokolwiek to zauważył.", "excerpt": "Beneficjenci zasiłków socjalnych w Republice Południowej Afryki mieli wielokrotnie napotykać błędy w portalu weryfikacji twarzy eLife agencji SASSA.", "explanation": "Beneficjenci zasiłków socjalnych w RPA mieli wielokrotnie napotykać błędy w portalu weryfikacji twarzy agencji SASSA. Raporty dla parlamentu wskazały później, że nieudane rozpoznanie twarzy było jedną z przyczyn niepowodzenia weryfikacji, i potwierdziły zawieszenie 67 868 świadczeń w jednym kwartale, ale nie podały, ile z nich wynikało właśnie z błędów weryfikacji twarzy.", "whyBad": "Automatyczna weryfikacja tożsamości nabiera dużej wagi, gdy zależy od niej dostęp do podstawowych usług publicznych. Błędna odmowa to nie tylko niedogodność: dla osoby pobierającej zasiłek może oznaczać opóźnienie pieniędzy na jedzenie, mieszkanie, transport czy leczenie. Centralne wdrożenie tworzy też ryzyko skorelowanych awarii — jeden błąd w projekcie lub działaniu systemu może dotknąć wiele osób naraz. Ciężar naprawienia pomyłki może nieproporcjonalnie spadać na tych, którzy mają najmniej czasu, możliwości dojazdu, dostępu do sieci i umiejętności urzędowych, by się odwołać.", "escalation": "Rządy i firmy mogą coraz częściej stosować weryfikację biometryczną i opartą na AI przy świadczeniach, w bankowości, ubezpieczeniach, zatrudnieniu i kontroli dostępu. Jeśli wdrożenia będą rosły szybciej niż procedury zastępcze, audyty i ścieżki odwoławcze, zautomatyzowane wykluczenie może stać się powszechniejsze i trudniejsze do zakwestionowania dla osób, których dotyczy."}, "ta": {"title": "முகச் சரிபார்ப்பும் சமூக நலத் திட்டங்களுக்கான அணுகலும்", "domain": "பொதுச் சேவைகள்", "hook": "தோல்வியடைந்த ஒரு முகச் சரிபார்ப்பு", "real": "ஒரு **முகச் சரிபார்ப்புத் தளத்தின்** தொடர் தோல்விகள், சிலர் **சமூக நல உதவிகளைப் பெற முடியாமல் போனதற்கான** காரணங்களில் ஒன்றாக இருந்ததாகக் கூறப்படுகிறது.", "fake": "**குடியிருப்பாளர்களின் கடிதங்களை வகைப்படுத்தும்** AI அமைப்பு ஒன்று, நல உதவி தொடர்பான நூற்றுக்கணக்கான மேல்முறையீடுகளைத் தவறான துறைக்கு அனுப்பியதாகவும், யாரும் கவனிப்பதற்கு முன்பே மக்கள் **மேல்முறையீட்டுக் காலக்கெடுவைத் தவறவிட்டதாகவும்** கூறப்படுகிறது.", "excerpt": "தென்னாப்பிரிக்காவில் சமூக உதவித்தொகை பெறுவோர் SASSA-வின் eLife முகச் சரிபார்ப்புத் தளத்தில் மீண்டும் மீண்டும் தோல்விகளைச் சந்தித்ததாகக் கூறப்படுகிறது.", "explanation": "தென்னாப்பிரிக்காவில் சமூக உதவித்தொகை பெறுவோர் SASSA-வின் முகச் சரிபார்ப்புத் தளத்தில் மீண்டும் மீண்டும் தோல்விகளைச் சந்தித்ததாகக் கூறப்படுகிறது. சரிபார்ப்பு தோல்வியடைந்ததற்கான காரணங்களில் முக அடையாளத் தோல்வியும் ஒன்று என்று நாடாளுமன்ற அறிக்கைகள் பின்னர் தெரிவித்தன; ஒரு காலாண்டில் 67,868 உதவித்தொகைகள் நிறுத்திவைக்கப்பட்டதை உறுதிசெய்தன; ஆனால் அவற்றில் எத்தனை முகச் சரிபார்ப்புத் தோல்வியால் மட்டுமே ஏற்பட்டன என்று குறிப்பிடவில்லை.", "whyBad": "அடிப்படைப் பொதுச் சேவைகளைப் பெறுவது தானியங்கி அடையாளச் சரிபார்ப்பைச் சார்ந்திருக்கும்போது, அது மிக முக்கியமான விஷயமாகிறது. தவறான நிராகரிப்பு வெறும் சிரமம் அல்ல: உதவித்தொகை பெறுபவருக்கு, உணவு, வீடு, போக்குவரத்து அல்லது மருத்துவத்துக்கான பணம் தாமதமாவதை அது குறிக்கலாம். மையப்படுத்தப்பட்ட செயல்படுத்தல், ஒன்றோடொன்று தொடர்புடைய தோல்விகளின் ஆபத்தையும் உருவாக்குகிறது — ஒரே ஒரு வடிவமைப்பு அல்லது இயக்கப் பிரச்சினை ஒரே நேரத்தில் பலரைப் பாதிக்கலாம். பிழையைத் திருத்தும் சுமை, மேல்முறையீடு செய்யக் குறைந்த நேரம், போக்குவரத்து வசதி, இணைய இணைப்பு அல்லது நிர்வாகத் திறன் உள்ளவர்கள் மீது விகிதாசாரமின்றி விழக்கூடும்.", "escalation": "அரசுகளும் நிறுவனங்களும் நலத்திட்டங்கள், வங்கிச் சேவைகள், காப்பீடு, வேலைவாய்ப்பு, நுழைவுக் கட்டுப்பாடு ஆகியவற்றுக்கு உயிரியளவு (biometric) மற்றும் AI அடிப்படையிலான சரிபார்ப்பை மேலும் பயன்படுத்தக்கூடும். மாற்று நடைமுறைகள், தணிக்கைகள், மேல்முறையீட்டு வழிகள் ஆகியவற்றை விட வேகமாக இந்தப் பயன்பாடு பெருகினால், தானியங்கி ஒதுக்கல் மேலும் பரவலாகி, பாதிக்கப்பட்டவர்கள் அதை எதிர்ப்பது கடினமாகலாம்."}, "sv": {"title": "Ansiktsverifiering och tillgång till socialt stöd", "domain": "Offentlig service", "hook": "en enda misslyckad ansiktskontroll", "real": "Upprepade fel i en **portal för ansiktsverifiering** ska ha varit ett av skälen till att vissa personer **inte fick ut sitt sociala stöd**.", "fake": "Ett AI-system som **sorterar brev från invånare** ska ha skickat hundratals överklaganden om bidrag till fel avdelning, och människor **missade tidsfristen för överklagande** innan någon märkte det.", "excerpt": "Mottagare av sociala bidrag i Sydafrika ska ha drabbats av upprepade misslyckanden i SASSA:s portal för ansiktsverifiering, eLife.", "explanation": "Mottagare av sociala bidrag i Sydafrika ska ha drabbats av upprepade misslyckanden i SASSA:s portal för ansiktsverifiering. Rapporter till parlamentet angav senare att misslyckad ansiktsigenkänning var en av orsakerna till utebliven verifiering och bekräftade 67 868 indragna bidrag under ett kvartal, men angav inte hur många som berodde just på misslyckad ansiktsverifiering.", "whyBad": "Automatiserad identitetskontroll blir avgörande när tillgången till grundläggande offentlig service hänger på den. Ett felaktigt avslag är inte bara ett besvär: för en bidragsmottagare kan det innebära att pengar till mat, boende, resor eller vård dröjer. Centraliserad användning skapar också risk för korrelerade fel – ett enda konstruktions- eller driftproblem kan drabba många människor samtidigt. Bördan att rätta felet kan falla oproportionerligt på dem som har minst tid, rörlighet, uppkoppling eller administrativ förmåga att överklaga.", "escalation": "Stater och företag kan i allt högre grad använda biometrisk och AI-baserad verifiering för bidrag, bankärenden, försäkringar, anställning och passerkontroll. Om användningen växer snabbare än reservrutiner, granskning och överklagandevägar kan automatiserad utestängning bli vanligare och svårare för de drabbade att bestrida."}, "tr": {"title": "Yüz doğrulama ve sosyal yardımlara erişim", "domain": "Kamu hizmetleri", "hook": "tek bir başarısız yüz doğrulaması", "real": "Bir **yüz doğrulama portalındaki** tekrarlanan hataların, bazı kişilerin **sosyal yardımlarını alamamasının** nedenleri arasında olduğu bildirildi.", "fake": "**Vatandaşlardan gelen mektupları sınıflandıran** bir yapay zekâ sisteminin, sosyal yardımlara ilişkin yüzlerce itirazı yanlış birime gönderdiği ve kimse fark etmeden önce insanların **itiraz süresini kaçırdığı** bildirildi.", "excerpt": "Güney Afrika'daki sosyal yardım alıcılarının SASSA'nın eLife yüz doğrulama portalında tekrarlanan başarısızlıklarla karşılaştığı bildirildi.", "explanation": "Güney Afrika'daki sosyal yardım alıcılarının SASSA'nın yüz doğrulama portalında tekrarlanan başarısızlıklarla karşılaştığı bildirildi. Daha sonra meclise sunulan raporlar, başarısız yüz tanımanın doğrulamanın tamamlanamamasının nedenlerinden biri olduğunu belirtti ve bir çeyrekte 67.868 yardımın askıya alındığını doğruladı; ancak bunların kaçının özellikle yüz doğrulama hatalarından kaynaklandığını belirtmedi.", "whyBad": "Temel kamu hizmetlerine erişim otomatik kimlik doğrulamaya bağlı olduğunda bu doğrulama kritik bir mesele hâline gelir. Hatalı bir ret basit bir rahatsızlık değildir: Bir yardım alıcısı için yiyecek, barınma, ulaşım veya sağlık için kullanılan paranın gecikmesi anlamına gelebilir. Merkezi kullanım, birbiriyle bağlantılı arızalar riskini de doğurur; tek bir tasarım veya işletim sorunu aynı anda pek çok kişiyi etkileyebilir. Hatayı düzeltme yükü, itiraz için en az zamana, hareket imkânına, internet bağlantısına veya idari kapasiteye sahip olanların üzerine orantısız biçimde binebilir.", "escalation": "Devletler ve şirketler sosyal yardımlar, bankacılık, sigorta, istihdam ve giriş kontrolü için biyometrik ve yapay zekâ tabanlı doğrulamayı giderek daha fazla kullanabilir. Kullanım; yedek prosedürlerden, denetimlerden ve itiraz yollarından daha hızlı yaygınlaşırsa, otomatik dışlanma daha yaygın hâle gelebilir ve etkilenenlerin buna itiraz etmesi zorlaşabilir."}}}, {"id": 1623, "url": "https://incidentdatabase.ai/cite/1623/", "building": "school", "text": {"en": {"title": "Students allegedly made inappropriate deepfake images of classmates", "domain": "Schools", "hook": "two students with an image tool", "real": "Two students at a private school allegedly used AI tools to create and share hundreds of **inappropriate fake images of female classmates**; authorities later identified dozens of victims, nearly all of them minors.", "fake": "Two students at a public high school allegedly used AI tools to produce realistic **letters on school letterhead accusing classmates of drug use** and sent them to parents; the school later identified dozens of affected families.", "excerpt": "Authorities later identified 60 victims, 59 of them minors.", "explanation": "Over about six months, two students at a Pennsylvania school allegedly used AI tools to make and exchange hundreds of inappropriate deepfake images of female classmates and other girls. Authorities later identified 60 victims, 59 of them minors. The students were adjudicated delinquent in juvenile court, and families later sued the school and unnamed AI companies.", "whyBad": "The harm here does not come from a system malfunctioning: the tools worked as designed and were used against people who never consented. Image generators have made it cheap for anyone, including children, to produce realistic, humiliating fake images of a real person from ordinary photos. The victims are harmed whether or not viewers know the images are fake, and schools, parents, and courts are left to respond with procedures written for a time when making such material took skill and effort.", "escalation": "Image and video generation keeps getting cheaper, more realistic, and easier to use, and it needs fewer photos of the person targeted. If safeguards in the tools, reporting routes in schools, and legal accountability do not keep pace, this kind of abuse could become a routine part of bullying and extortion, reaching far more children with almost no effort from the person doing it."}, "fr": {"title": "Des élèves auraient créé des deepfakes inappropriés de camarades de classe", "domain": "École", "hook": "deux élèves et un générateur d’images", "real": "Deux élèves d’une école privée auraient utilisé des outils d’IA pour créer et partager des centaines d’**images deepfake inappropriées de camarades de classe** ; les autorités ont ensuite identifié des dizaines de victimes, presque toutes mineures.", "fake": "Deux élèves d’un lycée public auraient utilisé des outils d’IA pour produire des **lettres réalistes à en-tête de l’établissement accusant des camarades de consommer de la drogue**, puis les auraient envoyées aux parents ; l’établissement a ensuite identifié des dizaines de familles concernées.", "excerpt": "Les autorités ont ensuite identifié 60 victimes, dont 59 mineures.", "explanation": "Pendant environ six mois, deux élèves d’une école de Pennsylvanie auraient utilisé des outils d’IA pour fabriquer et échanger des centaines d’images deepfake inappropriées de camarades de classe et d’autres jeunes filles. Les autorités ont ensuite identifié 60 victimes, dont 59 mineures. Les élèves ont été reconnus responsables par un tribunal pour mineurs, et des familles ont ensuite poursuivi l’école et des entreprises d’IA non nommées.", "whyBad": "Le préjudice ne vient pas ici d’un dysfonctionnement : les outils ont fonctionné comme prévu et ont été utilisés contre des personnes qui n’avaient pas donné leur consentement. Les générateurs d’images permettent à n’importe qui, y compris des enfants, de produire à bas coût des images inappropriées réalistes d’une personne réelle à partir de simples photos. Les victimes subissent un préjudice, que les spectateurs sachent ou non que les images sont fausses, et les écoles, les parents et les tribunaux doivent réagir avec des procédures écrites à une époque où fabriquer de tels contenus demandait des compétences et des efforts.", "escalation": "La génération d’images et de vidéos devient moins chère, plus réaliste et plus simple, et nécessite de moins en moins de photos de la personne visée. Si les garde-fous des outils, les circuits de signalement dans les écoles et la responsabilité juridique ne suivent pas, ce type d’abus pourrait devenir une composante banale du harcèlement et du chantage, et toucher beaucoup plus d’enfants presque sans effort de la part de l’auteur."}, "de": {"title": "Schüler sollen unangemessene Deepfakes von Mitschülerinnen erstellt haben", "domain": "Schule", "hook": "ein Bildgenerator in der Hand zweier Schüler", "real": "Zwei Schüler einer Privatschule sollen mit KI-Werkzeugen Hunderte **unangemessene Deepfake-Bilder von Mitschülerinnen** erstellt und geteilt haben; die Behörden identifizierten später Dutzende Opfer, fast alle minderjährig.", "fake": "Zwei Schüler einer staatlichen Schule sollen mit KI-Werkzeugen täuschend echte **Briefe auf Schulbriefpapier erstellt haben, die Mitschülern Drogenkonsum vorwarfen**, und sie an die Eltern geschickt haben; die Schule identifizierte später Dutzende betroffene Familien.", "excerpt": "Die Behörden identifizierten später 60 Opfer, 59 davon minderjährig.", "explanation": "Rund sechs Monate lang sollen zwei Schüler einer Schule in Pennsylvania mit KI-Werkzeugen Hunderte unangemessene Deepfake-Bilder von Mitschülerinnen und anderen Mädchen erstellt und ausgetauscht haben. Die Behörden identifizierten später 60 Opfer, 59 davon minderjährig. Ein Jugendgericht stellte die Verantwortlichkeit der Schüler fest, und Familien verklagten später die Schule und nicht genannte KI-Unternehmen.", "whyBad": "Der Schaden entsteht hier nicht durch eine Fehlfunktion: Die Werkzeuge arbeiteten wie vorgesehen und wurden gegen Menschen eingesetzt, die nie eingewilligt hatten. Bildgeneratoren machen es für jeden, auch für Kinder, billig, aus gewöhnlichen Fotos realistische unangemessene Bilder einer realen Person zu erzeugen. Die Betroffenen werden geschädigt, egal ob Betrachter wissen, dass die Bilder gefälscht sind, und Schulen, Eltern und Gerichte müssen mit Verfahren reagieren, die aus einer Zeit stammen, als solches Material Können und Aufwand erforderte.", "escalation": "Bild- und Videogenerierung wird billiger, realistischer und einfacher und braucht immer weniger Ausgangsfotos der Zielperson. Wenn Schutzmechanismen in den Werkzeugen, Meldewege an Schulen und rechtliche Verantwortung nicht Schritt halten, könnte diese Form des Missbrauchs zu einem gewöhnlichen Teil von Mobbing und Erpressung werden und weit mehr Kinder treffen, fast ohne Aufwand für die Täter."}, "ru": {"title": "Школьники предположительно создали непристойные дипфейки одноклассниц", "domain": "Школа", "hook": "двое школьников с генератором изображений", "real": "Двое учеников частной школы предположительно использовали ИИ-инструменты, чтобы создать и распространить сотни **непристойных дипфейк-изображений одноклассниц**; позже власти установили десятки пострадавших, почти все — несовершеннолетние.", "fake": "Двое учеников государственной школы предположительно использовали ИИ-инструменты, чтобы изготовить правдоподобные **письма на школьном бланке с обвинениями одноклассников в употреблении наркотиков**, и разослали их родителям; позже школа установила десятки пострадавших семей.", "excerpt": "Позже власти установили 60 пострадавших, 59 из них — несовершеннолетние.", "explanation": "Около полугода двое учеников школы в Пенсильвании предположительно создавали с помощью ИИ-инструментов сотни непристойных дипфейк-изображений одноклассниц и других девочек и обменивались ими. Позже власти установили 60 пострадавших, 59 из них — несовершеннолетние. Суд по делам несовершеннолетних признал учеников правонарушителями, а семьи впоследствии подали иск к школе и неназванным ИИ-компаниям.", "whyBad": "Вред здесь возник не из-за сбоя системы: инструменты работали так, как задумано, и были использованы против людей, которые не давали согласия. Генераторы изображений позволили кому угодно, включая детей, дёшево создавать реалистичные непристойные изображения реального человека из обычных фотографий. Пострадавшим причиняется вред независимо от того, знают ли зрители, что изображения поддельные, а школам, родителям и судам приходится реагировать по процедурам, написанным во времена, когда создание таких материалов требовало навыков и усилий.", "escalation": "Генерация изображений и видео становится дешевле, реалистичнее и проще, и ей нужно всё меньше исходных фотографий жертвы. Если защитные механизмы в самих инструментах, каналы жалоб в школах и юридическая ответственность не будут за этим успевать, такое насилие может стать обычной частью травли и вымогательства и затронуть гораздо больше детей почти без усилий со стороны обидчика."}, "it": {"title": "Studenti avrebbero creato deepfake inappropriati di compagne di classe", "domain": "Scuola", "hook": "due studenti con un generatore di immagini", "real": "Due studenti di una scuola privata avrebbero usato strumenti di IA per creare e condividere centinaia di **immagini deepfake inappropriate di compagne di classe**; le autorità hanno poi identificato decine di vittime, quasi tutte minorenni.", "fake": "Due studenti di una scuola pubblica avrebbero usato strumenti di IA per produrre **lettere realistiche su carta intestata della scuola che accusavano alcuni compagni di fare uso di droghe** e le avrebbero inviate ai genitori; la scuola ha poi identificato decine di famiglie coinvolte.", "excerpt": "Le autorità hanno poi identificato 60 vittime, 59 delle quali minorenni.", "explanation": "Per circa sei mesi, due studenti di una scuola della Pennsylvania avrebbero usato strumenti di IA per creare e scambiarsi centinaia di immagini deepfake inappropriate di compagne di classe e di altre ragazze. Le autorità hanno poi identificato 60 vittime, 59 delle quali minorenni. Un tribunale per i minorenni ha dichiarato responsabili i due studenti, e alcune famiglie hanno in seguito fatto causa alla scuola e a società di IA non identificate.", "whyBad": "Qui il danno non nasce da un malfunzionamento: gli strumenti hanno funzionato come previsto e sono stati usati contro persone che non avevano dato alcun consenso. I generatori di immagini permettono a chiunque, bambini compresi, di produrre a basso costo immagini inappropriate realistiche di una persona reale partendo da normali fotografie. Le vittime subiscono un danno a prescindere dal fatto che chi guarda sappia che le immagini sono false, e scuole, genitori e tribunali devono rispondere con procedure scritte quando produrre materiale simile richiedeva competenze e fatica.", "escalation": "La generazione di immagini e video diventa più economica, più realistica e più semplice, e richiede sempre meno foto della persona presa di mira. Se le protezioni negli strumenti, i canali di segnalazione nelle scuole e la responsabilità legale non tengono il passo, questo tipo di abuso potrebbe diventare una parte abituale del bullismo e dei ricatti, raggiungendo molti più minori quasi senza sforzo da parte di chi lo commette."}, "es": {"title": "Estudiantes presuntamente crearon deepfakes inapropiados de compañeras de clase", "domain": "Escuela", "hook": "un generador de imágenes en manos de dos estudiantes", "real": "Dos estudiantes de un colegio privado presuntamente usaron herramientas de IA para crear y compartir cientos de **imágenes deepfake inapropiadas de compañeras de clase**; las autoridades identificaron después a decenas de víctimas, casi todas menores.", "fake": "Dos estudiantes de un instituto público presuntamente usaron herramientas de IA para elaborar **cartas realistas con el membrete del centro que acusaban a compañeros de consumir drogas** y las enviaron a los padres; el centro identificó después a decenas de familias afectadas.", "excerpt": "Las autoridades identificaron después a 60 víctimas, 59 de ellas menores.", "explanation": "Durante unos seis meses, dos estudiantes de un colegio de Pensilvania presuntamente usaron herramientas de IA para crear e intercambiar cientos de imágenes deepfake inapropiadas de compañeras de clase y otras chicas. Las autoridades identificaron después a 60 víctimas, 59 de ellas menores. Un tribunal de menores declaró responsables a los estudiantes, y varias familias demandaron más tarde al colegio y a empresas de IA no identificadas.", "whyBad": "Aquí el daño no viene de un fallo del sistema: las herramientas funcionaron como estaba previsto y se usaron contra personas que nunca dieron su consentimiento. Los generadores de imágenes permiten que cualquiera, incluidos menores, produzca a bajo coste imágenes inapropiadas realistas de una persona real a partir de fotos corrientes. Las víctimas sufren el daño sepan o no los espectadores que las imágenes son falsas, y los colegios, las familias y los tribunales tienen que responder con procedimientos escritos para una época en la que crear ese material exigía habilidad y esfuerzo.", "escalation": "La generación de imágenes y vídeo es cada vez más barata, más realista y más sencilla, y necesita menos fotos de la persona atacada. Si las salvaguardas de las herramientas, los canales de denuncia en los colegios y la responsabilidad legal no avanzan al mismo ritmo, este tipo de abuso podría convertirse en parte habitual del acoso y la extorsión y alcanzar a muchos más menores casi sin esfuerzo para quien lo comete."}, "ko": {"title": "학생들이 급우의 부적절한 딥페이크를 만든 혐의", "domain": "학교", "hook": "이미지 생성 도구를 쓴 학생 두 명", "real": "한 사립학교 학생 두 명이 AI 도구로 **여학생 급우들의 부적절한 딥페이크 이미지** 수백 장을 만들어 공유한 혐의를 받고 있으며, 당국은 이후 수십 명의 피해자를 확인했는데 거의 모두 미성년자였다.", "fake": "한 공립 고등학교 학생 두 명이 AI 도구로 **급우들이 마약을 했다고 고발하는, 학교 공문 양식의 그럴듯한 편지**를 만들어 학부모들에게 보낸 혐의를 받고 있으며, 학교는 이후 수십 가정의 피해를 확인했다.", "excerpt": "당국은 이후 피해자 60명을 확인했고 그중 59명이 미성년자였다.", "explanation": "약 6개월 동안 펜실베이니아의 한 학교 학생 두 명이 AI 도구로 여학생 급우와 다른 소녀들의 부적절한 딥페이크 이미지 수백 장을 만들고 주고받은 혐의를 받고 있다. 당국은 이후 피해자 60명을 확인했고 그중 59명이 미성년자였다. 두 학생은 소년법원에서 비행 사실이 인정됐고, 피해자 가족들은 이후 학교와 이름이 밝혀지지 않은 AI 기업들을 상대로 소송을 제기했다.", "whyBad": "이 사건의 피해는 시스템 오작동에서 비롯된 것이 아니다. 도구는 설계된 대로 작동했고, 동의한 적 없는 사람들을 상대로 사용됐다. 이미지 생성 도구 덕분에 어린이를 포함한 누구나 평범한 사진만으로 실존 인물의 사실적인 부적절한 이미지를 싼값에 만들 수 있게 됐다. 보는 사람이 이미지가 가짜라는 것을 알든 모르든 피해자는 피해를 입으며, 학교와 부모, 법원은 이런 자료를 만드는 데 기술과 노력이 필요했던 시절에 만들어진 절차로 대응해야 한다.", "escalation": "이미지와 영상 생성은 점점 더 싸고, 더 사실적이고, 더 쉬워지고 있으며, 대상의 사진도 점점 덜 필요해진다. 도구의 안전장치, 학교의 신고 절차, 법적 책임이 이 속도를 따라가지 못하면 이런 가해가 괴롭힘과 협박의 흔한 수단이 되어, 가해자가 거의 힘을 들이지 않고도 훨씬 많은 아이들에게 피해를 줄 수 있다."}, "zh": {"title": "学生被指制作同学的不雅深度伪造图像", "domain": "学校", "hook": "两名学生和一个图像生成工具", "real": "一所私立学校的两名学生被指使用 AI 工具制作并传播了数百张**女同学的不雅深度伪造图像**；当局后来确认了数十名受害者，几乎全是未成年人。", "fake": "一所公立高中的两名学生被指使用 AI 工具，制作了**印有学校抬头、指控同学吸毒的逼真信件**并寄给家长；学校后来确认有数十个家庭受到影响。", "excerpt": "当局后来确认了 60 名受害者，其中 59 人是未成年人。", "explanation": "据指控，在大约六个月里，宾夕法尼亚州一所学校的两名学生使用 AI 工具制作并交换了数百张女同学和其他女孩的不雅深度伪造图像。当局后来确认了 60 名受害者，其中 59 人是未成年人。少年法庭裁定这两名学生有违法行为，受害者家庭随后起诉了学校和未具名的 AI 公司。", "whyBad": "这里的伤害并非来自系统故障：工具按设计正常运行，却被用来对付从未同意的人。图像生成工具让任何人（包括孩子）都能用普通照片低成本地制作真人的逼真不雅图像。无论观看者是否知道图像是假的，受害者都会受到伤害；而学校、家长和法院只能用过去的程序来应对，那些程序制定时，制作这类内容还需要技术和精力。", "escalation": "图像和视频生成越来越便宜、越来越逼真、越来越容易上手，所需的目标照片也越来越少。如果工具本身的防护措施、学校的举报渠道和法律责任跟不上，这类侵害可能成为欺凌和勒索的常见手段，施害者几乎不费力气就能伤害更多孩子。"}, "sr": {"title": "Ученици су наводно правили непримерене дипфејкове другарица из разреда", "domain": "Школа", "hook": "двојица ученика са генератором слика", "real": "Двојица ученика приватне школе наводно су помоћу ВИ алата направила и делила стотине **непримерених дипфејк слика другарица из разреда**; власти су касније идентификовале десетине жртава, готово све малолетне.", "fake": "Двојица ученика државне средње школе наводно су помоћу ВИ алата направила уверљива **писма на школском меморандуму у којима се другови из разреда оптужују за коришћење дроге** и послала их родитељима; школа је касније идентификовала десетине погођених породица.", "excerpt": "Власти су касније идентификовале 60 жртава, од којих је 59 малолетно.", "explanation": "Током око шест месеци двојица ученика једне школе у Пенсилванији наводно су помоћу ВИ алата правила и размењивала стотине непримерених дипфејк слика другарица из разреда и других девојчица. Власти су касније идентификовале 60 жртава, од којих је 59 малолетно. Суд за малолетнике утврдио је одговорност ученика, а породице су касније тужиле школу и неименоване ВИ компаније.", "whyBad": "Штета овде не потиче од квара система: алат  AI-verktyg för att skapa och dela hundratals **olämpliga deepfake-bilder av kvinnliga klasskamrater**; myndigheterna identifierade senare dussintals offer, nästan alla minderåriga.", "fake": "Två elever på en kommunal gymnasieskola ska ha använt AI-verktyg för att ta fram realistiska **brev med skolans brevhuvud som anklagade klasskamrater för att använda droger** och skickat dem till föräldrarna; skolan identifierade senare dussintals drabbade familjer.", "excerpt": "Myndigheterna identifierade senare 60 offer, varav 59 minderåriga.", "explanation": "Under ungefär sex månader ska två elever på en skola i Pennsylvania ha använt AI-verktyg för att skapa och utbyta hundratals olämpliga deepfake-bilder av kvinnliga klasskamrater och andra flickor. Myndigheterna identifierade senare 60 offer, varav 59 minderåriga. En ungdomsdomstol fann eleverna ansvariga, och familjer stämde senare skolan och icke namngivna AI-företag.", "whyBad": "Skadan här kommer inte av att ett system fungerade fel: verktygen fungerade som avsett och användes mot människor som aldrig samtyckt. Bildgeneratorer gör det billigt för vem som helst, även barn, att skapa realistiska olämpliga bilder av en verklig person utifrån vanliga foton. Offren skadas oavsett om betraktarna vet att bilderna är falska, och skolor, föräldrar och domstolar får reagera med rutiner som skrevs när sådant material krävde skicklighet och ansträngning.", "escalation": "Bild- och videogenerering blir billigare, mer realistisk och enklare, och kräver allt färre foton av den som utsätts. Om skydden i verktygen, anmälningsvägarna i skolorna och det rättsliga ansvaret inte hänger med kan den här typen av övergrepp bli en vanlig del av mobbning och utpressning och drabba betydligt fler barn nästan utan ansträngning från förövaren."}, "tr": {"title": "Öğrencilerin sınıf arkadaşlarının uygunsuz deepfake görüntülerini ürettiği iddia edildi", "domain": "Okul", "hook": "görüntü üreteci kullanan iki öğrenci", "real": "Özel bir okulun iki öğrencisinin yapay zekâ araçlarıyla kız sınıf arkadaşlarının yüzlerce **uygunsuz deepfake görüntüsünü** üretip paylaştığı iddia edildi; yetkililer daha sonra neredeyse tamamı reşit olmayan onlarca mağdur tespit etti.", "fake": "Bir devlet lisesinin iki öğrencisinin yapay zekâ araçlarıyla, **sınıf arkadaşlarını uyuşturucu kullanmakla suçlayan, okul antetli gerçekçi mektuplar** hazırlayıp velilere gönderdiği iddia edildi; okul daha sonra onlarca mağdur aile tespit etti.", "excerpt": "Yetkililer daha sonra 59'u reşit olmayan 60 mağdur tespit etti.", "explanation": "Yaklaşık altı ay boyunca Pennsylvania'daki bir okulun iki öğrencisinin yapay zekâ araçlarıyla kız sınıf arkadaşlarının ve başka kız çocuklarının yüzlerce uygunsuz deepfake görüntüsünü üretip birbirleriyle paylaştığı iddia edildi. Yetkililer daha sonra 59'u reşit olmayan 60 mağdur tespit etti. Çocuk mahkemesi öğrencileri sorumlu buldu; aileler daha sonra okula ve adı açıklanmayan yapay zekâ şirketlerine dava açtı.", "whyBad": "Buradaki zarar bir sistem arızasından kaynaklanmıyor: Araçlar tasarlandığı gibi çalıştı ve hiçbir zaman rıza göstermemiş kişilere karşı kullanıldı. Görüntü üreteçleri, çocuklar dâhil herkesin sıradan fotoğraflardan gerçek bir kişinin gerçekçi uygunsuz görüntülerini ucuza üretmesini mümkün kılıyor. İzleyenler görüntülerin sahte olduğunu bilse de bilmese de mağdurlar zarar görüyor; okullar, aileler ve mahkemeler ise bu tür içerikleri üretmenin beceri ve emek gerektirdiği bir dönemde yazılmış prosedürlerle karşılık vermek zorunda kalıyor.", "escalation": "Görüntü ve video üretimi giderek ucuzluyor, gerçekçileşiyor ve kolaylaşıyor; hedef alınan kişinin daha az fotoğrafına ihtiyaç duyuyor. Araçlardaki güvenlik önlemleri, okullardaki şikâyet yolları ve hukuki sorumluluk buna ayak uyduramazsa, bu tür istismar zorbalığın ve şantajın sıradan bir parçası hâline gelebilir ve faile neredeyse hiç emek gerektirmeden çok daha fazla çocuğa ulaşabilir."}}}, {"id": 1258, "url": "https://incidentdatabase.ai/cite/1258/", "building": "media", "text": {"en": {"title": "Purported deepfake news bulletin announced a candidate's withdrawal", "domain": "Elections & media", "hook": "one fake news bulletin", "real": "A purported deepfake video styled as a national **TV news bulletin** falsely showed a **presidential candidate announcing her withdrawal** from the race.", "fake": "A purported deepfake video styled as a national **TV weather bulletin** falsely warned of a **severe storm on election day** and urged people in several districts to stay home.", "excerpt": "A purported deepfake video circulated online that is alleged to have falsely depicted Irish presidential candidate Catherine Connolly announcing her withdrawal from the race.", "explanation": "A fabricated video made to look like an RTÉ News bulletin reportedly showed Irish presidential candidate Catherine Connolly announcing she was leaving the race. It reportedly gathered about 30,000 views on Facebook before it was removed. Connolly complained to the Electoral Commission and called the video a malicious attempt to mislead voters.", "whyBad": "The clip borrowed credibility twice: from a real candidate's face and voice, and from the look of a trusted national broadcaster. Voters who see such a clip may stay home or change their vote before any correction reaches them, and corrections rarely travel as far as the original. The wider damage is to trust itself: once convincing fakes of news broadcasts circulate, people have more reason to doubt real ones too.", "escalation": "Synthetic video and audio are becoming cheaper, faster to make, and harder to tell apart from real broadcasts. If provenance tools, platform response times, and election rules do not keep pace, fakes could be tailored to individual districts or voters and released in the final hours of a campaign, when there is no time left to correct them."}, "fr": {"title": "Un présumé deepfake de journal télévisé a annoncé le retrait d’une candidate", "domain": "Élections et médias", "hook": "un seul faux journal télévisé", "real": "Une vidéo présumée deepfake, présentée comme un **journal télévisé national**, a faussement montré une **candidate à la présidence annonçant son retrait** de la course.", "fake": "Une vidéo présumée deepfake, présentée comme un **bulletin météo** de la télévision nationale, a faussement annoncé une **violente tempête le jour du scrutin** et appelé les habitants de plusieurs circonscriptions à rester chez eux.", "excerpt": "Une vidéo présumée deepfake a circulé en ligne ; elle aurait faussement montré la candidate à la présidence irlandaise Catherine Connolly annonçant son retrait de la course.", "explanation": "Une vidéo fabriquée, présentée comme un journal de RTÉ, aurait montré la candidate à la présidence irlandaise Catherine Connolly annonçant qu’elle quittait la course. Elle aurait cumulé environ 30 000 vues sur Facebook avant d’être retirée. Catherine Connolly a saisi la Commission électorale et qualifié la vidéo de tentative malveillante de tromper les électeurs.", "whyBad": "La vidéo a emprunté de la crédibilité deux fois : au visage et à la voix d’une vraie candidate, et à l’habillage d’un diffuseur national de confiance. Les électeurs qui voient une telle vidéo peuvent s’abstenir ou changer leur vote avant qu’un démenti ne leur parvienne, et les démentis circulent rarement aussi loin que l’original. Le dommage plus large touche la confiance elle-même : quand des imitations convaincantes de journaux télévisés circulent, les gens ont davantage de raisons de douter aussi des vrais.", "escalation": "La vidéo et l’audio synthétiques deviennent moins chers, plus rapides à produire et plus difficiles à distinguer de vraies émissions. Si les outils de traçabilité (provenance), la réactivité des plateformes et les règles électorales ne suivent pas, des faux pourraient être adaptés à chaque circonscription ou à chaque électeur et diffusés dans les dernières heures d’une campagne, quand il ne reste plus de temps pour les démentir."}, "de": {"title": "Mutmaßlicher Deepfake einer Nachrichtensendung verkündete Rückzug einer Kandidatin", "domain": "Wahlen und Medien", "hook": "eine einzige gefälschte Nachrichtensendung", "real": "Ein mutmaßliches Deepfake-Video im Stil einer **Nachrichtensendung** des nationalen Fernsehens zeigte fälschlich, wie eine **Präsidentschaftskandidatin ihren Rückzug** aus dem Rennen verkündet.", "fake": "Ein mutmaßliches Deepfake-Video im Stil eines **Wetterberichts** des nationalen Fernsehens warnte fälschlich vor einem **schweren Sturm am Wahltag** und rief die Menschen in mehreren Wahlkreisen auf, zu Hause zu bleiben.", "excerpt": "Im Netz kursierte ein mutmaßliches Deepfake-Video, das die irische Präsidentschaftskandidatin Catherine Connolly fälschlich bei der Ankündigung ihres Rückzugs aus dem Rennen gezeigt haben soll.", "explanation": "Ein gefälschtes Video im Stil einer RTÉ-Nachrichtensendung soll die irische Präsidentschaftskandidatin Catherine Connolly gezeigt haben, wie sie ihren Ausstieg aus dem Rennen verkündet. Es soll auf Facebook rund 30.000 Aufrufe erreicht haben, bevor es entfernt wurde. Connolly reichte Beschwerde bei der Wahlkommission ein und nannte das Video einen böswilligen Versuch, Wähler zu täuschen.", "whyBad": "Der Clip lieh sich doppelt Glaubwürdigkeit: vom Gesicht und der Stimme einer echten Kandidatin und vom Erscheinungsbild eines vertrauten nationalen Senders. Wer einen solchen Clip sieht, bleibt vielleicht der Wahl fern oder ändert seine Stimme, bevor ihn eine Richtigstellung erreicht, und Richtigstellungen verbreiten sich selten so weit wie das Original. Der größere Schaden trifft das Vertrauen selbst: Wenn überzeugende Fälschungen von Nachrichtensendungen kursieren, haben Menschen mehr Grund, auch an echten zu zweifeln.", "escalation": "Synthetisches Video und Audio werden billiger, schneller herzustellen und schwerer von echten Sendungen zu unterscheiden. Wenn Herkunftsnachweise (provenance), die Reaktionszeiten der Plattformen und das Wahlrecht nicht Schritt halten, könnten Fälschungen auf einzelne Wahlkreise oder Wähler zugeschnitten und in den letzten Stunden eines Wahlkampfs veröffentlicht werden, wenn keine Zeit mehr für eine Richtigstellung bleibt."}, "ru": {"title": "Предполагаемый дипфейк выпуска новостей объявил о снятии кандидата с выборов", "domain": "Выборы и СМИ", "hook": "один фальшивый выпуск новостей", "real": "Предполагаемое дипфейк-видео, оформленное как **выпуск новостей** национального телеканала, ложно показывало, как **кандидат в президенты объявляет о выходе** из предвыборной гонки.", "fake": "Предполагаемое дипфейк-видео, оформленное как **прогноз погоды** национального телеканала, ложно предупреждало о **сильном шторме в день выборов** и призывало жителей нескольких округов оставаться дома.", "excerpt": "В сети распространялось предполагаемое дипфейк-видео, в котором, как утверждается, кандидат в президенты Ирландии Кэтрин Коннолли ложно объявляет о выходе из гонки.", "explanation": "Сфабрикованное видео, оформленное под выпуск новостей RTÉ, по имеющимся данным, показывало, как кандидат в президенты Ирландии Кэтрин Коннолли объявляет о выходе из гонки. По сообщениям, оно набрало около 30 000 просмотров в Facebook, прежде чем его удалили. Коннолли подала жалобу в Избирательную комиссию и назвала видео злонамеренной попыткой ввести избирателей в заблуждение.", "whyBad": "Ролик заимствовал доверие дважды: у лица и голоса реального кандидата и у оформления авторитетного национального телеканала. Избиратели, увидевшие такой ролик, могут не прийти на выборы или изменить свой выбор раньше, чем до них дойдёт опровержение, а опровержения редко расходятся так же широко, как оригинал. Более общий ущерб наносится самому доверию: когда в обращении есть убедительные подделки новостных выпусков, у людей появляется больше поводов сомневаться и в настоящих.", "escalation": "Синтетическое видео и аудио становятся дешевле, быстрее в производстве и всё менее отличимы от настоящих эфиров. Если инструменты подтверждения происхождения (provenance), скорость реакции платформ и избирательные правила не будут за этим успевать, подделки можно будет адаптировать под отдельные округа или избирателей и выпускать в последние часы кампании, когда времени на опровержение уже не остаётся."}, "it": {"title": "Un presunto deepfake di un telegiornale ha annunciato il ritiro di una candidata", "domain": "Elezioni e media", "hook": "un solo falso telegiornale", "real": "Un presunto video deepfake, confezionato come un **telegiornale nazionale**, ha mostrato falsamente una **candidata alla presidenza mentre annunciava il ritiro** dalla corsa.", "fake": "Un presunto video deepfake, confezionato come un **bollettino meteo** della televisione nazionale, ha annunciato falsamente una **forte tempesta nel giorno delle elezioni** invitando gli abitanti di diversi collegi a restare a casa.", "excerpt": "Online è circolato un presunto video deepfake che avrebbe mostrato falsamente la candidata alla presidenza irlandese Catherine Connolly mentre annunciava il ritiro dalla corsa.", "explanation": "Un video falso, realizzato per sembrare un telegiornale di RTÉ, avrebbe mostrato la candidata alla presidenza irlandese Catherine Connolly mentre annunciava l’abbandono della corsa. Avrebbe raccolto circa 30.000 visualizzazioni su Facebook prima di essere rimosso. Connolly ha presentato un reclamo alla Commissione elettorale e ha definito il video un tentativo malevolo di ingannare gli elettori.", "whyBad": "Il video ha preso in prestito credibilità due volte: dal volto e dalla voce di una candidata reale e dall’aspetto di un’emittente nazionale di cui il pubblico si fida. Chi vede un video simile può decidere di non votare o di cambiare voto prima che arrivi una smentita, e le smentite raramente arrivano lontano quanto l’originale. Il danno più ampio riguarda la fiducia stessa: quando circolano falsi convincenti di notiziari, le persone hanno più motivi per dubitare anche di quelli veri.", "escalation": "Video e audio sintetici diventano più economici, più rapidi da produrre e più difficili da distinguere dalle trasmissioni reali. Se gli strumenti di tracciabilità (provenance), i tempi di reazione delle piattaforme e le regole elettorali non tengono il passo, i falsi potrebbero essere adattati a singoli collegi o elettori e diffusi nelle ultime ore di una campagna, quando non resta tempo per smentirli."}, "es": {"title": "Un presunto deepfake de un informativo anunció la retirada de una candidata", "domain": "Elecciones y medios", "hook": "un solo informativo falso", "real": "Un presunto vídeo deepfake, con el formato de un **informativo** de la televisión nacional, mostró falsamente a una **candidata presidencial anunciando su retirada** de la carrera.", "fake": "Un presunto vídeo deepfake, con el formato de un **parte meteorológico** de la televisión nacional, advirtió falsamente de un **fuerte temporal el día de las elecciones** e instó a los habitantes de varios distritos a quedarse en casa.", "excerpt": "Circuló en internet un presunto vídeo deepfake que, según se alega, mostraba falsamente a la candidata presidencial irlandesa Catherine Connolly anunciando su retirada de la carrera.", "explanation": "Según se informa, un vídeo fabricado con el aspecto de un informativo de RTÉ mostraba a la candidata presidencial irlandesa Catherine Connolly anunciando que abandonaba la carrera. Según los informes, acumuló unas 30 000 visualizaciones en Facebook antes de ser retirado. Connolly presentó una queja ante la Comisión Electoral y calificó el vídeo de intento malicioso de engañar a los votantes.", "whyBad": "El vídeo tomó prestada credibilidad dos veces: del rostro y la voz de una candidata real y de la imagen de una cadena nacional en la que la gente confía. Quien ve un vídeo así puede quedarse en casa o cambiar su voto antes de que le llegue un desmentido, y los desmentidos rara vez llegan tan lejos como el original. El daño más amplio es a la confianza misma: cuando circulan falsificaciones convincentes de informativos, la gente tiene más motivos para dudar también de los auténticos.", "escalation": "El vídeo y el audio sintéticos son cada vez más baratos, más rápidos de producir y más difíciles de distinguir de las emisiones reales. Si las herramientas de trazabilidad del origen (provenance), la rapidez de respuesta de las plataformas y las normas electorales no avanzan al mismo ritmo, las falsificaciones podrían adaptarse a distritos o votantes concretos y difundirse en las últimas horas de una campaña, cuando ya no queda tiempo para desmentirlas."}, "ko": {"title": "딥페이크로 추정되는 뉴스 영상이 후보 사퇴를 허위로 발표", "domain": "선거와 언론", "hook": "가짜 뉴스 방송 하나", "real": "**전국 방송 뉴스**처럼 꾸민 딥페이크 추정 영상이 한 **대통령 후보가 선거 사퇴를 발표**하는 모습을 허위로 보여 줬다.", "fake": "전국 방송 **일기예보**처럼 꾸민 딥페이크 추정 영상이 **선거일에 강한 폭풍**이 온다고 허위로 경고하며 여러 선거구 주민들에게 집에 머물라고 촉구했다.", "excerpt": "아일랜드 대통령 후보 캐서린 코널리가 경선 사퇴를 발표하는 모습을 허위로 담았다는 의혹을 받는 딥페이크 추정 영상이 온라인에 유포됐다.", "explanation": "RTÉ 뉴스 방송처럼 만든 조작 영상이 아일랜드 대통령 후보 캐서린 코널리가 선거에서 물러난다고 발표하는 모습을 보여 준 것으로 알려졌다. 이 영상은 삭제되기 전 페이스북에서 약 3만 회 조회된 것으로 전해졌다. 코널리는 선거관리위원회에 이의를 제기하고 이 영상을 유권자를 속이려는 악의적 시도라고 비판했다.", "whyBad": "이 영상은 신뢰를 두 번 빌렸다. 실제 후보의 얼굴과 목소리에서, 그리고 신뢰받는 전국 방송사의 화면 형식에서다. 이런 영상을 본 유권자는 정정 보도가 닿기 전에 투표를 포기하거나 선택을 바꿀 수 있고, 정정은 원본만큼 멀리 퍼지는 일이 드물다. 더 큰 피해는 신뢰 자체에 미친다. 그럴듯한 가짜 뉴스 방송이 돌아다니면 사람들은 진짜 방송까지 의심할 이유가 늘어난다.", "escalation": "합성 영상과 음성은 점점 더 싸고, 더 빨리 만들 수 있고, 실제 방송과 구별하기 더 어려워지고 있다. 출처 확인 도구(provenance), 플랫폼의 대응 속도, 선거 규정이 이를 따라가지 못하면 가짜가 선거구나 유권자 개인에 맞춰 제작되어, 바로잡을 시간이 없는 선거운동 마지막 몇 시간에 유포될 수 있다."}, "zh": {"title": "疑似深度伪造的新闻播报谎称候选人退选", "domain": "选举与媒体", "hook": "一段伪造的新闻播报", "real": "一段疑似深度伪造的视频模仿国家电视台**新闻播报**的样式，虚假呈现一名**总统候选人宣布退出竞选**。", "fake": "一段疑似深度伪造的视频模仿国家电视台**天气预报**的样式，谎称**选举日将有强风暴**，并呼吁多个选区的居民留在家中。", "excerpt": "一段疑似深度伪造的视频在网上流传，据称该视频虚假呈现了爱尔兰总统候选人 Catherine Connolly 宣布退出竞选。", "explanation": "据报道，一段仿照 RTÉ 新闻播报制作的伪造视频显示，爱尔兰总统候选人 Catherine Connolly 宣布退出竞选。据报道
