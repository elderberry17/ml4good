<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="You are the mayor. Spot the real AI incident behind each building of your city, or watch it get hit.">
<meta property="og:title" content="Incident or Fiction?">
<meta property="og:description" content="A city game about AI safety, built on real cases from the AI Incident Database.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Incident or Fiction?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the city map on the left (sticky on wide screens), the round on the right.
   Each round zooms into one building; the record and a dark "what if" band unfold below the reports. */
:root {
  --bg: #ECEFEC;
  --surface: #F8FAF8;
  --ink: #141D1B;
  --muted: #586561;
  --line: #D2D9D5;
  --accent: #2E46C8;
  --accent-ink: #FFFFFF;
  --real: #1C7556;
  --real-soft: #DCEFE6;
  --fake: #B24F27;
  --fake-soft: #F6E3D9;
  --night: #0C1120;
  --night-2: #151C33;
  --night-ink: #E4E8F4;
  --night-muted: #9AA3C0;
  --ember: #FF8A5B;
  --shadow: 0 1px 2px rgb(20 29 27 / .06), 0 8px 24px -12px rgb(20 29 27 / .18);

  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-ui-base: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ui: var(--f-ui-base);
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1312; --surface: #161D1B; --ink: #E5EBE8; --muted: #93A09B; --line: #29322F;
    --accent: #93A4FF; --accent-ink: #0E1312;
    --real: #5CC7A0; --real-soft: #15302A; --fake: #F08C62; --fake-soft: #3A2118;
    --night: #070A14; --night-2: #10162A; --night-ink: #E4E8F4; --night-muted: #9AA3C0;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px -12px rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1312; --surface: #161D1B; --ink: #E5EBE8; --muted: #93A09B; --line: #29322F;
  --accent: #93A4FF; --accent-ink: #0E1312;
  --real: #5CC7A0; --real-soft: #15302A; --fake: #F08C62; --fake-soft: #3A2118;
  --night: #070A14; --night-2: #10162A; --night-ink: #E4E8F4; --night-muted: #9AA3C0;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px -12px rgb(0 0 0 / .6);
  color-scheme: dark;
}

/* Per-script faces. Newsreader has no Cyrillic, Hangul, Han or Devanagari.
   Extra faces are loaded on demand by ensureFonts(). */
:root:is([lang="ru"], [lang="uk"], [lang="sr"]) { --f-display: "Literata", "PT Serif", Georgia, serif; }
:root[lang="vi"] { --f-ui: "Be Vietnam Pro", var(--f-ui-base); }
:root[lang="ko"] { --f-display: "Noto Serif KR", serif; --f-ui: "Noto Sans KR", var(--f-ui-base); }
:root[lang="zh"] { --f-display: "Noto Serif SC", serif; --f-ui: "Noto Sans SC", var(--f-ui-base); }
:root[lang="hi"] { --f-display: "Noto Serif Devanagari", serif; --f-ui: "Noto Sans Devanagari", var(--f-ui-base); }
:root[lang="ta"] { --f-display: "Noto Serif Tamil", serif; --f-ui: "Noto Sans Tamil", var(--f-ui-base); }
/* Italic and uppercase mean nothing in these scripts */
:root:is([lang="ko"], [lang="zh"], [lang="hi"], [lang="ta"]) .round-head h1 em { font-style: normal; }

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.6 var(--f-ui);
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 20px 72px;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.mono { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .04em; }
.eyebrow {
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
}

/* Header */
header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  flex-wrap: wrap; padding-block: 8px 28px;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font: 600 1.15rem/1 var(--f-display); letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: .8rem; }
.track { display: flex; gap: 6px; align-items: center; }
.track i {
  width: 22px; height: 6px; border-radius: 3px; background: var(--line);
  transition: background .3s;
}
.track i.now { background: var(--ink); }
.track i.ok { background: var(--real); }
.track i.no { background: var(--fake); }
.score { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 8px; }
.top-right { display: flex; align-items: center; gap: 14px; min-width: 0; }
@media (max-width: 560px) {
  .brand span { display: none; }
  .track { gap: 3px; } .track i { width: 10px; }
}

/* Language switcher: globe button + popover */
.settings { position: relative; }
.globe {
  height: 36px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  padding: 0 12px 0 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em;
  transition: color .2s, border-color .2s;
}
.globe:hover, .globe[aria-expanded="true"] { color: var(--ink); border-color: var(--ink); }
.globe svg { width: 17px; height: 17px; flex: none; }
.flag {
  width: 20px; height: 14px; flex: none; display: block; border-radius: 3px; overflow: hidden;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent);
}
.menu {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 10;
  width: min(360px, calc(100vw - 32px)); max-height: min(72vh, 560px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  padding: 8px;
}
.menu .eyebrow { padding: 6px 10px 6px; }
.lang-group { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.lang-group + .lang-group { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
.menu label {
  position: relative; display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: 0;
  padding: 8px 10px; border-radius: 8px; font: 500 .9rem/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.menu label:hover { background: color-mix(in srgb, var(--bg) 70%, var(--surface)); }
.menu label:has(input:checked) { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.menu label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.menu label .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu label .code { font-family: var(--f-mono); font-size: .66rem; color: var(--muted); }
.menu input { position: absolute; opacity: 0; pointer-events: none; }
@media (max-width: 380px) { .lang-group { grid-template-columns: 1fr; } }

/* Round head */
.round-head { display: grid; gap: 8px; margin-bottom: 24px; }
.round-head h1 {
  font: 500 clamp(1.6rem, 3.2vw, 2.2rem)/1.14 var(--f-display);
  letter-spacing: -.02em; margin: 0; text-wrap: balance;
}
.round-head h1 em { font-style: italic; color: var(--accent); }

/* The face-off */
.pair { display: grid; grid-template-columns: 1fr; gap: 14px; position: relative; }
.card {
  position: relative; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 18px; min-width: 0;
  padding: 24px 24px 20px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow);
  transition: transform .2s ease, border-color .2s, box-shadow .2s, opacity .3s;
}
.card:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--accent); }
.card:disabled { cursor: default; }
.card .label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .letter {
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.card .key {
  font-family: var(--f-mono); font-size: .7rem; color: var(--muted);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px;
}
.card p.stmt {
  margin: 0; font: 400 clamp(1.15rem, 2.2vw, 1.32rem)/1.45 var(--f-display); text-wrap: pretty;
}
.card p.stmt strong { font-weight: 600; background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 3px; padding: 0 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.revealed .card p.stmt strong { background: none; }
.card .cta {
  margin-top: auto; font-weight: 600; font-size: .88rem; color: var(--accent);
  display: inline-flex; gap: 6px; align-items: center;
}
.card .stamp {
  margin-top: auto; display: none; align-items: center; gap: 8px; flex-wrap: wrap;
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
  padding: 6px 10px; border-radius: 6px; width: fit-content;
}
.revealed .card .cta { display: none; }
.revealed .card .stamp { display: inline-flex; }
.revealed .card.is-real { border-color: var(--real); }
.revealed .card.is-real .stamp { background: var(--real-soft); color: var(--real); }
.revealed .card.is-fake { opacity: .78; }
.revealed .card.is-fake .stamp { background: var(--fake-soft); color: var(--fake); }
.revealed .card.is-fake p.stmt { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--fake) 55%, transparent); text-decoration-thickness: 1px; }
.card .picked {
  position: absolute; top: -11px; right: 18px; display: none;
  font-family: var(--f-mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase;
  background: var(--ink); color: var(--bg); padding: 3px 8px; border-radius: 4px;
}
.revealed .card.chosen .picked { display: block; }

/* Verdict + record */
.reveal { display: grid; gap: 20px; margin-top: 28px; animation: rise .5s ease both; }
@keyframes rise { from { transform: translateY(10px); opacity: .001; } to { transform: none; opacity: 1; } }
.verdict { display: flex; gap: 14px; align-items: center; }
.verdict .dot {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; color: var(--accent-ink);
}
.verdict.ok .dot { background: var(--real); }
.verdict.no .dot { background: var(--fake); }
.verdict h2 { margin: 0; font: 500 1.4rem/1.2 var(--f-display); }
.verdict p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }

.record {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 28px; display: grid; gap: 18px;
}
@media (max-width: 520px) { .record { padding: 20px; } }
.record-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.record h3 { margin: 0; font: 600 1.35rem/1.25 var(--f-display); text-wrap: balance; }
.record .body { margin: 0; max-width: 66ch; font-size: 1.02rem; }
blockquote.src {
  margin: 0; padding: 14px 18px; border-left: 3px solid var(--line);
  background: color-mix(in srgb, var(--bg) 60%, var(--surface));
  border-radius: 0 8px 8px 0; display: grid; gap: 6px;
}
blockquote.src p { margin: 0; font: italic 400 1.05rem/1.5 var(--f-display); }
blockquote.src cite { font-style: normal; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: .92rem;
  text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  transition: background .2s, border-color .2s, transform .15s;
}
.btn:hover { border-color: var(--ink); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost-night { background: transparent; color: var(--night-ink); border-color: rgb(255 255 255 / .25); }
.btn.ghost-night:hover { border-color: var(--night-ink); }
.btn.solid-night { background: var(--night-ink); color: var(--night); border-color: var(--night-ink); }

details.why { border-top: 1px solid var(--line); padding-top: 14px; }
details.why summary { cursor: pointer; font-weight: 600; font-size: .92rem; list-style: none; display: flex; gap: 8px; align-items: center; }
details.why summary::-webkit-details-marker { display: none; }
details.why summary::before { content: "+"; font-family: var(--f-mono); color: var(--muted); width: 1ch; }
details.why[open] summary::before { content: "–"; }
details.why p { margin: 10px 0 0; max-width: 66ch; color: var(--muted); }

/* The "what if" band: the one dramatic moment */
.whatif-cta {
  display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 22px 24px; border-radius: var(--r);
  background: var(--night); color: var(--night-ink);
}
.whatif-cta p { margin: 0; font: 500 1.2rem/1.3 var(--f-display); }
.whatif-cta p span { display: block; font: 400 .85rem/1.4 var(--f-ui); color: var(--night-muted); margin-top: 4px; }

.whatif {
  position: relative; overflow: hidden; border-radius: var(--r);
  background: linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
  color: var(--night-ink);
  animation: rise .6s ease both;
}
.whatif canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.whatif .inner {
  position: relative; padding: clamp(28px, 5vw, 56px); display: grid; gap: 22px;
}
.whatif .eyebrow { color: var(--night-muted); }
.whatif h3 {
  margin: 0; font: 500 clamp(1.6rem, 3.6vw, 2.3rem)/1.15 var(--f-display); letter-spacing: -.015em;
  max-width: 22ch; text-wrap: balance;
}
.whatif .steps { display: grid; gap: 14px; max-width: 62ch; margin: 0; padding: 0; list-style: none; }
.whatif .steps li {
  display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start;
  font: 400 1.12rem/1.55 var(--f-display); color: var(--night-ink);
  animation: rise .7s ease both;
}
.whatif .steps li::before {
  content: ""; width: 9px; height: 9px; margin-top: .6em; border-radius: 50%;
  background: var(--night-muted); box-shadow: 0 0 0 4px color-mix(in srgb, var(--night-muted) 22%, transparent);
}
.whatif .note { font-size: .8rem; color: var(--night-muted); max-width: 62ch; margin: 0; }

/* End screen */
.end { display: grid; gap: 28px; }
.end .big { font: 500 clamp(3.5rem, 12vw, 6rem)/1 var(--f-display); letter-spacing: -.03em; margin: 0; font-variant-numeric: tabular-nums; }
.end .big small { font-size: .35em; color: var(--muted); letter-spacing: 0; }
.end h1 { margin: 0; font: 500 clamp(1.6rem, 4vw, 2.3rem)/1.15 var(--f-display); text-wrap: balance; max-width: 26ch; }
.end p.lead { margin: 0; max-width: 60ch; color: var(--muted); }
.ledger { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ledger li {
  display: grid; grid-template-columns: 18px 1fr auto; gap: 14px; align-items: baseline;
  padding: 14px 2px; border-bottom: 1px solid var(--line);
}
.ledger .m { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.ledger .m.ok { background: var(--real); }
.ledger .m.no { background: var(--fake); }
.ledger .t { min-width: 0; }
.ledger .t b { font-weight: 600; display: block; }
.ledger .t span { color: var(--muted); font-size: .85rem; }
.ledger a { font-family: var(--f-mono); font-size: .75rem; white-space: nowrap; }

footer.foot { margin-top: 48px; color: var(--muted); font-size: .8rem; max-width: 70ch; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- City map ---------- */
/* Map palette: daytime in light theme, night in dark theme (windows glow). */
:root {
  --m-sky: #DCEBEF; --m-sky-2: #EAF3F2;
  --m-water: #A6D3E0; --m-wave: rgb(255 255 255 / .6);
  --m-grass: #C9E2B1; --m-block: #BCD9A1; --m-side1: #9DBF86; --m-side2: #86AC70; --m-soil: #B39572;
  --m-road: #C9C7C1; --m-road-line: #FFFFFF;
  --m-tree: #79B162; --m-tree-2: #5F9A4F; --m-trunk: #8B6B4E;
  --m-win: #D3E9F4; --m-win-lit: #FFD27A; --m-win-off: #4A4F55;
  --m-bldg-filter: none; --m-smoke: #6E7378;
  --warn: #D08A12;
  --m-sand: #EFE2BC; --m-sand-2: #D9C797; --m-shallow: #BDE3EA; --m-walk: #F1EEE6; --m-pond: #8FCBE2; --m-path: #E6DCC0;
  --m-zebra: #FFFFFF; --m-cloud: #FFFFFF; --m-cloud-o: .5; --m-lamp: #F7E3A1; --m-shadow-o: .13;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --m-sky: #0F1820; --m-sky-2: #15222C;
    --m-water: #1B3243; --m-wave: rgb(255 255 255 / .14);
    --m-grass: #2E4936; --m-block: #2A4331; --m-side1: #213628; --m-side2: #1B2E22; --m-soil: #3A2F25;
    --m-road: #394146; --m-road-line: #6A7379;
    --m-tree: #3F6E46; --m-tree-2: #325A39; --m-trunk: #5A4636;
    --m-win: #3B4F62; --m-win-lit: #FFC861; --m-win-off: #1E2226;
    --m-bldg-filter: brightness(.74) saturate(.85); --m-smoke: #A3A9AE; --warn: #F2B84B;
    --m-sand: #5B5540; --m-sand-2: #474230; --m-shallow: #23445A; --m-walk: #4A5258; --m-pond: #2A5570; --m-path: #56513F;
    --m-zebra: #7C858B; --m-cloud: #9FB2C4; --m-cloud-o: .16; --m-lamp: #FFD166; --m-shadow-o: .3;
  }
}
:root[data-theme="dark"] {
  --m-sky: #0F1820; --m-sky-2: #15222C;
  --m-water: #1B3243; --m-wave: rgb(255 255 255 / .14);
  --m-grass: #2E4936; --m-block: #2A4331; --m-side1: #213628; --m-side2: #1B2E22; --m-soil: #3A2F25;
  --m-road: #394146; --m-road-line: #6A7379;
  --m-tree: #3F6E46; --m-tree-2: #325A39; --m-trunk: #5A4636;
  --m-win: #3B4F62; --m-win-lit: #FFC861; --m-win-off: #1E2226;
  --m-bldg-filter: brightness(.74) saturate(.85); --m-smoke: #A3A9AE; --warn: #F2B84B;
    --m-sand: #5B5540; --m-sand-2: #474230; --m-shallow: #23445A; --m-walk: #4A5258; --m-pond: #2A5570; --m-path: #56513F;
    --m-zebra: #7C858B; --m-cloud: #9FB2C4; --m-cloud-o: .16; --m-lamp: #FFD166; --m-shadow-o: .3;
}

.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 960px) {
  .stage { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 36px; align-items: start; }
  .map-pane { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  .map { height: min(80vh, 660px) !important; }
}
.map {
  position: relative; height: clamp(250px, 64vw, 400px); border-radius: 20px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 35%, var(--m-sky-2), var(--m-sky));
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
#city { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.map-caption {
  position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 24px);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 7px 14px; border-radius: 999px; font-size: .84rem; font-weight: 600;
  background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(6px);

நிறுவனம் அதன் பிறகே உறுதிசெய்தது.", "whyBad": "தொலைதூரப் பணி மற்றும் டிஜிட்டல் தொடர்பின் ஓர் அடிப்படை அனுமானத்தை இந்நிகழ்வு தாக்குகிறது: பழக்கமான ஒருவரைப் பார்ப்பது அல்லது கேட்பது அவரது அடையாளத்துக்குப் பயனுள்ள சான்று என்பதே அது. உருவாக்க ஊடகங்கள் நம்பும்படியான ஆள்மாறாட்டத்தின் செலவைக் குறைக்கின்றன; ஆனால் நிறுவனச் செயல்முறைகள் இன்னும் குரலையோ வீடியோவையோ கேள்வியின்றி நம்பக்கூடும். எனவே பாதிப்பு, மேம்பட்ட போலியாக்கத் திறனாலும், அதற்கேற்ப வடிவமைக்கப்படாத அடையாளச் சரிபார்ப்பு நடைமுறைகளாலும் ஏற்படுகிறது.", "escalation": "நேரடிச் செயற்கைக் குரலும் வீடியோவும் மலிவாகவும், தனிப்பட்டவையாகவும், தானியக்கம் செய்ய எளிதாகவும் ஆகக்கூடும். இது ஆள்மாறாட்டத் தாக்குதல்களின் தரத்தையும் அளவையும் ஒருசேர உயர்த்தி, முறைசாரா அடையாளச் சோதனைகளை மேலும் மேலும் நம்பகமற்றவையாக்கக்கூடும்."}, "sv": {"title": "Deepfake-direktör ledde till överföring på 1,1 miljoner dollar", "domain": "Företagsbedrägeri", "hook": "en enda falsk direktör", "real": "Bedragare ska ha **utgett sig för att vara en företagsdirektör med hjälp av deepfake-metoder** och fått en anställd att föra över omkring 1,1 miljoner dollar.", "fake": "Bedragare ska ha använt AI för att ta fram en **falsk revisionsrapport** i en välkänd revisionsbyrås namn och övertalat en anställd att föra över omkring 900 000 dollar som betalning för en **förfallen skatteskuld**.", "excerpt": "Starmangalsutra Private Limited ska ha förlorat 10,70 crore rupier efter att okända aktörer tagit sig in i företagets enheter och använt påstådda deepfake-metoder för att utge sig för att vara en direktör.", "explanation": "Angripare ska ha tagit sig in i företagets enheter och använt påstådda deepfake-metoder för att utge sig för att vara en direktör. En anställd trodde att instruktionerna var äkta och förde över omkring 1,1 miljoner dollar innan företaget kontrollerade att direktören inte hade gett dem.", "whyBad": "Händelsen angriper ett grundantagande i distansarbete och digital kommunikation: att se eller höra en bekant person är ett användbart bevis på identitet. Generativa medier sänker kostnaden för övertygande identitetsbedrägerier, medan organisationers rutiner fortfarande kan lita på röst eller video utan att ifrågasätta. Skadan kommer därför både från bättre förfalskningsförmåga och från autentiseringsrutiner som inte är byggda för den.", "escalation": "Syntetisk röst och video i realtid kan bli billigare, mer personanpassade och lättare att automatisera. Det kan öka både kvaliteten och omfattningen av identitetsbedrägerier och göra informella identitetskontroller allt mindre pålitliga."}, "tr": {"title": "Deepfake yönetici 1,1 milyon dolarlık transfere yol açtı", "domain": "Kurumsal dolandırıcılık", "hook": "tek bir sahte yönetici", "real": "Dolandırıcıların **deepfake yöntemleriyle bir şirket yöneticisini taklit ettiği** ve bir çalışanı yaklaşık 1,1 milyon dolar transfer etmeye ikna ettiği bildirildi.", "fake": "Dolandırıcıların yapay zekâyla tanınmış bir denetim firması adına **sahte bir denetim raporu** hazırladığı ve bir çalışanı **gecikmiş vergi borcu** ödemesi olarak yaklaşık 900.000 dolar transfer etmeye ikna ettiği bildirildi.", "excerpt": "Starmangalsutra Private Limited'in, kimliği belirsiz kişilerin şirket cihazlarını ele geçirip bir yöneticiyi taklit etmek için iddia edilen deepfake yöntemleri kullanmasının ardından 10,70 crore rupi kaybettiği bildirildi.", "explanation": "Saldırganların şirket cihazlarını ele geçirdiği ve bir yöneticiyi taklit etmek için iddia edilen deepfake yöntemleri kullandığı bildirildi. Bir çalışan talimatların gerçek olduğuna inandı ve şirket, yöneticinin bu talimatları vermediğini doğrulamadan önce yaklaşık 1,1 milyon dolar transfer etti.", "whyBad": "Olay, uzaktan çalışmanın ve dijital iletişimin temel bir varsayımını hedef alıyor: Tanıdık birini görmenin veya duymanın kimliğine dair işe yarar bir kanıt olduğu varsayımını. Üretken medya inandırıcı taklitlerin maliyetini düşürürken kurumların süreçleri hâlâ sese veya videoya örtük olarak güvenebiliyor. Dolayısıyla zarar hem gelişmiş sahtecilik kabiliyetinden hem de buna göre tasarlanmamış kimlik doğrulama prosedürlerinden kaynaklanıyor.", "escalation": "Gerçek zamanlı sentetik ses ve video daha ucuz, daha kişiselleştirilmiş ve otomasyona daha uygun hâle gelebilir. Bu, taklit saldırılarının hem kalitesini hem de ölçeğini artırarak gayriresmî kimlik kontrollerini giderek daha az güvenilir kılabilir."}}}, {"id": 1717, "url": "https://incidentdatabase.ai/cite/1717/", "building": "police", "text": {"en": {"title": "License-plate AI error led to an armed police stop", "domain": "Policing", "hook": "one false match", "real": "An automated **license-plate system** reportedly misread a vehicle's plate, after which police **stopped the driver at gunpoint** before the error was discovered.", "fake": "An AI system that **estimates crowd sizes from drone footage** reportedly flagged a **wedding party as an unauthorized protest**, after which riot police were sent to the venue before the error was discovered.", "excerpt": "Toledo, Ohio, police stopped motorist Brandon Upchurch at gunpoint after a Flock Safety license-plate reader incorrectly matched his truck to a stolen plate.", "explanation": "An automated license-plate reader incorrectly matched a truck to a stolen plate. Police stopped the driver at gunpoint, released a police dog that bit him, and arrested him. Police later said the alert was a misread; the charges were dropped.", "whyBad": "The significance is the coupling of a probabilistic recognition system to an institution with coercive power. Recognition systems inevitably have error rates; when an alert is treated as sufficiently authoritative to justify a high-risk intervention, even a small technical error can produce severe physical and legal consequences. The reported failure also involved a human verification step that was not performed correctly.", "escalation": "Wider deployment of automated surveillance can create many more machine-generated alerts. If downstream decisions are also increasingly automated or time-pressured, false positives can spread through policing, border control, access systems, or other high-stakes institutions before meaningful review occurs. AI surveillance carries a second danger too: when cameras can track every car and every face, everyone is watched all the time, and a single wrong match can follow a person from one system to the next."}, "fr": {"title": "Une erreur de lecture de plaque par l’IA a mené à un contrôle sous la menace d’une arme", "domain": "Police", "hook": "une seule fausse correspondance", "real": "Un **système automatique de lecture de plaques** aurait mal lu la plaque d’un véhicule, après quoi la police a **arrêté le conducteur sous la menace d’une arme** avant que l’erreur ne soit découverte.", "fake": "Un système d’IA **estimant la taille des foules à partir d’images de drone** aurait **pris une fête de mariage pour une manifestation non autorisée**, après quoi des policiers antiémeute ont été envoyés sur place avant que l’erreur ne soit découverte.", "excerpt": "La police de Toledo, dans l’Ohio, a arrêté l’automobiliste Brandon Upchurch sous la menace d’une arme après qu’un lecteur de plaques Flock Safety a associé à tort son pick-up à une plaque volée.", "explanation": "Un lecteur automatique de plaques a associé à tort un pick-up à une plaque volée. La police a arrêté le conducteur sous la menace d’une arme, lâché un chien qui l’a mordu, puis l’a placé en état d’arrestation. La police a ensuite reconnu une erreur de lecture ; les charges ont été abandonnées.", "whyBad": "L’enjeu est le couplage d’un système de reconnaissance probabiliste avec une institution dotée d’un pouvoir de contrainte. Les systèmes de reconnaissance ont inévitablement des taux d’erreur ; quand une alerte est jugée assez fiable pour justifier une intervention à haut risque, même une petite erreur technique peut avoir de graves conséquences physiques et juridiques. La défaillance signalée impliquait aussi une étape de vérification humaine mal effectuée.", "escalation": "Un déploiement plus large de la surveillance automatisée peut générer bien plus d’alertes produites par des machines. Si les décisions en aval sont elles aussi de plus en plus automatisées ou prises dans l’urgence, les faux positifs pourraient se propager dans la police, le contrôle aux frontières, les systèmes d’accès ou d’autres institutions à fort enjeu avant tout examen sérieux. La surveillance par IA comporte un second danger : quand des caméras peuvent suivre chaque voiture et chaque visage, tout le monde est observé en permanence, et une seule fausse correspondance peut suivre une personne d’un système à l’autre."}, "de": {"title": "KI-Fehler beim Kennzeichenlesen führte zu Polizeikontrolle mit gezogener Waffe", "domain": "Polizei", "hook": "ein einziger falscher Treffer", "real": "Ein **automatisches Kennzeichenerkennungssystem** soll das Kennzeichen eines Fahrzeugs falsch gelesen haben, woraufhin die Polizei **den Fahrer mit vorgehaltener Waffe stoppte**, bevor der Fehler entdeckt wurde.", "fake": "Ein KI-System, das **anhand von Drohnenaufnahmen die Größe von Menschenmengen schätzt**, soll eine **Hochzeitsgesellschaft als nicht genehmigte Demonstration** eingestuft haben, woraufhin Bereitschaftspolizei zum Ort geschickt wurde, bevor der Fehler entdeckt wurde.", "excerpt": "Die Polizei in Toledo, Ohio, stoppte den Autofahrer Brandon Upchurch mit vorgehaltener Waffe, nachdem ein Kennzeichenleser von Flock Safety seinen Pick-up fälschlich einem gestohlenen Kennzeichen zugeordnet hatte.", "explanation": "Ein automatischer Kennzeichenleser ordnete einen Pick-up fälschlich einem gestohlenen Kennzeichen zu. Die Polizei stoppte den Fahrer mit vorgehaltener Waffe, ließ einen Polizeihund los, der ihn biss, und nahm ihn fest. Später erklärte die Polizei, der Alarm sei ein Lesefehler gewesen; die Anklage wurde fallen gelassen.", "whyBad": "Entscheidend ist die Kopplung eines probabilistischen Erkennungssystems an eine Institution mit Zwangsbefugnissen. Erkennungssysteme haben zwangsläufig Fehlerraten; wird ein Alarm als verlässlich genug für einen riskanten Eingriff behandelt, kann schon ein kleiner technischer Fehler schwere körperliche und rechtliche Folgen haben. Zum berichteten Versagen gehörte auch ein menschlicher Prüfschritt, der nicht korrekt durchgeführt wurde.", "escalation": "Ein breiterer Einsatz automatisierter Überwachung kann viel mehr maschinell erzeugte Alarme hervorbringen. Wenn auch nachgelagerte Entscheidungen zunehmend automatisiert oder unter Zeitdruck getroffen werden, könnten sich Fehlalarme durch Polizei, Grenzkontrolle, Zugangssysteme und andere sensible Institutionen ausbreiten, bevor eine echte Prüfung stattfindet. KI-Überwachung birgt noch eine zweite Gefahr: Wenn Kameras jedes Auto und jedes Gesicht verfolgen können, werden alle ständig beobachtet, und ein einziger falscher Treffer kann einem Menschen von System zu System folgen."}, "ru": {"title": "Ошибка распознавания номера привела к остановке под дулом пистолета", "domain": "Полиция", "hook": "одно ложное совпадение", "real": "Автоматическая **система распознавания номерных знаков**, по имеющимся данным, неверно считала номер автомобиля, после чего полиция **остановила водителя под дулом пистолета**, прежде чем ошибка обнаружилась.", "fake": "ИИ-система, **оценивающая размер толпы по съёмке с дрона**, по имеющимся данным, **приняла свадьбу за несогласованную акцию протеста**, после чего на место направили спецподразделение полиции, прежде чем ошибка обнаружилась.", "excerpt": "Полиция Толидо (штат Огайо) остановила водителя Брэндона Апчерча под дулом пистолета после того, как считыватель номерных знаков Flock Safety ошибочно сопоставил его пикап с украденным номером.", "explanation": "Автоматический считыватель номерных знаков ошибочно сопоставил пикап с украденным номером. Полиция остановила водителя под дулом пистолета, спустила на него служебную собаку, которая его укусила, и арестовала его. Позже полиция признала, что сигнал был ошибкой считывания; обвинения сняли.", "whyBad": "Суть в связке вероятностной системы распознавания с институтом, у которого есть полномочия применять силу. У систем распознавания неизбежно есть доля ошибок; когда сигнал считается достаточно авторитетным, чтобы оправдать рискованное вмешательство, даже небольшая техническая ошибка может привести к тяжёлым физическим и юридическим последствиям. По имеющимся данным, в этом случае также не был как следует выполнен этап проверки человеком.", "escalation": "Более широкое внедрение автоматизированного наблюдения может порождать гораздо больше машинных сигналов. Если последующие решения тоже будут всё более автоматизированными или будут приниматься в спешке, ложные срабатывания смогут распространяться через полицию, пограничный контроль, системы доступа и другие институты с высокими ставками ещё до содержательной проверки. У ИИ-слежки есть и вторая опасность: когда камеры отслеживают каждую машину и каждое лицо, под наблюдением постоянно находятся все, а одно ложное совпадение может переходить за человеком из одной системы в другую."}, "it": {"title": "Un errore dell’IA nella lettura della targa ha portato a un fermo con armi spianate", "domain": "Polizia", "hook": "una sola falsa corrispondenza", "real": "Un **sistema automatico di lettura targhe** avrebbe letto male la targa di un veicolo, dopodiché la polizia ha **fermato il conducente sotto la minaccia delle armi** prima che l’errore venisse scoperto.", "fake": "Un sistema di IA che **stima le dimensioni delle folle dalle riprese dei droni** avrebbe **scambiato una festa di matrimonio per una manifestazione non autorizzata**, dopodiché sul posto sono stati inviati agenti antisommossa prima che l’errore venisse scoperto.", "excerpt": "La polizia di Toledo, in Ohio, ha fermato l’automobilista Brandon Upchurch sotto la minaccia delle armi dopo che un lettore di targhe Flock Safety aveva associato per errore il suo pick-up a una targa rubata.", "explanation": "Un lettore automatico di targhe ha associato per errore un pick-up a una targa rubata. La polizia ha fermato il conducente sotto la minaccia delle armi, gli ha sguinzagliato contro un cane che lo ha morso e lo ha arrestato. In seguito la polizia ha ammesso che l’allerta era un errore di lettura; le accuse sono state ritirate.", "whyBad": "Il punto è l’accoppiamento tra un sistema di riconoscimento probabilistico e un’istituzione con poteri coercitivi. I sistemi di riconoscimento hanno inevitabilmente tassi di errore; quando un’allerta è considerata abbastanza autorevole da giustificare un intervento ad alto rischio, anche un piccolo errore tecnico può avere gravi conseguenze fisiche e legali. Il caso riferito ha coinvolto anche un passaggio di verifica umana non eseguito correttamente.", "escalation": "Una diffusione più ampia della sorveglianza automatizzata può generare molte più allerte prodotte da macchine. Se anche le decisioni successive diventano sempre più automatizzate o prese di fretta, i falsi positivi potrebbero propagarsi tra polizia, controlli di frontiera, sistemi di accesso e altre istituzioni ad alto rischio prima di qualsiasi verifica sostanziale. La sorveglianza con l’IA comporta anche un secondo pericolo: quando le telecamere possono seguire ogni auto e ogni volto, tutti sono osservati continuamente, e una sola falsa corrispondenza può seguire una persona da un sistema all’altro."}, "es": {"title": "Un error de IA al leer una matrícula llevó a una detención a punta de pistola", "domain": "Policía", "hook": "una sola coincidencia falsa", "real": "Según se informa, un **sistema automático de lectura de matrículas** leyó mal la matrícula de un vehículo, tras lo cual la policía **detuvo al conductor a punta de pistola** antes de descubrir el error.", "fake": "Según se informa, un sistema de IA que **estima el tamaño de las multitudes a partir de imágenes de dron** **confundió una fiesta de boda con una protesta no autorizada**, tras lo cual se envió a policías antidisturbios al lugar antes de descubrir el error.", "excerpt": "La policía de Toledo (Ohio) detuvo a punta de pistola al conductor Brandon Upchurch después de que un lector de matrículas de Flock Safety asociara por error su camioneta con una matrícula robada.", "explanation": "Un lector automático de matrículas asoció por error una camioneta con una matrícula robada. La policía detuvo al conductor a punta de pistola, le soltó un perro policía que lo mordió y lo arrestó. Más tarde la policía reconoció que la alerta fue un error de lectura; se retiraron los cargos.", "whyBad": "Lo importante es el acoplamiento de un sistema de reconocimiento probabilístico con una institución con poder coercitivo. Los sistemas de reconocimiento tienen inevitablemente tasas de error; cuando una alerta se considera lo bastante fiable como para justificar una intervención de alto riesgo, incluso un pequeño error técnico puede tener graves consecuencias físicas y legales. El fallo descrito incluyó además un paso de verificación humana que no se realizó correctamente.", "escalation": "Un despliegue más amplio de la vigilancia automatizada puede generar muchas más alertas producidas por máquinas. Si las decisiones posteriores también se automatizan cada vez más o se toman con prisa, los falsos positivos podrían propagarse por la policía, el control fronterizo, los sistemas de acceso y otras instituciones de alto riesgo antes de que haya una revisión real. La vigilancia con IA conlleva además un segundo peligro: cuando las cámaras pueden seguir cada coche y cada rostro, todo el mundo está vigilado todo el tiempo, y una sola coincidencia errónea puede perseguir a una persona de un sistema a otro."}, "ko": {"title": "AI 번호판 인식 오류로 총구 앞 검문", "domain": "경찰", "hook": "잘못된 일치 판정 하나", "real": "**자동 번호판 인식 시스템**이 차량 번호판을 잘못 읽었고, 오류가 밝혀지기 전에 경찰이 **운전자를 총구를 겨눈 채 세운** 것으로 알려졌다.", "fake": "**드론 영상으로 군중 규모를 추정하는** AI 시스템이 **결혼식 하객을 미신고 집회로** 잘못 판단했고, 오류가 밝혀지기 전에 진압 경찰이 현장에 출동한 것으로 알려졌다.", "excerpt": "미국 오하이오주 톨레도 경찰은 Flock Safety 번호판 인식기가 브랜던 업처치의 트럭을 도난 번호판과 잘못 일치시킨 뒤 그를 총구를 겨눈 채 세웠다.", "explanation": "자동 번호판 인식기가 트럭을 도난 번호판과 잘못 일치시켰다. 경찰은 총구를 겨눈 채 운전자를 세우고, 경찰견을 풀어 그를 물게 한 뒤 체포했다. 경찰은 나중에 경보가 판독 오류였다고 밝혔고 혐의는 취하됐다.", "whyBad": "핵심은 확률적 인식 시스템이 강제력을 가진 기관과 결합됐다는 점이다. 인식 시스템에는 필연적으로 오류율이 있다. 경보가 위험한 개입을 정당화할 만큼 권위 있게 취급되면, 작은 기술적 오류도 심각한 신체적·법적 결과를 낳을 수 있다. 보도된 실패에는 제대로 수행되지 않은 인간 검증 단계도 포함됐다.", "escalation": "자동 감시가 더 널리 도입되면 기계가 만드는 경보가 훨씬 많아질 수 있다. 이후의 결정까지 점점 자동화되거나 시간에 쫓겨 내려진다면, 오탐은 제대로 된 검토가 이뤄지기도 전에 경찰, 국경 통제, 출입 시스템 등 위험도가 높은 기관 전반으로 퍼질 수 있다. AI 감시에는 또 다른 위험도 있다. 카메라가 모든 차량과 얼굴을 추적할 수 있게 되면 모든 사람이 항상 감시당하고, 한 번의 잘못된 일치 판정이 한 사람을 이 시스템에서 저 시스템으로 따라다닐 수 있다."}, "zh": {"title": "AI 车牌识别错误导致持枪拦车", "domain": "警务", "hook": "一次错误匹配", "real": "据报道，一个**自动车牌识别系统**误读了车牌，随后警方在错误被发现之前**持枪拦下了司机**。", "fake": "据报道，一个**根据无人机画面估算人群规模**的 AI 系统**把一场婚礼误判为未经批准的抗议活动**，随后防暴警察被派往现场，之后错误才被发现。", "excerpt": "美国俄亥俄州托莱多警方在 Flock Safety 车牌识别器错误地将 Brandon Upchurch 的皮卡与一块被盗车牌匹配后，持枪拦下了他。", "explanation": "一个自动车牌识别器错误地将一辆皮卡与被盗车牌匹配。警方持枪拦下司机，放出警犬咬伤了他，并将其逮捕。警方后来表示该警报是误读，指控被撤销。", "whyBad": "关键在于一个概率性的识别系统与拥有强制权力的机构耦合在一起。识别系统不可避免地存在错误率；当警报被视为足以支撑高风险干预的依据时，即使很小的技术错误也可能造成严重的人身和法律后果。据报道，这次失误还涉及一个未被正确执行的人工核验步骤。", "escalation": "更广泛地部署自动化监控，可能产生多得多的机器警报。如果后续决策也越来越自动化或在时间压力下作出，误报就可能在得到实质性审查之前，扩散到警务、边境管控、门禁系统和其他高风险机构。AI 监控还有另一重危险：当摄像头能追踪每一辆车、每一张脸时，所有人都时刻处于监视之下，而一次错误匹配可能跟着一个人从一个系统传到另一个系统。"}, "sr": {"title": "Грешка ВИ при читању таблица довела до заустављања под претњом оружјем", "domain": "Полиција", "hook": "једно лажно подударање", "real": "Аутоматски **систем за читање регистарских таблица** је, како се наводи, погрешно очитао таблицу возила, након чега је полиција **зауставила возача под претњом оружјем** пре него што је грешка откривена.", "fake": "ВИ систем који **процењује величину окупљања на основу снимака са дрона** је, како се наводи, **свадбу означио као непријављени протест**, након чега је на лице места послата интервентна полиција пре него што је грешка откривена.", "excerpt": "Полиција у Толеду, у Охају, зауставила је возача Брендона Апчерча под претњом оружјем након што је читач регистарских таблица Flock Safety погрешно повезао његов камионет са украденом таблицом.", "explanation": "Аутоматски читач таблица погрешно је повезао камионет са украденом таблицом. Полиција је зауставила возача под претњом оружјем, пустила на њега полицијског пса који га је ујео и ухапсила га. Полиција је касније рекла да је узбуна била погрешно очитавање; оптужбе су одбачене.", "whyBad": "Суштина је у спрези пробабилистичког система за препознавање и институције која има моћ принуде. Системи за препознавање неизбежно имају стопу грешке; када се узбуна сматра довољно поузданом да оправда ризичну интервенцију, чак и мала техничка грешка може имати тешке физичке и правне последице. Пријављени пропуст укључивао је и корак људске провере који није исправно спроведен.", "escalation": "Шира примена аутоматизованог надзора може произвести много више узбуна које генеришу машине. Ако и наредне одлуке постану све аутоматизованије или се доносе под временским притиском, лажно позитивни резултати могли би да се прошире кроз полицију, граничну контролу, системе за контролу приступа и друге институције високог ризика пре било какве суштинске провере. Надзор помоћу ВИ носи и другу опасност: када камере могу да прате сваки аутомобил и свако лице, сви су стално под надзором, а једно погрешно подударање може пратити човека из једног система у други."}, "bs": {"title": "Greška UI pri čitanju tablica dovela do zaustavljanja pod prijetnjom oružjem", "domain": "Policija", "hook": "jedno lažno podudaranje", "real": "Automatski **sistem za čitanje registarskih tablica** je, kako se navodi, pogrešno očitao tablicu vozila, nakon čega je policija **zaustavila vozača pod prijetnjom oružjem** prije nego što je greška otkrivena.", "fake": "UI sistem koji **procjenjuje veličinu okupljanja na osnovu snimaka s drona** je, kako se navodi, **svadbu označio kao neprijavljeni protest**, nakon čega je na lice mjesta poslana interventna policija prije nego što je greška otkrivena.", "excerpt": "Policija u Toledu, u Ohaju, zaustavila je vozača Brandona Upchurcha pod prijetnjom oružjem nakon što je čitač registarskih tablica Flock Safety pogrešno povezao njegov pikap s ukradenom tablicom.", "explanation": "Automatski čitač tablica pogrešno je povezao pikap s ukradenom tablicom. Policija je zaustavila vozača pod prijetnjom oružjem, pustila na njega policijskog psa koji ga je ujeo i uhapsila ga. Policija je kasnije rekla da je uzbuna bila pogrešno očitavanje; optužbe su odbačene.", "whyBad": "Suština je u sprezi probabilističkog sistema za prepoznavanje i institucije koja ima moć prinude. Sistemi za prepoznavanje neizbježno imaju stopu greške; kada se uzbuna smatra dovoljno pouzdanom da opravda rizičnu intervenciju, čak i mala tehnička greška može imati teške fizičke i pravne posljedice. Prijavljeni propust uključivao je i korak ljudske provjere koji nije ispravno proveden.", "escalation": "Šira primjena automatizovanog nadzora može proizvesti mnogo više uzbuna koje generišu mašine. Ako i naredne odluke postanu sve automatizovanije ili se donose pod vremenskim pritiskom, lažno pozitivni rezultati mogli bi se proširiti kroz policiju, graničnu kontrolu, sisteme kontrole pristupa i druge institucije visokog rizika prije bilo kakve suštinske provjere. Nadzor pomoću UI nosi i drugu opasnost: kada kamere mogu pratiti svaki automobil i svako lice, svi su stalno pod nadzorom, a jedno pogrešno podudaranje može pratiti čovjeka iz jednog sistema u drugi."}, "ro": {"title": "O eroare IA de citire a plăcuței a dus la o oprire sub amenințarea armei", "domain": "Poliție", "hook": "o singură potrivire falsă", "real": "Un **sistem automat de citire a plăcuțelor de înmatriculare** ar fi citit greșit plăcuța unui vehicul, după care poliția **l-a oprit pe șofer sub amenințarea armei** înainte ca eroarea să fie descoperită.", "fake": "Un sistem IA care **estimează mărimea mulțimilor din imagini filmate cu drona** ar fi **luat o nuntă drept un protest neautorizat**, după care la fața locului au fost trimiși jandarmi înainte ca eroarea să fie descoperită.", "excerpt": "Poliția din Toledo, Ohio, l-a oprit sub amenințarea armei pe șoferul Brandon Upchurch după ce un cititor de plăcuțe Flock Safety i-a asociat greșit camioneta cu o plăcuță furată.", "explanation": "Un cititor automat de plăcuțe a asociat greșit o camionetă cu o plăcuță furată. Poliția l-a oprit pe șofer sub amenințarea armei, a asmuțit asupra lui un câine care l-a mușcat și l-a arestat. Ulterior, poliția a spus că alerta a fost o citire greșită; acuzațiile au fost retrase.", "whyBad": "Esențial este cuplarea unui sistem probabilistic de recunoaștere cu o instituție care are putere de constrângere. Sistemele de recunoaștere au inevitabil rate de eroare; când o alertă este tratată ca suficient de autoritară pentru a justifica o intervenție riscantă, chiar și o mică eroare tehnică poate avea consecințe fizice și juridice grave. Eșecul relatat a implicat și un pas de verificare umană care nu a fost făcut corect.", "escalation": "O utilizare mai largă a supravegherii automate poate genera mult mai multe alerte produse de mașini. Dacă și deciziile ulterioare devin tot mai automatizate sau luate în grabă, rezultatele fals pozitive s-ar putea propaga prin poliție, controlul la frontieră, sistemele de acces și alte instituții cu miză mare înainte de orice verificare reală. Supravegherea cu IA aduce și un al doilea pericol: când camerele pot urmări fiecare mașină și fiecare chip, toată lumea este supravegheată permanent, iar o singură potrivire greșită poate urmări un om dintr-un sistem în altul."}, "vi": {"title": "Lỗi AI đọc biển số dẫn đến bị chặn xe bằng súng", "domain": "Cảnh sát", "hook": "một lần khớp sai", "real": "Một **hệ thống đọc biển số tự động** được cho là đã đọc sai biển số xe, sau đó cảnh sát **chĩa súng chặn tài xế** trước khi lỗi được phát hiện.", "fake": "Một hệ thống AI **ước tính quy mô đám đông từ hình ảnh drone** được cho là đã **nhận nhầm một đám cưới là cuộc biểu tình trái phép**, sau đó cảnh sát chống bạo động được điều đến hiện trường trước khi lỗi được phát hiện.", "excerpt": "Cảnh sát Toledo, Ohio, đã chĩa súng chặn tài xế Brandon Upchurch sau khi thiết bị đọc biển số của Flock Safety khớp nhầm xe bán tải của anh với một biển số bị đánh cắp.", "explanation": "Một thiết bị đọc biển số tự động đã khớp nhầm một chiếc xe bán tải với biển số bị đánh cắp. Cảnh sát chĩa súng chặn tài xế, thả chó nghiệp vụ cắn anh và bắt giữ anh. Sau đó cảnh sát thừa nhận cảnh báo là do đọc sai; các cáo buộc đã được hủy bỏ.", "whyBad": "Điểm mấu chốt là sự kết nối giữa một hệ thống nhận dạng mang tính xác suất với một thiết chế có quyền cưỡng chế. Hệ thống nhận dạng luôn có tỷ lệ sai sót; khi một cảnh báo được coi là đủ đáng tin để biện minh cho một can thiệp rủi ro cao, ngay cả một lỗi kỹ thuật nhỏ cũng có thể gây hậu quả nghiêm trọng về thể chất và pháp lý. Sự cố được báo cáo còn liên quan đến một bước xác minh của con người không được thực hiện đúng.", "escalation": "Việc triển khai giám sát tự động rộng hơn có thể tạo ra nhiều cảnh báo do máy móc sinh ra hơn. Nếu các quyết định tiếp theo cũng ngày càng tự động hóa hoặc bị đưa ra dưới áp lực thời gian, các kết quả dương tính giả có thể lan qua cảnh sát, kiểm soát biên giới, hệ thống ra vào và các thiết chế rủi ro cao khác trước khi có bất kỳ sự xem xét thực chất nào. Giám sát bằng AI còn có mối nguy thứ hai: khi camera có thể theo dõi mọi chiếc xe và mọi khuôn mặt, ai cũng bị theo dõi mọi lúc, và một lần khớp sai có thể bám theo một người từ hệ thống này sang hệ thống khác."}, "uk": {"title": "Помилка розпізнавання номера призвела до зупинки під дулом пістолета", "domain": "Поліція", "hook": "один хибний збіг", "real": "Автоматична **система розпізнавання номерних знаків**, за наявними даними, неправильно зчитала номер автомобіля, після чого поліція **зупинила водія під дулом пістолета**, перш ніж помилку було виявлено.", "fake": "ШІ-система, що **оцінює розмір натовпу за зйомкою з дрона**, за наявними даними, **сприйняла весілля за неузгоджену акцію протесту**, після чого на місце направили спецпідрозділ поліції, перш ніж помилку було виявлено.", "excerpt": "Поліція Толідо (штат Огайо) зупинила водія Брендона Апчерча під дулом пістолета після того, як зчитувач номерних знаків Flock Safety помилково зіставив його пікап із викраденим номером.", "explanation": "Автоматичний зчитувач номерних знаків помилково зіставив пікап із викраденим номером. Поліція зупинила водія під дулом пістолета, нацькувала на нього службового собаку, який його покусав, і заарештувала його. Згодом поліція визнала, що сигнал був помилкою зчитування; обвинувачення зняли.", "whyBad": "Суть — у зв'язці ймовірнісної системи розпізнавання з інституцією, що має повноваження застосовувати силу. Системи розпізнавання неминуче мають частку помилок; коли сигнал вважають достатньо авторитетним, щоб виправдати ризиковане втручання, навіть невелика технічна помилка може призвести до тяжких фізичних і юридичних наслідків. За наявними даними, у цьому випадку також не було як слід виконано етап перевірки людиною.", "escalation": "Ширше впровадження автоматизованого стеження може породжувати набагато більше машинних сигналів. Якщо подальші рішення теж дедалі більше автоматизуватимуться або ухвалюватимуться поспіхом, хибні спрацювання зможуть поширюватися через поліцію, прикордонний контроль, системи доступу та інші інституції з високими ставками ще до змістовної перевірки. ШІ-стеження має і другу небезпеку: коли камери відстежують кожну машину й кожне обличчя, під наглядом постійно перебувають усі, а один хибний збіг може переходити за людиною з однієї системи в іншу."}, "pl": {"title": "Błąd AI przy odczycie tablicy doprowadził do zatrzymania pod bronią", "domain": "Policja", "hook": "jedno fałszywe dopasowanie", "real": "Automatyczny **system odczytu tablic rejestracyjnych** miał błędnie odczytać tablicę pojazdu, po czym policja **zatrzymała kierowcę, mierząc do niego z broni**, zanim wykryto pomyłkę.", "fake": "System AI **szacujący wielkość tłumu na podstawie nagrań z drona** miał **uznać wesele za nielegalny protest**, po czym na miejsce wysłano oddziały prewencji, zanim wykryto pomyłkę.", "excerpt": "Policja w Toledo w stanie Ohio zatrzymała kierowcę Brandona Upchurcha, mierząc do niego z broni, po tym jak czytnik tablic rejestracyjnych Flock Safety błędnie dopasował jego pikapa do skradzionej tablicy.", "explanation": "Automatyczny czytnik tablic błędnie dopasował pikapa do skradzionej tablicy. Policja zatrzymała kierowcę, mierząc do niego z broni, spuściła psa policyjnego, który go pogryzł, i aresztowała go. Później policja przyznała, że alert był błędnym odczytem; zarzuty wycofano.", "whyBad": "Istotą problemu jest połączenie probabilistycznego systemu rozpoznawania z instytucją, która może stosować przymus. Systemy rozpoznawania nieuchronnie popełniają błędy; gdy alert traktuje się jako wystarczająco wiarygodny, by uzasadnić ryzykowną interwencję, nawet drobny błąd techniczny może mieć poważne skutki fizyczne i prawne. W opisanym przypadku zawiódł też etap weryfikacji przez człowieka, którego nie wykonano prawidłowo.", "escalation": "Szersze stosowanie zautomatyzowanego nadzoru może generować znacznie więcej alertów tworzonych przez maszyny. Jeśli kolejne decyzje też będą coraz bardziej zautomatyzowane lub podejmowane w pośpiechu, fałszywe alarmy mogą rozchodzić się po policji, kontroli granicznej, systemach dostępu i innych instytucjach o wysokiej stawce, zanim dojdzie do rzetelnej weryfikacji. Nadzór oparty na AI niesie też drugie zagrożenie: gdy kamery mogą śledzić każdy samochód i każdą twarz, wszyscy są obserwowani przez cały czas, a jedno błędne dopasowanie może podążać za człowiekiem z systemu do systemu."}, "ta": {"title": "AI வாகன எண் வாசிப்புப் பிழையால் துப்பாக்கி முனையில் நிறுத்தம்", "domain": "காவல்துறை", "hook": "ஒரு தவறான பொருத்தம்", "real": "தானியங்கி **வாகன எண் பலகை அடையாள அமைப்பு** ஒன்று ஒரு வாகனத்தின் எண்ணைத் தவறாக வாசித்ததாகவும், பிழை கண்டுபிடிக்கப்படுவதற்கு முன்பே காவல்துறையினர் **ஓட்டுநரைத் துப்பாக்கி முனையில் நிறுத்தியதாகவும்** கூறப்படுகிறது.", "fake": "**ட்ரோன் காட்சிகளிலிருந்து கூட்டத்தின் அளவை மதிப்பிடும்** AI அமைப்பு ஒன்று, ஒரு **திருமண விழாவை அனுமதியற்ற போராட்டம்** என்று தவறாகக் குறித்ததாகவும், பிழை கண்டுபிடிக்கப்படுவதற்கு முன்பே கலவரத் தடுப்புக் காவலர்கள் அங்கு அனுப்பப்பட்டதாகவும் கூறப்படுகிறது.", "excerpt": "Flock Safety வாகன எண் பலகை வாசிப்பான் ஒன்று பிராண்டன் அப்சர்ச்சின் லாரியைத் திருடப்பட்ட எண் பலகையுடன் தவறாகப் பொருத்தியதால், அமெரிக்காவின் ஒஹையோ மாநிலம் டொலீடோ காவல்துறையினர் அவரைத் துப்பாக்கி முனையில் நிறுத்தினர்.", "explanation": "தானியங்கி வாகன எண் வாசிப்பான் ஒரு லாரியைத் திருடப்பட்ட எண் பலகையுடன் தவறாகப் பொருத்தியது. காவல்துறையினர் ஓட்டுநரைத் துப்பாக்கி முனையில் நிறுத்தி, அவர் மீது ஒரு காவல் நாயை ஏவினர்; அது அவரைக் கடித்தது; பின்னர் அவரைக் கைது செய்தனர். அந்த எச்சரிக்கை தவறான வாசிப்பு என்று காவல்துறை பின்னர் கூறியது; குற்றச்சாட்டுகள் கைவிடப்பட்டன.", "whyBad": "நிகழ்தகவு அடிப்படையிலான ஓர் அடையாள அமைப்பு, கட்டாய அதிகாரம் கொண்ட ஒரு நிறுவனத்துடன் இணைக்கப்பட்டிருப்பதே முக்கியம். அடையாள அமைப்புகளுக்குத் தவிர்க்க முடியாத பிழை விகிதம் உண்டு; அதிக ஆபத்துள்ள தலையீட்டை நியாயப்படுத்தும் அளவுக்கு ஓர் எச்சரிக்கை நம்பகமானதாகக் கருதப்படும்போது, சிறிய தொழில்நுட்பப் பிழைகூடக் கடுமையான உடல்ரீதியான மற்றும் சட்டரீதியான விளைவுகளை ஏற்படுத்தலாம். இந்தத் தோல்வியில், சரியாகச் செய்யப்படாத ஒரு மனிதச் சரிபார்ப்புப் படியும் அடங்கியிருந்தது.", "escalation": "தானியங்கிக் கண்காணிப்பு பரவலாகப் பயன்படுத்தப்படும்போது, இயந்திரங்கள் உருவாக்கும் எச்சரிக்கைகள் பல மடங்கு அதிகரிக்கலாம். அடுத்தடுத்த முடிவுகளும் மேலும் தானியக்கமாகவோ நேர நெருக்கடியிலோ எடுக்கப்பட்டால், தவறான எச்சரிக்கைகள் உரிய ஆய்வுக்கு முன்பே காவல்துறை, எல்லைக் கட்டுப்பாடு, நுழைவு அமைப்புகள் மற்றும் பிற உயர் ஆபத்து நிறுவனங்கள் வழியாகப் பரவக்கூடும். AI கண்காணிப்பில் இரண்டாவது ஆபத்தும் உள்ளது: கேமராக்கள் ஒவ்வொரு வாகனத்தையும் ஒவ்வொரு முகத்தையும் பின்தொடர முடியும்போது, எல்லோரும் எப்போதும் கண்காணிக்கப்படுகிறார்கள்; ஒரே ஒரு தவறான பொருத்தம் ஒருவரை ஓர் அமைப்பிலிருந்து மற்றொன்றுக்குத் தொடர்ந்து செல்லக்கூடும்."}, "sv": {"title": "AI-fel vid skyltläsning ledde till ett stopp under vapenhot", "domain": "Polis", "hook": "en enda falsk träff", "real": "Ett **automatiskt system för skyltläsning** ska ha läst fel på ett fordons registreringsskylt, varefter polisen **stoppade föraren under vapenhot** innan felet upptäcktes.", "fake": "Ett AI-system som **uppskattar folkmängder utifrån drönarbilder** ska ha **tagit ett bröllopssällskap för en otillåten demonstration**, varefter kravallpolis skickades till platsen innan felet upptäcktes.", "excerpt": "Polisen i Toledo, Ohio, stoppade bilisten Brandon Upchurch under vapenhot efter att en skyltläsare från Flock Safety felaktigt matchat hans pickup mot en stulen registreringsskylt.", "explanation": "En automatisk skyltläsare matchade felaktigt en pickup mot en stulen registreringsskylt. Polisen stoppade föraren under vapenhot, släppte en polishund som bet honom och grep honom. Polisen sa senare att larmet var en felläsning; åtalet lades ned.", "whyBad": "Det avgörande är kopplingen mellan ett probabilistiskt igenkänningssystem och en institution med tvångsmakt. Igenkänningssystem har oundvikligen felfrekvenser; när ett larm behandlas som tillräckligt auktoritativt för att motivera ett högriskingripande kan även ett litet tekniskt fel få allvarliga fysiska och rättsliga följder. Det rapporterade misslyckandet omfattade också ett mänskligt kontrollsteg som inte utfördes korrekt.", "escalation": "Bredare användning av automatiserad övervakning kan ge många fler maskingenererade larm. Om även efterföljande beslut blir alltmer automatiserade eller fattas under tidspress kan falsklarm spridas genom polis, gränskontroll, passersystem och andra institutioner med höga insatser innan någon verklig granskning sker. AI-övervakning innebär också en andra fara: när kameror kan följa varje bil och varje ansikte är alla övervakade hela tiden, och en enda felaktig träff kan följa en människa från ett system till nästa."}, "tr": {"title": "Yapay zekânın plaka okuma hatası silah zoruyla durdurmaya yol açtı", "domain": "Polis", "hook": "tek bir yanlış eşleşme", "real": "Otomatik bir **plaka tanıma sisteminin** bir aracın plakasını yanlış okuduğu, ardından hata fark edilmeden önce polisin **sürücüyü silah doğrultarak durdurduğu** bildirildi.", "fake": "**Drone görüntülerinden kalabalık büyüklüğünü tahmin eden** bir yapay zekâ sisteminin **bir düğünü izinsiz gösteri olarak işaretlediği**, ardından hata fark edilmeden önce olay yerine çevik kuvvet gönderildiği bildirildi.", "excerpt": "Ohio eyaletinin Toledo kentinde polis, bir Flock Safety plaka okuyucusu kamyonetini yanlışlıkla çalıntı bir plakayla eşleştirdikten sonra sürücü Brandon Upchurch'ü silah doğrultarak durdurdu.", "explanation": "Otomatik bir plaka okuyucusu bir kamyoneti yanlışlıkla çalıntı bir plakayla eşleştirdi. Polis sürücüyü silah doğrultarak durdurdu, üzerine onu ısıran bir polis köpeği saldı ve onu tutukladı. Polis daha sonra uyarının bir okuma hatası olduğunu açıkladı; suçlamalar düşürüldü.", "whyBad": "Önemli olan, olasılığa dayalı bir tanıma sisteminin zor kullanma yetkisine sahip bir kurumla birleştirilmesidir. Tanıma sistemlerinin kaçınılmaz olarak hata oranları vardır; bir uyarı yüksek riskli bir müdahaleyi haklı çıkaracak kadar güvenilir sayıldığında, küçük bir teknik hata bile ciddi fiziksel ve hukuki sonuçlar doğurabilir. Bildirilen başarısızlıkta düzgün yapılmayan bir insan doğrulama adımı da vardı.", "escalation": "Otomatik gözetimin daha yaygın kullanımı, makinelerin ürettiği çok daha fazla uyarı doğurabilir. Sonraki kararlar da giderek otomatikleşir veya aceleyle alınırsa, yanlış pozitifler anlamlı bir inceleme yapılmadan önce polis, sınır kontrolü, giriş sistemleri ve diğer yüksek riskli kurumlar boyunca yayılabilir. Yapay zekâ gözetiminin ikinci bir tehlikesi daha var: Kameralar her aracı ve her yüzü izleyebildiğinde herkes sürekli gözetim altında olur ve tek bir yanlış eşleşme bir insanı bir sistemden diğerine takip edebilir."}}}, {"id": 1505, "url": "https://incidentdatabase.ai/cite/1505/", "building": "homes", "text": {"en": {"title": "AI-cloned voice used in a fake kidnapping", "domain": "Scams", "hook": "one cloned voice", "real": "Scammers reportedly used an **AI-cloned voice** in a **fake kidnapping call** and convinced a mother to send thousands of dollars.", "fake": "Scammers reportedly sent a mother who was away on holiday an **AI-generated video of her house on fire** and convinced her to pay thousands of dollars for an **emergency repair crew**.", "excerpt": "Deborah Del Mastro reportedly wired $5,400 to Mexico after scammers falsely claimed her daughter Sarah had been kidnapped", "explanation": "A woman received a call from scammers claiming they had kidnapped her daughter. They played what sounded like her daughter's panicked voice. She sent $5,400 before learning that her daughter was safe; AI had reportedly been used to mimic the voice.", "whyBad": "Social engineering normally depends on convincing a target that an attacker is someone they trust. Voice cloning makes one of the strongest intuitive identity signals cheap to imitate. This can increase both the credibility and emotional pressure of scams, especially when attackers combine synthetic media with personal information obtained from public sources or data leaks.", "escalation": "More capable systems can combine voice cloning, generated video, personal-data retrieval, and conversational agents. That could turn highly personalized scams from labor-intensive operations into partially automated campaigns targeting many people simultaneously."}, "fr": {"title": "Une voix clonée par IA utilisée dans un faux enlèvement", "domain": "Arnaques", "hook": "une seule voix clonée", "real": "Des escrocs auraient utilisé une **voix clonée par IA** lors d’un appel de **faux enlèvement** et convaincu une mère d’envoyer plusieurs milliers de dollars.", "fake": "Des escrocs auraient envoyé à une mère en vacances une **vidéo générée par IA montrant sa maison en feu** et l’auraient convaincue de payer plusieurs milliers de dollars pour une **équipe de réparation d’urgence**.", "excerpt": "Deborah Del Mastro aurait viré 5 400 $ vers le Mexique après que des escrocs ont faussement affirmé que sa fille Sarah avait été enlevée", "explanation": "Une femme a reçu un appel d’escrocs affirmant avoir enlevé sa fille. Ils lui ont fait entendre ce qui ressemblait à la voix paniquée de sa fille. Elle a envoyé 5 400 $ avant d’apprendre que sa fille était en sécurité ; l’IA aurait été utilisée pour imiter la voix.", "whyBad": "L’ingénierie sociale repose généralement sur le fait de convaincre une cible que l’attaquant est une personne de confiance. Le clonage vocal rend bon marché l’imitation de l’un des signaux d’identité les plus intuitifs. Cela peut accroître la crédibilité et la pression émotionnelle des arnaques, surtout lorsque les attaquants combinent médias synthétiques et informations personnelles issues de sources publiques ou de fuites de données.", "escalation": "Des systèmes plus performants pourraient combiner clonage vocal, vidéo générée, recherche de données personnelles et agents conversationnels. Des arnaques très personnalisées pourraient ainsi passer d’opérations artisanales à des campagnes en partie automatisées visant de nombreuses personnes simultanément."}, "de": {"title": "KI-geklonte Stimme bei vorgetäuschter Entführung", "domain": "Betrugsmaschen", "hook": "eine einzige geklonte Stimme", "real": "Betrüger sollen bei einem Anruf über eine **vorgetäuschte Entführung** eine **KI-geklonte Stimme** eingesetzt und eine Mutter dazu gebracht haben, mehrere Tausend Dollar zu schicken.", "fake": "Betrüger sollen einer Mutter im Urlaub ein **KI-generiertes Video ihres brennenden Hauses** geschickt und sie dazu gebracht haben, mehrere Tausend Dollar für einen **Notfall-Reparaturtrupp** zu zahlen.", "excerpt": "Deborah Del Mastro soll 5.400 $ nach Mexiko überwiesen haben, nachdem Betrüger fälschlich behauptet hatten, ihre Tochter Sarah sei entführt worden", "explanation": "Eine Frau erhielt einen Anruf von Betrügern, die behaupteten, ihre Tochter entführt zu haben. Sie spielten etwas vor, das wie die panische Stimme der Tochter klang. Sie schickte 5.400 $, bevor sie erfuhr, dass ihre Tochter in Sicherheit war; die Stimme soll mit KI nachgeahmt worden sein.", "whyBad": "Social Engineering beruht meist darauf, ein Opfer davon zu überzeugen, dass der Angreifer eine vertraute Person ist. Stimmklonen macht die Nachahmung eines der stärksten intuitiven Identitätsmerkmale billig. Das kann Glaubwürdigkeit und emotionalen Druck von Betrugsmaschen erhöhen, besonders wenn Angreifer synthetische Medien mit persönlichen Daten aus öffentlichen Quellen oder Datenlecks kombinieren.", "escalation": "Leistungsfähigere Systeme könnten Stimmklonen, generiertes Video, die Suche nach persönlichen Daten und Gesprächsagenten kombinieren. Hochgradig personalisierte Betrugsmaschen könnten so von arbeitsintensiver Handarbeit zu teilautomatisierten Kampagnen werden, die viele Menschen gleichzeitig ins Visier nehmen."}, "ru": {"title": "Клонированный ИИ голос в фальшивом похищении", "domain": "Мошенничество", "hook": "один клонированный голос", "real": "Мошенники, по имеющимся данным, использовали **клонированный с помощью ИИ голос** в звонке о **фальшивом похищении** и убедили мать отправить несколько тысяч долларов.", "fake": "Мошенники, по имеющимся данным, отправили матери, которая была в отпуске, **сгенерированное ИИ видео с пожаром в её доме** и убедили её заплатить несколько тысяч долларов за **срочную ремонтную бригаду**.", "excerpt": "Дебора Дель Мастро, по имеющимся данным, перевела $5 400 в Мексику после того, как мошенники ложно заявили, что её дочь Сара похищена", "explanation": "Женщине позвонили мошенники и заявили, что похитили её дочь. Они включили запись, звучавшую как панический голос дочери. Женщина отправила $5 400, прежде чем узнала, что дочь в безопасности; по сообщениям, голос был сымитирован с помощью ИИ.", "whyBad": "Социальная инженерия обычно строится на том, чтобы убедить жертву, что злоумышленник — человек, которому она доверяет. Клонирование голоса делает дешёвой имитацию одного из самых сильных интуитивных признаков личности. Это может повысить и правдоподобие, и эмоциональное давление мошенничества, особенно когда злоумышленники сочетают синтетические медиа с личными данными из открытых источников или утечек.", "escalation": "Более способные системы смогут сочетать клонирование голоса, генерацию видео, поиск персональных данных и диалоговых агентов. Это может превратить высокоперсонализированное мошенничество из трудоёмкой ручной работы в частично автоматизированные кампании, нацеленные одновременно на множество людей."}, "it": {"title": "Voce clonata con l’IA usata in un finto rapimento", "domain": "Truffe", "hook": "una sola voce clonata", "real": "Dei truffatori avrebbero usato una **voce clonata con l’IA** in una telefonata per un **finto rapimento** e convinto una madre a inviare migliaia di dollari.", "fake": "Dei truffatori avrebbero inviato a una madre in vacanza un **video generato dall’IA della sua casa in fiamme** e l’avrebbero convinta a pagare migliaia di dollari per una **squadra di riparazioni d’emergenza**.", "excerpt": "Deborah Del Mastro avrebbe inviato 5.400 $ in Messico dopo che dei truffatori avevano falsamente sostenuto che sua figlia Sarah era stata rapita", "explanation": "Una donna ha ricevuto una telefonata da truffatori che dicevano di aver rapito sua figlia. Le hanno fatto sentire quella che sembrava la voce terrorizzata della figlia. Ha inviato 5.400 $ prima di scoprire che la figlia era al sicuro; secondo quanto riferito, la voce era stata imitata con l’IA.", "whyBad": "L’ingegneria sociale si basa di solito sul convincere la vittima che l’aggressore sia qualcuno di cui si fida. La clonazione vocale rende economico imitare uno dei segnali di identità più intuitivi. Questo può aumentare credibilità e pressione emotiva delle truffe, soprattutto se gli aggressori combinano media sintetici e dati personali presi da fonti pubbliche o da fughe di dati.", "escalation": "Sistemi più capaci potrebbero combinare clonazione vocale, video generati, ricerca di dati personali e agenti conversazionali. Truffe altamente personalizzate potrebbero così passare da operazioni artigianali a campagne in parte automatizzate rivolte a molte persone contemporaneamente."}, "es": {"title": "Una voz clonada con IA en un secuestro falso", "domain": "Estafas", "hook": "una sola voz clonada", "real": "Según se informa, unos estafadores usaron una **voz clonada con IA** en una llamada de **secuestro falso** y convencieron a una madre de enviar miles de dólares.", "fake": "Según se informa, unos estafadores enviaron a una madre que estaba de vacaciones un **vídeo generado con IA de su casa en llamas** y la convencieron de pagar miles de dólares por una **cuadrilla de reparación de emergencia**.", "excerpt": "Según se informa, Deborah Del Mastro transfirió 5400 $ a México después de que unos estafadores afirmaran falsamente que su hija Sarah había sido secuestrada", "explanation": "Una mujer recibió una llamada de estafadores que afirmaban haber secuestrado a su hija. Le hicieron oír lo que parecía la voz aterrada de su hija. Envió 5400 $ antes de saber que su hija estaba a salvo; según se informa, la voz se imitó con IA.", "whyBad": "La ingeniería social suele depender de convencer a la víctima de que el atacante es alguien de confianza. La clonación de voz abarata la imitación de una de las señales de identidad más intuitivas. Esto puede aumentar la credibilidad y la presión emocional de las estafas, sobre todo cuando los atacantes combinan medios sintéticos con datos personales obtenidos de fuentes públicas o filtraciones.", "escalation": "Sistemas más capaces podrían combinar clonación de voz, vídeo generado, búsqueda de datos personales y agentes conversacionales. Eso podría convertir estafas muy personalizadas, hoy laboriosas, en campañas parcialmente automatizadas dirigidas a muchas personas a la vez."}, "ko": {"title": "가짜 납치 사기에 쓰인 AI 복제 음성", "domain": "사기", "hook": "복제된 목소리 하나", "real": "사기범들이 **가짜 납치 전화**에서 **AI로 복제한 목소리**를 사용해 한 어머니가 수천 달러를 보내도록 만든 것으로 알려졌다.", "fake": "사기범들이 휴가 중이던 한 어머니에게 **집이 불타는 AI 생성 영상**을 보내 **긴급 수리팀** 비용으로 수천 달러를 내도록 만든 것으로 알려졌다.", "excerpt": "데버라 델 마스트로는 사기범들이 딸 세라가 납치됐다고 거짓 주장한 뒤 멕시코로 5,400달러를 송금한 것으로 알려졌다", "explanation": "한 여성이 딸을 납치했다고 주장하는 사기범들의 전화를 받았다. 그들은 겁에 질린 딸의 목소리처럼 들리는 음성을 들려줬다. 그녀는 딸이 무사하다는 사실을 알기 전에 5,400달러를 보냈다. 목소리는 AI로 흉내 낸 것으로 알려졌다.", "whyBad": "사회공학 공격은 보통 공격자가 신뢰할 만한 사람이라고 피해자를 믿게 만드는 데 달려 있다. 음성 복제는 가장 강력한 직관적 신원 신호 가운데 하나를 싸게 흉내 낼 수 있게 한다. 특히 공격자가 합성 미디어를 공개 자료나 유출 데이터에서 얻은 개인정보와 결합하면 사기의 신빙성과 정서적 압박이 커질 수 있다.", "escalation": "더 유능한 시스템은 음성 복제, 생성 영상, 개인정보 검색, 대화형 에이전트를 결합할 수 있다. 그러면 노동 집약적이던 맞춤형 사기가 많은 사람을 동시에 노리는 부분 자동화된 캠페인으로 바뀔 수 있다."}, "zh": {"title": "AI 克隆声音被用于假绑架诈骗", "domain": "诈骗", "hook": "一个被克隆的声音", "real": "据报道，诈骗者在一通**假绑架电话**中使用了 **AI 克隆的声音**，说服一位母亲汇出数千美元。", "fake": "据报道，诈骗者向一位正在度假的母亲发送了一段 **AI 生成的她家房屋起火的视频**，说服她为“**紧急抢修队**”支付了数千美元。", "excerpt": "据报道，在诈骗者谎称她的女儿 Sarah 被绑架后，Deborah Del Mastro 向墨西哥汇出了 5400 美元", "explanation": "一名女性接到诈骗者的电话，对方声称绑架了她的女儿，并播放了听起来像女儿惊恐呼救的声音。她汇出 5400 美元后才得知女儿安然无恙；据报道，那个声音是用 AI 模仿的。", "whyBad": "社会工程攻击通常依赖于让目标相信攻击者是自己信任的人。声音克隆让模仿最直观的身份信号之一变得廉价。这可能提高诈骗的可信度和情绪压力，尤其当攻击者把合成媒体与从公开来源或数据泄露中获得的个人信息结合起来时。", "escalation": "能力更强的系统可以把声音克隆、生成视频、个人信息检索和对话智能体结合起来。这可能把高度个性化的诈骗从劳动密集型操作，变成同时针对大量人群的半自动化行动。"}, "sr": {"title": "Глас клониран помоћу ВИ у лажној отмици", "domain": "Преваре", "hook": "један клонирани глас", "real": "Преваранти су, како се наводи, у позиву о **лажној отмици** користили **глас клониран помоћу ВИ** и убедили мајку да пошаље неколико хиљада долара.", "fake": "Преваранти су, како се наводи, мајци која је била на одмору послали **видео генерисан помоћу ВИ на ком њена кућа гори** и убедили је да плати неколико хиљада долара за **хитну екипу за поправке**.", "excerpt": "Дебора Дел Мастро је, како се наводи, послала 5.400 долара у Мексико након што су преваранти лажно тврдили да је њена ћерка Сара отета", "explanation": "Жени су се јавили преваранти тврдећи да су јој отели ћерку. Пустили су јој нешто што је звучало као уплашени глас њене ћерке. Послала је 5.400 долара пре него што је сазнала да јој је ћерка безбедна; глас је, како се наводи, имитиран помоћу ВИ.", "whyBad": "Друштвени инжењеринг се обично ослања на то да се мета убеди да је нападач неко коме верује. Клонирање гласа чини јефтиним опонашање једног од најјачих интуитивних знакова идентитета. То може повећати уверљивост и емоционални притисак превара, нарочито када нападачи комбинују синтетичке медије са личним подацима из јавних извора или цурења података.", "escalation": "Способнији системи могли би да комбинују клонирање гласа, генерисани видео, претрагу личних података и конверзационе агенте. То би високо персонализоване преваре могло да претвори из радно захтевних операција у делимично аутоматизоване кампање које истовремено циљају многе људе."}, "bs": {"title": "Glas kloniran pomoću UI u lažnoj otmici", "domain": "Prevare", "hook": "jedan klonirani glas", "real": "Prevaranti su, kako se navodi, u pozivu o **lažnoj otmici** koristili **glas kloniran pomoću UI** i uvjerili majku da pošalje nekoliko hiljada dolara.", "fake": "Prevaranti su, kako se navodi, majci koja je bila na odmoru poslali **video generisan pomoću UI na kojem njena kuća gori** i uvjerili je da plati nekoliko hiljada dolara za **hitnu ekipu za popravke**.", "excerpt": "Deborah Del Mastro je, kako se navodi, poslala 5.400 dolara u Meksiko nakon što su prevaranti lažno tvrdili da je njena kćerka Sarah oteta", "explanation": "Ženi su se javili prevaranti tvrdeći da su joj oteli kćerku. Pustili su joj nešto što je zvučalo kao uplašeni glas njene kćerke. Poslala je 5.400 dolara prije nego što je saznala da joj je kćerka na sigurnom; glas je, kako se navodi, imitiran pomoću UI.", "whyBad": "Društveni inženjering se obično oslanja na to da se meta uvjeri da je napadač neko kome vjeruje. Kloniranje glasa čini jeftinim oponašanje jednog od najjačih intuitivnih znakova identiteta. To može povećati uvjerljivost i emocionalni pritisak prevara, naročito kada napadači kombinuju sintetičke medije s ličnim podacima iz javnih izvora ili curenja podataka.", "escalation": "Sposobniji sistemi mogli bi kombinovati kloniranje glasa, generisani video, pretragu ličnih podataka i konverzacijske agente. To bi visoko personalizovane prevare moglo pretvoriti iz radno zahtjevnih operacija u djelimično automatizovane kampanje koje istovremeno ciljaju mnoge ljude."}, "ro": {"title": "Voce clonată cu IA folosită într-o falsă răpire", "domain": "Escrocherii", "hook": "o singură voce clonată", "real": "Escrocii ar fi folosit o **voce clonată cu IA** într-un apel despre o **falsă răpire** și ar fi convins o mamă să trimită câteva mii de dolari.", "fake": "Escrocii i-ar fi trimis unei mame aflate în vacanță un **videoclip generat cu IA cu casa ei în flăcări** și ar fi convins-o să plătească câteva mii de dolari pentru o **echipă de reparații de urgență**.", "excerpt": "Deborah Del Mastro ar fi trimis 5.400 $ în Mexic după ce escrocii au susținut în mod fals că fiica ei, Sarah, fusese răpită", "explanation": "O femeie a primit un apel de la escroci care susțineau că i-au răpit fiica. I-au pus să asculte ceva ce suna ca vocea panicată a fiicei ei. A trimis 5.400 $ înainte să afle că fiica ei era în siguranță; potrivit relatărilor, vocea fusese imitată cu IA.", "whyBad": "Ingineria socială se bazează de obicei pe a convinge ținta că atacatorul este cineva de încredere. Clonarea vocii face ieftină imitarea unuia dintre cele mai intuitive semnale de identitate. Asta poate crește credibilitatea și presiunea emoțională a escrocheriilor, mai ales când atacatorii combină media sintetică cu date personale din surse publice sau scurgeri de date.", "escalation": "Sisteme mai capabile ar putea combina clonarea vocii, video generat, căutarea de date personale și agenți conversaționali. Asta ar putea transforma escrocheriile foarte personalizate din operațiuni laborioase în campanii parțial automatizate care vizează simultan multe persoane."}, "vi": {"title": "Giọng nói nhân bản bằng AI trong một vụ bắt cóc giả", "domain": "Lừa đảo", "hook": "một giọng nói bị sao chép", "real": "Những kẻ lừa đảo được cho là đã dùng **giọng nói nhân bản bằng AI** trong một cuộc gọi **bắt cóc giả** và thuyết phục một người mẹ gửi vài nghìn đô la.", "fake": "Những kẻ lừa đảo được cho là đã gửi cho một người mẹ đang đi nghỉ một **video do AI tạo ra về cảnh nhà bà bốc cháy** và thuyết phục bà trả vài nghìn đô la cho một **đội sửa chữa khẩn cấp**.", "excerpt": "Deborah Del Mastro được cho là đã chuyển 5.400 USD sang Mexico sau khi những kẻ lừa đảo nói dối rằng con gái bà, Sarah, đã bị bắt cóc", "explanation": "Một phụ nữ nhận cuộc gọi từ những kẻ lừa đảo tuyên bố đã bắt cóc con gái bà. Chúng mở một đoạn âm thanh nghe như giọng hoảng loạn của con gái bà. Bà đã gửi 5.400 USD trước khi biết con gái mình vẫn an toàn; theo báo cáo, giọng nói đã được giả lập bằng AI.", "whyBad": "Tấn công phi kỹ thuật (social engineering) thường dựa vào việc thuyết phục nạn nhân rằng kẻ tấn công là người họ tin tưởng. Nhân bản giọng nói khiến việc bắt chước một trong những tín hiệu nhận dạng trực giác mạnh nhất trở nên rẻ. Điều này có thể làm tăng độ tin cậy và áp lực cảm xúc của các vụ lừa đảo, nhất là khi kẻ tấn công kết hợp nội dung tổng hợp với thông tin cá nhân lấy từ nguồn công khai hoặc dữ liệu bị rò rỉ.", "escalation": "Các hệ thống mạnh hơn có thể kết hợp nhân bản giọng nói, video tạo sinh, tra cứu dữ liệu cá nhân và tác tử hội thoại. Điều đó có thể biến các vụ lừa đảo cá nhân hóa cao từ những hoạt động tốn nhiều công sức thành các chiến dịch bán tự động nhắm vào nhiều người cùng lúc."}, "uk": {"title": "Клонований ШІ голос у фальшивому викраденні", "domain": "Шахрайство", "hook": "один клонований голос", "real": "Шахраї, за наявними даними, використали **клонований за допомогою ШІ голос** у дзвінку про **фальшиве викрадення** й переконали матір надіслати кілька тисяч доларів.", "fake": "Шахраї, за наявними даними, надіслали матері, яка була у відпустці, **згенероване ШІ відео з пожежею в її будинку** й переконали її заплатити кілька тисяч доларів за **термінову ремонтну бригаду**.", "excerpt": "Дебора Дель Мастро, за наявними даними, переказала $5 400 до Мексики після того, як шахраї неправдиво заявили, що її доньку Сару викрадено", "explanation": "Жінці зателефонували шахраї й заявили, що викрали її доньку. Вони ввімкнули запис, що звучав як панічний голос доньки. Жінка надіслала $5 400, перш ніж дізналася, що донька в безпеці; як повідомляється, голос було зімітовано за допомогою ШІ.", "whyBad": "Соціальна інженерія зазвичай будується на тому, щоб переконати жертву, що зловмисник — людина, якій вона довіряє. Клонування голосу робить дешевою імітацію однієї з найсильніших інтуїтивних ознак особи. Це може підвищити правдоподібність і емоційний тиск шахрайства, особливо коли зловмисники поєднують синтетичні медіа з особистими даними з відкритих джерел або витоків.", "escalation": "Здібніші системи зможуть поєднувати клонування голосу, генерацію відео, пошук персональних даних і діалогових агентів. Це може перетворити високоперсоналізоване шахрайство з трудомісткої ручної роботи на частково автоматизовані кампанії, націлені одночасно на безліч людей."}, "pl": {"title": "Głos sklonowany przez AI użyty w fałszywym porwaniu", "domain": "Oszustwa", "hook": "jeden sklonowany głos", "real": "Oszuści mieli użyć **głosu sklonowanego przez AI** w rozmowie o **fałszywym porwaniu** i nakłonić matkę do wysłania kilku tysięcy dolarów.", "fake": "Oszuści mieli wysłać matce przebywającej na urlopie **wygenerowane przez AI nagranie jej płonącego domu** i nakłonić ją do zapłacenia kilku tysięcy dolarów za **ekipę do pilnych napraw**.", "excerpt": "Deborah Del Mastro miała przelać 5400 dolarów do Meksyku po tym, jak oszuści fałszywie twierdzili, że jej córka Sarah została porwana", "explanation": "Kobieta odebrała telefon od oszustów, którzy twierdzili, że porwali jej córkę. Odtworzyli coś, co brzmiało jak przerażony głos jej córki. Wysłała 5400 dolarów, zanim dowiedziała się, że córka jest bezpieczna; głos miał zostać podrobiony przy użyciu AI.", "whyBad": "Socjotechnika zwykle polega na przekonaniu ofiary, że napastnik jest kimś, komu ufa. Klonowanie głosu sprawia, że podrobienie jednego z najsilniejszych intuicyjnych sygnałów tożsamości staje się tanie. Może to zwiększać wiarygodność oszustw i presję emocjonalną, zwłaszcza gdy sprawcy łączą syntetyczne media z danymi osobowymi z publicznych źródeł lub wycieków.", "escalation": "Bardziej zdolne systemy mogą łączyć klonowanie głosu, generowane wideo, wyszukiwanie danych osobowych i agentów konwersacyjnych. Mogłoby to zmienić mocno spersonalizowane oszustwa z pracochłonnych operacji w częściowo zautomatyzowane kampanie wymierzone w wiele osób jednocześnie."}, "ta": {"title": "போலிக் கடத்தலில் AI மூலம் நகலெடுக்கப்பட்ட குரல்", "domain": "மோசடிகள்", "hook": "நகலெடுக்கப்பட்ட ஒரு குரல்", "real": "மோசடிக்காரர்கள் ஒரு **போலிக் கடத்தல் அழைப்பில்** **AI மூலம் நகலெடுக்கப்பட்ட குரலைப்** பயன்படுத்தி, ஒரு தாயைப் பல ஆயிரம் டாலர் அனுப்ப வைத்ததாகக் கூறப்படுகிறது.", "fake": "விடுமுறையில் இருந்த ஒரு தாய்க்கு, அவரது **வீடு தீப்பற்றி எரிவது போன்ற AI உருவாக்கிய வீடியோவை** மோசடிக்காரர்கள் அனுப்பி, **அவசரப் பழுதுபார்ப்புக் குழுவுக்காகப்** பல ஆயிரம் டாலர் செலுத்த வைத்ததாகக் கூறப்படுகிறது.", "excerpt": "தனது மகள் சாரா கடத்தப்பட்டதாக மோசடிக்காரர்கள் பொய்யாகக் கூறியதைத் தொடர்ந்து, டெபோரா டெல் மாஸ்ட்ரோ மெக்சிகோவுக்கு 5,400 டாலர் அனுப்பியதாகக் கூறப்படுகிறது", "explanation": "தன் மகளைக் கடத்தியதாகக் கூறிய மோசடிக்காரர்களிடமிருந
