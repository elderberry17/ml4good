<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="You are the mayor. Spot the real AI incident behind each building of your city, or watch it get hit.">
<meta property="og:title" content="Incident or Fiction?">
<meta property="og:description" content="A city game about AI safety, built on real cases from the AI Incident Database.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Incident or Fiction?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the city map on the left (sticky on wide screens), the round on the right.
   Each round zooms into one building; the record and a dark "what if" band unfold below the reports. */
:root {
  --bg: #ECEFEC;
  --surface: #F8FAF8;
  --ink: #141D1B;
  --muted: #586561;
  --line: #D2D9D5;
  --accent: #2E46C8;
  --accent-ink: #FFFFFF;
  --real: #1C7556;
  --real-soft: #DCEFE6;
  --fake: #B24F27;
  --fake-soft: #F6E3D9;
  --night: #0C1120;
  --night-2: #151C33;
  --night-ink: #E4E8F4;
  --night-muted: #9AA3C0;
  --ember: #FF8A5B;
  --shadow: 0 1px 2px rgb(20 29 27 / .06), 0 8px 24px -12px rgb(20 29 27 / .18);

  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-ui-base: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ui: var(--f-ui-base);
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1312; --surface: #161D1B; --ink: #E5EBE8; --muted: #93A09B; --line: #29322F;
    --accent: #93A4FF; --accent-ink: #0E1312;
    --real: #5CC7A0; --real-soft: #15302A; --fake: #F08C62; --fake-soft: #3A2118;
    --night: #070A14; --night-2: #10162A; --night-ink: #E4E8F4; --night-muted: #9AA3C0;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px -12px rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1312; --surface: #161D1B; --ink: #E5EBE8; --muted: #93A09B; --line: #29322F;
  --accent: #93A4FF; --accent-ink: #0E1312;
  --real: #5CC7A0; --real-soft: #15302A; --fake: #F08C62; --fake-soft: #3A2118;
  --night: #070A14; --night-2: #10162A; --night-ink: #E4E8F4; --night-muted: #9AA3C0;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px -12px rgb(0 0 0 / .6);
  color-scheme: dark;
}

/* Per-script faces. Newsreader has no Cyrillic, Hangul, Han or Devanagari.
   Extra faces are loaded on demand by ensureFonts(). */
:root:is([lang="ru"], [lang="uk"], [lang="sr"]) { --f-display: "Literata", "PT Serif", Georgia, serif; }
:root[lang="vi"] { --f-ui: "Be Vietnam Pro", var(--f-ui-base); }
:root[lang="ko"] { --f-display: "Noto Serif KR", serif; --f-ui: "Noto Sans KR", var(--f-ui-base); }
:root[lang="zh"] { --f-display: "Noto Serif SC", serif; --f-ui: "Noto Sans SC", var(--f-ui-base); }
:root[lang="hi"] { --f-display: "Noto Serif Devanagari", serif; --f-ui: "Noto Sans Devanagari", var(--f-ui-base); }
:root[lang="ta"] { --f-display: "Noto Serif Tamil", serif; --f-ui: "Noto Sans Tamil", var(--f-ui-base); }
/* Italic and uppercase mean nothing in these scripts */
:root:is([lang="ko"], [lang="zh"], [lang="hi"], [lang="ta"]) .round-head h1 em { font-style: normal; }

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.6 var(--f-ui);
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 20px 72px;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.mono { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .04em; }
.eyebrow {
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
}

/* Header */
header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  flex-wrap: wrap; padding-block: 8px 28px;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font: 600 1.15rem/1 var(--f-display); letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: .8rem; }
.track { display: flex; gap: 6px; align-items: center; }
.track i {
  width: 22px; height: 6px; border-radius: 3px; background: var(--line);
  transition: background .3s;
}
.track i.now { background: var(--ink); }
.track i.ok { background: var(--real); }
.track i.no { background: var(--fake); }
.score { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 8px; }
.top-right { display: flex; align-items: center; gap: 14px; min-width: 0; }
@media (max-width: 560px) {
  .brand span { display: none; }
  .track { gap: 3px; } .track i { width: 10px; }
}

/* Language switcher: globe button + popover */
.settings { position: relative; }
.globe {
  height: 36px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  padding: 0 12px 0 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em;
  transition: color .2s, border-color .2s;
}
.globe:hover, .globe[aria-expanded="true"] { color: var(--ink); border-color: var(--ink); }
.globe svg { width: 17px; height: 17px; flex: none; }
.flag {
  width: 20px; height: 14px; flex: none; display: block; border-radius: 3px; overflow: hidden;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent);
}
.menu {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 10;
  width: min(360px, calc(100vw - 32px)); max-height: min(72vh, 560px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  padding: 8px;
}
.menu .eyebrow { padding: 6px 10px 6px; }
.lang-group { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.lang-group + .lang-group { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
.menu label {
  position: relative; display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: 0;
  padding: 8px 10px; border-radius: 8px; font: 500 .9rem/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.menu label:hover { background: color-mix(in srgb, var(--bg) 70%, var(--surface)); }
.menu label:has(input:checked) { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.menu label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.menu label .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu label .code { font-family: var(--f-mono); font-size: .66rem; color: var(--muted); }
.menu input { position: absolute; opacity: 0; pointer-events: none; }
@media (max-width: 380px) { .lang-group { grid-template-columns: 1fr; } }

/* Round head */
.round-head { display: grid; gap: 8px; margin-bottom: 24px; }
.round-head h1 {
  font: 500 clamp(1.6rem, 3.2vw, 2.2rem)/1.14 var(--f-display);
  letter-spacing: -.02em; margin: 0; text-wrap: balance;
}
.round-head h1 em { font-style: italic; color: var(--accent); }

/* The face-off */
.pair { display: grid; grid-template-columns: 1fr; gap: 14px; position: relative; }
.card {
  position: relative; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: 18px; min-width: 0;
  padding: 24px 24px 20px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow);
  transition: transform .2s ease, border-color .2s, box-shadow .2s, opacity .3s;
}
.card:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--accent); }
.card:disabled { cursor: default; }
.card .label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .letter {
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.card .key {
  font-family: var(--f-mono); font-size: .7rem; color: var(--muted);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px;
}
.card p.stmt {
  margin: 0; font: 400 clamp(1.15rem, 2.2vw, 1.32rem)/1.45 var(--f-display); text-wrap: pretty;
}
.card p.stmt strong { font-weight: 600; background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 3px; padding: 0 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.revealed .card p.stmt strong { background: none; }
.card .cta {
  margin-top: auto; font-weight: 600; font-size: .88rem; color: var(--accent);
  display: inline-flex; gap: 6px; align-items: center;
}
.card .stamp {
  margin-top: auto; display: none; align-items: center; gap: 8px; flex-wrap: wrap;
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
  padding: 6px 10px; border-radius: 6px; width: fit-content;
}
.revealed .card .cta { display: none; }
.revealed .card .stamp { display: inline-flex; }
.revealed .card.is-real { border-color: var(--real); }
.revealed .card.is-real .stamp { background: var(--real-soft); color: var(--real); }
.revealed .card.is-fake { opacity: .78; }
.revealed .card.is-fake .stamp { background: var(--fake-soft); color: var(--fake); }
.revealed .card.is-fake p.stmt { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--fake) 55%, transparent); text-decoration-thickness: 1px; }
.card .picked {
  position: absolute; top: -11px; right: 18px; display: none;
  font-family: var(--f-mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase;
  background: var(--ink); color: var(--bg); padding: 3px 8px; border-radius: 4px;
}
.revealed .card.chosen .picked { display: block; }

/* Verdict + record */
.reveal { display: grid; gap: 20px; margin-top: 28px; animation: rise .5s ease both; }
@keyframes rise { from { transform: translateY(10px); opacity: .001; } to { transform: none; opacity: 1; } }
.verdict { display: flex; gap: 14px; align-items: center; }
.verdict .dot {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; color: var(--accent-ink);
}
.verdict.ok .dot { background: var(--real); }
.verdict.no .dot { background: var(--fake); }
.verdict h2 { margin: 0; font: 500 1.4rem/1.2 var(--f-display); }
.verdict p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }

.record {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 28px; display: grid; gap: 18px;
}
@media (max-width: 520px) { .record { padding: 20px; } }
.record-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.record h3 { margin: 0; font: 600 1.35rem/1.25 var(--f-display); text-wrap: balance; }
.record .body { margin: 0; max-width: 66ch; font-size: 1.02rem; }
blockquote.src {
  margin: 0; padding: 14px 18px; border-left: 3px solid var(--line);
  background: color-mix(in srgb, var(--bg) 60%, var(--surface));
  border-radius: 0 8px 8px 0; display: grid; gap: 6px;
}
blockquote.src p { margin: 0; font: italic 400 1.05rem/1.5 var(--f-display); }
blockquote.src cite { font-style: normal; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: .92rem;
  text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  transition: background .2s, border-color .2s, transform .15s;
}
.btn:hover { border-color: var(--ink); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost-night { background: transparent; color: var(--night-ink); border-color: rgb(255 255 255 / .25); }
.btn.ghost-night:hover { border-color: var(--night-ink); }
.btn.solid-night { background: var(--night-ink); color: var(--night); border-color: var(--night-ink); }

details.why { border-top: 1px solid var(--line); padding-top: 14px; }
details.why summary { cursor: pointer; font-weight: 600; font-size: .92rem; list-style: none; display: flex; gap: 8px; align-items: center; }
details.why summary::-webkit-details-marker { display: none; }
details.why summary::before { content: "+"; font-family: var(--f-mono); color: var(--muted); width: 1ch; }
details.why[open] summary::before { content: "–"; }
details.why p { margin: 10px 0 0; max-width: 66ch; color: var(--muted); }

/* The "what if" band: the one dramatic moment */
.whatif-cta {
  display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 22px 24px; border-radius: var(--r);
  background: var(--night); color: var(--night-ink);
}
.whatif-cta p { margin: 0; font: 500 1.2rem/1.3 var(--f-display); }
.whatif-cta p span { display: block; font: 400 .85rem/1.4 var(--f-ui); color: var(--night-muted); margin-top: 4px; }

.whatif {
  position: relative; overflow: hidden; border-radius: var(--r);
  background: linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
  color: var(--night-ink);
  animation: rise .6s ease both;
}
.whatif canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.whatif .inner {
  position: relative; padding: clamp(28px, 5vw, 56px); display: grid; gap: 22px;
}
.whatif .eyebrow { color: var(--night-muted); }
.whatif h3 {
  margin: 0; font: 500 clamp(1.6rem, 3.6vw, 2.3rem)/1.15 var(--f-display); letter-spacing: -.015em;
  max-width: 22ch; text-wrap: balance;
}
.whatif .steps { display: grid; gap: 14px; max-width: 62ch; margin: 0; padding: 0; list-style: none; }
.whatif .steps li {
  display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start;
  font: 400 1.12rem/1.55 var(--f-display); color: var(--night-ink);
  animation: rise .7s ease both;
}
.whatif .steps li::before {
  content: ""; width: 9px; height: 9px; margin-top: .6em; border-radius: 50%;
  background: var(--night-muted); box-shadow: 0 0 0 4px color-mix(in srgb, var(--night-muted) 22%, transparent);
}
.whatif .note { font-size: .8rem; color: var(--night-muted); max-width: 62ch; margin: 0; }

/* End screen */
.end { display: grid; gap: 28px; }
.end .big { font: 500 clamp(3.5rem, 12vw, 6rem)/1 var(--f-display); letter-spacing: -.03em; margin: 0; font-variant-numeric: tabular-nums; }
.end .big small { font-size: .35em; color: var(--muted); letter-spacing: 0; }
.end h1 { margin: 0; font: 500 clamp(1.6rem, 4vw, 2.3rem)/1.15 var(--f-display); text-wrap: balance; max-width: 26ch; }
.end p.lead { margin: 0; max-width: 60ch; color: var(--muted); }
.ledger { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ledger li {
  display: grid; grid-template-columns: 18px 1fr auto; gap: 14px; align-items: baseline;
  padding: 14px 2px; border-bottom: 1px solid var(--line);
}
.ledger .m { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.ledger .m.ok { background: var(--real); }
.ledger .m.no { background: var(--fake); }
.ledger .t { min-width: 0; }
.ledger .t b { font-weight: 600; display: block; }
.ledger .t span { color: var(--muted); font-size: .85rem; }
.ledger a { font-family: var(--f-mono); font-size: .75rem; white-space: nowrap; }

footer.foot { margin-top: 48px; color: var(--muted); font-size: .8rem; max-width: 70ch; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- City map ---------- */
/* Map palette: daytime in light theme, night in dark theme (windows glow). */
:root {
  --m-sky: #DCEBEF; --m-sky-2: #EAF3F2;
  --m-water: #A6D3E0; --m-wave: rgb(255 255 255 / .6);
  --m-grass: #C9E2B1; --m-block: #BCD9A1; --m-side1: #9DBF86; --m-side2: #86AC70; --m-soil: #B39572;
  --m-road: #C9C7C1; --m-road-line: #FFFFFF;
  --m-tree: #79B162; --m-tree-2: #5F9A4F; --m-trunk: #8B6B4E;
  --m-win: #D3E9F4; --m-win-lit: #FFD27A; --m-win-off: #4A4F55;
  --m-bldg-filter: none; --m-smoke: #6E7378;
  --warn: #D08A12;
  --m-sand: #EFE2BC; --m-sand-2: #D9C797; --m-shallow: #BDE3EA; --m-walk: #F1EEE6; --m-pond: #8FCBE2; --m-path: #E6DCC0;
  --m-zebra: #FFFFFF; --m-cloud: #FFFFFF; --m-cloud-o: .5; --m-lamp: #F7E3A1; --m-shadow-o: .13;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --m-sky: #0F1820; --m-sky-2: #15222C;
    --m-water: #1B3243; --m-wave: rgb(255 255 255 / .14);
    --m-grass: #2E4936; --m-block: #2A4331; --m-side1: #213628; --m-side2: #1B2E22; --m-soil: #3A2F25;
    --m-road: #394146; --m-road-line: #6A7379;
    --m-tree: #3F6E46; --m-tree-2: #325A39; --m-trunk: #5A4636;
    --m-win: #3B4F62; --m-win-lit: #FFC861; --m-win-off: #1E2226;
    --m-bldg-filter: brightness(.74) saturate(.85); --m-smoke: #A3A9AE; --warn: #F2B84B;
    --m-sand: #5B5540; --m-sand-2: #474230; --m-shallow: #23445A; --m-walk: #4A5258; --m-pond: #2A5570; --m-path: #56513F;
    --m-zebra: #7C858B; --m-cloud: #9FB2C4; --m-cloud-o: .16; --m-lamp: #FFD166; --m-shadow-o: .3;
  }
}
:root[data-theme="dark"] {
  --m-sky: #0F1820; --m-sky-2: #15222C;
  --m-water: #1B3243; --m-wave: rgb(255 255 255 / .14);
  --m-grass: #2E4936; --m-block: #2A4331; --m-side1: #213628; --m-side2: #1B2E22; --m-soil: #3A2F25;
  --m-road: #394146; --m-road-line: #6A7379;
  --m-tree: #3F6E46; --m-tree-2: #325A39; --m-trunk: #5A4636;
  --m-win: #3B4F62; --m-win-lit: #FFC861; --m-win-off: #1E2226;
  --m-bldg-filter: brightness(.74) saturate(.85); --m-smoke: #A3A9AE; --warn: #F2B84B;
    --m-sand: #5B5540; --m-sand-2: #474230; --m-shallow: #23445A; --m-walk: #4A5258; --m-pond: #2A5570; --m-path: #56513F;
    --m-zebra: #7C858B; --m-cloud: #9FB2C4; --m-cloud-o: .16; --m-lamp: #FFD166; --m-shadow-o: .3;
}

.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 960px) {
  .stage { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 36px; align-items: start; }
  .map-pane { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  .map { height: min(80vh, 660px) !important; }
}
.map {
  position: relative; height: clamp(250px, 64vw, 400px); border-radius: 20px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 35%, var(--m-sky-2), var(--m-sky));
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
#city { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.map-caption {
  position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 24px);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 7px 14px; border-radius: 999px; font-size: .84rem; font-weight: 600;
  background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(6px);

என்பதை நிறுவனம் பின்னர் கண்டறிந்தது.", "whyBad": "தொலைநிலைப் பணி ஓர் எளிய அனுமானத்தின் மீது நிற்கிறது: தெரிந்த ஒருவரைப் பார்த்தாலோ கேட்டாலோ, அது உண்மையில் அவர்தான். AI உருவாக்கும் குரலும் காணொளியும் நம்பத்தகுந்த ஆள்மாறாட்டத்தை மலிவாக்குகின்றன. பல நிறுவனங்கள் இரண்டாவது சரிபார்ப்பு இல்லாமல் ஒரு குரலையோ காணொளி அழைப்பையோ இன்னும் நம்புகின்றன. தீங்கு இரு பக்கங்களிலிருந்து வருகிறது: மேம்பட்ட போலிகள், அவற்றை எதிர்கொள்ள வடிவமைக்கப்படாத ஒப்புதல் நடைமுறைகள்.", "escalation": "நிகழ்நேரப் போலிக் குரலும் காணொளியும் மேலும் மலிவாகவும், தனிநபருக்கு ஏற்றவாறும், தானியக்கமாக்க எளிதாகவும் மாறக்கூடும். ஆள்மாறாட்டத் தாக்குதல்கள் மேலும் சிறப்பாகவும் அடிக்கடியும் நிகழக்கூடும். குரலை அடையாளம் காண்பது போன்ற முறைசாரா அடையாளச் சரிபார்ப்புகள் மேலும் மேலும் நம்பகமற்றவையாகிவிடும்."}, "sv": {"title": "Deepfake-direktör ledde till överföring på 1,1 miljoner dollar", "domain": "Företagsbedrägeri", "hook": "en enda falsk direktör", "real": "Bedragare ska ha **utgett sig för att vara en företagsdirektör med hjälp av deepfake-metoder** och fått en anställd att föra över omkring 1,1 miljoner dollar.", "fake": "Bedragare ska ha använt AI för att ta fram en **falsk revisionsrapport** i en välkänd revisionsbyrås namn. De fick en anställd att föra över omkring 900 000 dollar som en **förfallen skattebetalning**.", "excerpt": "Starmangalsutra Private Limited ska ha förlorat 10,70 crore rupier efter att okända aktörer tagit sig in i företagets enheter och använt påstådda deepfake-metoder för att utge sig för att vara en direktör.", "explanation": "Angripare ska ha tagit sig in i företagets enheter och använt det som beskrevs som deepfake-metoder för att utge sig för att vara en direktör. En anställd trodde att instruktionerna var äkta och förde över omkring 1,1 miljoner dollar. Företaget fann senare att direktören aldrig hade gett dem.", "whyBad": "Distansarbete vilar på ett enkelt antagande: om du ser eller hör en person du känner, så är det verkligen den personen. AI-genererad röst och video gör övertygande imitationer billiga. Många företag litar fortfarande på en röst eller ett videosamtal utan en andra kontroll. Skadan kommer från två håll: bättre förfalskningar och godkännanderutiner som inte byggdes för dem.", "escalation": "Falsk röst och video i realtid kan bli billigare, mer personligt anpassade och lättare att automatisera. Attacker med falsk identitet kan bli både bättre och vanligare. Informella identitetskontroller, som att känna igen en röst, skulle bli allt mindre pålitliga."}, "tr": {"title": "Deepfake yönetici 1,1 milyon dolarlık transfere yol açtı", "domain": "Kurumsal dolandırıcılık", "hook": "tek bir sahte yönetici", "real": "Dolandırıcıların **deepfake yöntemleriyle bir şirket yöneticisinin kimliğine büründüğü** ve bir çalışanı yaklaşık 1,1 milyon dolar havale etmeye ikna ettiği bildirildi.", "fake": "Dolandırıcıların yapay zekâ kullanarak tanınmış bir muhasebe firması adına **sahte bir denetim raporu** hazırladığı bildirildi. Bir çalışanı **gecikmiş vergi ödemesi** olarak yaklaşık 900.000 dolar havale etmeye ikna ettiler.", "excerpt": "Starmangalsutra Private Limited'in, kimliği belirsiz kişilerin şirket cihazlarını ele geçirip bir yöneticiyi taklit etmek için iddia edilen deepfake yöntemleri kullanmasının ardından 10,70 crore rupi kaybettiği bildirildi.", "explanation": "Saldırganların şirket cihazlarına sızdığı ve bir yöneticinin kimliğine bürünmek için deepfake olarak tanımlanan yöntemler kullandığı bildirildi. Bir çalışan talimatların gerçek olduğuna inandı ve yaklaşık 1,1 milyon dolar havale etti. Şirket daha sonra yöneticinin bu talimatları hiç vermediğini tespit etti.", "whyBad": "Uzaktan çalışma basit bir varsayıma dayanır: tanıdığınız birini görüyor veya duyuyorsanız, o gerçekten odur. Yapay zekâyla üretilen ses ve video, inandırıcı taklitleri ucuzlatıyor. Birçok şirket hâlâ ikinci bir kontrol olmadan bir sese veya görüntülü aramaya güveniyor. Zarar iki taraftan geliyor: daha iyi sahteler ve bunlar düşünülerek tasarlanmamış onay süreçleri.", "escalation": "Gerçek zamanlı sahte ses ve video daha ucuz, daha kişiye özel ve otomatikleştirmesi daha kolay hâle gelebilir. Kimliğe bürünme saldırıları hem daha iyi hem daha sık olabilir. Bir sesi tanımak gibi gayriresmî kimlik kontrolleri giderek daha az güvenilir olur."}}}, {"id": 1717, "url": "https://incidentdatabase.ai/cite/1717/", "building": "police", "text": {"en": {"title": "License-plate AI error led to an armed police stop", "domain": "Policing", "hook": "one false match", "real": "An automated **license-plate reader** reportedly misread a vehicle's plate. Police then **stopped the driver at gunpoint** before the mistake was found.", "fake": "An AI system that **estimates crowd sizes from drone footage** reportedly mistook a **wedding party for an unauthorized protest**. Riot police were sent before the mistake was found.", "excerpt": "Toledo, Ohio, police stopped motorist Brandon Upchurch at gunpoint after a Flock Safety license-plate reader incorrectly matched his truck to a stolen plate.", "explanation": "An automated plate reader wrongly matched a truck to a stolen plate. Police stopped the driver at gunpoint, released a police dog that bit him, and arrested him. Police later said the alert was a misread. The charges were dropped.", "whyBad": "Recognition systems always make some mistakes. The danger comes when an alert is trusted enough to justify force. Then even a small technical error can end in injury or arrest. In this case the alert was also supposed to be checked by a person, and that check was reportedly not done properly.", "escalation": "As automated surveillance spreads, machines produce far more alerts. If the decisions that follow are also automated or rushed, false alarms can pass through police, border control and other powerful institutions before anyone checks them. AI surveillance has a second danger. When cameras can track every car and every face, everyone is watched all the time, and one wrong match can follow a person from system to system."}, "fr": {"title": "Une erreur de lecture de plaque par l’IA a mené à un contrôle sous la menace d’une arme", "domain": "Police", "hook": "une seule fausse correspondance", "real": "Un **lecteur automatique de plaques** aurait mal lu la plaque d’un véhicule. La police a alors **arrêté le conducteur sous la menace d’une arme** avant que l’erreur ne soit découverte.", "fake": "Un système d’IA qui **estime la taille des foules à partir d’images de drone** aurait pris une **fête de mariage pour une manifestation non autorisée**. Des policiers antiémeute ont été envoyés avant que l’erreur ne soit découverte.", "excerpt": "La police de Toledo, dans l’Ohio, a arrêté l’automobiliste Brandon Upchurch sous la menace d’une arme après qu’un lecteur de plaques Flock Safety a associé à tort son pick-up à une plaque volée.", "explanation": "Un lecteur automatique de plaques a associé à tort un pick-up à une plaque volée. La police a arrêté le conducteur sous la menace d’une arme, lâché un chien qui l’a mordu, puis l’a placé en état d’arrestation. La police a ensuite reconnu une erreur de lecture. Les charges ont été abandonnées.", "whyBad": "Les systèmes de reconnaissance font toujours quelques erreurs. Le danger apparaît quand on fait assez confiance à une alerte pour justifier l’usage de la force. Une petite erreur technique peut alors se terminer par une blessure ou une arrestation. Dans ce cas, l’alerte devait aussi être vérifiée par une personne, et cette vérification n’aurait pas été faite correctement.", "escalation": "Plus la surveillance automatisée se répand, plus les machines produisent d’alertes. Si les décisions qui suivent sont elles aussi automatisées ou prises dans l’urgence, les fausses alertes peuvent traverser la police, le contrôle aux frontières et d’autres institutions puissantes avant que quelqu’un ne les vérifie. La surveillance par IA comporte un second danger. Quand des caméras peuvent suivre chaque voiture et chaque visage, tout le monde est observé en permanence, et une seule fausse correspondance peut suivre une personne d’un système à l’autre."}, "de": {"title": "KI-Fehler beim Kennzeichenlesen führte zu Polizeikontrolle mit gezogener Waffe", "domain": "Polizei", "hook": "ein einziger falscher Treffer", "real": "Ein automatisches **Kennzeichen-Lesegerät** soll das Kennzeichen eines Fahrzeugs falsch gelesen haben. Die Polizei **stoppte den Fahrer daraufhin mit vorgehaltener Waffe**, bevor der Fehler entdeckt wurde.", "fake": "Ein KI-System, das **anhand von Drohnenaufnahmen die Größe von Menschenmengen schätzt**, soll eine **Hochzeitsgesellschaft für eine nicht genehmigte Demonstration** gehalten haben. Bereitschaftspolizei wurde geschickt, bevor der Fehler entdeckt wurde.", "excerpt": "Die Polizei in Toledo, Ohio, stoppte den Autofahrer Brandon Upchurch mit vorgehaltener Waffe, nachdem ein Kennzeichenleser von Flock Safety seinen Pick-up fälschlich einem gestohlenen Kennzeichen zugeordnet hatte.", "explanation": "Ein automatischer Kennzeichenleser ordnete einen Pick-up fälschlich einem gestohlenen Kennzeichen zu. Die Polizei stoppte den Fahrer mit vorgehaltener Waffe, ließ einen Polizeihund los, der ihn biss, und nahm ihn fest. Später erklärte die Polizei, der Alarm sei ein Lesefehler gewesen. Die Anklage wurde fallen gelassen.", "whyBad": "Erkennungssysteme machen immer einige Fehler. Gefährlich wird es, wenn man einem Alarm so sehr vertraut, dass er den Einsatz von Gewalt rechtfertigt. Dann kann schon ein kleiner technischer Fehler mit einer Verletzung oder Festnahme enden. In diesem Fall sollte der Alarm außerdem von einem Menschen geprüft werden, und diese Prüfung soll nicht richtig durchgeführt worden sein.", "escalation": "Je weiter sich automatisierte Überwachung ausbreitet, desto mehr Alarme erzeugen Maschinen. Wenn auch die folgenden Entscheidungen automatisiert oder in Eile getroffen werden, können Fehlalarme durch Polizei, Grenzkontrolle und andere mächtige Institutionen laufen, bevor sie jemand prüft. KI-Überwachung hat eine zweite Gefahr. Wenn Kameras jedes Auto und jedes Gesicht verfolgen können, werden alle ständig beobachtet, und ein einziger falscher Treffer kann einem Menschen von System zu System folgen."}, "ru": {"title": "Ошибка распознавания номера привела к остановке под дулом пистолета", "domain": "Полиция", "hook": "одно ложное совпадение", "real": "Автоматическая **система распознавания номеров**, по имеющимся данным, неверно считала номер автомобиля. После этого полиция **остановила водителя под дулом пистолета**, и только потом ошибка обнаружилась.", "fake": "ИИ-система, которая **оценивает размер толпы по съёмке с дрона**, по имеющимся данным, **приняла свадьбу за несогласованный протест**. На место отправили спецподразделение полиции, и только потом ошибка обнаружилась.", "excerpt": "Полиция Толидо (штат Огайо) остановила водителя Брэндона Апчерча под дулом пистолета после того, как считыватель номерных знаков Flock Safety ошибочно сопоставил его пикап с украденным номером.", "explanation": "Автоматический считыватель номеров ошибочно сопоставил пикап с украденным номером. Полиция остановила водителя под дулом пистолета, спустила на него служебную собаку, которая его укусила, и арестовала его. Позже полиция признала, что сигнал был ошибкой считывания. Обвинения сняли.", "whyBad": "Системы распознавания всегда иногда ошибаются. Опасность возникает, когда сигналу доверяют настолько, что он оправдывает применение силы. Тогда даже небольшая техническая ошибка может закончиться травмой или арестом. В этом случае сигнал должен был проверить человек, и, по имеющимся данным, эту проверку не выполнили как следует.", "escalation": "Чем шире автоматизированное наблюдение, тем больше сигналов выдают машины. Если и решения по этим сигналам принимаются автоматически или в спешке, ложные тревоги могут пройти через полицию, пограничный контроль и другие влиятельные ведомства раньше, чем их кто-то проверит. У ИИ-слежки есть и вторая опасность. Когда камеры отслеживают каждую машину и каждое лицо, под наблюдением постоянно находятся все, а одно ложное совпадение может следовать за человеком из системы в систему."}, "it": {"title": "Un errore dell’IA nella lettura della targa ha portato a un fermo con armi spianate", "domain": "Polizia", "hook": "una sola falsa corrispondenza", "real": "Un **lettore automatico di targhe** avrebbe letto male la targa di un veicolo. La polizia ha quindi **fermato il conducente sotto la minaccia delle armi** prima che l’errore venisse scoperto.", "fake": "Un sistema di IA che **stima le dimensioni delle folle dalle riprese dei droni** avrebbe scambiato una **festa di matrimonio per una manifestazione non autorizzata**. Sono stati inviati agenti antisommossa prima che l’errore venisse scoperto.", "excerpt": "La polizia di Toledo, in Ohio, ha fermato l’automobilista Brandon Upchurch sotto la minaccia delle armi dopo che un lettore di targhe Flock Safety aveva associato per errore il suo pick-up a una targa rubata.", "explanation": "Un lettore automatico di targhe ha associato per errore un pick-up a una targa rubata. La polizia ha fermato il conducente sotto la minaccia delle armi, gli ha sguinzagliato contro un cane che lo ha morso e lo ha arrestato. In seguito la polizia ha detto che l’allerta era un errore di lettura. Le accuse sono state ritirate.", "whyBad": "I sistemi di riconoscimento commettono sempre qualche errore. Il pericolo nasce quando ci si fida di un’allerta al punto da giustificare l’uso della forza. Allora anche un piccolo errore tecnico può finire con un ferimento o un arresto. In questo caso l’allerta doveva anche essere controllata da una persona, e quel controllo non sarebbe stato fatto correttamente.", "escalation": "Man mano che la sorveglianza automatizzata si diffonde, le macchine producono molte più allerte. Se anche le decisioni successive sono automatizzate o prese di fretta, i falsi allarmi possono attraversare polizia, controlli di frontiera e altre istituzioni potenti prima che qualcuno li verifichi. La sorveglianza con l’IA ha un secondo pericolo. Quando le telecamere possono seguire ogni auto e ogni volto, tutti sono osservati continuamente, e una sola falsa corrispondenza può seguire una persona da un sistema all’altro."}, "es": {"title": "Un error de IA al leer una matrícula llevó a una detención a punta de pistola", "domain": "Policía", "hook": "una sola coincidencia falsa", "real": "Un **lector automático de matrículas** habría leído mal la matrícula de un vehículo. La policía **detuvo entonces al conductor a punta de pistola** antes de que se descubriera el error.", "fake": "Un sistema de IA que **estima el tamaño de las multitudes a partir de imágenes de drones** habría confundido una **fiesta de boda con una protesta no autorizada**. Se enviaron policías antidisturbios antes de que se descubriera el error.", "excerpt": "La policía de Toledo (Ohio) detuvo a punta de pistola al conductor Brandon Upchurch después de que un lector de matrículas de Flock Safety asociara por error su camioneta con una matrícula robada.", "explanation": "Un lector automático de matrículas asoció por error una camioneta con una matrícula robada. La policía detuvo al conductor a punta de pistola, soltó un perro policía que lo mordió y lo arrestó. Después la policía dijo que la alerta había sido un error de lectura. Los cargos se retiraron.", "whyBad": "Los sistemas de reconocimiento siempre cometen algunos errores. El peligro aparece cuando se confía en una alerta lo suficiente como para justificar el uso de la fuerza. Entonces incluso un pequeño error técnico puede terminar en una lesión o un arresto. En este caso, además, una persona debía comprobar la alerta, y esa comprobación no se habría hecho correctamente.", "escalation": "A medida que la vigilancia automatizada se extiende, las máquinas generan muchas más alertas. Si las decisiones posteriores también se automatizan o se toman con prisa, las falsas alarmas pueden pasar por la policía, el control de fronteras y otras instituciones poderosas antes de que alguien las compruebe. La vigilancia con IA tiene un segundo peligro. Cuando las cámaras pueden seguir cada coche y cada rostro, todos están observados todo el tiempo, y una sola coincidencia falsa puede seguir a una persona de un sistema a otro."}, "ko": {"title": "AI 번호판 인식 오류로 총구 앞 검문", "domain": "경찰", "hook": "잘못된 일치 판정 하나", "real": "자동 **번호판 판독기**가 한 차량의 번호판을 잘못 읽은 것으로 알려졌습니다. 그 뒤 경찰은 오류가 밝혀지기 전에 **운전자에게 총을 겨누고 차를 세웠습니다**.", "fake": "**드론 영상으로 군중 규모를 추정하는** AI 시스템이 **결혼식 피로연을 미신고 시위로 잘못 판단한** 것으로 알려졌습니다. 오류가 밝혀지기 전에 진압 경찰이 출동했습니다.", "excerpt": "미국 오하이오주 톨레도 경찰은 Flock Safety 번호판 인식기가 브랜던 업처치의 트럭을 도난 번호판과 잘못 일치시킨 뒤 그를 총구를 겨눈 채 세웠다.", "explanation": "자동 번호판 판독기가 픽업트럭을 도난 번호판과 잘못 연결했습니다. 경찰은 운전자에게 총을 겨누고 차를 세웠고, 경찰견을 풀어 그를 물게 한 뒤 체포했습니다. 이후 경찰은 그 경보가 판독 오류였다고 밝혔습니다. 혐의는 취하됐습니다.", "whyBad": "인식 시스템은 언제나 어느 정도 오류를 냅니다. 위험은 경보를 무력 사용을 정당화할 만큼 믿을 때 생깁니다. 그러면 작은 기술적 오류도 부상이나 체포로 끝날 수 있습니다. 이 사건에서는 사람이 경보를 확인하게 되어 있었는데, 그 확인이 제대로 이루어지지 않은 것으로 알려졌습니다.", "escalation": "자동 감시가 퍼질수록 기계가 만들어 내는 경보도 훨씬 많아집니다. 이어지는 결정까지 자동화되거나 급하게 내려지면, 잘못된 경보가 누군가 확인하기 전에 경찰, 국경 통제, 그 밖의 강력한 기관을 거쳐 갈 수 있습니다. AI 감시에는 두 번째 위험이 있습니다. 카메라가 모든 차와 모든 얼굴을 추적할 수 있게 되면 모든 사람이 항상 감시받게 되고, 잘못된 일치 하나가 한 사람을 이 시스템에서 저 시스템으로 따라다닐 수 있습니다."}, "zh": {"title": "AI 车牌识别错误导致持枪拦车", "domain": "警务", "hook": "一次错误匹配", "real": "据报道，一台自动**车牌识别设备**读错了一辆车的车牌。警方随后在错误被发现之前**持枪拦停了司机**。", "fake": "据报道，一个**根据无人机画面估算人群规模的**AI系统把一场**婚宴误判为未经批准的抗议**。在错误被发现之前，防暴警察已被派往现场。", "excerpt": "美国俄亥俄州托莱多警方在 Flock Safety 车牌识别器错误地将 Brandon Upchurch 的皮卡与一块被盗车牌匹配后，持枪拦下了他。", "explanation": "一台自动车牌识别设备错误地把一辆皮卡与一块被盗车牌对应起来。警方持枪拦停了司机，放出警犬咬伤了他，并将他逮捕。警方后来表示，这次警报是识别错误。指控已被撤销。", "whyBad": "识别系统总会出一些错。危险在于，人们对警报的信任足以让动用武力显得正当。这时，即使是很小的技术错误，也可能以受伤或被捕告终。在这起事件中，警报本来还应由人来核查，而据报道，这项核查没有做到位。", "escalation": "随着自动化监控的普及，机器发出的警报多了很多。如果后续决定也被自动化，或者是匆忙做出的，错误警报就可能在有人核查之前，一路通过警方、边境管控和其他权力很大的机构。AI监控还有第二重危险。当摄像头能够追踪每一辆车和每一张脸时，所有人都时刻处在监视之下，而一次错误匹配可能跟着一个人从一个系统到另一个系统。"}, "sr": {"title": "Грешка ВИ при читању таблица довела до заустављања под претњом оружјем", "domain": "Полиција", "hook": "једно лажно подударање", "real": "Аутоматски **читач регистарских таблица** је, према наводима, погрешно прочитао таблицу возила. Полиција је затим **зауставила возача уз уперено оружје** пре него што је грешка откривена.", "fake": "Систем вештачке интелигенције који **процењује величину масе на основу снимака из дрона** је, према наводима, **свадбено славље заменио за непријављени протест**. Послата је интервентна полиција пре него што је грешка откривена.", "excerpt": "Полиција у Толеду, у Охају, зауставила је возача Брендона Апчерча под претњом оружјем након што је читач регистарских таблица Flock Safety погрешно повезао његов камионет са украденом таблицом.", "explanation": "Аутоматски читач регистарских таблица погрешно је повезао пикап са украденом таблицом. Полиција је зауставила возача уз уперено оружје, пустила службеног пса који га је ујео и ухапсила га. Полиција је касније рекла да је упозорење било грешка у читању. Оптужбе су одбачене.", "whyBad": "Системи за препознавање увек праве понеку грешку. Опасност настаје када се упозорењу верује довољно да оправда употребу силе. Тада и мала техничка грешка може да се заврши повредом или хапшењем. У овом случају упозорење је требало да провери и човек, а та провера, према наводима, није урађена како треба.", "escalation": "Како се аутоматизовани надзор шири, машине стварају много више упозорења. Ако су и одлуке које следе аутоматизоване или се доносе у журби, лажна упозорења могу да прођу кроз полицију, граничну контролу и друге моћне институције пре него што их ико провери. Надзор помоћу вештачке интелигенције има и другу опасност. Када камере могу да прате сваки аутомобил и свако лице, сви су стално под надзором, а једно лажно поклапање може да прати човека из система у систем."}, "bs": {"title": "Greška UI pri čitanju tablica dovela do zaustavljanja pod prijetnjom oružjem", "domain": "Policija", "hook": "jedno lažno podudaranje", "real": "Automatski **čitač registarskih tablica** je, prema navodima, pogrešno pročitao tablicu vozila. Policija je zatim **zaustavila vozača uz upereno oružje** prije nego što je greška otkrivena.", "fake": "AI sistem koji **procjenjuje veličinu mase na osnovu snimaka iz drona** je, prema navodima, **svadbeno slavlje zamijenio za neprijavljeni protest**. Poslana je interventna policija prije nego što je greška otkrivena.", "excerpt": "Policija u Toledu, u Ohaju, zaustavila je vozača Brandona Upchurcha pod prijetnjom oružjem nakon što je čitač registarskih tablica Flock Safety pogrešno povezao njegov pikap s ukradenom tablicom.", "explanation": "Automatski čitač registarskih tablica pogrešno je povezao pikap s ukradenom tablicom. Policija je zaustavila vozača uz upereno oružje, pustila službenog psa koji ga je ugrizao i uhapsila ga. Policija je kasnije rekla da je upozorenje bilo greška u čitanju. Optužbe su odbačene.", "whyBad": "Sistemi za prepoznavanje uvijek prave poneku grešku. Opasnost nastaje kada se upozorenju vjeruje dovoljno da opravda upotrebu sile. Tada i mala tehnička greška može završiti povredom ili hapšenjem. U ovom slučaju upozorenje je trebao provjeriti i čovjek, a ta provjera, prema navodima, nije urađena kako treba.", "escalation": "Kako se automatizirani nadzor širi, mašine stvaraju mnogo više upozorenja. Ako su i odluke koje slijede automatizirane ili se donose u žurbi, lažna upozorenja mogu proći kroz policiju, graničnu kontrolu i druge moćne institucije prije nego što ih iko provjeri. AI nadzor ima i drugu opasnost. Kada kamere mogu pratiti svaki automobil i svako lice, svi su stalno pod nadzorom, a jedno lažno poklapanje može pratiti čovjeka iz sistema u sistem."}, "ro": {"title": "O eroare IA de citire a plăcuței a dus la o oprire sub amenințarea armei", "domain": "Poliție", "hook": "o singură potrivire falsă", "real": "Un **cititor automat de numere de înmatriculare** ar fi citit greșit numărul unui vehicul. Poliția **l-a oprit apoi pe șofer sub amenințarea armei** înainte ca greșeala să fie descoperită.", "fake": "Un sistem de IA care **estimează mărimea mulțimilor din imagini filmate cu drona** ar fi confundat o **petrecere de nuntă cu un protest neautorizat**. Au fost trimiși jandarmi înainte ca greșeala să fie descoperită.", "excerpt": "Poliția din Toledo, Ohio, l-a oprit sub amenințarea armei pe șoferul Brandon Upchurch după ce un cititor de plăcuțe Flock Safety i-a asociat greșit camioneta cu o plăcuță furată.", "explanation": "Un cititor automat de numere de înmatriculare a asociat greșit o camionetă cu un număr furat. Poliția l-a oprit pe șofer sub amenințarea armei, a eliberat un câine polițist care l-a mușcat și l-a arestat. Ulterior, poliția a spus că alerta fusese o eroare de citire. Acuzațiile au fost retrase.", "whyBad": "Sistemele de recunoaștere fac întotdeauna unele greșeli. Pericolul apare atunci când o alertă primește destulă încredere încât să justifice folosirea forței. Atunci chiar și o mică eroare tehnică se poate termina cu o rănire sau o arestare. În acest caz, alerta trebuia verificată și de o persoană, iar această verificare nu ar fi fost făcută corect.", "escalation": "Pe măsură ce supravegherea automatizată se răspândește, mașinile produc mult mai multe alerte. Dacă și deciziile care urmează sunt automatizate sau luate în grabă, alertele false pot trece prin poliție, controlul la frontieră și alte instituții puternice înainte să le verifice cineva. Supravegherea cu IA are un al doilea pericol. Când camerele pot urmări fiecare mașină și fiecare față, toată lumea este urmărită tot timpul, iar o singură potrivire falsă poate urmări o persoană dintr-un sistem în altul."}, "vi": {"title": "Lỗi AI đọc biển số dẫn đến bị chặn xe bằng súng", "domain": "Cảnh sát", "hook": "một lần khớp sai", "real": "Một **máy đọc biển số** tự động được cho là đã đọc sai biển số của một chiếc xe. Sau đó cảnh sát đã **chĩa súng chặn người lái xe** trước khi sai sót được phát hiện.", "fake": "Một hệ thống AI chuyên **ước tính quy mô đám đông từ hình ảnh quay bằng drone** được cho là đã nhầm một **tiệc cưới với một cuộc biểu tình trái phép**. Cảnh sát chống bạo động đã được điều đến trước khi sai sót được phát hiện.", "excerpt": "Cảnh sát Toledo, Ohio, đã chĩa súng chặn tài xế Brandon Upchurch sau khi thiết bị đọc biển số của Flock Safety khớp nhầm xe bán tải của anh với một biển số bị đánh cắp.", "explanation": "Một máy đọc biển số tự động đã ghép nhầm một chiếc xe bán tải với một biển số bị đánh cắp. Cảnh sát chĩa súng chặn người lái xe, thả chó nghiệp vụ cắn anh ta rồi bắt giữ anh ta. Sau đó cảnh sát nói rằng cảnh báo là do đọc sai. Các cáo buộc đã được hủy bỏ.", "whyBad": "Các hệ thống nhận dạng luôn mắc một số lỗi. Nguy hiểm xuất hiện khi người ta tin một cảnh báo đủ để biện minh cho việc dùng vũ lực. Khi đó, ngay cả một lỗi kỹ thuật nhỏ cũng có thể kết thúc bằng thương tích hoặc một vụ bắt giữ. Trong vụ này, cảnh báo còn phải được một người kiểm tra lại, và việc kiểm tra đó được cho là đã không được làm đúng cách.", "escalation": "Khi giám sát tự động lan rộng, máy móc tạo ra nhiều cảnh báo hơn rất nhiều. Nếu các quyết định tiếp theo cũng được tự động hóa hoặc được đưa ra vội vàng, cảnh báo sai có thể đi qua cảnh sát, kiểm soát biên giới và các cơ quan quyền lực khác trước khi có người kiểm tra. Giám sát bằng AI còn có mối nguy thứ hai. Khi camera có thể theo dõi mọi chiếc xe và mọi khuôn mặt, tất cả mọi người đều bị theo dõi liên tục, và một lần ghép nhầm có thể đeo bám một người từ hệ thống này sang hệ thống khác."}, "uk": {"title": "Помилка розпізнавання номера призвела до зупинки під дулом пістолета", "domain": "Поліція", "hook": "один хибний збіг", "real": "Автоматичний **зчитувач номерних знаків**, за наявними даними, неправильно прочитав номер автомобіля. Після цього поліція **зупинила водія під прицілом зброї**, перш ніж помилку виявили.", "fake": "ШІ-система, яка **оцінює розмір натовпу за зйомкою з дронів**, за наявними даними, сприйняла **весільне святкування за несанкціонований протест**. Туди відправили спецпідрозділ поліції, перш ніж помилку виявили.", "excerpt": "Поліція Толідо (штат Огайо) зупинила водія Брендона Апчерча під дулом пістолета після того, як зчитувач номерних знаків Flock Safety помилково зіставив його пікап із викраденим номером.", "explanation": "Автоматичний зчитувач номерних знаків помилково пов’язав пікап із викраденим номером. Поліція зупинила водія під прицілом зброї, спустила службового собаку, який його покусав, і заарештувала його. Пізніше поліція заявила, що сигнал був помилкою зчитування. Звинувачення зняли.", "whyBad": "Системи розпізнавання завжди припускаються певних помилок. Небезпека виникає тоді, коли сигналу довіряють настільки, що він виправдовує застосування сили. Тоді навіть дрібна технічна помилка може закінчитися травмою або арештом. У цьому випадку сигнал також мала перевірити людина, і цю перевірку, за наявними даними, не провели належним чином.", "escalation": "Що ширше розповсюджується автоматизоване спостереження, то більше сигналів створюють машини. Якщо подальші рішення теж автоматизовані або ухвалюються поспіхом, хибні сигнали можуть пройти через поліцію, прикордонний контроль та інші впливові установи, перш ніж їх хтось перевірить. ШІ-спостереження має й другу небезпеку. Коли камери можуть відстежувати кожне авто і кожне обличчя, за всіма стежать постійно, а один хибний збіг може переслідувати людину від системи до системи."}, "pl": {"title": "Błąd AI przy odczycie tablicy doprowadził do zatrzymania pod bronią", "domain": "Policja", "hook": "jedno fałszywe dopasowanie", "real": "Automatyczny **czytnik tablic rejestracyjnych** miał błędnie odczytać tablicę pojazdu. Policja **zatrzymała wtedy kierowcę, mierząc do niego z broni**, zanim błąd wykryto.", "fake": "System AI, który **szacuje wielkość tłumu na podstawie nagrań z dronów**, miał wziąć **przyjęcie weselne za nielegalny protest**. Wysłano oddziały prewencji, zanim błąd wykryto.", "excerpt": "Policja w Toledo w stanie Ohio zatrzymała kierowcę Brandona Upchurcha, mierząc do niego z broni, po tym jak czytnik tablic rejestracyjnych Flock Safety błędnie dopasował jego pikapa do skradzionej tablicy.", "explanation": "Automatyczny czytnik tablic rejestracyjnych błędnie powiązał pick-upa ze skradzioną tablicą. Policja zatrzymała kierowcę, mierząc do niego z broni, spuściła psa, który go pogryzł, i aresztowała go. Później policja przyznała, że alert był błędem odczytu. Zarzuty wycofano.", "whyBad": "Systemy rozpoznawania zawsze popełniają jakieś błędy. Niebezpiecznie robi się wtedy, gdy alertowi ufa się na tyle, że uzasadnia użycie siły. Wtedy nawet drobny błąd techniczny może skończyć się obrażeniami albo aresztowaniem. W tym przypadku alert miał też sprawdzić człowiek, a tej kontroli podobno nie przeprowadzono prawidłowo.", "escalation": "Im szerzej stosuje się zautomatyzowany nadzór, tym więcej alertów generują maszyny. Jeśli kolejne decyzje też są zautomatyzowane albo podejmowane w pośpiechu, fałszywe alarmy mogą przejść przez policję, kontrolę graniczną i inne potężne instytucje, zanim ktoś je sprawdzi. Nadzór z użyciem AI niesie też drugie zagrożenie. Gdy kamery mogą śledzić każdy samochód i każdą twarz, wszyscy są obserwowani przez cały czas, a jedno fałszywe dopasowanie może iść za człowiekiem od systemu do systemu."}, "ta": {"title": "AI வாகன எண் வாசிப்புப் பிழையால் துப்பாக்கி முனையில் நிறுத்தம்", "domain": "காவல்துறை", "hook": "ஒரு தவறான பொருத்தம்", "real": "ஒரு தானியங்கி **வாகன எண் பலகை வாசிப்பான்** ஒரு வாகனத்தின் எண் பலகையைத் தவறாகப் படித்ததாகக் கூறப்படுகிறது. பிழை கண்டறியப்படுவதற்கு முன், காவல்துறை **துப்பாக்கி முனையில் ஓட்டுநரை நிறுத்தியது**.", "fake": "**ட்ரோன் காட்சிகளிலிருந்து கூட்டத்தின் அளவை மதிப்பிடும்** ஒரு AI அமைப்பு, ஒரு **திருமண விருந்தை அனுமதியற்ற போராட்டம் எனத் தவறாகக் கருதியதாகக்** கூறப்படுகிறது. பிழை கண்டறியப்படுவதற்கு முன் கலவரத் தடுப்புக் காவலர்கள் அனுப்பப்பட்டனர்.", "excerpt": "Flock Safety வாகன எண் பலகை வாசிப்பான் ஒன்று பிராண்டன் அப்சர்ச்சின் லாரியைத் திருடப்பட்ட எண் பலகையுடன் தவறாகப் பொருத்தியதால், அமெரிக்காவின் ஒஹையோ மாநிலம் டொலீடோ காவல்துறையினர் அவரைத் துப்பாக்கி முனையில் நிறுத்தினர்.", "explanation": "ஒரு தானியங்கி எண் பலகை வாசிப்பான், ஒரு பிக்அப் வாகனத்தைத் திருடப்பட்ட எண் பலகையுடன் தவறாகப் பொருத்தியது. காவல்துறை துப்பாக்கி முனையில் ஓட்டுநரை நிறுத்தியது, காவல் நாயை அவிழ்த்துவிட்டது, அது அவரைக் கடித்தது, பின்னர் அவரைக் கைது செய்தது. அந்த எச்சரிக்கை வாசிப்புப் பிழை என்று காவல்துறை பின்னர் கூறியது. குற்றச்சாட்டுகள் கைவிடப்பட்டன.", "whyBad": "அடையாளம் காணும் அமைப்புகள் எப்போதும் சில பிழைகளைச் செய்கின்றன. ஓர் எச்சரிக்கையின் மீது, பலத்தைப் பயன்படுத்துவதை நியாயப்படுத்தும் அளவுக்கு நம்பிக்கை வைக்கப்படும்போது ஆபத்து எழுகிறது. அப்போது சிறிய தொழில்நுட்பப் பிழைகூட காயத்திலோ கைதிலோ முடியலாம். இந்தச் சம்பவத்தில், எச்சரிக்கையை ஒரு மனிதரும் சரிபார்க்க வேண்டியிருந்தது; அந்தச் சரிபார்ப்பு முறையாகச் செய்யப்படவில்லை என்று கூறப்படுகிறது.", "escalation": "தானியங்கிக் கண்காணிப்பு பரவும்போது, இயந்திரங்கள் மிக அதிகமான எச்சரிக்கைகளை உருவாக்குகின்றன. அடுத்து வரும் முடிவுகளும் தானியங்கியாகவோ அவசரமாகவோ எடுக்கப்பட்டால், தவறான எச்சரிக்கைகள் யாரும் சரிபார்ப்பதற்கு முன் காவல்துறை, எல்லைக் கட்டுப்பாடு, பிற அதிகாரம் மிக்க நிறுவனங்கள் வழியாகச் செல்லக்கூடும். AI கண்காணிப்பில் இரண்டாவது ஆபத்தும் உள்ளது. கேமராக்கள் ஒவ்வொரு வாகனத்தையும் ஒவ்வொரு முகத்தையும் பின்தொடர முடியும்போது, எல்லோரும் எப்போதும் கண்காணிக்கப்படுகிறார்கள்; ஒரே ஒரு தவறான பொருத்தம் ஒருவரை ஓர் அமைப்பிலிருந்து மற்றோர் அமைப்புக்குப் பின்தொடரக்கூடும்."}, "sv": {"title": "AI-fel vid skyltläsning ledde till ett stopp under vapenhot", "domain": "Polis", "hook": "en enda falsk träff", "real": "En automatisk **registreringsskyltsläsare** ska ha läst fel på ett fordons skylt. Polisen **stoppade sedan föraren under vapenhot** innan misstaget upptäcktes.", "fake": "Ett AI-system som **uppskattar folkmassors storlek utifrån drönarbilder** ska ha tagit en **bröllopsfest för en otillåten demonstration**. Kravallpolis skickades dit innan misstaget upptäcktes.", "excerpt": "Polisen i Toledo, Ohio, stoppade bilisten Brandon Upchurch under vapenhot efter att en skyltläsare från Flock Safety felaktigt matchat hans pickup mot en stulen registreringsskylt.", "explanation": "En automatisk skyltläsare kopplade felaktigt en pickup till en stulen registreringsskylt. Polisen stoppade föraren under vapenhot, släppte en polishund som bet honom och grep honom. Senare sade polisen att larmet var ett läsfel. Åtalet lades ned.", "whyBad": "Igenkänningssystem gör alltid några fel. Faran uppstår när man litar så mycket på ett larm att det rättfärdigar våld. Då kan även ett litet tekniskt fel sluta med en skada eller ett gripande. I det här fallet skulle larmet dessutom kontrolleras av en människa, och den kontrollen ska inte ha gjorts ordentligt.", "escalation": "När den automatiserade övervakningen breder ut sig skapar maskiner många fler larm. Om besluten som följer också är automatiserade eller fattas i hast kan falska larm passera genom polis, gränskontroll och andra mäktiga institutioner innan någon kontrollerar dem. AI-övervakning har en andra fara. När kameror kan följa varje bil och varje ansikte är alla övervakade hela tiden, och en enda falsk träff kan följa en människa från system till system."}, "tr": {"title": "Yapay zekânın plaka okuma hatası silah zoruyla durdurmaya yol açtı", "domain": "Polis", "hook": "tek bir yanlış eşleşme", "real": "Otomatik bir **plaka okuyucunun** bir aracın plakasını yanlış okuduğu bildirildi. Polis bunun üzerine, hata fark edilmeden önce **sürücüyü silah doğrultarak durdurdu**.", "fake": "**Drone görüntülerinden kalabalığın büyüklüğünü tahmin eden** bir yapay zekâ sisteminin, bir **düğün kutlamasını izinsiz protesto sandığı** bildirildi. Hata fark edilmeden önce çevik kuvvet gönderildi.", "excerpt": "Ohio eyaletinin Toledo kentinde polis, bir Flock Safety plaka okuyucusu kamyonetini yanlışlıkla çalıntı bir plakayla eşleştirdikten sonra sürücü Brandon Upchurch'ü silah doğrultarak durdurdu.", "explanation": "Otomatik bir plaka okuyucu, bir kamyoneti yanlışlıkla çalıntı bir plakayla eşleştirdi. Polis sürücüyü silah doğrultarak durdurdu, onu ısıran bir polis köpeğini saldı ve sürücüyü tutukladı. Polis daha sonra uyarının bir okuma hatası olduğunu söyledi. Suçlamalar düşürüldü.", "whyBad": "Tanıma sistemleri her zaman bazı hatalar yapar. Tehlike, bir uyarıya güç kullanmayı haklı çıkaracak kadar güvenildiğinde ortaya çıkar. O zaman küçük bir teknik hata bile yaralanmayla veya tutuklamayla bitebilir. Bu olayda uyarının ayrıca bir insan tarafından kontrol edilmesi gerekiyordu ve bu kontrolün düzgün yapılmadığı bildirildi.", "escalation": "Otomatik gözetim yaygınlaştıkça makineler çok daha fazla uyarı üretiyor. Sonraki kararlar da otomatikleşir veya aceleyle alınırsa, yanlış alarmlar kimse kontrol etmeden polisten, sınır kontrolünden ve diğer güçlü kurumlardan geçebilir. Yapay zekâ gözetiminin ikinci bir tehlikesi var. Kameralar her arabayı ve her yüzü izleyebildiğinde herkes sürekli gözetlenir ve tek bir yanlış eşleşme bir insanı sistemden sisteme takip edebilir."}}}, {"id": 1505, "url": "https://incidentdatabase.ai/cite/1505/", "building": "homes", "text": {"en": {"title": "AI-cloned voice used in a fake kidnapping", "domain": "Scams", "hook": "one cloned voice", "real": "Scammers reportedly used an **AI-cloned voice** in a **fake kidnapping call** and convinced a mother to send thousands of dollars.", "fake": "Scammers reportedly sent a mother who was on holiday an **AI-generated video of her house on fire**. They convinced her to pay thousands of dollars for an **emergency repair crew**.", "excerpt": "Deborah Del Mastro reportedly wired $5,400 to Mexico after scammers falsely claimed her daughter Sarah had been kidnapped", "explanation": "A woman got a call from scammers who said they had kidnapped her daughter. They played what sounded like her daughter's panicked voice. She sent $5,400 before she learned her daughter was safe. AI had reportedly been used to copy the voice.", "whyBad": "Scams work by making the victim believe the caller is someone they trust. A familiar voice is one of the strongest signs of that. Voice cloning makes it cheap to fake. Scams become more believable and more frightening, especially when the scammers also use personal details taken from public sources or data leaks.", "escalation": "More capable systems can combine cloned voices, generated video, personal data and chatbots that hold a conversation. Scams that now take a lot of work could become partly automated and target many people at the same time."}, "fr": {"title": "Une voix clonée par IA utilisée dans un faux enlèvement", "domain": "Arnaques", "hook": "une seule voix clonée", "real": "Des escrocs auraient utilisé une **voix clonée par IA** lors d’un **appel de faux enlèvement** et convaincu une mère d’envoyer plusieurs milliers de dollars.", "fake": "Des escrocs auraient envoyé à une mère en vacances une **vidéo générée par IA montrant sa maison en feu**. Ils l’auraient convaincue de payer plusieurs milliers de dollars pour une **équipe de réparation d’urgence**.", "excerpt": "Deborah Del Mastro aurait viré 5 400 $ vers le Mexique après que des escrocs ont faussement affirmé que sa fille Sarah avait été enlevée", "explanation": "Une femme a reçu un appel d’escrocs qui disaient avoir enlevé sa fille. Ils lui ont fait entendre ce qui ressemblait à la voix paniquée de sa fille. Elle a envoyé 5 400 $ avant d’apprendre que sa fille était en sécurité. L’IA aurait été utilisée pour copier la voix.", "whyBad": "Une arnaque fonctionne quand la victime croit que la personne qui appelle est quelqu’un de confiance. Une voix familière en est l’un des signes les plus forts. Le clonage vocal permet de l’imiter à bas coût. Les arnaques deviennent plus crédibles et plus effrayantes, surtout quand les escrocs utilisent aussi des informations personnelles tirées de sources publiques ou de fuites de données.", "escalation": "Des systèmes plus performants peuvent combiner voix clonées, vidéo générée, données personnelles et chatbots capables de tenir une conversation. Des arnaques qui demandent aujourd’hui beaucoup de travail pourraient devenir en partie automatiques et viser beaucoup de personnes en même temps."}, "de": {"title": "KI-geklonte Stimme bei vorgetäuschter Entführung", "domain": "Betrugsmaschen", "hook": "eine einzige geklonte Stimme", "real": "Betrüger sollen bei einem **Anruf über eine vorgetäuschte Entführung** eine **KI-geklonte Stimme** eingesetzt und eine Mutter dazu gebracht haben, mehrere Tausend Dollar zu schicken.", "fake": "Betrüger sollen einer Mutter im Urlaub ein **KI-generiertes Video ihres brennenden Hauses** geschickt haben. Sie brachten sie dazu, mehrere Tausend Dollar für einen **Notfall-Reparaturtrupp** zu zahlen.", "excerpt": "Deborah Del Mastro soll 5.400 $ nach Mexiko überwiesen haben, nachdem Betrüger fälschlich behauptet hatten, ihre Tochter Sarah sei entführt worden", "explanation": "Eine Frau bekam einen Anruf von Betrügern, die behaupteten, ihre Tochter entführt zu haben. Sie spielten etwas vor, das wie die panische Stimme der Tochter klang. Die Frau schickte 5.400 $, bevor sie erfuhr, dass ihre Tochter in Sicherheit war. Die Stimme soll mit KI kopiert worden sein.", "whyBad": "Betrug funktioniert, wenn das Opfer glaubt, dass der Anrufer jemand ist, dem es vertraut. Eine vertraute Stimme ist eines der stärksten Zeichen dafür. Stimmklonen macht es billig, sie zu fälschen. Betrugsmaschen werden glaubwürdiger und beängstigender, besonders wenn die Betrüger zusätzlich persönliche Daten aus öffentlichen Quellen oder Datenlecks nutzen.", "escalation": "Leistungsfähigere Systeme können geklonte Stimmen, generiertes Video, persönliche Daten und Chatbots verbinden, die ein Gespräch führen. Betrug, der heute viel Arbeit kostet, könnte teilweise automatisch ablaufen und viele Menschen gleichzeitig treffen."}, "ru": {"title": "Клонированный ИИ голос в фальшивом похищении", "domain": "Мошенничество", "hook": "один клонированный голос", "real": "Мошенники, по имеющимся данным, использовали **голос, клонированный с помощью ИИ**, в звонке о **фальшивом похищении** и убедили мать отправить несколько тысяч долларов.", "fake": "Мошенники, по имеющимся данным, отправили матери, которая была в отпуске, **сгенерированное ИИ видео с пожаром в её доме**. Они убедили её заплатить несколько тысяч долларов за **срочную ремонтную бригаду**.", "excerpt": "Дебора Дель Мастро, по имеющимся данным, перевела $5 400 в Мексику после того, как мошенники ложно заявили, что её дочь Сара похищена", "explanation": "Женщине позвонили мошенники и сказали, что похитили её дочь. Они включили запись, похожую на панический голос дочери. Женщина отправила $5 400, прежде чем узнала, что дочь в безопасности. По имеющимся данным, голос скопировали с помощью ИИ.", "whyBad": "Мошенничество строится на том, что жертва верит: звонит человек, которому она доверяет. Знакомый голос — один из самых сильных признаков. Клонирование голоса позволяет дёшево его подделать. Обман становится правдоподобнее и страшнее, особенно когда мошенники используют ещё и личные данные из открытых источников или утечек.", "escalation": "Более способные системы смогут совмещать клонированный голос, сгенерированное видео, личные данные и чат-ботов, которые ведут разговор. Мошенничество, которое сейчас требует много ручной работы, может стать частично автоматическим и бить по многим людям одновременно."}, "it": {"title": "Voce clonata con l’IA usata in un finto rapimento", "domain": "Truffe", "hook": "una sola voce clonata", "real": "Dei truffatori avrebbero usato una **voce clonata con l’IA** in una **telefonata per un finto rapimento** e convinto una madre a inviare migliaia di dollari.", "fake": "Dei truffatori avrebbero inviato a una madre in vacanza un **video generato dall’IA della sua casa in fiamme**. L’avrebbero convinta a pagare migliaia di dollari per una **squadra di riparazioni d’emergenza**.", "excerpt": "Deborah Del Mastro avrebbe inviato 5.400 $ in Messico dopo che dei truffatori avevano falsamente sostenuto che sua figlia Sarah era stata rapita", "explanation": "Una donna ha ricevuto una telefonata da truffatori che dicevano di aver rapito sua figlia. Le hanno fatto sentire quella che sembrava la voce terrorizzata della figlia. Ha inviato 5.400 $ prima di scoprire che la figlia era al sicuro. La voce sarebbe stata copiata con l’IA.", "whyBad": "Una truffa funziona quando la vittima crede che chi chiama sia una persona di cui si fida. Una voce familiare è uno dei segnali più forti. La clonazione vocale rende economico falsificarla. Le truffe diventano più credibili e più spaventose, soprattutto quando i truffatori usano anche dati personali presi da fonti pubbliche o da fughe di dati.", "escalation": "Sistemi più capaci possono combinare voci clonate, video generati, dati personali e chatbot in grado di sostenere una conversazione. Truffe che oggi richiedono molto lavoro potrebbero diventare in parte automatiche e colpire molte persone nello stesso momento."}, "es": {"title": "Una voz clonada con IA en un secuestro falso", "domain": "Estafas", "hook": "una sola voz clonada", "real": "Unos estafadores habrían usado una **voz clonada con IA** en una **llamada de secuestro falso** y convencido a una madre de enviar miles de dólares.", "fake": "Unos estafadores habrían enviado a una madre de vacaciones un **vídeo generado con IA de su casa en llamas**. La habrían convencido de pagar miles de dólares por un **equipo de reparación de emergencia**.", "excerpt": "Según se informa, Deborah Del Mastro transfirió 5400 $ a México después de que unos estafadores afirmaran falsamente que su hija Sarah había sido secuestrada", "explanation": "Una mujer recibió una llamada de estafadores que decían haber secuestrado a su hija. Le pusieron lo que sonaba como la voz aterrada de su hija. Envió 5.400 $ antes de saber que su hija estaba a salvo. La voz se habría copiado con IA.", "whyBad": "Una estafa funciona cuando la víctima cree que quien llama es alguien de confianza. Una voz familiar es una de las señales más fuertes de ello. La clonación de voz hace barato falsificarla. Las estafas se vuelven más creíbles y más aterradoras, sobre todo cuando los estafadores usan además datos personales de fuentes públicas o de filtraciones.", "escalation": "Sistemas más capaces pueden combinar voces clonadas, vídeo generado, datos personales y chatbots que mantienen una conversación. Estafas que hoy exigen mucho trabajo podrían volverse en parte automáticas y dirigirse a muchas personas al mismo tiempo."}, "ko": {"title": "가짜 납치 사기에 쓰인 AI 복제 음성", "domain": "사기", "hook": "복제된 목소리 하나", "real": "사기범들이 **가짜 납치 전화**에서 **AI로 복제한 목소리**를 써서 한 어머니가 수천 달러를 보내게 한 것으로 알려졌습니다.", "fake": "사기범들이 휴가 중인 한 어머니에게 **집이 불타는 모습을 담은 AI 생성 영상**을 보낸 것으로 알려졌습니다. 이들은 **긴급 수리팀** 비용으로 수천 달러를 내도록 그녀를 설득했습니다.", "excerpt": "데버라 델 마스트로는 사기범들이 딸 세라가 납치됐다고 거짓 주장한 뒤 멕시코로 5,400달러를 송금한 것으로 알려졌다", "explanation": "한 여성이 딸을 납치했다고 주장하는 사기범들의 전화를 받았습니다. 그들은 겁에 질린 딸의 목소리처럼 들리는 소리를 들려줬습니다. 그녀는 딸이 안전하다는 사실을 알기 전에 5,400달러를 보냈습니다. 그 목소리는 AI로 복제된 것으로 알려졌습니다.", "whyBad": "사기는 피해자가 전화를 건 사람을 믿을 만한 사람이라고 믿을 때 통합니다. 익숙한 목소리는 그 가장 강한 신호 가운데 하나입니다. 음성 복제는 그 목소리를 싸게 흉내 낼 수 있게 합니다. 사기는 더 그럴듯하고 더 무서워지며, 사기범이 공개된 자료나 유출된 데이터에서 얻은 개인 정보까지 쓸 때 특히 그렇습니다.", "escalation": "더 유능한 시스템은 복제된 목소리, 생성된 영상, 개인 정보, 대화를 이어 가는 챗봇을 결합할 수 있습니다. 지금은 많은 노력이 드는 사기가 부분적으로 자동화되어 동시에 많은 사람을 노릴 수 있습니다."}, "zh": {"title": "AI 克隆声音被用于假绑架诈骗", "domain": "诈骗", "hook": "一个被克隆的声音", "real": "据报道，诈骗者在一通**假绑架电话**中使用了**AI克隆的声音**，说服一位母亲汇出了数千美元。", "fake": "据报道，诈骗者给一位正在度假的母亲发送了**AI生成的她家房子起火的视频**。他们说服她为一支**紧急维修队**支付了数千美元。", "excerpt": "据报道，在诈骗者谎称她的女儿 Sarah 被绑架后，Deborah Del Mastro 向墨西哥汇出了 5400 美元", "explanation": "一名女子接到诈骗者的电话，对方声称绑架了她的女儿。他们播放了一段听起来像她女儿惊恐的声音。在得知女儿平安之前，她已经汇出了5,400美元。据报道，这个声音是用AI复制的。", "whyBad": "诈骗之所以得逞，是因为受害者相信来电的人是自己信任的人。熟悉的声音是最有力的信号之一。声音克隆让伪造这种声音变得很便宜。骗局因此更可信，也更吓人，尤其是当诈骗者还利用来自公开渠道或数据泄露的个人信息时。", "escalation": "能力更强的系统可以把克隆的声音、生成的视频、个人数据和能够持续对话的聊天机器人结合起来。如今需要大量人力的骗局，可能变得部分自动化，并同时针对很多人。"}, "sr": {"title": "Глас клониран помоћу ВИ у лажној отмици", "domain": "Преваре", "hook": "један клонирани глас", "real": "Преваранти су, према наводима, употребили **глас клониран вештачком интелигенцијом** у **позиву о лажној отмици** и убедили мајку да пошаље неколико хиљада долара.", "fake": "Преваранти су, према наводима, мајци на одмору послали **видео њене куће у пламену, генерисан вештачком интелигенцијом**. Убедили су је да плати неколико хиљада долара за **екипу за хитне поправке**.", "excerpt": "Дебора Дел Мастро је, како се наводи, послала 5.400 долара у Мексико након што су преваранти лажно тврдили да је њена ћерка Сара отета", "explanation": "Жену су позвали преваранти који су тврдили да су отели њену ћерку. Пустили су јој нешто што је звучало као уплашени глас њене ћерке. Послала је 5.400 долара пре него што је сазнала да је ћерка на сигурном. Глас је, према наводима, копиран помоћу вештачке интелигенције.", "whyBad": "Превара успева када жртва верује да зове неко коме верује. Познат глас је један од најјачих знакова за то. Клонирање гласа чини његово лажирање јефтиним. Преваре постају уверљивије и страшније, посебно када преваранти користе и личне податке из јавних извора или из процурелих база.", "escalation": "Способнији системи могу да споје клониране гласове, генерисани видео, личне податке и четботове који умеју да воде разговор. Преваре које данас траже много рада могле би да постану делимично аутоматске и да погађају много људи у исто време."}, "bs": {"title": "Glas kloniran pomoću UI u lažnoj otmici", "domain": "Prevare", "hook": "jedan klonirani glas", "real": "Prevaranti su, prema navodima, upotrijebili **glas kloniran pomoću AI-ja** u **pozivu o lažnoj otmici** i uvjerili majku da pošalje nekoliko hiljada dolara.", "fake": "Prevaranti su, prema navodima, majci na odmoru poslali **AI-generisani video njene kuće u plamenu**. Uvjerili su je da plati nekoliko hiljada dolara za **ekipu za hitne popravke**.", "excerpt": "Deborah Del Mastro je, kako se navodi, poslala 5.400 dolara u Meksiko nakon što su prevaranti lažno tvrdili da je njena kćerka Sarah oteta", "explanation": "Ženu su nazvali prevaranti koji su tvrdili da su oteli njenu kćerku. Pustili su joj nešto što je zvučalo kao uplašeni glas njene kćerke. Poslala je 5.400 dolara prije nego što je saznala da je kćerka na sigurnom. Glas je, prema navodima, kopiran pomoću AI-ja.", "whyBad": "Prevara uspijeva kada žrtva vjeruje da zove neko kome vjeruje. Poznat glas je jedan od najjačih znakova za to. Kloniranje glasa čini njegovo lažiranje jeftinim. Prevare postaju uvjerljivije i strašnije, posebno kada prevaranti koriste i lične podatke iz javnih izvora ili iz procurjelih baza.", "escalation": "Sposobniji sistemi mogu spojiti klonirane glasove, generisani video, lične podatke i chatbotove koji znaju voditi razgovor. Prevare koje danas traže mnogo rada mogle bi postati djelimično automatske i pogađati mnogo ljudi u isto vrijeme."}, "ro": {"title": "Voce clonată cu IA folosită într-o falsă răpire", "domain": "Escrocherii", "hook": "o singură voce clonată", "real": "Niște escroci ar fi folosit o **voce clonată cu IA** într-un **apel despre o răpire falsă** și ar fi convins o mamă să trimită câteva mii de dolari.", "fake": "Niște escroci i-ar fi trimis unei mame aflate în vacanță un **videoclip generat cu IA cu casa ei în flăcări**. Ar fi convins-o să plătească câteva mii de dolari pentru o **echipă de reparații de urgență**.", "excerpt": "Deborah Del Mastro ar fi trimis 5.400 $ în Mexic după ce escrocii au susținut în mod fals că fiica ei, Sarah, fusese răpită", "explanation": "O femeie a primit un apel de la escroci care spuneau că i-au răpit fiica. I-au pus ceva ce suna ca vocea îngrozită a fiicei. A trimis 5.400 de dolari înainte să afle că fiica ei era în siguranță. Vocea ar fi fost copiată cu IA.", "whyBad": "O escrocherie funcționează când victima crede că cel care sună este cineva în care are
