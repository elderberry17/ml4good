    svg.innerHTML = svgMarkup();
    gestures();
    // Keep the current target framed when the map box changes size (but don't cut an animation short).
    // If the player has moved the camera, keep their view and only fix its proportions.
    new ResizeObserver(() => {
      if (!free || !vb) return look(target, raf === 0);
      const [x, y, w, h] = vb, h2 = w / ((el.clientWidth || 16) / (el.clientHeight || 10));
      setVB(clampVB([x, y + (h - h2) / 2, w, h2]));
    }).observe(el);
  }
  function setStates(states) {
    for (const el of svg.querySelectorAll("[data-b]")) {
      const s = states[el.dataset.b] || "";
      el.classList.toggle("safe", s === "safe");
      el.classList.toggle("hit", s === "hit");
      el.classList.toggle("current", s === "current");
      el.classList.toggle("waiting", s === "waiting");
    }
  }
  function setTitles(names) {
    for (const el of svg.querySelectorAll(".bldg")) el.querySelector("title").textContent = names[el.dataset.b] || "";
  }
  return { mount, setStates, setTitles, look, focusOf, FULL, KEYS, zoomAt, isZoomed, wasDrag: () => dragged, anchors, view: () => vb };
})();

let S; // game state
function newGame(phase = "landing") {
  S = {
    realFirst: INCIDENTS.map(() => Math.random() < .5),
    answers: {},       // incident index -> true (spotted the real threat) / false
    seen: {},          // incident index -> the "what if" panel was opened
    cur: null,         // incident index of the building that is open
    phase,             // landing | map | ask | revealed | whatif | end
  };
}

const app = $("#app");
const track = $("#track");
// Buildings in map order; each entry is an index into INCIDENTS.
const ORDER = City.KEYS.map(k => INCIDENTS.findIndex(i => i.building === k)).filter(i => i >= 0);
const N = ORDER.length;
const inRound = () => ["ask", "revealed", "whatif"].includes(S.phase);
const curInc = () => INCIDENTS[S.cur];
const done = i => i in S.answers;
const doneCount = () => Object.keys(S.answers).length;
const score = () => Object.values(S.answers).filter(Boolean).length;
const mostSafe = () => score() * 2 > N; // more than half
const bName = key => t().buildings?.[key] || key;
const isWide = () => matchMedia("(min-width: 960px)").matches;
const toMap = () => { if (!isWide()) $(".map-pane").scrollIntoView({ behavior: smooth(), block: "start" }); };

function renderTrack() {
  track.innerHTML = ORDER.map(i => {
    const cls = done(i) ? (S.answers[i] ? "ok" : "no") : (i === S.cur && inRound() ? "now" : "");
    return `<i class="${cls}"></i>`;
  }).join("") + `<span class="score">${score()}/${N}</span>`;
}

// Building states + camera + caption follow the game state.
function renderCity(instant) {
  const u = t(), states = {};
  for (const i of ORDER) {
    const key = INCIDENTS[i].building;
    if (done(i)) states[key] = S.answers[i] ? "safe" : "hit";
    else if (i === S.cur && inRound()) states[key] = "current";
    else if (S.phase !== "landing") states[key] = "waiting";
  }
  City.setStates(states);
  for (const el of document.querySelectorAll(".map-label")) {
    const st = states[el.dataset.b] || "idle";
    el.className = "map-label " + st;
    el.querySelector(".nm").textContent = bName(el.dataset.b);
    const lbl = st === "safe" ? u.statusSafe : st === "hit" ? u.statusHit : st === "waiting" ? u.statusNew : "";
    el.setAttribute("aria-label", bName(el.dataset.b) + (lbl ? ": " + lbl : ""));
  }
  City.setTitles(u.buildings || {});
  $("#city").setAttribute("aria-label", u.mapAria);
  $("#map").classList.toggle("pick", S.phase !== "landing");
  $(".stage").dataset.mode = S.phase === "map" ? "map" : "split";
  const hud = $("#map-hud");
  hud.hidden = S.phase !== "map";
  if (S.phase === "map") hud.innerHTML = `<div class="eyebrow">${esc(u.resultEyebrow)} · ${doneCount()}/${N}</div><h1>${esc(u.mapTitle)}</h1>`;
  for (const [id, key] of [["z-in", "zoomIn"], ["z-out", "zoomOut"], ["z-all", "zoomReset"]]) { $("#" + id).title = u[key]; $("#" + id).setAttribute("aria-label", u[key]); }

  const cap = $("#map-caption");
  if (inRound()) {
    const key = curInc().building, st = states[key];
    cap.innerHTML = `<span>${esc(bName(key))}</span>` +
      (st === "safe" ? `<span class="st safe">${esc(u.statusSafe)}</span>` : st === "hit" ? `<span class="st hit">${esc(u.statusHit)}</span>` : "");
    City.look(City.focusOf(key), instant);
  } else {
    cap.innerHTML = S.phase === "end"
      ? `<span>${esc(u.resilience)}</span><span class="st ${mostSafe() ? "safe" : "hit"}">${Math.round(score() / N * 100)}%</span>`
      : S.phase === "map" ? `<span>${esc(u.statusNew)}</span><span class="st wait">${N - doneCount()}</span>` : "";
    City.look(City.FULL, instant);
  }
}

function render(instant) {
  renderChrome();
  renderTrack();
  renderCity(instant);
  if (S.phase === "landing") return renderLanding();
  if (S.phase === "map") return renderMap();
  if (S.phase === "end") return renderEnd();
  const inc = curInc(), c = tx(inc), u = t();
  const cards = S.realFirst[S.cur] ? [["real", c.real], ["fake", c.fake]] : [["fake", c.fake], ["real", c.real]];
  const answered = S.phase !== "ask";
  const chosenKind = answered ? (S.answers[S.cur] ? "real" : "fake") : null;

  app.innerHTML = `
    <div class="round-head">
      <div class="head-row">
        <div class="eyebrow">${esc(bName(inc.building))}${answered ? "" : " · " + esc(fmt(u.round, { i: doneCount() + 1, n: N }))}</div>
        <button class="backlink" data-back>${esc(u.back)}</button>
      </div>
      <h1>${emph(u.question)}</h1>
    </div>
    <div class="pair ${answered ? "revealed" : ""}">
      ${cards.map(([kind, text], i) => `
        <button class="card is-${kind} ${chosenKind === kind ? "chosen" : ""}" data-kind="${kind}" ${answered ? "disabled" : ""}
          aria-label="${u.report} ${"AB"[i]}: ${esc(plain(text))}">
          <span class="picked">${u.yourPick}</span>
          <span class="label"><span class="letter">${u.report} ${"AB"[i]}</span>${answered ? "" : `<span class="key" aria-hidden="true">${"AB"[i]}</span>`}</span>
          <p class="stmt">${strong(text)}</p>
          <span class="cta">${u.pick}</span>
          <span class="stamp">${kind === "real" ? esc(fmt(u.stampReal, { id: inc.id })) : u.stampFake}</span>
        </button>`).join("")}
    </div>
    ${answered ? renderReveal(inc) : ""}
  `;

  app.querySelectorAll(".card:not(:disabled)").forEach(b => b.addEventListener("click", () => choose(b.dataset.kind)));
  $("#go-whatif")?.addEventListener("click", showWhatIf);
  app.querySelectorAll("[data-next], [data-back]").forEach(b => b.addEventListener("click", backToCity));
  if (S.phase === "whatif") startGloom($(".whatif canvas"));
}

function renderLanding() {
  const u = t();
  app.innerHTML = `
    <section class="landing">
      <div class="eyebrow">${esc(u.landingEyebrow)}</div>
      <h1>${esc(u.landingH)}</h1>
      <p class="lede">${withAiid(u.landingP)}</p>
      <ul class="roster">${ORDER.map(i => `<li>${esc(bName(INCIDENTS[i].building))}</li>`).join("")}</ul>
      <button class="btn primary big" id="start">${esc(u.start)}</button>
    </section>`;
  $("#start").addEventListener("click", startGame);
}

function startGame() {
  S.phase = "map";
  render();
  toMap();
}

// The city overview: the map is the whole screen; the chips below mirror it for touch and keyboard.
function renderMap() {
  const u = t();
  app.innerHTML = `
    <p class="map-hint">${esc(u.mapP)}</p>
    <ul class="bl-chips">
      ${ORDER.map(i => { const st = done(i) ? (S.answers[i] ? "ok" : "no") : "wait"; const lbl = st === "ok" ? u.statusSafe : st === "no" ? u.statusHit : u.statusNew; return `
        <li><button data-open="${i}" title="${esc(lbl)}" aria-label="${esc(bName(INCIDENTS[i].building))}: ${esc(lbl)}"><span class="m ${st}"></span>${esc(bName(INCIDENTS[i].building))}</button></li>`; }).join("")}
    </ul>`;
  app.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openBuilding(+b.dataset.open)));
}

function openBuilding(i) {
  if (!ORDER.includes(i)) return;
  S.cur = i;
  S.phase = done(i) ? (S.seen[i] ? "whatif" : "revealed") : "ask";
  render();
  if (isWide()) window.scrollTo({ top: 0, behavior: smooth() }); else toMap();
}

function backToCity() {
  S.cur = null;
  S.phase = doneCount() === N ? "end" : "map";
  render();
  window.scrollTo({ top: 0, behavior: "auto" });
}

function renderReveal(inc) {
  const ok = S.answers[S.cur], c = tx(inc), u = t();
  const verdict = `
    <div class="verdict ${ok ? "ok" : "no"}">
      <div class="dot" aria-hidden="true">${ok ? "✓" : "✕"}</div>
      <div>
        <h2>${ok ? u.rightH : u.wrongH}</h2>
        <p>${ok ? u.rightP : u.wrongP}</p>
      </div>
    </div>`;
  const record = `
    <section class="record" aria-label="${u.recordAria}">
      <div class="record-head">
        <h3>${esc(c.title)}</h3>
        <span class="mono" style="color:var(--muted)">AI Incident Database · #${inc.id}</span>
      </div>
      <p class="body">${esc(c.explanation)}</p>
      <blockquote class="src">
        <p>${u.quotes[0]}${esc(c.excerpt.replace(/[.。।\s]+$/, ""))}…${u.quotes[1]}</p>
        <cite class="mono" style="color:var(--muted)">${u.quoteCite}</cite>
      </blockquote>
      <div class="actions">
        <a class="btn" href="${esc(inc.url)}" target="_blank" rel="noopener">${u.readFull}</a>
      </div>
      ${c.whyBad ? `<details class="why"><summary>${u.why}</summary><p>${esc(c.whyBad)}</p></details>` : ""}
    </section>`;
  const whatif = S.phase === "whatif" ? `
    <section class="whatif" id="whatif" aria-label="${u.whatifEyebrow}">
      <canvas aria-hidden="true"></canvas>
      <div class="inner">
        <div class="eyebrow">${u.whatifEyebrow}</div>
        <h3>${esc(fmt(u.whatifH, { hook: c.hook }))}</h3>
        <ol class="steps">
          ${sentences(c.escalation).map((s, i) => `<li style="animation-delay:${.25 + i * .55}s">${esc(s)}</li>`).join("")}
        </ol>
        <p class="note">${u.whatifNote}</p>
        <div class="actions">
          <button class="btn solid-night" data-next>${doneCount() < N ? u.back : u.results}</button>
        </div>
      </div>
    </section>` : `
    <div class="whatif-cta">
      <p>${u.ctaH}<span>${u.ctaP}</span></p>
      <div class="actions">
        <button class="btn solid-night" id="go-whatif">${u.ctaBtn}</button>
        <button class="btn ghost-night" data-back>${doneCount() < N ? u.back : u.results}</button>
      </div>
    </div>`;
  return `<div class="reveal">${verdict}${record}${whatif}</div>`;
}

function choose(kind) {
  if (S.phase !== "ask") return;
  S.answers[S.cur] = kind === "real";
  S.phase = "revealed";
  render();
  // On wide screens the map stays in view; on phones show the building change first.
  if (isWide()) $(".reveal")?.scrollIntoView({ behavior: smooth(), block: "start" }); else toMap();
}

function showWhatIf() {
  S.seen[S.cur] = true;
  S.phase = "whatif";
  render();
  $("#whatif")?.scrollIntoView({ behavior: smooth(), block: "start" });
}

function renderEnd() {
  const c = score(), u = t(), pct = Math.round(c / N * 100);
  // Three outcomes: everything safe, most safe ("it gets harder"), city in decline.
  const head = u.ends[c === N ? 0 : mostSafe() ? 1 : 2];
  const col = mostSafe() ? "var(--real)" : "var(--fake)";
  app.innerHTML = `
    <section class="end">
      <div class="eyebrow">${esc(u.resultEyebrow)}</div>
      <p class="big">${c}<small> / ${N}</small></p>
      <div class="meter-row">
        <div class="lbl"><span>${esc(fmt(u.endScore, { c, n: N }))}</span><span>${pct}%</span></div>
        <div class="meter" role="img" aria-label="${esc(u.resilience)} ${pct}%"><i style="width:${pct}%;background:${col}"></i></div>
      </div>
      <h1>${esc(head)}</h1>
      <p class="lead">${esc(u.endLead)}</p>
      <ul class="ledger">
        ${ORDER.map(i => { const inc = INCIDENTS[i], x = tx(inc); return `
          <li><span class="m ${S.answers[i] ? "ok" : "no"}" title="${S.answers[i] ? u.statusSafe : u.statusHit}"></span>
            <span class="t"><button class="backlink" data-open="${i}">${esc(bName(inc.building))}</button><span>${esc(x.title)}</span></span>
            <a href="${esc(inc.url)}" target="_blank" rel="noopener">AIID #${inc.id} ↗</a></li>`; }).join("")}
      </ul>
      <div class="actions"><button class="btn primary" id="again">${u.again}</button></div>
    </section>`;
  app.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openBuilding(+b.dataset.open)));
  $("#again").addEventListener("click", () => { newGame("map"); render(); window.scrollTo({ top: 0 }); });
}

// Settings menu
const gear = $("#globe"), menu = $("#menu");
function setMenu(open) {
  menu.hidden = !open;
  gear.setAttribute("aria-expanded", String(open));
  if (open) menu.querySelector("input:checked")?.focus({ preventScroll: true });
}
gear.addEventListener("click", e => { e.stopPropagation(); setMenu(menu.hidden); });
document.addEventListener("click", e => { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
menu.addEventListener("change", e => {
  if (e.target.name !== "lang") return;
  lang = e.target.value;
  store.set("lang", lang);
  render(); // the game keeps its place; only the words change
  setMenu(false);
  gear.focus();
});

// Keyboard: A / B (or Russian А / Б) to pick, Enter for the next step, Esc closes the menu.
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape" && !menu.hidden) { setMenu(false); gear.focus(); return; }
  if (e.key === "Escape" && inRound()) { backToCity(); return; }
  if (!menu.hidden) return;
  const k = e.key.toLowerCase();
  const pick = { a: 0, b: 1, "а": 0, "б": 1, "ф": 0, "и": 1 }[k]; // ф/и = A/B keys on a Russian layout
  if (S.phase === "ask" && pick !== undefined) {
    const card = app.querySelectorAll(".card")[pick];
    card && choose(card.dataset.kind);
  } else if (k === "enter" && document.activeElement === document.body) {
    if (S.phase === "landing") startGame();
    else if (S.phase === "revealed") showWhatIf();
    else if (S.phase === "whatif") backToCity();
  }
});

// The gloom: a city at night in the rain, its windows going dark one by one.
// Quiet backdrop for the "what if" text; no glow, nothing pretty.
let gloomRAF = 0;
function startGloom(canvas) {
  cancelAnimationFrame(gloomRAF);
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; ctx.scale(dpr, dpr);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Skyline along the bottom edge.
  const blocks = [], wins = [];
  for (let x = -10; x < W + 10;) {
    const w = 26 + Math.random() * 46, h = 40 + Math.random() * Math.min(150, H * .32);
    blocks.push({ x, w, h });
    for (let wx = x + 6; wx < x + w - 8; wx += 11) for (let wy = H - h + 9; wy < H - 10; wy += 13)
      if (Math.random() < .5) wins.push({ x: wx, y: wy, off: 2000 + Math.random() * 22000 }); // ms until it goes dark
    x += w + 2;
  }
  const keep = Math.max(3, Math.round(wins.length * .04)); // a few stay lit
  wins.sort(() => Math.random() - .5).slice(0, keep).forEach(w => w.off = Infinity);
  const drops = Array.from({ length: Math.round(W * H / 5200) }, () => ({ x: Math.random() * W, y: Math.random() * H, v: 260 + Math.random() * 220, l: 9 + Math.random() * 12 }));

  let last = performance.now(); const t0 = last;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000), t = now - t0; last = now;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "rgba(4,6,12,.55)";
    for (const b of blocks) ctx.fillRect(b.x, H - b.h, b.w, b.h);
    for (const w of wins) {
      const left = reduce ? (w.off === Infinity ? 1 : 0) : Math.max(0, Math.min(1, (w.off - t) / 1500));
      ctx.fillStyle = left > 0 ? `rgba(214,196,150,${.07 + .22 * left})` : "rgba(160,170,190,.035)";
      ctx.fillRect(w.x, w.y, 5, 7);
    }
    if (!reduce) {
      ctx.strokeStyle = "rgba(170,182,205,.13)"; ctx.lineWidth = 1; ctx.beginPath();
      for (const d of drops) {
        d.y += d.v * dt; d.x -= d.v * dt * .12;
        if (d.y > H) { d.y = -d.l; d.x = Math.random() * (W + 40); }
        ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * .12, d.y + d.l);
      }
      ctx.stroke();
      gloomRAF = requestAnimationFrame(frame);
    }
  }
  gloomRAF = requestAnimationFrame(frame);
}

// Keep the game state across live republishes of the artifact.
window.claude?.hot?.snapshot?.(() => S);
City.mount($("#map"), () => placeLabels());
$("#z-in").addEventListener("click", () => City.zoomAt(.62));
$("#z-out").addEventListener("click", () => City.zoomAt(1 / .62));
$("#z-all").addEventListener("click", () => City.look(City.FULL));

// Labels follow the buildings as the camera moves.
function placeLabels() {
  const map = $("#map"), v = City.view();
  if (!v) return;
  const W = map.clientWidth, H = map.clientHeight;
  map.classList.toggle("compact", W < 620 && v[2] > 560);
  for (const el of document.querySelectorAll(".map-label")) {
    const [ax, ay] = City.anchors[el.dataset.b];
    el.style.transform = `translate(${((ax - v[0]) / v[2] * W).toFixed(1)}px, ${((ay - v[1]) / v[3] * H).toFixed(1)}px) translate(-50%, -100%)`;
  }
}
$("#map-labels").innerHTML = City.KEYS.map(k => `<button class="map-label idle" data-b="${k}"><span class="ic" aria-hidden="true"></span><span class="nm"></span></button>`).join("");

// Click a building or its label to open it. Works from the first screen too.
$("#map").addEventListener("click", e => {
  const g = e.target.closest?.(".bldg, .map-label");
  if (!g || City.wasDrag()) return;
  const i = INCIDENTS.findIndex(x => x.building === g.dataset.b);
  if (i >= 0) openBuilding(i);
});

function start(saved) {
  if (saved && saved.answers && !Array.isArray(saved.answers) && Array.isArray(saved.realFirst) && saved.realFirst.length === INCIDENTS.length) S = saved;
  else newGame();
  render(true);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
</script>

</body>
</html>
