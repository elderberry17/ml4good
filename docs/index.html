த்துகின்றன. மாற்று வழிகள், தணிக்கைகள், மேல்முறையீட்டு வழிகள் ஆகியவற்றைவிட இந்த அமைப்புகள் வேகமாகப் பரவினால், மேலும் பலர் மேல்முறையீடு செய்ய வாய்ப்பே கிட்டத்தட்ட இல்லாமல் தானாகவே விலக்கப்படக்கூடும்."}, "sv": {"title": "Ansiktsverifiering och tillgång till socialt stöd", "domain": "Offentlig service", "hook": "en enda misslyckad ansiktskontroll", "real": "En **portal för ansiktsverifiering** ska ha krånglat gång på gång. Det var ett av skälen till att vissa människor **inte fick ut sina sociala bidrag**.", "fake": "Ett AI-system som **sorterar brev från invånare** ska ha skickat hundratals överklaganden om bidrag till fel avdelning. Människor **missade tidsfristen för att överklaga** innan någon märkte det.", "excerpt": "Mottagare av sociala bidrag i Sydafrika ska ha drabbats av upprepade misslyckanden i SASSA:s portal för ansiktsverifiering, eLife.", "explanation": "I Sydafrika ska bidragsmottagare gång på gång ha stött på fel i en portal för ansiktsverifiering som drivs av den statliga myndigheten SASSA. Rapporter till parlamentet angav senare misslyckad ansiktsigenkänning som en av orsakerna till att människor inte verifierades. De bekräftade också 67 868 indragna bidrag under ett kvartal. De sade inte hur många som berodde på ansiktsverifieringen.", "whyBad": "När tillgången till grundläggande stöd hänger på en automatisk identitetskontroll är ett felaktigt avslag allvarligt. För den som lever på ett bidrag kan det betyda inga pengar till mat, hyra, resor eller medicin. Eftersom ett system betjänar alla kan ett enda fel drabba många på en gång. Och att rätta felet hamnar ofta på dem som har minst tid, pengar och tillgång till internet för att överklaga.", "escalation": "Stater och företag använder ansiktsverifiering och andra AI-baserade identitetskontroller för bidrag, bank, försäkring, jobb och tillträde till byggnader. Om systemen sprids snabbare än reservlösningar, granskningar och möjligheter att överklaga kan fler människor stängas ute automatiskt, nästan utan chans att överklaga."}, "tr": {"title": "Yüz doğrulama ve sosyal yardımlara erişim", "domain": "Kamu hizmetleri", "hook": "tek bir başarısız yüz doğrulaması", "real": "Bir **yüz doğrulama portalının** tekrar tekrar arıza verdiği bildirildi. Bu, bazı insanların **sosyal yardımlarını alamamasının** nedenlerinden biriydi.", "fake": "**Vatandaşlardan gelen mektupları sınıflandıran** bir yapay zekâ sisteminin, sosyal yardımlarla ilgili yüzlerce itirazı yanlış birime gönderdiği bildirildi. İnsanlar, kimse fark etmeden **itiraz süresini kaçırdı**.", "excerpt": "Güney Afrika'daki sosyal yardım alıcılarının SASSA'nın eLife yüz doğrulama portalında tekrarlanan başarısızlıklarla karşılaştığı bildirildi.", "explanation": "Güney Afrika’da sosyal yardım alanların, devlet kurumu SASSA’nın işlettiği bir yüz doğrulama portalında tekrar tekrar arızalarla karşılaştığı bildirildi. Parlamentoya sunulan raporlar daha sonra, insanların doğrulanamamasının nedenlerinden biri olarak yüz tanımanın başarısız olmasını gösterdi. Raporlar ayrıca bir çeyrekte 67.868 yardımın askıya alındığını doğruladı. Bunların kaçının yüz doğrulamadan kaynaklandığını belirtmedi.", "whyBad": "Temel desteğe erişim otomatik bir kimlik kontrolüne bağlı olduğunda, yanlış bir ret ciddi bir sorundur. Yardımla geçinen biri için bu; yemek, kira, ulaşım veya ilaç için para olmaması demek olabilir. Tek bir sistem herkese hizmet verdiği için tek bir arıza aynı anda birçok insanı etkileyebilir. Hatayı düzeltmek ise çoğu zaman itiraz etmek için en az zamana, paraya ve internet erişimine sahip olanlara kalır.", "escalation": "Devletler ve şirketler, sosyal yardımlar, bankacılık, sigorta, iş ve binalara giriş için yüz doğrulamayı ve diğer yapay zekâ tabanlı kimlik kontrollerini kullanıyor. Bu sistemler yedek çözümlerden, denetimlerden ve itiraz yollarından daha hızlı yayılırsa, daha fazla insan neredeyse hiç itiraz şansı olmadan otomatik olarak dışarıda kalabilir."}}}, {"id": 1623, "url": "https://incidentdatabase.ai/cite/1623/", "building": "school", "text": {"en": {"title": "Students allegedly made inappropriate deepfake images of classmates", "domain": "Schools", "hook": "two students with an image tool", "real": "Two students at a private school allegedly used AI tools to create and share hundreds of **inappropriate fake images of female classmates**. Authorities later identified dozens of victims, almost all of them minors.", "fake": "Two students at a public high school allegedly used AI tools to produce realistic **letters on school letterhead accusing classmates of drug use** and sent them to parents. The school later identified dozens of affected families.", "excerpt": "Authorities later identified 60 victims, 59 of them minors.", "explanation": "Over about six months, two students at a Pennsylvania school allegedly used AI tools to make and swap hundreds of inappropriate deepfake images of female classmates and other girls. Authorities later identified 60 victims, 59 of them minors. A juvenile court found the students responsible. Families later sued the school and unnamed AI companies.", "whyBad": "Nothing malfunctioned here. The tools worked as designed and were used against people who never agreed to it. Image generators let anyone, including children, make realistic and humiliating fake images of a real person from ordinary photos. The victims are harmed whether or not viewers know the images are fake. Schools, parents and courts have to respond with rules written when making such images took skill and effort.", "escalation": "Making fake images and video keeps getting cheaper, more realistic and easier, and needs fewer photos of the person targeted. If safeguards in the tools, reporting routes in schools and legal responsibility do not keep up, this kind of abuse could become a routine part of bullying and blackmail. It could reach far more children with almost no effort from the person doing it."}, "fr": {"title": "Des élèves auraient créé des deepfakes inappropriés de camarades de classe", "domain": "École", "hook": "deux élèves et un générateur d’images", "real": "Deux élèves d’une école privée auraient utilisé des outils d’IA pour créer et partager des centaines d’**images truquées inappropriées de camarades de classe**. Les autorités ont ensuite identifié des dizaines de victimes, presque toutes mineures.", "fake": "Deux élèves d’un lycée public auraient utilisé des outils d’IA pour produire des **lettres réalistes à en-tête de l’établissement accusant des camarades de consommer de la drogue** et les auraient envoyées aux parents. L’établissement a ensuite identifié des dizaines de familles concernées.", "excerpt": "Les autorités ont ensuite identifié 60 victimes, dont 59 mineures.", "explanation": "Pendant environ six mois, deux élèves d’une école de Pennsylvanie auraient utilisé des outils d’IA pour fabriquer et échanger des centaines d’images deepfake inappropriées de camarades de classe et d’autres jeunes filles. Les autorités ont ensuite identifié 60 victimes, dont 59 mineures. Un tribunal pour mineurs a reconnu les élèves responsables. Des familles ont ensuite poursuivi l’école et des entreprises d’IA non nommées.", "whyBad": "Rien n’a dysfonctionné ici. Les outils ont fonctionné comme prévu et ont été utilisés contre des personnes qui n’avaient jamais donné leur accord. Les générateurs d’images permettent à n’importe qui, y compris des enfants, de fabriquer de fausses images réalistes et humiliantes d’une personne réelle à partir de simples photos. Les victimes subissent un préjudice, que les spectateurs sachent ou non que les images sont fausses. Les écoles, les parents et les tribunaux doivent réagir avec des règles écrites à une époque où fabriquer de telles images demandait des compétences et des efforts.", "escalation": "Fabriquer de fausses images et vidéos devient toujours moins cher, plus réaliste et plus simple, et demande moins de photos de la personne visée. Si les protections intégrées aux outils, les moyens de signalement dans les écoles et la responsabilité juridique ne suivent pas, ce type d’abus pourrait devenir une part ordinaire du harcèlement et du chantage. Il pourrait toucher beaucoup plus d’enfants, presque sans effort de la part de l’auteur."}, "de": {"title": "Schüler sollen unangemessene Deepfakes von Mitschülerinnen erstellt haben", "domain": "Schule", "hook": "ein Bildgenerator in der Hand zweier Schüler", "real": "Zwei Schüler einer Privatschule sollen mit KI-Werkzeugen Hunderte **unangemessene gefälschte Bilder von Mitschülerinnen** erstellt und geteilt haben. Die Behörden identifizierten später Dutzende Opfer, fast alle minderjährig.", "fake": "Zwei Schüler einer staatlichen Schule sollen mit KI-Werkzeugen täuschend echte **Briefe auf Schulbriefpapier, die Mitschülern Drogenkonsum vorwarfen**, erstellt und an die Eltern geschickt haben. Die Schule identifizierte später Dutzende betroffene Familien.", "excerpt": "Die Behörden identifizierten später 60 Opfer, 59 davon minderjährig.", "explanation": "Über etwa sechs Monate sollen zwei Schüler einer Schule in Pennsylvania mit KI-Werkzeugen Hunderte unangemessene Deepfake-Bilder von Mitschülerinnen und anderen Mädchen erstellt und getauscht haben. Die Behörden identifizierten später 60 Opfer, 59 davon minderjährig. Ein Jugendgericht stellte die Verantwortlichkeit der Schüler fest. Familien verklagten später die Schule und nicht genannte KI-Unternehmen.", "whyBad": "Hier hat nichts versagt. Die Werkzeuge funktionierten wie vorgesehen und wurden gegen Menschen eingesetzt, die dem nie zugestimmt hatten. Mit Bildgeneratoren kann jeder, auch Kinder, aus gewöhnlichen Fotos realistische und demütigende Fälschungen einer echten Person herstellen. Die Opfer werden geschädigt, egal ob die Betrachter wissen, dass die Bilder gefälscht sind. Schulen, Eltern und Gerichte müssen mit Regeln reagieren, die aus einer Zeit stammen, als solche Bilder Können und Mühe erforderten.", "escalation": "Gefälschte Bilder und Videos herzustellen wird immer billiger, realistischer und einfacher und braucht immer weniger Fotos der betroffenen Person. Wenn Schutzmaßnahmen in den Werkzeugen, Meldewege an Schulen und rechtliche Verantwortung nicht Schritt halten, könnte diese Art von Missbrauch ein gewöhnlicher Teil von Mobbing und Erpressung werden. Sie könnte weit mehr Kinder treffen, fast ohne Aufwand für den Täter."}, "ru": {"title": "Школьники предположительно создали непристойные дипфейки одноклассниц", "domain": "Школа", "hook": "двое школьников с генератором изображений", "real": "Двое учеников частной школы предположительно использовали ИИ-инструменты, чтобы создать и распространить сотни **непристойных поддельных изображений одноклассниц**. Позже власти установили десятки пострадавших, почти все они несовершеннолетние.", "fake": "Двое учеников государственной школы предположительно изготовили с помощью ИИ правдоподобные **письма на школьном бланке с обвинениями одноклассников в употреблении наркотиков** и разослали их родителям. Позже школа установила десятки пострадавших семей.", "excerpt": "Позже власти установили 60 пострадавших, 59 из них — несовершеннолетние.", "explanation": "Около полугода двое учеников школы в Пенсильвании предположительно создавали с помощью ИИ-инструментов сотни непристойных дипфейк-изображений одноклассниц и других девочек и обменивались ими. Позже власти установили 60 пострадавших, 59 из них несовершеннолетние. Суд по делам несовершеннолетних признал учеников правонарушителями. Семьи потом подали иск к школе и неназванным ИИ-компаниям.", "whyBad": "Здесь ничего не сломалось. Инструменты работали так, как задумано, и их использовали против людей, которые на это не соглашались. Генераторы изображений позволяют кому угодно, включая детей, делать реалистичные унизительные подделки с реальным человеком из обычных фотографий. Пострадавшим причиняется вред независимо от того, знают ли зрители, что изображения поддельные. Школам, родителям и судам приходится действовать по правилам, написанным во времена, когда такие изображения требовали навыков и усилий.", "escalation": "Создавать поддельные изображения и видео становится всё дешевле и проще, они выглядят всё реалистичнее, а фотографий жертвы нужно всё меньше. Если защита в самих инструментах, способы пожаловаться в школе и юридическая ответственность не будут за этим успевать, такое насилие может стать обычной частью травли и шантажа. Оно сможет затронуть гораздо больше детей почти без усилий со стороны обидчика."}, "it": {"title": "Studenti avrebbero creato deepfake inappropriati di compagne di classe", "domain": "Scuola", "hook": "due studenti con un generatore di immagini", "real": "Due studenti di una scuola privata avrebbero usato strumenti di IA per creare e condividere centinaia di **immagini false e inappropriate di compagne di classe**. Le autorità hanno poi identificato decine di vittime, quasi tutte minorenni.", "fake": "Due studenti di una scuola pubblica avrebbero usato strumenti di IA per produrre **lettere realistiche su carta intestata della scuola che accusavano alcuni compagni di fare uso di droghe** e le avrebbero inviate ai genitori. La scuola ha poi identificato decine di famiglie coinvolte.", "excerpt": "Le autorità hanno poi identificato 60 vittime, 59 delle quali minorenni.", "explanation": "Per circa sei mesi, due studenti di una scuola della Pennsylvania avrebbero usato strumenti di IA per creare e scambiarsi centinaia di immagini deepfake inappropriate di compagne di classe e di altre ragazze. Le autorità hanno poi identificato 60 vittime, 59 delle quali minorenni. Un tribunale per i minorenni ha ritenuto responsabili gli studenti. In seguito alcune famiglie hanno fatto causa alla scuola e ad aziende di IA non nominate.", "whyBad": "Qui non si è guastato nulla. Gli strumenti hanno funzionato come previsto e sono stati usati contro persone che non avevano mai dato il consenso. I generatori di immagini permettono a chiunque, bambini compresi, di creare da normali fotografie immagini false, realistiche e umilianti di una persona reale. Le vittime subiscono un danno sia che chi guarda sappia che le immagini sono false, sia che non lo sappia. Scuole, genitori e tribunali devono rispondere con regole scritte quando creare immagini simili richiedeva abilità e fatica.", "escalation": "Creare immagini e video falsi diventa sempre più economico, realistico e facile, e richiede meno fotografie della persona presa di mira. Se le protezioni negli strumenti, i canali di segnalazione nelle scuole e la responsabilità legale non tengono il passo, questo tipo di abuso potrebbe diventare una parte abituale del bullismo e del ricatto. Potrebbe raggiungere molti più bambini quasi senza sforzo da parte di chi lo commette."}, "es": {"title": "Estudiantes presuntamente crearon deepfakes inapropiados de compañeras de clase", "domain": "Escuela", "hook": "un generador de imágenes en manos de dos estudiantes", "real": "Dos estudiantes de un colegio privado habrían usado herramientas de IA para crear y compartir cientos de **imágenes falsas inapropiadas de compañeras de clase**. Las autoridades identificaron después a decenas de víctimas, casi todas menores.", "fake": "Dos estudiantes de un instituto público habrían usado herramientas de IA para producir **cartas realistas con membrete del centro que acusaban a compañeros de consumir drogas** y enviarlas a los padres. El centro identificó después a decenas de familias afectadas.", "excerpt": "Las autoridades identificaron después a 60 víctimas, 59 de ellas menores.", "explanation": "Durante unos seis meses, dos estudiantes de un colegio de Pensilvania habrían usado herramientas de IA para crear e intercambiar cientos de imágenes deepfake inapropiadas de compañeras de clase y de otras chicas. Las autoridades identificaron después a 60 víctimas, 59 de ellas menores. Un tribunal de menores declaró responsables a los estudiantes. Más tarde, varias familias demandaron al colegio y a empresas de IA no identificadas.", "whyBad": "Aquí no falló nada. Las herramientas funcionaron según lo previsto y se usaron contra personas que nunca dieron su consentimiento. Los generadores de imágenes permiten a cualquiera, incluidos niños, crear a partir de fotos corrientes imágenes falsas, realistas y humillantes de una persona real. Las víctimas sufren el daño sepan o no los espectadores que las imágenes son falsas. Los colegios, los padres y los tribunales tienen que responder con normas escritas cuando crear esas imágenes exigía habilidad y esfuerzo.", "escalation": "Crear imágenes y vídeos falsos es cada vez más barato, realista y fácil, y requiere menos fotos de la persona atacada. Si las protecciones de las herramientas, las vías de denuncia en los colegios y la responsabilidad legal no avanzan al mismo ritmo, este tipo de abuso podría volverse una parte habitual del acoso y el chantaje. Podría alcanzar a muchos más niños casi sin esfuerzo por parte de quien lo comete."}, "ko": {"title": "학생들이 급우의 부적절한 딥페이크를 만든 혐의", "domain": "학교", "hook": "이미지 생성 도구를 쓴 학생 두 명", "real": "한 사립학교 학생 두 명이 AI 도구로 **같은 반 여학생들의 부적절한 가짜 이미지** 수백 장을 만들어 공유했다는 혐의를 받았습니다. 이후 당국은 수십 명의 피해자를 확인했고, 거의 모두 미성년자였습니다.", "fake": "한 공립학교 학생 두 명이 AI 도구로 **같은 반 학생들이 마약을 한다고 고발하는, 학교 공식 서식의** 그럴듯한 **편지**를 만들어 학부모들에게 보냈다는 혐의를 받았습니다. 이후 학교는 피해를 본 수십 가정을 확인했습니다.", "excerpt": "당국은 이후 피해자 60명을 확인했고 그중 59명이 미성년자였다.", "explanation": "펜실베이니아의 한 학교 학생 두 명이 약 6개월 동안 AI 도구로 같은 반 여학생들과 다른 여학생들의 부적절한 딥페이크 이미지 수백 장을 만들어 주고받았다는 혐의를 받았습니다. 이후 당국은 피해자 60명을 확인했고, 그중 59명이 미성년자였습니다. 소년법원은 두 학생에게 책임이 있다고 판단했습니다. 이후 가족들은 학교와 이름이 밝혀지지 않은 AI 기업들을 상대로 소송을 냈습니다.", "whyBad": "여기서는 아무것도 고장 나지 않았습니다. 도구는 설계된 대로 작동했고, 동의한 적 없는 사람들을 상대로 쓰였습니다. 이미지 생성기를 쓰면 어린이를 포함해 누구나 평범한 사진으로 실제 인물의 사실적이고 모욕적인 가짜 이미지를 만들 수 있습니다. 보는 사람이 가짜라는 것을 알든 모르든 피해자는 해를 입습니다. 학교, 부모, 법원은 그런 이미지를 만들려면 기술과 노력이 필요하던 시절에 쓰인 규칙으로 대응해야 합니다.", "escalation": "가짜 이미지와 영상을 만드는 일은 계속 더 싸고, 더 사실적이고, 더 쉬워지고 있으며, 대상이 된 사람의 사진도 더 적게 필요합니다. 도구 안의 안전장치, 학교의 신고 절차, 법적 책임이 이를 따라가지 못하면, 이런 가해는 괴롭힘과 협박의 흔한 일부가 될 수 있습니다. 가해자는 거의 힘을 들이지 않고도 훨씬 많은 아이들에게 피해를 줄 수 있습니다."}, "zh": {"title": "学生被指制作同学的不雅深度伪造图像", "domain": "学校", "hook": "两名学生和一个图像生成工具", "real": "据称，一所私立学校的两名学生使用AI工具制作并传播了数百张**同班女生的不雅伪造图片**。当局后来确认了数十名受害者，几乎全是未成年人。", "fake": "据称，一所公立学校的两名学生使用AI工具制作了逼真的**带有学校信头、指控同学吸毒的信件**，并寄给了家长。学校后来确认了数十个受影响的家庭。", "excerpt": "当局后来确认了 60 名受害者，其中 59 人是未成年人。", "explanation": "据称，在大约六个月的时间里，宾夕法尼亚州一所学校的两名学生使用AI工具制作并交换了数百张同班女生和其他女孩的不雅深度伪造图片。当局后来确认了60名受害者，其中59人是未成年人。少年法庭认定这两名学生负有责任。一些家庭后来起诉了学校和未具名的AI公司。", "whyBad": "这里没有任何东西出故障。工具按设计正常运行，却被用来对付从未同意的人。有了图像生成器，任何人，包括孩子，都能用普通照片制作出某个真实的人的逼真而带有羞辱性的假图片。无论观看者是否知道图片是假的，受害者都会受到伤害。学校、家长和法院只能用过去制定的规则来应对，那时制作这样的图片还需要技术和精力。", "escalation": "制作假图片和假视频越来越便宜、越来越逼真、越来越容易，需要的受害者照片也越来越少。如果工具中的防护措施、学校里的举报渠道和法律责任跟不上，这类侵害可能成为霸凌和勒索中常见的一部分。施害者几乎不费力气，就可能伤害到多得多的孩子。"}, "sr": {"title": "Ученици су наводно правили непримерене дипфејкове другарица из разреда", "domain": "Школа", "hook": "двојица ученика са генератором слика", "real": "Двојица ученика приватне школе су, према наводима, помоћу алата вештачке интелигенције направила и делила стотине **непримерених лажних слика другарица из разреда**. Власти су касније идентификовале десетине жртава, скоро све малолетне.", "fake": "Двојица ученика државне школе су, према наводима, помоћу алата вештачке интелигенције направила уверљива **писма на школском меморандуму која оптужују другове из разреда за коришћење дроге** и послала их родитељима. Школа је касније идентификовала десетине погођених породица.", "excerpt": "Власти су касније идентификовале 60 жртава, од којих је 59 малолетно.", "explanation": "Током око шест месеци, двојица ученика једне школе у Пенсилванији су, према наводима, помоћу алата вештачке интелигенције правила и размењивала стотине непримерених дипфејк слика другарица из разреда и других девојчица. Власти су касније идентификовале 60 жртава, од којих 59 малолетних. Суд за малолетнике је утврдио одговорност ученика. Породице су касније тужиле школу и неименоване компаније за вештачку интелигенцију.", "whyBad": "Овде се ништа није покварило. Алати су радили како је предвиђено и употребљени су против људи који на то никада нису пристали. Генератори слика омогућавају свакоме, па и деци, да од обичних фотографија направи реалистичне и понижавајуће лажне слике стварне особе. Жртве трпе штету без обзира на то да ли гледаоци знају да су слике лажне. Школе, родитељи и судови морају да реагују по правилима писаним у време када је израда таквих слика тражила вештину и труд.", "escalation": "Израда лажних слика и видеа постаје све јефтинија, реалистичнија и лакша, а потребно је све мање фотографија особе која је мета. Ако заштита у самим алатима, начини пријављивања у школама и правна одговорност не буду држали корак, оваква злоупотреба би могла да постане уобичајен део вршњачког насиља и уцена. Могла би да погоди много више деце, скоро без труда оног ко је чини."}, "bs": {"title": "Učenici su navodno pravili neprimjerene deepfakeove školskih kolegica", "domain": "Škola", "hook": "dvojica učenika s generatorom slika", "real": "Dvojica učenika privatne škole su, prema navodima, pomoću AI alata napravila i dijelila stotine **neprimjerenih lažnih slika drugarica iz razreda**. Vlasti su kasnije identificirale desetine žrtava, skoro sve maloljetne.", "fake": "Dvojica učenika državne škole su, prema navodima, pomoću AI alata napravila uvjerljiva **pisma na školskom memorandumu koja optužuju drugove iz razreda za korištenje droge** i poslala ih roditeljima. Škola je kasnije identificirala desetine pogođenih porodica.", "excerpt": "Vlasti su kasnije identifikovale 60 žrtava, od kojih je 59 maloljetno.", "explanation": "Tokom oko šest mjeseci, dvojica učenika jedne škole u Pensilvaniji su, prema navodima, pomoću AI alata pravila i razmjenjivala stotine neprimjerenih deepfake slika drugarica iz razreda i drugih djevojčica. Vlasti su kasnije identificirale 60 žrtava, od kojih 59 maloljetnih. Sud za maloljetnike je utvrdio odgovornost učenika. Porodice su kasnije tužile školu i neimenovane AI kompanije.", "whyBad": "Ovdje se ništa nije pokvarilo. Alati su radili kako je predviđeno i upotrijebljeni su protiv ljudi koji na to nikada nisu pristali. Generatori slika omogućavaju svakome, pa i djeci, da od običnih fotografija napravi realistične i ponižavajuće lažne slike stvarne osobe. Žrtve trpe štetu bez obzira na to da li gledaoci znaju da su slike lažne. Škole, roditelji i sudovi moraju reagovati po pravilima pisanim u vrijeme kada je izrada takvih slika tražila vještinu i trud.", "escalation": "Izrada lažnih slika i videa postaje sve jeftinija, realističnija i lakša, a potrebno je sve manje fotografija osobe koja je meta. Ako zaštita u samim alatima, načini prijavljivanja u školama i pravna odgovornost ne budu držali korak, ovakva zloupotreba bi mogla postati uobičajen dio vršnjačkog nasilja i ucjena. Mogla bi pogoditi mnogo više djece, skoro bez truda onoga ko je čini."}, "ro": {"title": "Elevi ar fi creat deepfake-uri nepotrivite cu colege de clasă", "domain": "Școală", "hook": "doi elevi cu un generator de imagini", "real": "Doi elevi ai unei școli private ar fi folosit instrumente de IA pentru a crea și distribui sute de **imagini false nepotrivite cu colege de clasă**. Autoritățile au identificat ulterior zeci de victime, aproape toate minore.", "fake": "Doi elevi ai unei școli de stat ar fi folosit instrumente de IA pentru a produce **scrisori realiste cu antetul școlii care acuzau colegi de consum de droguri** și le-ar fi trimis părinților. Școala a identificat ulterior zeci de familii afectate.", "excerpt": "Autoritățile au identificat ulterior 60 de victime, dintre care 59 minore.", "explanation": "Timp de aproximativ șase luni, doi elevi ai unei școli din Pennsylvania ar fi folosit instrumente de IA pentru a crea și a face schimb de sute de imagini deepfake nepotrivite cu colege de clasă și alte fete. Autoritățile au identificat ulterior 60 de victime, dintre care 59 minore. O instanță pentru minori i-a găsit răspunzători pe elevi. Ulterior, familiile au dat în judecată școala și companii de IA nenumite.", "whyBad": "Aici nu s-a defectat nimic. Instrumentele au funcționat așa cum au fost concepute și au fost folosite împotriva unor oameni care nu și-au dat niciodată acordul. Generatoarele de imagini permit oricui, inclusiv copiilor, să facă din fotografii obișnuite imagini false, realiste și umilitoare cu o persoană reală. Victimele suferă indiferent dacă privitorii știu sau nu că imaginile sunt false. Școlile, părinții și instanțele trebuie să răspundă cu reguli scrise pe vremea când astfel de imagini cereau pricepere și efort.", "escalation": "Crearea de imagini și videoclipuri false devine tot mai ieftină, mai realistă și mai ușoară și cere mai puține fotografii ale persoanei vizate. Dacă protecțiile din instrumente, căile de sesizare din școli și răspunderea legală nu țin pasul, acest tip de abuz ar putea deveni o parte obișnuită a hărțuirii și a șantajului. Ar putea ajunge la mult mai mulți copii, aproape fără efort din partea celui care îl comite."}, "vi": {"title": "Học sinh bị cáo buộc tạo ảnh deepfake phản cảm về bạn cùng lớp", "domain": "Trường học", "hook": "hai học sinh với một công cụ tạo ảnh", "real": "Hai học sinh một trường tư được cho là đã dùng công cụ AI để tạo và chia sẻ hàng trăm **hình ảnh giả không phù hợp về các bạn nữ cùng lớp**. Nhà chức trách sau đó xác định được hàng chục nạn nhân, gần như tất cả đều chưa thành niên.", "fake": "Hai học sinh một trường công được cho là đã dùng công cụ AI để tạo ra những **lá thư trông như thật trên giấy tiêu đề của trường, cáo buộc bạn cùng lớp sử dụng ma túy** và gửi cho phụ huynh. Nhà trường sau đó xác định được hàng chục gia đình bị ảnh hưởng.", "excerpt": "Nhà chức trách sau đó xác định được 60 nạn nhân, trong đó 59 người là trẻ vị thành niên.", "explanation": "Trong khoảng sáu tháng, hai học sinh một trường ở Pennsylvania được cho là đã dùng công cụ AI để tạo và trao đổi hàng trăm hình ảnh deepfake không phù hợp về các bạn nữ cùng lớp và những nữ sinh khác. Nhà chức trách sau đó xác định được 60 nạn nhân, trong đó 59 người chưa thành niên. Tòa án vị thành niên kết luận hai học sinh phải chịu trách nhiệm. Sau đó các gia đình đã kiện nhà trường và các công ty AI không được nêu tên.", "whyBad": "Ở đây không có gì bị hỏng. Các công cụ hoạt động đúng như thiết kế và bị dùng để chống lại những người chưa bao giờ đồng ý. Công cụ tạo ảnh cho phép bất kỳ ai, kể cả trẻ em, tạo ra hình ảnh giả chân thực và gây nhục nhã về một người thật từ những bức ảnh bình thường. Nạn nhân bị tổn hại dù người xem có biết hình ảnh là giả hay không. Nhà trường, phụ huynh và tòa án phải ứng phó bằng những quy định được viết ra khi việc tạo hình ảnh như vậy còn đòi hỏi kỹ năng và công sức.", "escalation": "Việc tạo hình ảnh và video giả ngày càng rẻ, chân thực và dễ dàng hơn, và cần ít ảnh của người bị nhắm đến hơn. Nếu các biện pháp bảo vệ trong công cụ, kênh báo cáo trong trường học và trách nhiệm pháp lý không theo kịp, kiểu xâm hại này có thể trở thành một phần thường thấy của bắt nạt và tống tiền. Nó có thể ảnh hưởng đến nhiều trẻ em hơn rất nhiều mà kẻ gây ra gần như không tốn công sức."}, "uk": {"title": "Школярі ймовірно створили непристойні діпфейки однокласниць", "domain": "Школа", "hook": "двоє школярів із генератором зображень", "real": "Двоє учнів приватної школи, як стверджується, використали ШІ-інструменти, щоб створити й поширити сотні **непристойних підроблених зображень однокласниць**. Пізніше влада встановила десятки постраждалих, майже всі неповнолітні.", "fake": "Двоє учнів державної школи, як стверджується, використали ШІ-інструменти, щоб виготовити правдоподібні **листи на шкільному бланку зі звинуваченнями однокласників у вживанні наркотиків** і розіслати їх батькам. Пізніше школа встановила десятки постраждалих сімей.", "excerpt": "Згодом влада встановила 60 постраждалих, 59 із них — неповнолітні.", "explanation": "Близько пів року двоє учнів школи в Пенсильванії, як стверджується, створювали за допомогою ШІ-інструментів сотні непристойних дипфейк-зображень однокласниць та інших дівчат і обмінювалися ними. Пізніше влада встановила 60 постраждалих, 59 із них неповнолітні. Суд у справах неповнолітніх визнав учнів відповідальними. Згодом сім’ї подали позов проти школи та неназваних ШІ-компаній.", "whyBad": "Тут нічого не зламалося. Інструменти працювали так, як задумано, і їх використали проти людей, які на це не погоджувалися. Генератори зображень дають змогу будь-кому, зокрема дітям, робити зі звичайних фотографій реалістичні й принизливі підробки з реальною людиною. Постраждалим завдано шкоди незалежно від того, чи знають глядачі, що зображення підроблені. Школам, батькам і судам доводиться діяти за правилами, написаними тоді, коли такі зображення потребували вміння і зусиль.", "escalation": "Створювати підроблені зображення та відео стає дедалі дешевше й простіше, вони виглядають реалістичніше, а фотографій жертви потрібно менше. Якщо захист у самих інструментах, способи поскаржитися в школі та юридична відповідальність не встигатимуть за цим, таке насильство може стати звичною частиною цькування і шантажу. Воно зможе зачепити набагато більше дітей майже без зусиль із боку кривдника."}, "pl": {"title": "Uczniowie mieli stworzyć niestosowne deepfake’i koleżanek z klasy", "domain": "Szkoła", "hook": "dwóch uczniów z generatorem obrazów", "real": "Dwóch uczniów prywatnej szkoły miało użyć narzędzi AI do stworzenia i rozpowszechnienia setek **nieodpowiednich fałszywych zdjęć koleżanek z klasy**. Władze zidentyfikowały później dziesiątki ofiar, prawie wszystkie niepełnoletnie.", "fake": "Dwóch uczniów szkoły publicznej miało użyć narzędzi AI do przygotowania realistycznych **pism na szkolnym papierze firmowym, oskarżających kolegów z klasy o zażywanie narkotyków**, i wysłać je rodzicom. Szkoła zidentyfikowała później dziesiątki poszkodowanych rodzin.", "excerpt": "Władze zidentyfikowały później 60 ofiar, z których 59 było niepełnoletnich.", "explanation": "Przez około pół roku dwóch uczniów szkoły w Pensylwanii miało za pomocą narzędzi AI tworzyć i wymieniać setki nieodpowiednich obrazów deepfake przedstawiających koleżanki z klasy i inne dziewczęta. Władze zidentyfikowały później 60 ofiar, w tym 59 niepełnoletnich. Sąd dla nieletnich uznał uczniów za odpowiedzialnych. Później rodziny pozwały szkołę i niewymienione z nazwy firmy AI.", "whyBad": "Nic tu nie zawiodło. Narzędzia działały zgodnie z przeznaczeniem i użyto ich przeciwko osobom, które nigdy się na to nie zgodziły. Generatory obrazów pozwalają każdemu, także dzieciom, robić ze zwykłych zdjęć realistyczne i upokarzające fałszywe obrazy prawdziwej osoby. Ofiary ponoszą szkodę bez względu na to, czy oglądający wiedzą, że obrazy są fałszywe. Szkoły, rodzice i sądy muszą reagować według zasad napisanych wtedy, gdy tworzenie takich obrazów wymagało umiejętności i wysiłku.", "escalation": "Tworzenie fałszywych zdjęć i filmów jest coraz tańsze, łatwiejsze i bardziej realistyczne, a zdjęć ofiary potrzeba coraz mniej. Jeśli zabezpieczenia w narzędziach, ścieżki zgłaszania w szkołach i odpowiedzialność prawna za tym nie nadążą, taka przemoc może stać się zwykłą częścią nękania i szantażu. Może dotknąć znacznie więcej dzieci, prawie bez wysiłku ze strony sprawcy."}, "ta": {"title": "மாணவர்கள் சக மாணவிகளின் தகாத டீப்ஃபேக் படங்களை உருவாக்கியதாகக் குற்றச்சாட்டு", "domain": "பள்ளி", "hook": "பட உருவாக்கக் கருவியுடன் இரண்டு மாணவர்கள்", "real": "ஒரு தனியார் பள்ளியின் இரண்டு மாணவர்கள், AI கருவிகளைப் பயன்படுத்தி **வகுப்புத் தோழிகளின் பொருத்தமற்ற போலிப் படங்களை** நூற்றுக்கணக்கில் உருவாக்கிப் பகிர்ந்ததாகக் குற்றம் சாட்டப்படுகிறது. அதிகாரிகள் பின்னர் டஜன் கணக்கான பாதிக்கப்பட்டவர்களை அடையாளம் கண்டனர்; கிட்டத்தட்ட அனைவரும் சிறார்கள்.", "fake": "ஓர் அரசுப் பள்ளியின் இரண்டு மாணவர்கள், AI கருவிகளைப் பயன்படுத்தி, **வகுப்புத் தோழர்கள் போதைப்பொருள் பயன்படுத்துவதாகக் குற்றம் சாட்டும், பள்ளியின் கடிதத் தலைப்புடன் கூடிய** உண்மை போன்ற **கடிதங்களை** உருவாக்கிப் பெற்றோருக்கு அனுப்பியதாகக் குற்றம் சாட்டப்படுகிறது. பள்ளி பின்னர் டஜன் கணக்கான பாதிக்கப்பட்ட குடும்பங்களை அடையாளம் கண்டது.", "excerpt": "அதிகாரிகள் பின்னர் 60 பாதிக்கப்பட்டவர்களை அடையாளம் கண்டனர்; அவர்களில் 59 பேர் சிறார்.", "explanation": "பென்சில்வேனியாவில் உள்ள ஒரு பள்ளியின் இரண்டு மாணவர்கள், சுமார் ஆறு மாதங்களாக AI கருவிகளைப் பயன்படுத்தி வகுப்புத் தோழிகள் மற்றும் பிற சிறுமிகளின் நூற்றுக்கணக்கான பொருத்தமற்ற டீப்ஃபேக் படங்களை உருவாக்கிப் பரிமாறிக்கொண்டதாகக் குற்றம் சாட்டப்படுகிறது. அதிகாரிகள் பின்னர் 60 பாதிக்கப்பட்டவர்களை அடையாளம் கண்டனர்; அவர்களில் 59 பேர் சிறார்கள். சிறார் நீதிமன்றம் அந்த மாணவர்களைப் பொறுப்பாளிகள் என்று தீர்மானித்தது. குடும்பங்கள் பின்னர் பள்ளி மீதும் பெயர் குறிப்பிடப்படாத AI நிறுவனங்கள் மீதும் வழக்குத் தொடர்ந்தன.", "whyBad": "இங்கே எதுவும் பழுதடையவில்லை. கருவிகள் வடிவமைக்கப்பட்டபடியே செயல்பட்டன; ஒருபோதும் சம்மதிக்காத மனிதர்களுக்கு எதிராக அவை பயன்படுத்தப்பட்டன. படம் உருவாக்கும் கருவிகள், குழந்தைகள் உட்பட யாரும், சாதாரணப் புகைப்படங்களிலிருந்து ஓர் உண்மையான நபரின் யதார்த்தமான, அவமானப்படுத்தும் போலிப் படங்களை உருவாக்க வழிசெய்கின்றன. படங்கள் போலி என்று பார்ப்பவர்களுக்குத் தெரிந்தாலும் தெரியாவிட்டாலும், பாதிக்கப்பட்டவர்களுக்குத் தீங்கு ஏற்படுகிறது. இத்தகைய படங்களை உருவாக்கத் திறமையும் உழைப்பும் தேவைப்பட்ட காலத்தில் எழுதப்பட்ட விதிகளைக் கொண்டே பள்ளிகளும் பெற்றோரும் நீதிமன்றங்களும் எதிர்வினையாற்ற வேண்டியுள்ளது.", "escalation": "போலிப் படங்களையும் காணொளிகளையும் உருவாக்குவது தொடர்ந்து மலிவாகவும், யதார்த்தமாகவும், எளிதாகவும் மாறுகிறது; குறிவைக்கப்படும் நபரின் புகைப்படங்களும் குறைவாகவே தேவைப்படுகின்றன. கருவிகளில் உள்ள பாதுகாப்புகள், பள்ளிகளில் புகார் அளிக்கும் வழிகள், சட்டப் பொறுப்பு ஆகியவை இதற்கு ஈடுகொடுக்காவிட்டால், இத்தகைய துன்புறுத்தல் கொடுமைப்படுத்துதலிலும் மிரட்டிப் பணம் பறிப்பதிலும் வழக்கமான ஒரு பகுதியாக மாறக்கூடும். இதைச் செய்பவரிடமிருந்து கிட்டத்தட்ட எந்த முயற்சியும் இல்லாமல் இது மிக அதிகமான குழந்தைகளைப் பாதிக்கக்கூடும்."}, "sv": {"title": "Elever ska ha skapat olämpliga deepfakes av klasskamrater", "domain": "Skola", "hook": "två elever med en bildgenerator", "real": "Två elever på en privatskola ska ha använt AI-verktyg för att skapa och sprida hundratals **olämpliga falska bilder av klasskamrater**. Myndigheterna identifierade senare dussintals offer, nästan alla minderåriga.", "fake": "Två elever på en kommunal skola ska ha använt AI-verktyg för att ta fram realistiska **brev med skolans brevhuvud som anklagade klasskamrater för att använda droger** och skickat dem till föräldrarna. Skolan identifierade senare dussintals drabbade familjer.", "excerpt": "Myndigheterna identifierade senare 60 offer, varav 59 minderåriga.", "explanation": "Under ungefär ett halvår ska två elever på en skola i Pennsylvania ha använt AI-verktyg för att skapa och byta hundratals olämpliga deepfake-bilder av kvinnliga klasskamrater och andra flickor. Myndigheterna identifierade senare 60 offer, varav 59 minderåriga. En ungdomsdomstol fann eleverna ansvariga. Familjer stämde senare skolan och icke namngivna AI-företag.", "whyBad": "Här gick ingenting sönder. Verktygen fungerade som de var byggda och användes mot människor som aldrig hade gått med på det. Bildgeneratorer låter vem som helst, även barn, göra realistiska och förnedrande falska bilder av en verklig person utifrån vanliga foton. Offren skadas oavsett om de som tittar vet att bilderna är falska. Skolor, föräldrar och domstolar måste svara med regler som skrevs när sådana bilder krävde skicklighet och möda.", "escalation": "Att göra falska bilder och videor blir hela tiden billigare, mer realistiskt och enklare, och det behövs färre foton på den som utsätts. Om skydden i verktygen, vägarna för att anmäla i skolorna och det rättsliga ansvaret inte hänger med kan den här typen av övergrepp bli en vanlig del av mobbning och utpressning. Det kan drabba långt fler barn, nästan utan ansträngning för den som gör det."}, "tr": {"title": "Öğrencilerin sınıf arkadaşlarının uygunsuz deepfake görüntülerini ürettiği iddia edildi", "domain": "Okul", "hook": "görüntü üreteci kullanan iki öğrenci", "real": "Özel bir okulun iki öğrencisinin, yapay zekâ araçlarını kullanarak **kız sınıf arkadaşlarının uygunsuz sahte görüntülerinden** yüzlercesini oluşturup paylaştığı iddia edildi. Yetkililer daha sonra, neredeyse tamamı reşit olmayan onlarca mağdur tespit etti.", "fake": "Bir devlet okulunun iki öğrencisinin, yapay zekâ araçlarını kullanarak **sınıf arkadaşlarını uyuşturucu kullanmakla suçlayan, okul antetli** gerçekçi **mektuplar** hazırlayıp velilere gönderdiği iddia edildi. Okul daha sonra etkilenen onlarca aile tespit etti.", "excerpt": "Yetkililer daha sonra 59'u reşit olmayan 60 mağdur tespit etti.", "explanation": "Pensilvanya’daki bir okulun iki öğrencisinin, yaklaşık altı ay boyunca yapay zekâ araçlarını kullanarak kız sınıf arkadaşlarının ve başka kızların yüzlerce uygunsuz deepfake görüntüsünü oluşturup birbirleriyle paylaştığı iddia edildi. Yetkililer daha sonra 59’u reşit olmayan 60 mağdur tespit etti. Bir çocuk mahkemesi öğrencileri sorumlu buldu. Aileler daha sonra okula ve adı açıklanmayan yapay zekâ şirketlerine dava açtı.", "whyBad": "Burada hiçbir şey bozulmadı. Araçlar tasarlandığı gibi çalıştı ve buna hiç rıza göstermemiş insanlara karşı kullanıldı. Görüntü üreticileri, çocuklar dahil herkesin sıradan fotoğraflardan gerçek bir kişinin gerçekçi ve aşağılayıcı sahte görüntülerini yapmasına olanak tanıyor. İzleyenler görüntülerin sahte olduğunu bilse de bilmese de mağdurlar zarar görür. Okullar, veliler ve mahkemeler, bu tür görüntüleri yapmanın beceri ve emek istediği dönemde yazılmış kurallarla karşılık vermek zorunda.", "escalation": "Sahte görüntü ve video yapmak giderek ucuzluyor, gerçekçileşiyor ve kolaylaşıyor; hedef alınan kişinin daha az fotoğrafı gerekiyor. Araçlardaki korumalar, okullardaki şikâyet yolları ve hukuki sorumluluk buna ayak uyduramazsa, bu tür istismar zorbalığın ve şantajın sıradan bir parçası hâline gelebilir. Bunu yapan kişinin neredeyse hiç çaba harcamasına gerek kalmadan çok daha fazla çocuğa ulaşabilir."}}}, {"id": 1258, "url": "https://incidentdatabase.ai/cite/1258/", "building": "media", "text": {"en": {"title": "Purported deepfake news bulletin announced a candidate's withdrawal", "domain": "Elections & media", "hook": "one fake news bulletin", "real": "A purported deepfake video made to look like a national **TV news bulletin** falsely showed a **presidential candidate announcing she was quitting** the race.", "fake": "A purported deepfake video made to look like a national **TV weather bulletin** falsely warned of a **severe storm on election day** and told people in several districts to stay home.", "excerpt": "A purported deepfake video circulated online that is alleged to have falsely depicted Irish presidential candidate Catherine Connolly announcing her withdrawal from the race.", "explanation": "A fake video made to look like an RTÉ News bulletin reportedly showed Irish presidential candidate Catherine Connolly announcing that she was leaving the race. It reportedly had about 30,000 views on Facebook before it was removed. Connolly complained to the Electoral Commission and called the video a malicious attempt to mislead voters.", "whyBad": "The clip borrowed trust twice: from a real candidate's face and voice, and from the look of a trusted national broadcaster. Voters who see such a clip may stay home or change their vote before a correction reaches them. Corrections rarely spread as far as the original. The wider damage is to trust itself. Once convincing fake news bulletins are around, people have more reason to doubt the real ones.", "escalation": "Fake video and audio are getting cheaper, faster to make and harder to tell from real broadcasts. If tools for checking where a clip came from, platform response times and election rules do not keep up, fakes could be tailored to single districts or voters. They could be released in the last hours of a campaign, when there is no time left to correct them."}, "fr": {"title": "Un présumé deepfake de journal télévisé a annoncé le retrait d’une candidate", "domain": "Élections et médias", "hook": "un seul faux journal télévisé", "real": "Une vidéo présumée deepfake, présentée comme un **journal télévisé national**, a faussement montré une **candidate à la présidence annonçant son retrait** de la course.", "fake": "Une vidéo présumée deepfake, présentée comme un **bulletin météo** de la télévision nationale, a faussement annoncé une **violente tempête le jour du scrutin** et appelé les habitants de plusieurs circonscriptions à rester chez eux.", "excerpt": "Une vidéo présumée deepfake a circulé en ligne ; elle aurait faussement montré la candidate à la présidence irlandaise Catherine Connolly annonçant son retrait de la course.", "explanation": "Une fausse vidéo, présentée comme un journal de RTÉ, aurait montré la candidate à la présidence irlandaise Catherine Connolly annonçant qu’elle quittait la course. Elle aurait atteint environ 30 000 vues sur Facebook avant d’être retirée. Catherine Connolly a saisi la Commission électorale et qualifié la vidéo de tentative malveillante de tromper les électeurs.", "whyBad": "La vidéo a emprunté de la confiance deux fois : au visage et à la voix d’une vraie candidate, et à l’apparence d’une chaîne nationale de confiance. Les électeurs qui voient une telle vidéo peuvent rester chez eux ou changer leur vote avant qu’un démenti ne leur parvienne. Les démentis circulent rarement aussi loin que l’original. Le dommage plus large touche la confiance elle-même. Quand de faux journaux télévisés convaincants circulent, les gens ont plus de raisons de douter des vrais.", "escalation": "Les fausses vidéos et les faux enregistrements audio deviennent moins chers, plus rapides à produire et plus difficiles à distinguer de vraies émissions. Si les outils qui permettent de vérifier l’origine d’une vidéo, la rapidité de réaction des plateformes et les règles électorales ne suivent pas, des faux pourraient être adaptés à une circonscription ou à un électeur. Ils pourraient être diffusés dans les dernières heures d’une campagne, quand il ne reste plus de temps pour les démentir."}, "de": {"title": "Mutmaßlicher Deepfake einer Nachrichtensendung verkündete Rückzug einer Kandidatin", "domain": "Wahlen und Medien", "hook": "eine einzige gefälschte Nachrichtensendung", "real": "Ein mutmaßliches Deepfake-Video im Stil einer **Nachrichtensendung** des nationalen Fernsehens zeigte fälschlich, wie eine **Präsidentschaftskandidatin ihren Rückzug** aus dem Rennen verkündet.", "fake": "Ein mutmaßliches Deepfake-Video im Stil eines **Wetterberichts** des nationalen Fernsehens warnte fälschlich vor einem **schweren Sturm am Wahltag** und rief die Menschen in mehreren Wahlkreisen auf, zu Hause zu bleiben.", "excerpt": "Im Netz kursierte ein mutmaßliches Deepfake-Video, das die irische Präsidentschaftskandidatin Catherine Connolly fälschlich bei der Ankündigung ihres Rückzugs aus dem Rennen gezeigt haben soll.", "explanation": "Ein gefälschtes Video im Stil einer Nachrichtensendung von RTÉ soll gezeigt haben, wie die irische Präsidentschaftskandidatin Catherine Connolly ihren Rückzug aus dem Rennen verkündet. Es soll auf Facebook etwa 30.000 Aufrufe erreicht haben, bevor es entfernt wurde. Connolly beschwerte sich bei der Wahlkommission und nannte das Video einen böswilligen Versuch, Wähler zu täuschen.", "whyBad": "Der Clip lieh sich zweimal Vertrauen: vom Gesicht und der Stimme einer echten Kandidatin und vom Erscheinungsbild eines vertrauten nationalen Senders. Wähler, die so einen Clip sehen, bleiben vielleicht zu Hause oder ändern ihre Stimme, bevor eine Richtigstellung sie erreicht. Richtigstellungen verbreiten sich selten so weit wie das Original. Der größere Schaden trifft das Vertrauen selbst. Wenn überzeugend gefälschte Nachrichtensendungen im Umlauf sind, haben Menschen mehr Grund, auch an den echten zu zweifeln.", "escalation": "Gefälschte Videos und Tonaufnahmen werden billiger, lassen sich schneller herstellen und sind schwerer von echten Sendungen zu unterscheiden. Wenn Werkzeuge zur Prüfung der Herkunft eines Clips, die Reaktionszeiten der Plattformen und die Wahlregeln nicht Schritt halten, könnten Fälschungen auf einzelne Wahlkreise oder Wähler zugeschnitten werden. Sie könnten in den letzten Stunden eines Wahlkampfs erscheinen, wenn keine Zeit mehr für eine Richtigstellung bleibt."}, "ru": {"title": "Предполагаемый дипфейк выпуска новостей объявил о снятии кандидата с выборов", "domain": "Выборы и СМИ", "hook": "один фальшивый выпуск новостей", "real": "Предполагаемое дипфейк-видео, оформленное как **выпуск новостей** национального телеканала, ложно показывало, как **кандидат в президенты объявляет о выходе** из гонки.", "fake": "Предполагаемое дипфейк-видео, оформленное как **прогноз погоды** национального телеканала, ложно предупреждало о **сильном шторме в день выборов** и призывало жителей нескольких округов оставаться дома.", "excerpt": "В сети распространялось предполагаемое дипфейк-видео, в котором, как утверждается, кандидат в президенты Ирландии Кэтрин Коннолли ложно объявляет о выходе из гонки.", "explanation": "Поддельное видео, оформленное под выпуск новостей RTÉ, по имеющимся данным, показывало, как кандидат в президенты Ирландии Кэтрин Коннолли объявляет о выходе из гонки. По сообщениям, оно набрало около 30 000 просмотров в Facebook, прежде чем его удалили. Коннолли подала жалобу в Избирательную комиссию и назвала видео злонамеренной попыткой обмануть избирателей.", "whyBad": "Ролик дважды воспользовался чужим доверием: к лицу и голосу реального кандидата и к оформлению известного национального телеканала. Избиратели, увидевшие такой ролик, могут не пойти на выборы или изменить свой выбор раньше, чем до них дойдёт опровержение. Опровержения редко расходятся так же широко, как сам ролик. Более общий вред наносится доверию. Когда появляются убедительные подделки новостей, у людей больше причин сомневаться и в настоящих.", "escalation": "Поддельные видео и аудио становятся дешевле, делаются быстрее, и их всё труднее отличить от настоящих эфиров. Если способы проверить происхождение ролика, скорость реакции платформ и правила выборов не будут за этим успевать, подделки можно будет делать под отдельные округа или даже под отдельных избирателей. Их можно будет выпускать в последние часы кампании, когда на опровержение уже нет времени."}, "it": {"title": "Un presunto deepfake di un telegiornale ha annunciato il ritiro di una candidata", "domain": "Elezioni e media", "hook": "un solo falso telegiornale", "real": "Un presunto video deepfake, confezionato come un **telegiornale nazionale**, ha mostrato falsamente una **candidata alla presidenza mentre annunciava il ritiro** dalla corsa.", "fake": "Un presunto video deepfake, confezionato come un **bollettino meteo** della televisione nazionale, ha annunciato falsamente una **forte tempesta nel giorno delle elezioni** e ha invitato gli abitanti di diversi collegi a restare a casa.", "excerpt": "Online è circolato un presunto video deepfake che avrebbe mostrato falsamente la candidata alla presidenza irlandese Catherine Connolly mentre annunciava il ritiro dalla corsa.", "explanation": "Un video falso, confezionato come un notiziario di RTÉ, avrebbe mostrato la candidata alla presidenza irlandese Catherine Connolly mentre annunciava l’uscita dalla corsa. Avrebbe raggiunto circa 30.000 visualizzazioni su Facebook prima di essere rimosso. Connolly ha presentato un reclamo alla Commissione elettorale e ha definito il video un tentativo malevolo di ingannare gli elettori.", "whyBad": "Il filmato ha preso in prestito la fiducia due volte: dal volto e dalla voce di una candidata reale e dall’aspetto di un’emittente nazionale affidabile. Gli elettori che vedono un filmato del genere possono restare a casa o cambiare voto prima che una smentita li raggiunga. Le smentite raramente si diffondono quanto l’originale. Il danno più ampio riguarda la fiducia stessa. Quando circolano falsi telegiornali convincenti, le persone hanno più motivi per dubitare anche di quelli veri.", "escalation": "Video e audio falsi diventano più economici, più rapidi da produrre e più difficili da distinguere dalle trasmissioni vere. Se gli strumenti per verificare l’origine di un filmato, i tempi di risposta delle piattaforme e le regole elettorali non tengono il passo, i falsi potrebbero essere adattati a singoli collegi o a singoli elettori. Potrebbero essere diffusi nelle ultime ore di una campagna, quando non c’è più tempo per smentirli."}, "es": {"title": "Un presunto deepfake de un informativo anunció la retirada de una candidata", "domain": "Elecciones y medios", "hook": "un solo informativo falso", "real": "Un presunto vídeo deepfake, presentado como un **informativo de la televisión nacional**, mostró falsamente a una **candidata a la presidencia anunciando su retirada** de la carrera.", "fake": "Un presunto vídeo deepfake, presentado como un **parte meteorológico** de la televisión nacional, anunció falsamente un **fuerte temporal el día de las elecciones** y pidió a los habitantes de varias circunscripciones que se quedaran en casa.", "excerpt": "Circuló en internet un presunto vídeo deepfake que, según se alega, mostraba falsamente a la candidata presidencial irlandesa Catherine Connolly anunciando su retirada de la carrera.", "explanation": "Un vídeo falso, hecho para parecer un informativo de RTÉ, habría mostrado a la candidata a la presidencia de Irlanda Catherine Connolly anunciando que dejaba la carrera. Habría alcanzado unas 30.000 visualizaciones en Facebook antes de ser retirado. Connolly presentó una queja ante la Comisión Electoral y calificó el vídeo de intento malicioso de engañar a los votantes.", "whyBad": "El vídeo tomó prestada la confianza dos veces: del rostro y la voz de una candidata real, y del aspecto de una cadena nacional de confianza. Los votantes que ven un vídeo así pueden quedarse en casa o cambiar su voto antes de que les llegue un desmentido. Los desmentidos rara vez llegan tan lejos como el original. El daño más amplio es a la propia confianza. Cuando circulan informativos falsos convincentes, la gente tiene más motivos para dudar de los reales.", "escalation": "El vídeo y el audio falsos son cada vez más baratos, más rápidos de producir y más difíciles de distinguir de las emisiones reales. Si las herramientas para comprobar el origen de un vídeo, la rapidez de respuesta de las plataformas y las normas electorales no avanzan al mismo ritmo, las falsificaciones podrían adaptarse a circunscripciones o votantes concretos. Podrían publicarse en las últimas horas de una campaña, cuando ya no queda tiempo para desmentirlas."}, "ko": {"title": "딥페이크로 추정되는 뉴스 영상이 후보 사퇴를 허위로 발표", "domain": "선거와 언론", "hook": "가짜 뉴스 방송 하나", "real": "국영 방송의 **뉴스 속보**처럼 꾸민 딥페이크로 의심되는 영상이 **대통령 후보가 사퇴를 발표하는** 모습을 거짓으로 보여 줬습니다.", "fake": "국영 방송의 **일기 예보**처럼 꾸민 딥페이크로 의심되는 영상이 **선거일에 강한 폭풍**이 온다고 거짓으로 알리고 여러 선거구 주민에게 집에 머물라고 권했습니다.", "excerpt": "아일랜드 대통령 후보 캐서린 코널리가 경선 사퇴를 발표하는 모습을 허위로 담았다는 의혹을 받는 딥페이크 추정 영상이 온라인에 유포됐다.", "explanation": "RTÉ 뉴스처럼 보이게 만든 가짜 영상이 아일랜드 대통령 후보 캐서린 코널리가 경선에서 물러난다고 발표하는 모습을 보여 준 것으로 알려졌습니다. 이 영상은 삭제되기 전 페이스북에서 약 3만 회 조회된 것으로 알려졌습니다. 코널리는 선거관리위원회에 이의를 제기했고, 이 영상을 유권자를 속이려는 악의적인 시도라고 불렀습니다.", "whyBad": "이 영상은 신뢰를 두 번 빌렸습니다. 실제 후보의 얼굴과 목소리에서, 그리고 신뢰받는 국영 방송사의 겉모습에서 빌렸습니다. 이런 영상을 본 유권자는 정정 보도가 닿기 전에 투표하러 가지 않거나 표를 바꿀 수 있습니다. 정정 보도는 원본만큼 멀리 퍼지는 일이 드뭅니다. 더 큰 피해는 신뢰 자체가 입습니다. 그럴듯한 가짜 뉴스 영상이 돌아다니면 사람들은 진짜 뉴스까지 의심할 이유가 더 많아집니다.", "escalation": "가짜 영상과 음성은 더 싸지고, 더 빨리 만들 수 있고, 실제 방송과 구별하기 더 어려워지고 있습니다. 영상의 출처를 확인하는 도구, 플랫폼의 대응 속도, 선거 규칙이 이를 따라가지 못하면, 가짜는 개별 선거구나 유권자에 맞춰 만들어질 수 있습니다. 바로잡을 시간이 남지 않은 선거 운동 마지막 몇 시간에 공개될 수도 있습니다."}, "zh": {"title": "疑似深度伪造的新闻播报谎称候选人退选", "domain": "选举与媒体", "hook": "一段伪造的新闻播报", "real": "一段疑似深度伪造的视频被做成国家电视台**新闻播报**的样子，虚假地显示一名**总统候选人宣布退出**竞选。", "fake": "一段疑似深度伪造的视频被做成国家电视台**天气预报**的样子，虚假地预告**选举日将有强风暴**，并呼吁几个选区的居民留在家中。", "excerpt": "一段疑似深度伪造的视频在网上流传，据称该视频虚假呈现了爱尔兰总统候选人 Catherine Connolly 宣布退出竞选。", "explanation": "据报道，一段被做成RTÉ新闻播报样子的假视频显示，爱尔兰总统候选人凯瑟琳·康诺利宣布退出竞选。据报道，在被删除之前，它在Facebook上有约3万次观看。康诺利向选举委员会提出了投诉，并称这段视频是误导选民的恶意企图。", "whyBad": "这段视频两次借用了信任：一次来自真实候选人的面孔和声音，一次来自一家受信任的国家广播机构的外观。看到这种视频的选民，可能在更正消息传到之前就留在家里或改变投票。更正很少能传得和原视频一样远。更大的损害落在信任本身。一旦足以乱真的假新闻播报流传开来，人们就更有理由连真的也怀疑。", "escalation": "伪造的视频和音频越来越便宜，制作越来越快，也越来越难与真实的广播节目区分。如果核查视频来源的工具、平台的反应速度和选举规则跟不上，假视频就可以针对单个选区或选民量身定做。它们可能在竞选的最后几个小时发布，那时已经没有时间更正。"}, "sr": {"title": "Наводни дипфејк вести објавио повлачење председничке кандидаткиње", "domain": "Избори и медији", "hook": "једна лажна емисија вести", "real": "Наводни дипфејк видео, обликован као **вести** националне телевизије, лажно је приказао како **председничка кандидаткиња објављује повлачење** из трке.", "fake": "Наводни дипфејк видео, обликован као **временска прогноза** националне телевизије, лажно је упозорио на **јаку олују на дан избора** и позвао становнике неколико изборних јединица да остану код куће.", "excerpt": "На интернету је кружио наводни дипфејк видео за који се тврди да лажно приказује ирску председничку кандидаткињу Кетрин Коноли како објављује повлачење из трке.", "explanation": "Лажни видео, направљен да изгледа као вести RTÉ-а, наводно је приказао како ирска председничка кандидаткиња Кетрин Коноли објављује да напушта трку. Наводно је имао око 30.000 прегледа на Фејсбуку пре него што је уклоњен. Коноли се жалила Изборној комисији и назвала видео злонамерним покушајем да се бирачи обману.", "whyBad": "Снимак је двапут позајмио туђе поверење: од лица и гласа стварне кандидаткиње и од изгледа поузданог националног емитера. Бирачи који виде такав снимак могу да остану код куће или промене глас пре него што до њих стигне демант. Деманти ретко стижу тако далеко као оригинал. Шира штета погађа само поверење. Када круже уверљиве лажне вести, људи имају више разлога да сумњају и у праве.", "escalation": "Лажни видео и звук постају јефтинији, брже се праве и све их је теже разликовати од правих емисија. Ако алати за проверу порекла снимка, брзина реакције платформи и изборна правила не буду држали корак, фалсификати би могли да се прилагоде појединим изборним јединицама или бирачима. Могли би да се објаве у последњим сатима кампање, када више нема времена за демант."}, "bs": {"title": "Navodni deepfake vijesti objavio povlačenje predsjedničke kandidatkinje", "domain": "Izbori i mediji", "hook": "jedna lažna emisija vijesti", "real": "Navodni deepfake video, oblikovan kao **vijesti** nacionalne televizije, lažno je prikazao kako **predsjednička kandidatkinja objavljuje povlačenje** iz utrke.", "fake": "Navodni deepfake video, oblikovan kao **vremenska prognoza** nacionalne televizije, lažno je upozorio na **jaku oluju na dan izbora** i pozvao stanovnike nekoliko izbornih jedinica da ostanu kod kuće.", "excerpt": "Na internetu je kružio navodni deepfake video za koji se tvrdi da lažno prikazuje irsku predsjedničku kandidatkinju Catherine Connolly kako objavljuje povlačenje iz utrke.", "explanation": "Lažni video, napravljen da izgleda kao vijesti RTÉ-a, navodno je prikazao kako irska predsjednička kandidatkinja Catherine Connolly objavljuje da napušta utrku. Navodno je imao oko 30.000 pregleda na Facebooku prije nego što je uklonjen. Connolly se žalila Izbornoj komisiji i nazvala video zlonamjernim pokušajem da se birači obmanu.", "whyBad": "Snimak je dvaput posudio tuđe povjerenje: od lica i glasa stvarne kandidatkinje i od izgleda pouzdanog nacionalnog emitera. Birači koji vide takav snimak mogu ostati kod kuće ili promijeniti glas prije nego što do njih stigne demanti. Demanti rijetko stižu tako daleko kao original. Šira šteta pogađa samo povjerenje. Kada kruže uvjerljive lažne vijesti, ljudi imaju više razloga da sumnjaju i u prave.", "escalation": "Lažni video i zvuk postaju jeftiniji, brže se prave i sve ih je teže razlikovati od pravih emisija. Ako alati za provjeru porijekla snimka, brzina reakcije platformi i izborna pravila ne budu držali korak, falsifikati bi se mogli prilagoditi pojedinim izbornim jedinicama ili biračima. Mogli bi se objaviti u posljednjim satima kampanje, kada više nema vremena za demanti."}, "ro": {"title": "Un presupus deepfake al unui jurnal de știri a anunțat retragerea unei candidate", "domain": "Alegeri și media", "hook": "un singur jurnal de știri fals", "real": "Un presupus videoclip deepfake, realizat să arate ca un **buletin de știri** al televiziunii naționale, a arătat în mod fals o **candidată la președinție anunțându-și retragerea** din cursă.", "fake": "Un presupus videoclip deepfake, realizat să arate ca o **prognoză meteo** a televiziunii naționale, a avertizat în mod fals despre o **furtună puternică în ziua alegerilor** și i-a îndemnat pe locuitorii din mai multe circumscripții să rămână acasă.", "excerpt": "Online a circulat un presupus videoclip deepfake despre care se susține că o arăta în mod fals pe candidata la președinția Irlandei, Catherine Connolly, anunțându-și retragerea din cursă.", "explanation": "Un videoclip fals, făcut să arate ca un buletin de știri RTÉ, ar fi arătat-o pe candidata la președinția Irlandei, Catherine Connolly, anunțând că părăsește cursa. Ar fi avut aproximativ 30.000 de vizualizări pe Facebook înainte să fie eliminat. Connolly a depus o plângere la Comisia Electorală și a numit videoclipul o încercare rău-intenționată de a induce alegătorii în eroare.", "whyBad": "Clipul a împrumutat încredere de două ori: de la fața și vocea unei candidate reale și de la aspectul unui post național de încredere. Alegătorii care văd un astfel de clip pot rămâne acasă sau își pot schimba votul înainte să ajungă la ei o dezmințire. Dezmințirile rareori ajung la fel de departe ca originalul. Paguba mai largă privește încrederea însăși. Când circulă buletine de știri false convingătoare, oamenii au mai multe motive să se îndoiască și de cele reale.", "escalation": "Imaginile video și înregistrările audio false devin mai ieftine, mai rapid de făcut și mai greu de deosebit de emisiunile reale. Dacă instrumentele de verificare a originii unui clip, viteza de reacție a platformelor și regulile electorale nu țin pasul, falsurile ar putea fi adaptate pentru anumite circumscripții sau anumiți alegători. Ar putea fi lansate în ultimele ore ale unei campanii, când nu mai este timp pentru dezmințiri."}, "vi": {"title": "Bản tin được cho là deepfake loan tin ứng viên tổng thống rút lui", "domain": "Bầu cử và truyền thông", "hook": "một bản tin giả", "real": "Một video bị nghi là deepfake, được dựng giống **bản tin thời sự** của đài truyền hình quốc gia, đã chiếu sai sự thật cảnh một **ứng viên tổng thống tuyên bố rút lui** khỏi cuộc đua.", "fake": "Một video bị nghi là deepfake, được dựng giống **bản tin dự báo thời tiết** của đài truyền hình quốc gia, đã cảnh báo sai sự thật về một **cơn bão mạnh vào ngày bầu cử** và kêu gọi người dân ở một số khu vực bầu cử ở nhà.", "excerpt": "Một video được cho là deepfake đã lan truyền trên mạng, bị cáo buộc dựng cảnh sai sự thật rằng ứng viên tổng thống Ireland Catherine Connolly tuyên bố rút khỏi cuộc đua.", "explanation": "Một video giả được dựng giống bản tin RTÉ News được cho là đã chiếu cảnh ứng viên tổng thống Ireland Catherine Connolly tuyên bố rời cuộc đua. Video được cho là đã có khoảng 30.000 lượt xem trên Facebook trước khi bị gỡ. Bà Connolly đã khiếu nại lên Ủy ban Bầu cử và gọi video là một nỗ lực ác ý nhằm đánh lừa cử tri.", "whyBad": "Đoạn video đã mượn lòng tin hai lần: từ khuôn mặt và giọng nói của một ứng viên có thật, và từ hình thức của một đài truyền hình quốc gia được tin cậy. Cử tri xem một đoạn video như vậy có thể ở nhà hoặc đổi lá phiếu trước khi thông tin đính chính đến được với họ. Thông tin đính chính hiếm khi lan xa bằng bản gốc. Thiệt hại lớn hơn là đối với chính lòng tin. Khi các bản tin giả thuyết phục xuất hiện, người ta có thêm lý do để nghi ngờ cả những bản tin thật.", "escalation": "Video và âm thanh giả ngày càng rẻ, làm nhanh hơn và khó phân biệt với chương trình phát sóng thật hơn. Nếu c
